[package]
name = "atlas-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Atlas: plugin + benchmark abstraction and registry driven by the spark-server TUI"

# HARD CONSTRAINT: no GPU, no model, no server dependency. This crate drives a
# served endpoint over HTTP and shells out to provisioned artifacts; it must
# stay buildable (and unit-testable) without CUDA, so the benchmark suite can be
# reasoned about and tested on any box.
[dependencies]
# The journey ledger. `ledger_append` is its FIRST writer — the crate shipped
# with 16 tests and zero callers.
atlas-governance = { path = "../atlas-governance" }
atlas-closure = { path = "../atlas-closure" }
# `moe_policy::budget_experts` — the expert-set selection rule, shared with
# the engine so one implementation decides what a category needs.
# `default-features = false` drops the cudarc feature: the HARD CONSTRAINT
# above still holds, this pulls in serde/anyhow-level code only.
atlas-core = { path = "../atlas-core", default-features = false }
# BENCH.toml — a model's benchmarks and thresholds, beside the model.
toml = "0.8"
anyhow = { workspace = true }
# Full-file dataset hashing + draw fingerprints for the MLPerf agentic leg —
# the same workspace pin atlas-closure already uses, so nothing new is vendored.
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tracing = "0.1"
# `Stream` for `Benchmark::run`, `BoxFuture` for the dyn-safe bridge.
futures = "0.3"
# Vision fixtures reach the API as base64 `data:` URIs — Atlas rejects remote
# image URLs, so this is the only shape the endpoint accepts. Same version the
# rest of the workspace pins; hand-rolling base64 for one function would be a
# worse trade than the dependency.
base64 = "0.22"
# Benchmarks are I/O state machines: TCP to the endpoint, child processes for
# the BFCL artifacts, timers for warmup/timeouts. No `rt-multi-thread` — the
# executor runs on the server's existing runtime.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
