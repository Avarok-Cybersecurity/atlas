# ── w4a4: the module does not exist on this target at all ─────────────────
# CORRECTED 2026-09-17. The note this table used to carry said dispatch "falls
# back to w4a4_gemm". That was true while only the mfast variant was missing.
# It is FALSE here: `w4a4_gemm.cu` itself does not compile on gfx1201
# (`41:8: error: unknown opcode`), so the w4a4 MODULE is absent and BOTH
# lookups miss:
#
#   dense_ffn.rs:445              try_kernel("w4a4", "w4a4_gemm")
#   qwen3_attention/init.rs:749   try_kernel("w4a4", "w4a4_gemm_mfast")
#
# Both land on `KernelHandle(0)`, and every use site is guarded by
# `self.w4a4_gemm_k.0 != 0 && ... && ctx.levers.fp4_prefill`
# (dense_ffn.rs:2553, qwen3_attention/prefill/paged_{qkv,oproj}.rs), so the
# FP4-activation prefill path is never taken on r9700 and prefill runs the
# ordinary W4A16/BF16 route. Nothing falls back to w4a4_gemm, because there is
# no w4a4_gemm. This is a LOST fast path, not a substituted one.
