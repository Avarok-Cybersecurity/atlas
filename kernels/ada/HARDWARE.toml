# streams costs 99 ms for 13.4 tokens against 39 ms for 8, and the serve
# delivers 157 tok/s where plain decode delivers 197). With the row on the
# gate keeps one set of baselines and one standing decision per batch width,
# so a width seen before resumes without a probe; its re-probe and refresh
# intervals count tokens per stream, so the probe duty cycle at any width is
# the single-stream one; and a re-probe that confirms the standing decision
# doubles the next interval, up to 8x, until a flip resets it. It only chooses
# between two modes that both emit verified tokens, so outputs are those of
# whichever mode runs; it is not bit-identical to the row off, because the two
# modes are interleaved differently. Off until the receipt on this card: conc
# A/B with --speculative at C=1, 2, 4 and 8 with no loss at any width against
# the row off, and at C=8 no loss against a serve without --speculative.
# AVAROK_MTP_WIDTH_POLICY=1 is the A/B; the gate logs every switch.
mtp_width_policy = false
# The MTP-verify GDN projections of a BF16-kept GDN layer (the Qwen3.5 dense
# Bf16Raw load) on dense_gemv_bf16_batchm, 16 rows a weight pass
# (layers/ops/gdn_verify_gemv.rs): in_proj_qkvz at 3 or more rows, where the
# verify runs one dense_gemv per row at 3 and 4 rows (3 or 4 passes over a 63
# MB weight a layer on the 4B) and the scalar dense_gemm above 4, and
# out_proj_dense at 2 or more rows, where it runs the scalar dense_gemm at
# every width. Tier-S timing on the RTX 4060 Ti 16 GB (4B, FP8 FFN): the
# verify forward is 47.9 ms for the 4 rows of one stream and 92.6 ms for the
# 16 rows of 8 streams, against decode steps of 27 and 40 ms; the scalar
# kernel turns about 0.6 TFLOP/s, and it is why MTP loses at 8 streams. The
# batched GEMV reads each weight once for up to 16 rows near the bandwidth
# floor (L07 sweep: in_proj_qkvz 234 us at 1 row, 310 at 16), and every row is
# bit-identical to the M=1 decode GEMV (same source, --fmad=false, as
# attn_gated_bf16_batchm), so a verify row's GDN projections equal the
# decode's. At 3 and 4 rows in_proj_qkvz keeps today's bits; above 4 rows,
# and for out_proj_dense at every width, the scalar GEMM's summation order
# becomes the decode order, so verify logits move toward plain decode. It
# differs from gdn_batched_gemm, which makes the same launches on cuBLASLt
# and reassociates: with both on, this row serves up to 16 rows and cuBLASLt
# the wider batches; alone, it runs one pass per 16 rows. Only a BF16-kept GDN
# layer takes it (gdn_fp8_from_bf16 and the 4-bit routes have their own
# arms). Off until the receipt: examples/dense_gemv_bf16_batchm_microtest PASS
# at the two GDN shapes up to 16 rows, greedy agreement of --speculative
# against plain decode on the 8 agreement prompts no worse than with the row
# off, the MTP verify time (AVAROK_MTP_TIMING) down at C=1 and C=8, and a conc
# gain with --speculative at C=1, 2, 4 and 8. AVAROK_GDN_VERIFY_GEMV=1 is the
# A/B.
gdn_verify_gemv = false
# A BF16 LM head's speculative-verify rows above 8 on dense_gemv_bf16_batchm,
# 16 rows a weight pass (layers/ops/lm_head_verify_gemv.rs), instead of the
# scalar dense_gemm, which is the only arm a BF16 head has at 9 or more verify
# rows (model/impl_a3.rs: the wide arms are NVFP4 only). A batched verify of 8
# streams with one draft each is 16 rows; on the 4B's tied BF16 head (248,070
# x 2,560, 1.27 GB) that is 10.2 G scalar multiply-adds a pass. Tier-S timing
# on the RTX 4060 Ti 16 GB (4B, FP8 FFN): the verify forward is 92.6 ms at 16
# rows and 148 ms at 32, against a 40 ms decode step of 8 rows; this head and
# the GDN projections (gdn_verify_gemv) are the two scalar GEMMs in it. The
# batched GEMV measures 6.8 ms on this head at 16 rows against 5.0 ms at 8
# (L07 sweep). Every row is bit-identical to the M=1 decode head, as verify
# rows 2..8 already are; rows above 8 leave the scalar GEMM's summation order
# for the decode order, so their logits move toward plain decode. Only a BF16
# head on one rank takes it; the decode head's band (lm_head_batchm_max) is
# not touched. Off until the receipt: examples/dense_gemv_bf16_batchm_microtest
# PASS at the head shape up to 16 rows, greedy agreement of --speculative
# against plain decode at C=8 no worse than with the row off, and the MTP
# verify time (AVAROK_MTP_TIMING) and conc tok/s with --speculative better at
# C=8. AVAROK_LM_HEAD_VERIFY_GEMV=1 is the A/B.
lm_head_verify_gemv = false
# A greedy decode step whose sequences still have a min_tokens floor to reach
# stays on the device argmax (spark-server scheduler/min_floor_fast.rs).
# Today an active floor sends the whole batch through the host sampling
# pipeline for the floor's EOS mask alone: every step copies the [n, vocab]
# logits to the host, widens them to FP32 and scans them once per sequence
# (3.97 MB and eight 248,070-element passes a step at 8 streams on the 4B). A
# fixed-length benchmark sets min_tokens = max_tokens, so every step of every
# conc run pays it; AVAROK_DECODE_TIMING=1 prints the copy and the scan. With
# temperature 0 and neutral penalties the pipeline's token is the argmax of
# the masked logits, and masking an entry that is not the maximum does not
# move it, so the device argmax is the same token unless it is one of the
# sequence's EOS ids; that is checked afterwards and only such a step is
# redone on the host, as the two-id think mask already is. A request with any
# penalty set keeps the host pipeline. One thing does change, the tie-break:
# where the two top logits tie exactly (1.3% of greedy positions in queue-1's
# quality dumps) the device argmax keeps the id with the lower index mod 1024
# and the host pipeline the lower index. So a floored greedy run is NOT
# bit-identical to the row off; it emits what the same request emits without
# a floor, which already takes the device argmax. Off until the receipt: on
# fixed-length runs at C=1 and C=8, tokens equal to the same prompts served
# without min_tokens up to their first EOS, the fallback case exercised (the
# 8 agreement prompts with min_tokens below their natural length), and steady
# tok/s no lower. AVAROK_MIN_TOKENS_GPU_ARGMAX=1 is the A/B.
min_tokens_gpu_argmax = false
# A native-FP8 dense FFN over 5 to 16 rows (a decode step of 5 to 8 streams, a
# speculative verify of up to 16 rows) on the sm_89 16-row tensor-core GEMM
# (kernels/ada/common/fp8_gemm_ada_m16.cu): gate and up in one launch, the
# layer's activation multiply, then down, each weight read once
# (layers/dense_ffn/fp8_m16_tc.rs). It replaces what those widths run today:
# the W8A8 arm, which quantizes the activations to E4M3 and costs 143 us a
# projection at every width from 1 to 64 rows on the RTX 4060 Ti 16 GB (L07
# sweep, 4B gate/up, 23.6 MB, against a 91 us floor at the measured 260 GB/s),
# or, with ffn_fp8_verify_gemv or ffn_fp8_decode_gemv on, the batch-M GEMV,
# which holds the floor to 4 rows, is compute bound above them (97 us at M=4,
# 184 at M=8) and stops at 8. The kernel keeps the activations BF16 and widens
# the E4M3 weights in registers (exact), one m16n8k16 per 128 weight bytes,
# with the weights streamed global-to-register the way the decode GEMV streams
# them. An FP8 mma would need E4M3 activations, which is the W8A8 arithmetic
# this row exists to leave. Numerics: the kernel REASSOCIATES the K reduction (16
# products per MMA, one block-scale fold per 128 K on an FP32 accumulator), so
# a row is not bit-identical to the M=1 decode GEMV; the contract is the M16
# tensor-core one (at most 2 BF16 ULP, or under the FP32 accumulation floor
# for a cancelled output), and a row's bits do not depend on how many rows
# share the launch. Rows 2..4 keep w8a16_gemv_batch4, which is bit-exact and
# already at the floor (AVAROK_FFN_FP8_M16_TC_MIN_ROWS=2 lowers the bound for
# a measurement); above 16 rows nothing changes; a prompt pass never takes
# it. With this row on it is asked before ffn_fp8_verify_gemv and
# ffn_fp8_decode_gemv at the widths it takes. Only targets that compile the
# module can take it (no lookup elsewhere). Off until the receipt:
# examples/fp8_ada_m16_tc_microtest.rs all PASS with memcheck clean, a conc
# gain at C=8 without --speculative beyond the ABBA bound with top-20 KL
# against the row off inside the bar, and with --speculative at C=8 the verify
# time (AVAROK_MTP_TIMING) down. AVAROK_FFN_FP8_M16_TC=1 is the A/B.
ffn_fp8_m16_tc = false
# @port:defaults

# ── Kernels this target owns ───────────────────────────────────────────────
#
# Every other entry in `common/` is a relative symlink into kernels/gb10/common
# (the kernels are written to an SM80-class floor: mma.sync.m16n8k16,
# cp.async.cg). These are the files Ada holds as real sources, because the gb10
# source cannot assemble for sm_89 and editing it would move the PTX (and the
# closure hash) of every target that inherits it. Each one's own header says
# what differs from the gb10 file it replaces.
#
#   prefill_dyn_smem.cuh     ADDITION. One `extern __shared__` buffer the
#                            prefill tiles below are laid over, and the macro
#                            that exports each entry's launch size as
#                            `<entry>_dyn_smem_bytes` for the registry
#                            (`avarok_core::registry_dyn_smem`).
#
#   inferspark_prefill.cu,   The BR=32 and BR=64 contiguous and paged prefill
#   inferspark_prefill_fp8kv.cu,  attention tiles: 66,560 to 90,208 bytes of
#   prefill_paged_compute.cuh,    static `__shared__`, which ptxas refuses
#   prefill_paged_compute_asym.cuh  above 0xc000 (48 KiB) for any arch without
#                            an `a` suffix, and Ada has none ("Entry function
#                            'inferspark_prefill_64' uses too much shared data
#                            (0x16000 bytes, 0xc000 max)": 22 modules, 42
#                            entry points, the same 22 stems gb10's sm_121f
#                            gate run reports in docs/HARDWARE.md). The tiles
#                            are the same bytes in the same order, moved to
#                            dynamic shared memory (opt-in up to 99 KiB per
#                            block on sm_89); the kernel bodies are unchanged.
#                            The 20 paged `.cu` files stay symlinks: their
#                            `#include "prefill_paged_compute*.cuh"` resolves
#                            against this directory, so they pick these headers
#                            up. See docs/HARDWARE.md, "PTX arch suffix and the
#                            static shared-memory ceiling".
#
#   gated_delta_rule_fla.cu  The opt-in TMA state spine
#                            (`gated_delta_rule_chunk_delta_h_tma`, behind
#                            AVAROK_GDN_TMA=1) uses `cp.async.bulk.tensor` and
#                            `mbarrier.arrive.expect_tx`, which need sm_90.
#                            That spine and its helpers sit inside
#                            `#if __CUDA_ARCH__ >= 900`; nothing else in the
#                            file changes. The lookup is a try_kernel whose
#                            absence keeps the scalar spine, and both holo
#                            MODEL.tomls declare it in [expected_absent].
#
#   fp8_gemv_ada.cu,         ADDITIONS. sm_89 drop-ins for the dense FFN's FP8
#   fp8_gemm_ada.cu          W8A16 decode GEMVs (register `cvt.rn.f16x2.e4m3x2`
#                            dequant, no shared-memory LUT) and its W8A8
#                            prefill GEMM (three-stage cp.async, swizzled
#                            ldmatrix). Same arguments, geometry and output
#                            bits as the gb10 kernels they stand in for, which
#                            stay symlinked here; the layer takes the handle
#                            (`layers/dense_ffn_ada_kernels.rs`).
#
#   swiglu_quant_fp8_ada.cu  ADDITION. The W8A8 prefill's SwiGLU and the down
#                            projection's per-token-group FP8 quant in one
#                            pass: the bytes and scales of `moe_silu_mul` then
#                            `per_token_group_quant_fp8`, bit for bit, without
#                            the BF16 product's round trip through DRAM
#                            (`layers/dense_ffn_swiglu_quant.rs`). gb10's
#                            `silu_mul_quant_fp8` stops at K = 2048; the Holo
#                            intermediates are 3,584 and 9,216.
#
#   gated_delta_rule_wyn_woa.cu  ADDITION (port lane L10, row `gdn_woa_mtp`,
#                            OFF). Write-on-accept twins of the batched
#                            verify's wy2, wy3 and wy5..wy16 table kernels
#                            plus one K-generic fold: the twin reads H once
#                            and writes no state, the fold applies the
#                            accepted rows once after the verdict. Same
#                            expressions and order as each parent, so the
#                            outputs and the folded state are bit-identical
#                            (`examples/gdn_wyn_woa_oracle.rs`). K = 4 keeps
#                            gb10's `gated_delta_rule_wy4_woa.cu`. Resolved
#                            only with the row on (`qwen3_ssm/woa_wyn.rs`).
#
#   fp8_gemv_ada.cu (again)  The three decode GEMVs also have `_l2ef` twins:
#                            the same code with evict-first L2 weight loads
#                            (`createpolicy` + `ld.global.nc.L2::cache_hint`,
#                            after Cinference, Apache-2.0), taken only when
#                            `l2_evict_first_weights` resolves on. Same output
#                            bits; check the SASS on a new CUDA (13.1's ptxas
#                            faulted on hinted loads).
#
#   fp8_gemv_ada_batchm.cu   ADDITION. The batch-M (M = 2..8) twins of the three
#                            decode GEMVs for the dense FFN's speculative
#                            verify rows: one weight pass, M accumulators,
#                            byte-identical per row to M launches of
#                            fp8_gemv_ada (`layers/dense_ffn_ada_kernels/verify.rs`,
#                            row `ffn_fp8_verify_gemv`). gb10's
#                            w8a16_gemv_batch4 is the LUT counterpart at M <= 4.
#                            The same entries serve a multi-sequence decode
#                            step behind row `ffn_fp8_decode_gemv`
#                            (`layers/dense_ffn/fp8_decode_gemv.rs`). Activation
#                            rows are addressed by a 32-bit word index: the
#                            64-bit row-pointer form was miscompiled by CUDA
#                            13.3's ptxas at M = 7 (the file's `fgb_act_word`
#                            note has the SASS and the memcheck record).
#
#   rmsnorm_quant_fp8_ada.cu ADDITION. residual_add_rms_norm and the W8A8
#                            FFN input's per_token_group_quant_fp8 in one pass,
#                            bit for bit, without re-reading the normed rows
#                            (`layers/dense_ffn_w8a8_prefill/norm_fused.rs`,
#                            row `rmsnorm_fp8_quant_fused`).
#
#   gdn_chunk_tc_ada.cu      ADDITION. The tensor-core chunked GDN prefill
#                            (prepare_wy_wu, state passing, output: K K^T, Q K^T
#                            and Q S on BF16 mma.sync, the triangular products
#                            and the state update on TF32 mma.sync, the state in
#                            FP32 accumulators), from NInfer's chunked path via
#                            Cinference (Apache-2.0,
#                            CINFERENCE-GDN-CHUNK-ATTRIBUTION.md). No gb10
#                            counterpart. Taken only when `gdn_prefill_tc`
#                            resolves on and this module is in the image
#                            (`layers/qwen3_ssm/gdn_chunk_tc_ada.rs`).
#
#   attn_page_sparse_ada.cu  ADDITION. Quest page-sparse decode attention
#                            (attn_ps_summary_update, attn_ps_page_score,
#                            attn_ps_compact): per-page key min/max, the Quest
#                            bound per page, an exact top-k and the compacted
#                            block table the unchanged paged decode reads. No
#                            gb10 counterpart. Taken only when
#                            `attn_page_sparse` resolves on (approximate,
#                            never default on) and this module is in the
#                            image (`spark-model/src/port/sparse_quest/`).
#
#   kv_page_sketch_ada.cu    ADDITION. The bounded KV view's per-page sketch:
#                            the mean of each KV page's keys after k-norm and
#                            BEFORE RoPE (re-read from the paged cache, BF16 or
#                            FP8, RoPE undone with the write's own convention),
#                            recomputed per page after each K write, plus the
#                            in-place inverse RoPE of captured query rows. No
#                            gb10 counterpart. Runs only when
#                            `kv_view_selection` resolves on (approximate,
#                            never default on); the idea is KVMem's
#                            (arXiv:2609.04852), implemented independently
#                            (`spark-runtime/src/kv_cache/sketch.rs`).
#
#   kv_page_score_ada.cu     ADDITION. The page-softmax view-block scorer over
#                            that sketch (count-weighted block merge, FP32
#                            logits, softmax stats, GQA mean or max, one
#                            deterministic accumulate), tiled under the
#                            caller's 64 MiB scratch for 1M tokens and 512
#                            query rows (`spark-runtime/src/kv_select/`). Once
#                            per user turn, same row.
#
#   kv_view_table_ada.cu     ADDITION. The bounded KV view's decode and verify
#                            block tables: per attention row, the selected
#                            pages before the view's tail page plus every page
#                            from it on, and the shortened length, rebuilt from
#                            the step's real tables inside the captured graph.
#                            Rows find their view by content (the physical
#                            blocks at three anchor pages), so a replay needs
#                            no host code; a row with no view keeps its real
#                            table. No gb10 counterpart. Runs only when
#                            `kv_view_selection` resolves on with a budget
#                            (approximate, never default on;
#                            `spark-model/src/port/kv_view/device.rs`, host
#                            twin `view.rs::build_row`).
#
#   prefill_block_sparse_ada.cu  ADDITION. Block-sparse paged PREFILL
#                            attention, XAttention-style (clean room from the
#                            paper): strided antidiagonal scoring of 128-token
#                            blocks on BF16 mma.sync, per-query-block selection
#                            by cumulative softmax mass (sink and diagonal band
#                            always kept), then flash attention over the kept
#                            KV blocks only (BF16 or FP8 KV, head_dim 128/256,
#                            dynamic shared memory). No gb10 counterpart. Taken
#                            only when `prefill_sparse_attn` resolves on
#                            (approximate, never default on) and this module is
#                            in the image (`spark-model/src/port/sparse_prefill/`).
[kernels]
