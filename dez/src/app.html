<!doctype html>
<html lang="en" class="no-js">
  <head>
    <!-- SPDX-License-Identifier: AGPL-3.0-only -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dez" />

    <!--
      Theme bootstrap. Runs before first paint so a stored preference never
      flashes the wrong palette. Self-contained: no network, no storage writes.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.remove('no-js');
        try {
          var t = localStorage.getItem('dez-theme');
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        } catch (e) {
          /* private mode / storage disabled — fall back to prefers-color-scheme */
        }
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
