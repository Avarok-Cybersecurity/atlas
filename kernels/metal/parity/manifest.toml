[[metal]]
source = "kernels/metal/common/noop_smoke.metal"
entry  = "noop_smoke"
state  = "metal_only"
why    = "Build-and-launch pipeline probe: zeros the first n floats of out so metal_alloc_copy_launch_roundtrip can prove alloc, copy, launch and readback work end to end. gb10 has no smoke kernel; its launch path is exercised by the real kernels' tests."

[[metal]]
source = "kernels/metal/common/softmax_topp.metal"
entry  = "softmax_topp"
state  = "metal_only"
why    = "Top-p sampler: temperature softmax, nucleus truncation by a binary search on the survival threshold, and one inverse-CDF draw from a host uniform, in a single launch. gb10 samples on the host after argmax_bf16/argmax_fp32; no CUDA kernel performs a softmax or a top-p draw over the vocab."

[[metal]]
source = "kernels/metal/common/conv3d_patch_embed.metal"
entry  = "conv3d_patch_embed"
state  = "metal_only"
why    = "Direct non-overlapping 3-D convolution for the Qwen3.5-VL patch embed, reading the HF weight layout [out, kT, kH, kW, in] and fusing the bias. gb10 does patch embedding by unfolding patches on the host and running a plain GEMM, so no CUDA kernel has a conv contract at all."

[[metal]]
source = "kernels/metal/common/mlx_int8_dequant.metal"
entry  = "mlx_int8_dequant"
state  = "metal_only"
why    = "Dequantizes the MLX 8-bit affine group format (4 uint8 per uint32, per-group bf16 scale AND bias, w = byte*s + b) to bf16. gb10 has no MLX-format kernel: its w8a16_* family consumes FP8-E4M3 block-scaled weights with no per-group bias, a different storage format and different arithmetic."

[[metal]]
source = "kernels/metal/common/mlx_int8_gemm.metal"
entry  = "mlx_int8_gemm"
state  = "metal_only"
why    = "Prefill GEMM with inline MLX 8-bit affine dequant (per-group bf16 scale and bias). gb10's int8 and w8a16 GEMMs (w8a16_gemm*.cu, the int8_gemm_* entries of w4a16_gemm.cu) read FP8-E4M3 or symmetric int8 block-scaled weights with no bias term; nothing on the CUDA side consumes the MLX uint32 packing."

[[metal]]
source = "kernels/metal/common/mlx_int8_gemv.metal"
entry  = "mlx_int8_gemv"
state  = "metal_only"
why    = "Decode GEMV with inline MLX 8-bit affine dequant, 4 rows per threadgroup and one simdgroup per row. gb10's w8a16_gemv*.cu reads FP8-E4M3 block-scaled weights without a per-group bias; the MLX uint32 packing and its scale-plus-bias affine recovery have no CUDA implementation."

[[metal]]
source = "kernels/metal/common/mlx_int8_gemv_gate_up.metal"
entry  = "mlx_int8_gemv_gate_up"
state  = "metal_only"
why    = "Fused dual GEMV (gate_proj and up_proj sharing one x) over MLX 8-bit affine weights. gb10 fuses gate/up only inside MoE expert kernels (moe_expert_gemv_gate_up) over NVFP4/FP8 experts, never over a dense MLX-packed int8 weight with a per-group bias, so there is no CUDA counterpart."

[[metal]]
source = "kernels/metal/common/mlx_int8_gemv_silu_gate.metal"
entry  = "mlx_int8_gemv_silu_gate"
state  = "metal_only"
why    = "down_proj GEMV over MLX 8-bit affine weights with the SwiGLU input silu(gate)*up computed inline. gb10 has silu-mul-then-GEMV only for FP8/NVFP4 MoE experts (moe_expert_gemv_silu_down); nothing on the CUDA side reads the MLX packing or applies its per-group bias."

[[metal]]
source = "kernels/metal/common/mlx_int8_gemv_silu_gate.metal"
entry  = "mlx_int8_gemv_silu_gate_resid"
state  = "metal_only"
why    = "The same fused SwiGLU down_proj GEMV over MLX 8-bit affine weights, additionally folding the residual add y = x_resid + W*(silu(gate)*up). No CUDA kernel reads the MLX packing, and gb10 folds the residual in separate residual_add / residual_add_rms_norm kernels rather than in the GEMV."

[[metal]]
source = "kernels/metal/common/gdn_helpers.metal"
entry  = "silu_apply"
state  = "metal_only"
why    = "Standalone elementwise silu(x) on bf16, used by the Metal GDN gate path before bf16_mul. gb10 never launches a bare SiLU: every CUDA SiLU is fused into a gate*up product (fused_silu_mul, silu_mul_separate) or into the conv1d / gated-norm kernels that need it."

[[metal]]
source = "kernels/metal/common/gdn_helpers.metal"
entry  = "bf16_mul"
state  = "metal_only"
why    = "Plain elementwise bf16 Hadamard product out = a*b with fp32 internal math, pairing with silu_apply on the Metal GDN gate path. gb10 has no unfused elementwise multiply; its gate products are fused into sigmoid_gate_mul, silu_mul_separate and the gated_rms_norm family."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_linear_no_bias"
state  = "metal_only"
why    = "fp32 NLLB linear without a bias operand. gb10's nllb_linear takes a nullable bias pointer and branches on it in-kernel (bias ? bias[n] : 0), which Metal cannot express because buffer arguments are never null, so the bias-less case became its own Metal entry point with no CUDA twin."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_linear_bf16"
state  = "metal_only"
why    = "bf16 NLLB linear with fused bias (C = bias + A*W^T) for M > 1. gb10's nllb_encoder.cu has no bf16 GEMM: its batched bf16 projections go through dense_gemm_bf16_pipelined followed by nllb_bias_bf16, so this fused M>1 bf16 linear is a Metal-side composition of two CUDA kernels."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_linear_no_bias_bf16"
state  = "metal_only"
why    = "bf16 NLLB linear without bias for M > 1. gb10's nllb_encoder.cu has neither a bf16 GEMM nor a bias-less linear entry: its bf16 path is nllb_gemv_bf16 for M = 1 and dense_gemm_bf16_pipelined otherwise, so nothing on the CUDA side carries this signature."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_add_position_bf16"
state  = "metal_only"
why    = "Adds one position row to every batch row of a decoder step (dst[b, :] += pos[:] over batch x D). gb10 broadcasts positions with nllb_add_row_bf16 over a flat [n, d] view, which Metal also has; this batch-shaped variant exists only on the Metal side."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_cache_write_bf16"
state  = "metal_only"
why    = "Writes one decoder step's rows into a per-batch contiguous cache at position pos with an explicit rows count (src, cache, pos, batch, rows, D). gb10 writes its NLLB cache only through nllb_scatter_batched (src, dst, pos, B, stride, d), which Metal also carries; this second write path has no CUDA twin."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_gemv_bf16_no_bias"
state  = "metal_only"
why    = "bf16 NLLB GEMV without the bias operand. gb10's nllb_gemv_bf16 takes a nullable bias pointer and checks it in-kernel (if (bias) acc += bias[warp]); Metal cannot pass a null buffer, so the no-bias case became a separate Metal entry point that no CUDA kernel corresponds to."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_gemv_batched_bf16"
state  = "metal_only"
why    = "Batched bf16 NLLB GEMV (M rows of x against one W, bias applied per row) for multi-beam decode. gb10 has only the single-row nllb_gemv_bf16 and routes M > 1 projections through the dense_gemm_bf16_pipelined tensor-core GEMM, so no CUDA entry point takes an M axis here."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_attn_kv_batched_bf16"
state  = "metal_only"
why    = "Batched bf16 NLLB attention over a leading batch dimension (q[batch, tq, H*D] against k/v[batch, tk, H*D]). gb10's nllb_attn_kv_bf16 handles one sequence per launch and its batched decode goes through nllb_attn_bdecode with a per-row tk table, so no CUDA kernel has this batch-major prefill contract."

[[metal]]
source = "kernels/metal/common/lora_bgmv.metal"
entry  = "lora_bgmv_shrink_stub"
state  = "stub"
gb10   = "kernels/gb10/common/lora_bgmv.cu::lora_bgmv_shrink"
why    = "Empty body by its own header: per-request LoRA bgmv is not implemented on Metal. Stands in for gb10's lora_bgmv_shrink (xa[row, :] = x[row, :] @ A_s^T at max_rank, BF16 out) so the metal kernel set is not surprised by a missing stem. A real port must reproduce dense_gemv_bf16's reduction order."

[[metal]]
source = "kernels/metal/common/lora_bgmv.metal"
entry  = "lora_bgmv_expand_fold_stub"
state  = "stub"
gb10   = "kernels/gb10/common/lora_bgmv.cu::lora_bgmv_expand_fold"
why    = "Empty body by its own header: per-request LoRA bgmv is not implemented on Metal. Stands in for gb10's lora_bgmv_expand_fold (delta = xa @ B_s^T, then out += scale_s * bf16(delta) with the bf16 rounding BEFORE the scale). Nothing here can be mapped until a body exists and is measured."

[[metal]]
source = "kernels/metal/common/attention_decode.metal"
entry  = "attention_decode"
state  = "counterpart"
gb10   = "kernels/gb10/common/paged_decode_attn.cu::paged_decode_attn"
why    = "gb10 reads K/V through block_tables and seq_lens over a paged NHD pool for num_seqs sequences with an optional sliding_window; Metal reads one contiguous [seq_len, kv_heads, head_dim] cache for a single sequence and silently clamps seq_len to MAX_SEQ_DECODE = 4096 (threadgroup score array). Paged vs contiguous, plus the clamp."

[[metal]]
source = "kernels/metal/common/attention_decode_turbo2.metal"
entry  = "attention_decode_turbo2"
state  = "counterpart"
gb10   = "kernels/gb10/common/paged_decode_attn_turbo2.cu::paged_decode_attn_turbo2"
why    = "gb10 is paged (block_tables, seq_lens, block_stride_bytes, data_section_bytes) over num_seqs; Metal takes flat contiguous k_data/v_data/k_scales/v_scales for ONE sequence, exposes sparse_v_threshold as an argument where CUDA fixes it as a constant, and clamps seq_len to 4096. Same Turbo2 byte layout per token, different cache contract."

[[metal]]
