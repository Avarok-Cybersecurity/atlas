[model]
name = "qwen3.5-122b-a10b"
hf_id = "Sehyo/Qwen3.5-122B-A10B-NVFP4"
params = "122B"
active_params = "10B"
architecture = "Gated DeltaNet + Full Attention + MoE"

layers_total = 48
layers_linear_attention = 36
layers_full_attention = 12
layer_pattern = "3:1 (linear, linear, linear, full)"

moe_experts = 256
moe_topk = 8
moe_intermediate = 1024
shared_expert_intermediate = 1024

hidden_dim = 3072
head_dim = 256
q_heads = 32
kv_heads = 2

linear_attn_key_heads = 16
linear_attn_key_dim = 128
linear_attn_value_heads = 64
linear_attn_value_dim = 128
linear_conv_kernel = 4

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
partial_rotary_factor = 0.25
attn_output_gate = true

mtp_layers = 1
mtp_type = "full_attention"
vision = true

# Recommended sampling defaults per category (from Qwen3.5 model card).
# 2026-05-24 empirical band-aid (matches Qwen3.6-35B-A3B post-revert).
# Reverted from Qwen card's temp=1.0/pres=1.5/2.0 — those caused
# max_tokens-overrun wandering on agentic opencode clients on the 35B
# sibling. Same family, same regression risk.
[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0  # 2026-06-06: 1.1->1.0, align with qwen3.6-35b 10/10 campaign + Qwen vendor
dry_multiplier = 0.0      # 2026-06-06: 0.5->0.0, campaign temp=0 finding

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0  # 2026-06-06: 1.1->1.0, align with qwen3.6-35b 10/10 campaign + Qwen vendor
dry_multiplier = 0.0      # 2026-06-06: 0.5->0.0, campaign temp=0 finding

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0  # 2026-06-06: 1.1->1.0, align with qwen3.6-35b 10/10 campaign + Qwen vendor
dry_multiplier = 0.0      # 2026-06-06: 0.5->0.0, campaign temp=0 finding

[behavior]
# Content-loop watchdog disabled: 2026-05-05 chess-game stress sweep
# showed Qwen3.5-122B-A10B EP=2 finishes naturally with EOS on long-code
# prompts (33.3 t/s, finish=stop, zero loops). Only the dense Qwen 27B
# variants need the watchdog.
enable_loop_watchdog = false
# Thinking on by default for all Qwen reasoning-tier models (sweep 2026-05-20).
thinking_default = true
# 2026-05-23 sweep: false → true. Project-wide default after Qwen3.6
# Layer-A scanner and F1 removal landed.
thinking_in_tools = true
# 2026-05-23 sweep: 512 → 2048 (project-wide reasoning headroom bump).
max_thinking_budget = 2048

[[model_types]]
model_type = "qwen3_5_moe"
hidden_size = 3072

# Qwen3.6-derived checkpoints (e.g. Sehyo/Qwen3.5-122B-A10B-NVFP4 with
# mrope_interleaved=true) get their model_type rewritten to qwen3_6_moe
# by parse_config. Accept the rewritten form at the same hidden_size so
# the 122B target handles both Qwen3.5 and Qwen3.6-flavored 122B
# checkpoints from the same kernel dir.
[[model_types]]
model_type = "qwen3_6_moe"
hidden_size = 3072

[kernel]
moe_gate_shmem_bytes = 6144   # hidden_dim(3072) * sizeof(bf16)

# ── Kernel lookups this model may legitimately fail to resolve ──
# Harvested 2026-08-03 from `spark serve --check-kernels --gpu-memory-utilization 0.99`
# (22 lookups; the 0.99 util is check-only — the check never serves and the
# physical-fit clamp still guards). Every entry is a try_kernel() probe whose
# 0-handle falls back to a kernel that resolves on this target. The four
# [expected_absent.gated_delta_rule] f16 arms carry the honesty note below.

[expected_absent.w4a16]
w4a16_gemm_t_p3 = "3-deep p3 twin shipped only in qwen3.6-27b's shadow; layers::tgemm_kernel falls back to w4a16_gemm_t (resolves). Unmeasured for this target."
w4a16_gemm_t_k64_p3 = "Same family; k64_kernel falls back to the required w4a16_gemm_t_k64 (resolves)."
w4a16_gemm_t_k64_n64_p3 = "Narrow-N twin; 0-handle, dispatch gated on handle != 0."
w4a16_gemm_t_m128_bf16 = "BF16-projection prefill twin; gated on handle != 0 in prefill_weights, falls back through the resolved w4a16 path."

[expected_absent.w4a4]
w4a4_gemm_mfast = "Shipped only in nemotron-labs-3-puzzle's shadow; dispatch falls back to w4a4_gemm (resolves). Unmeasured."

[expected_absent.vision_encoder]
vision_add_bias = """
TC-pipelined ViT GEMM epilogue; gated on k_gemm_pipelined && k_add_bias
(vit_block.rs:31), falls back to vision_gemm_bias which resolves."""
vit_rope_deinterleave = """
GEMM-based ViT SDPA family. Per enc_impl/init.rs this is SOFT: only the
qwen3.6/Holo vision tree ships it; older trees (qwen3-vl-30b, gemma-4)
leave it null and vit_block auto-falls back to k_attn (vit_block.rs:220),
the universal warp-per-query attention that resolves here."""
vit_softmax_rows = "Same SOFT GEMM-ViT SDPA family; auto-fallback to k_attn."
vit_scatter_head = "Same SOFT GEMM-ViT SDPA family; auto-fallback to k_attn."

[expected_absent.moe_w4a16]
moe_w4a16_grouped_gemm_ptrtable_e8m0 = "Native-MXFP4 E8M0 variant, shipped only in deepseek-v4-flash. NVFP4 target uses the resolved ptrtable grouped GEMM."
moe_w4a16_grouped_gemm_ptrtable_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t variant."
moe_w4a16_grouped_gemm_ptrtable_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t_k64 variant."
moe_w4a16_fused_gate_up_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up variant."
moe_w4a16_fused_gate_up_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up_k64 variant."
moe_w4a16_fused_gate_up_t_k64_fp4 = "FUSED-FP4 gate_up (Holo-3.1 family); dispatch checks handle != 0 before firing."
moe_w4a16_fused_gate_up_t_k64_m128 = "M=128 Block-D variant shipped only in minimax-m2-229b; dispatch falls through to M=64."
moe_w4a16_down_t_k64_fp4 = "FP4 down-projection twin; forward_prefill_routed gates on down_fp4 && handle != 0."

[expected_absent.gated_delta_rule_wy17]
gated_delta_rule_wy17 = """
wy17 fused decode (K=17) exists only in qwen3.6-35b-a3b's PTX module
set (per the init.rs comment); decode_batched checks non-NULL before
the fused path and keeps the sequential per-token path otherwise."""

# ⚠ HONESTY NOTE on the four gated_delta_rule f16 arms: the FP16-h-state
# decode arms dispatch these handles UN-PROBED once --ssm-h-dtype f16 is
# active. Preflight refuses f16 for bad env combos but NOT for a target
# that lacks the twins, so setting the flag on this model is a 0-handle
# launch, not a fallback. Declared here to unblock the gate; the correct
# fix is a preflight check on kernel presence. UNMEASURED.

# ⚠ HONESTY NOTE on the four gated_delta_rule f16 arms: the FP16-h-state
# decode arms dispatch these handles UN-PROBED once --ssm-h-dtype f16 is
# active. Preflight refuses f16 for bad env combos but NOT for a target
# that lacks the twins, so setting the flag on this model is a 0-handle
# launch, not a fallback. Declared here to unblock the gate; the correct
# fix is a preflight check on kernel presence. UNMEASURED.
[expected_absent.gated_delta_rule]
gated_delta_rule_decode_f16_norm = "FP16 h-state twin; see honesty note above. F32 fused-norm arm resolves."
gated_delta_rule_decode_f16_strided_norm_half = "FP16 h-state twin; see honesty note above. F32 strided-norm arm resolves."
gated_delta_rule_decode_f32_strided_norm_half = "Half-register twin; selected only under the resolved half-register gate (ATLAS_GDN_HALF_REG presence, off as shipped)."
gated_delta_rule_decode_f32_strided_norm_smem = "SMEM-staged twin; gated behind ATLAS_GDN_SMEM_STAGE (off as shipped) AND the half-register gate."
