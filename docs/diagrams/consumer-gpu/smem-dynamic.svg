<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Static versus dynamic shared memory for the prefill tiles</title>
  <desc id="d">The BR=64 prefill tile set is 90,112 bytes: Q 33,792, K double-buffered 33,792, V 16,896, P 5,120 and the row statistics 512. ptxas refuses that much static shared memory on sm_89, whose static ceiling is 49,152 bytes (0xc000), but sm_89 lets one block opt into 101,376 bytes of dynamic shared memory. The Ada copy lays the same arrays over one extern __shared__ buffer and exports the size as inferspark_prefill_64_dyn_smem_bytes. The host registry reads that symbol when it resolves the kernel and raises every launch to it, calling cuFuncSetAttribute for sizes above 48 KiB.</desc>

  <defs>
    <marker id="tipInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9CCD4"/>
    </marker>
    <marker id="tipViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BE9DF8"/>
    </marker>
    <marker id="tipRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F28B82"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="#0F1216"/>

  <text x="40" y="44" font-size="23" font-weight="650" fill="#C9CCD4">Same bytes, different kind of shared memory</text>
  <text x="40" y="66" font-size="13.5" fill="#82868F">The BR=64 prefill attention tiles, against the two limits sm_89 has. Scale: bytes per thread block.</text>

  <!-- ===== the scale ===== -->
  <!-- 0..110,000 B over x 160..1060 (900 px): px = 160 + B * 0.0081818 -->
  <text x="40" y="128" font-size="12" font-weight="600" fill="#C9CCD4">BR=64 tiles</text>
  <text x="40" y="144" font-size="10.5" fill="#82868F">inferspark_prefill_64</text>
  <rect x="160" y="112" width="276.5" height="36" fill="#BE9DF8" fill-opacity="0.85"/>
  <rect x="436.5" y="112" width="276.5" height="36" fill="#49C3DB" fill-opacity="0.85"/>
  <rect x="713" y="112" width="138.2" height="36" fill="#12B981" fill-opacity="0.85"/>
  <rect x="851.2" y="112" width="41.9" height="36" fill="#EFB338" fill-opacity="0.9"/>
  <rect x="893.1" y="112" width="4.2" height="36" fill="#F28B82"/>
  <g font-size="11.5" font-weight="650" fill="#0F1216" text-anchor="middle">
    <text x="298" y="135">Q  33,792</text>
    <text x="575" y="135">K x2  33,792</text>
    <text x="782" y="135">V  16,896</text>
  </g>
  <text x="890" y="168" font-size="10.5" fill="#82868F" text-anchor="end">P 5,120 + ml 512</text>

  <!-- axis -->
  <line x1="160" y1="196" x2="1060" y2="196" stroke="#82868F" stroke-width="1"/>
  <g stroke="#82868F" stroke-width="1">
    <line x1="160" y1="192" x2="160" y2="200"/>
    <line x1="323.6" y1="192" x2="323.6" y2="200"/>
    <line x1="487.3" y1="192" x2="487.3" y2="200"/>
    <line x1="650.9" y1="192" x2="650.9" y2="200"/>
    <line x1="814.5" y1="192" x2="814.5" y2="200"/>
    <line x1="978.2" y1="192" x2="978.2" y2="200"/>
  </g>
  <g font-size="10.5" fill="#82868F" text-anchor="middle">
    <text x="160" y="214">0</text>
    <text x="323.6" y="214">20,000</text>
    <text x="487.3" y="214">40,000</text>
    <text x="650.9" y="214">60,000</text>
    <text x="814.5" y="214">80,000</text>
    <text x="978.2" y="214">100,000</text>
  </g>

  <!-- limits -->
  <line x1="562.2" y1="96" x2="562.2" y2="250" stroke="#F28B82" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="568" y="240" font-size="11.5" font-weight="650" fill="#F28B82">49,152 = 0xc000</text>
  <text x="568" y="256" font-size="10.5" fill="#F28B82">static ceiling, any arch without an "a"</text>
  <line x1="897.3" y1="96" x2="897.3" y2="226" stroke="#C9CCD4" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="891" y="104" font-size="11" fill="#C9CCD4" text-anchor="end">90,112 = 0x16000</text>
  <line x1="989.4" y1="96" x2="989.4" y2="250" stroke="#12B981" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="984" y="240" font-size="11.5" font-weight="650" fill="#12B981" text-anchor="end">101,376 = 99 KiB</text>
  <text x="984" y="256" font-size="10.5" fill="#12B981" text-anchor="end">dynamic opt-in per block, sm_86 and sm_89</text>

  <!-- ===== left: the gb10 source ===== -->
  <rect x="40" y="288" width="540" height="252" rx="4" fill="#171B21" stroke="#2E353F"/>
  <rect x="40" y="288" width="4" height="252" fill="#F28B82"/>
  <text x="60" y="314" font-size="14" font-weight="650" fill="#C9CCD4">gb10/common: static __shared__</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#C9CCD4">
    <text x="60" y="344">__shared__ __nv_bfloat16 smem_Q[BR64][HDIM_PAD];</text>
    <text x="60" y="362">__shared__ __nv_bfloat16 smem_K64[2][BC][HDIM_PAD];</text>
    <text x="60" y="380">__shared__ __nv_bfloat16 smem_V64[BC][HDIM_PAD];</text>
    <text x="60" y="398">__shared__ __nv_bfloat16 smem_P64[BR64][BC + PAD_P];</text>
    <text x="60" y="416">__shared__ float smem_ml64[BR64][2];</text>
  </g>
  <text x="60" y="440" font-size="11" fill="#82868F">BR64 = 64, BC = 32, HDIM_PAD = 264, PAD_P = 8</text>
  <path d="M 310 452 L 310 476" stroke="#F28B82" stroke-width="1.5" marker-end="url(#tipRed)"/>
  <rect x="60" y="480" width="500" height="46" rx="3" fill="#3A2224" stroke="#F28B82"/>
  <text x="72" y="499" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#F28B82">ptxas -arch=sm_89: Entry function 'inferspark_prefill_64'</text>
  <text x="72" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#F28B82">uses too much shared data (0x16000 bytes, 0xc000 max)</text>

  <!-- ===== right: the Ada copy ===== -->
  <rect x="620" y="288" width="540" height="252" rx="4" fill="#171B21" stroke="#2E353F"/>
  <rect x="620" y="288" width="4" height="252" fill="#BE9DF8"/>
  <text x="640" y="314" font-size="14" font-weight="650" fill="#C9CCD4">ada/common: the same arrays, dynamic</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#C9CCD4" xml:space="preserve">
    <text x="640" y="344">struct PrefillTiles64 {      // same order</text>
    <text x="640" y="362">  Q[BR64][HDIM_PAD]; K[2][BC][HDIM_PAD];</text>
    <text x="640" y="380">  V[BC][HDIM_PAD]; P[BR64][BC+PAD_P]; ml[BR64][2];</text>
    <text x="640" y="398">};</text>
    <text x="640" y="420" fill="#BE9DF8">AVAROK_EXPORT_DYN_SMEM(inferspark_prefill_64,</text>
    <text x="640" y="438" fill="#BE9DF8">                       PrefillTiles64);</text>
    <text x="640" y="462">// in the kernel body:</text>
    <text x="640" y="480">AVAROK_PREFILL_TILES(PrefillTiles64, tiles);</text>
    <text x="640" y="498">auto&amp; smem_Q = tiles.Q;    // body unchanged</text>
  </g>
  <text x="640" y="526" font-size="11" fill="#82868F">The macro static_asserts sizeof(Tiles) &lt;= 101,376 and defines the symbol.</text>

  <!-- ===== bottom: the host path ===== -->
  <text x="40" y="584" font-size="15" font-weight="650" fill="#C9CCD4">How the launch learns the size: avarok_core::registry_dyn_smem</text>

  <g font-size="11.5">
    <rect x="40" y="604" width="250" height="96" rx="4" fill="#1E242B" stroke="#2E353F"/>
    <text x="56" y="626" font-weight="650" fill="#C9CCD4">1. Resolve the entry</text>
    <text x="56" y="646" fill="#82868F">raw_function_cached looks up</text>
    <text x="56" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#C9CCD4">inferspark_prefill_64</text>
    <text x="56" y="680" fill="#82868F">once, then caches the handle</text>

    <rect x="318" y="604" width="270" height="96" rx="4" fill="#1E242B" stroke="#2E353F"/>
    <text x="334" y="626" font-weight="650" fill="#C9CCD4">2. Look for the floor symbol</text>
    <text x="334" y="646" fill="#82868F">cuModuleGetGlobal_v2 on</text>
    <text x="334" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#C9CCD4">&lt;entry&gt;_dyn_smem_bytes</text>
    <text x="334" y="680" fill="#82868F">then a 4-byte cuMemcpyDtoH_v2</text>

    <rect x="616" y="604" width="250" height="96" rx="4" fill="#1E242B" stroke="#2E353F"/>
    <text x="632" y="626" font-weight="650" fill="#C9CCD4">3. Raise the launch</text>
    <text x="632" y="646" fill="#82868F">launch_on_stream takes</text>
    <text x="632" y="662" fill="#82868F">max(requested, floor);</text>
    <text x="632" y="680" fill="#82868F">never lowers a larger request</text>

    <rect x="894" y="604" width="266" height="96" rx="4" fill="#1E242B" stroke="#2E353F"/>
    <text x="910" y="626" font-weight="650" fill="#C9CCD4">4. Opt in, then launch</text>
    <text x="910" y="646" fill="#82868F">above 48 KiB: cuFuncSetAttribute</text>
    <text x="910" y="662" fill="#82868F">(MAX_DYNAMIC_SHARED, 90,112),</text>
    <text x="910" y="680" fill="#82868F">then cuLaunchKernel</text>
  </g>
  <g stroke="#C9CCD4" stroke-width="1.5" fill="none">
    <path d="M 290 652 L 314 652" marker-end="url(#tipInk)"/>
    <path d="M 588 652 L 612 652" marker-end="url(#tipInk)"/>
    <path d="M 866 652 L 890 652" marker-end="url(#tipInk)"/>
  </g>

  <!-- outcomes of step 2 -->
  <g font-size="11.5">
    <rect x="318" y="724" width="270" height="34" rx="3" fill="#0F2A22" stroke="#12B981"/>
    <text x="330" y="745" fill="#12B981">found, 4 bytes: record the floor</text>
    <rect x="318" y="766" width="270" height="34" rx="3" fill="#171B21" stroke="#2E353F"/>
    <text x="330" y="787" fill="#C9CCD4">CUDA_ERROR_NOT_FOUND: no floor</text>
    <rect x="318" y="808" width="270" height="34" rx="3" fill="#3A2224" stroke="#F28B82"/>
    <text x="330" y="829" fill="#F28B82">any other error or size: refuse to load</text>
  </g>
  <path d="M 453 700 L 453 720" stroke="#C9CCD4" stroke-width="1.5" marker-end="url(#tipInk)"/>

  <g font-size="11.5" fill="#82868F">
    <text x="616" y="740">Why this way: the size has one source, the kernel's own sizeof.</text>
    <text x="616" y="758">No prefill dispatch site changes, and no host constant can drift.</text>
    <text x="616" y="782">Targets that export nothing launch exactly as before: on a module</text>
    <text x="616" y="800">set with no floors the launch path pays one atomic load.</text>
    <text x="616" y="824">Failing closed matters: a dynamic-tile kernel launched with no</text>
    <text x="616" y="842">dynamic memory reads out of bounds instead of running slowly.</text>
  </g>
</svg>
