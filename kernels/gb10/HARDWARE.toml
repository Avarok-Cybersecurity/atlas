[hardware]
name = "gb10"
vendor = "nvidia"
arch = "sm_121f"
compute_capability = "12.1"
# Streaming multiprocessors — the GB10 value that `avarok_core::device::sm121`
# has always carried, stated here so grid-sizing rules can read it from the
# TARGET instead of from a constant named after one card. Declaring it changes
# nothing on GB10; `avarok_core::device::sm121::NUM_SMS` stays for the gb10
# callers that are genuinely about this part.
sm_count = 48
memory_bandwidth_gbps = 273
memory_type = "LPDDR5X"
memory_gb = 120

# ── Benchmark limits ───────────────────────────────────────────────────────
#
# What a certification campaign and the record policies judge a GB10 by
# (`avarok_plugin::hardware::limits`). Facts about THIS box class — its
# `acpitz` chassis zones, its unified 121 GB pool, its checkpoint load times —
# an H100 SXM has other sensors, another memory model and another disk, and
# declares its own tables when someone measures them. Every sub-table is
# required once this section exists: a reader sees every number a campaign
# will use. This file is a closure input: changing a limit re-opens every
# gb10 gate.

# Chassis and die temperatures.
# * park / resume: `spark bench certify` parks a node at or above
#   `chassis_park_c` (or on the driver's thermal-slowdown flag) and lets it
#   take units again at or below `chassis_resume_c`. Healthy loaded GB10s read
#   55-76 °C across three boxes on 2026-09-15; the box behind the 0.66 tok/s
#   cross-box incident read 89 °C with the driver reporting a slowdown. A
#   relative rule (+20 °C over rest) parked every box after its first unit — a
#   GB10 rises 26-33 °C over rest under any gate. `chassis_park_c` is also the
#   record-time "this Speed number is suspect" line (`hardware::policy`).
# * equivalence delta: two GB10s whose hottest zones are within this of each
#   other, with no thermal alert on either, may sign one Speed-class record
#   set (`gate::agreement`). 15: the incident pair was 24 °C apart; a fleet
#   under load spreads 11-13 °C (55 vs 66-68 °C) with no number moving.
# * gpu_ceiling_c: die temperature above which a Speed record's pre-run
#   capture is suspect. 75 is the midpoint between dgx1's healthy 52-66 and
#   dgx2's 70-89 on 2026-08-15 — a hypothesis awaiting a third box, gating
#   only under AVAROK_HW_TEMP_GATE=1 and recorded on every run meanwhile.
[benchmarks.limits.thermal]
chassis_park_c = 80
chassis_resume_c = 70
chassis_equivalence_delta_c = 15
gpu_ceiling_c = 75

# `MemAvailable / MemTotal` a gate needs before its server may start. The
# recipe's own `gpu_memory_utilization` is honoured verbatim; what freezes a
# unified pool is CO-TENANCY — two serves plus a heavy client took SSH with
# them once — and 16.3 GB of co-tenants was measured to cost 32 % at C=16.
# 0.85 means "nothing else holds more than ~15 % of this box": a clean GB10
# sits at ~0.94 and passes, a single 16 GB container drops it to ~0.81.
[benchmarks.limits.memory]
min_free_fraction = 0.85

# Seconds. serve_allowance: what a self-served gate spends before its first
# sample — ~40 s for a 27B NVFP4 checkpoint in the page cache, minutes for a
# cold 35B FP8 from disk; stack #1073's third campaign killed a 17 s bench at
# 52 s while its server loaded. boot_timeout: how long a started server may
# take to name its model. shard_overhead / floor: measured 2026-09-15 on
# six-way shards — an echolp sixth ran 1650-1873 s against a 1260 s share, a
# 27B sixth 741-940 s against 1020. build_allowance: a fresh anchor build on
# a node.
[benchmarks.limits.timing]
serve_allowance_s = 600
boot_timeout_s = 900
shard_overhead_s = 420
shard_floor_s = 300
build_allowance_s = 1800

# The non-thermal half of "one box": clock ceiling within 1 % (two GB10s
# report 3003 MHz exactly; anything else is another part or firmware), memory
# within 5 % (128 GB parts read a few hundred MB apart; another SKU is 30 %
# away).
[benchmarks.limits.equivalence]
clock_spread = 0.01
mem_spread = 0.05

# ── Serving defaults for this target ───────────────────────────────────────
#
# SSOT for the per-target serving levers, baked into `avarok_kernels` by
# build.rs (`build_defaults.rs`) as `avarok_kernels::TARGET_DEFAULTS` and read
# by every resolver in spark-model BEFORE the environment.
#
# WHY IT IS HERE. Maintainer review, 2026-09-11 (tbraun96): "There is no arch
# separation at all. H100 builds compile GB10's kernel tree. Every Hopper/GB10
# divergence is expressed as an env lever set by an H100 recipe living outside
# this repo — not as arch-selected code. 'No interference' rests on discipline
# rather than structure." A default that lives in a launch script is not a
# property of the target; one that lives beside the target's arch and memory
# facts is. The environment stays available as an EXPLICIT operator override,
# and the serve log says which values came from it.
#
# EVERY target with a `[defaults]` table declares EVERY row, even where the
# value agrees with the baseline: an absent key falls through to
# `build_defaults::baseline`, which is correct behaviour and terrible
# documentation — a reader of this file would have to know the baseline to
# know what this target serves with, which is the "recipe lives somewhere
# else" problem the table replaces.
#
# GB10's values are TODAY'S HARDCODED DEFAULTS, unchanged, and
# `crates/avarok-kernels/tests/target_defaults.rs` asserts exactly that by
# equality against `build_defaults::baseline`: a GB10 serve with no
# environment set behaves as it did before this table existed.
[defaults]
# The BF16 decode head's batched-GEMV band
# (`model/trait_impl/lm_head_batched.rs`). 8 is the FROZEN band: the A/B
# behind it measured the batched GEMV NEGATIVE above 8 on GB10 (-14.4% at
# C=16, commits 84d5b763c / 78d276832), and the band's upper edge decides
# whether a width lands on the GEMV or on a REASSOCIATING tile GEMM — i.e.
# which bits a decode of that width produces. See `layers/ops/gemm_quant.rs`.
lm_head_batchm_max = 8
# One strided recurrent launch per batch on the GDN decode path. No GB10
# receipt; unchanged from main.
ssm_batched_recurrent = false
# The tensor-core GDN chunked-PREFILL spine (#928). OFF, and INERT here: the
# kernel is `kernels/hopper/common/gated_delta_rule_chunk_tc.cu`, declared in
# that target's `[kernels] overrides`, and GB10's build does not compile it — so
# the probe returns `KernelHandle(0)` and the launcher stays on the scalar
# parent `gated_delta_rule_fla::chunk_delta_h_vfused` whatever this row says.
# Declared anyway because the lever list is one list.
#
# It was DEVELOPED AND VALIDATED HERE, on GB10, and it is arch-neutral; it sits
# in the Hopper tree only because a file in `kernels/gb10/common` is mirrored
# into hopper and b200 by symlink, and `check_cross_hardware.py` rule S1
# refuses to create new cross-hardware symlinks. Two things would move it back
# down, in one commit: a GB10 A/B receipt, and the two mirror links.
#
# The standing reason this row would stay false even then: the arm reassociates
# the k-reduction into the MMA tree, and this kernel's lesson is that a spine
# change can read cos=1.0000 and still cost 1.4 BFCL points, so promotion needs
# the ssm-poisoning tripwire. HOPPER ships it ON (round 13, -39.6%/-44.7% C=1
# TTFT, coherency 4/4, determinism 8/8 x 3), and that is an H100 receipt: a
# 48-SM GB10 is the part the 48-CTA grid nearly fills, so the margin does not
# transfer by argument.
gdn_prefill_tc = false
# The Hopper BA-gates twin (#928). OFF, and INERT here: the kernel lives in
# `kernels/hopper/common/ssm_ba_gates_hopper.cu`, which GB10's tree does not
# carry and GB10's build does not compile, so the probe returns
# `KernelHandle(0)` and the launcher stays on the gb10 parent
# `ssm_preprocess::dense_gemm_ba_gates_prefill` whatever this row says.
# Declared anyway, for the same reason every other row here is: the lever list
# is one list, and a row present in one target's table and missing from
# another's is how a lever comes to mean two things in one repository. The twin is bit-identical to that parent, so a GB10 receipt could
# move this row on speed alone — but the parent's 24-CTAs-per-token grid is a
# much better fit for a 48-SM part than for a 132-SM H100, and there is no GB10
# A/B. See `kernels/hopper/HARDWARE.toml` and `SSM-BA-GATES-ATTRIBUTION.md`.
ssm_ba_gates_hopper = false
# The Hopper FP8 activation-quant twin (#928, round 16). OFF: the source lives
# under `kernels/hopper` only, so the lookup returns 0 here and the row is
# INERT — declared so the lever list is one list, the same disposition as
# `gdn_decode_hopper` and `ssm_ba_gates_hopper` above. The twin's own receipt
# is an H100 one (3.3-3.6x at prefill M, 0.76-0.95x at M <= 25), and its CTA
# floor is derived from a 132-SM part; a 48-SM GB10 would want its own
# measurement before either moves.
# See `kernels/hopper/HARDWARE.toml` and `FP8-ACT-QUANT-ATTRIBUTION.md`.
fp8_act_quant_hopper = false
# Split SiLU+down on the decode path — shipped ON everywhere.
decode_split_silu = true
# Paged-decode attention split-K. `legacy` is the rule GB10 has always run —
# `num_splits = sm_count / (num_q_heads * split_ref_seqs(num_seqs, max batch))`
# — restated, not changed. Hopper's `auto` fills 132 SMs at the single-stream
# shape; a 48-SM GB10 is the part that rule was written for and there is no
# GB10 A/B, so this row does not move until there is one.
# `AVAROK_ATTN_DECODE_SPLITK=auto` is how that A/B is run.
attn_decode_splitk = "legacy"
# `w8a16_gemm_m16` on the dense-FFN decode arm (#927). OFF: the kernel is not
# in this target's tree at all (`kernels/hopper/HARDWARE.toml [kernels]
# overrides`), so the handle resolves to 0 and the arm declines anyway.
# Declared explicitly so this file answers what GB10 serves with on its own.
ffn_m16_tc = false
# `w8a16_gemm_m16{,_strided}` on the decode Q/K/V and o_proj (#927). OFF: no
# GB10 receipt, and the kernel is not in this target's tree.
attn_m16_tc = false
# `dense_gemm_m16_bf16` on the BF16 decode head (#927). OFF: no GB10 receipt,
# the kernel is not in this target's tree, and the arm is a token-visible
# numerics seam that must not arrive by inheritance.
lm_head_m16_tc = false
# `w8a16_gemv_batch16_ncol{2,4}` on the decode attention projections (#927).
# OFF: no receipt, and the kernel is not in this target's tree.
attn_ncol_gemv = false
# The fused dense-FFN gate+up decode GEMM (#927). OFF: the arm is a cuBLASLt
# call-shape change on the W8A8 block-scaled path, and GB10 has neither a
# receipt nor the arm the receipt was taken on. GB10 also does not compile the
# arm's strided-SiLU consumer (`silu_mul_strided.cu` is Hopper-owned), so the
# row is INERT here and is declared only so the lever list is one list. A GB10
# receipt moves the source down and this row with it. See
# `kernels/hopper/HARDWARE.toml` and `FFN-GATEUP-FUSION-ATTRIBUTION.md`.
ffn_gateup_fused = false
# Quantize a plain-BF16 dense checkpoint's FFN to block-scaled FP8 at load.
# OFF: on this part the dense-FP8 arms lose to NVFP4 (see
# `layers/dense_ffn_w8a8_prefill.rs`), and 120 GB needs no FP8 to fit a dense
# model. A NUMERICS row; it exists for the 16 GB Ada target.
dense_fp8_from_bf16 = false
# The same route for the GDN projections (`in_proj_qkvz`, `out_proj`). OFF for
# the same reasons; a NUMERICS row that exists for the 16 GB Ada target.
gdn_fp8_from_bf16 = false
# And for the full-attention q/k/v/o. OFF for the same reasons.
attn_fp8_from_bf16 = false
# BF16 dense-FFN prefill on cuBLASLt by default. OFF: the baseline, restated.
# The win is an Ada measurement; GB10 keeps `AVAROK_CUBLAS_GEMM=ffn` as the
# opt-in it always was.
ffn_bf16_cublas_prefill = false
# BF16 GDN verify projections on one cuBLASLt GEMM. OFF: the baseline,
# restated. A numerics row; `AVAROK_GDN_BATCHED_GEMM=1` is the A/B.
gdn_batched_gemm = false
# Gated dense-BF16 Q/K/V on the batched GEMV in multi-seq decode. OFF: the
# baseline, restated (the row is an ada change). `AVAROK_ATTN_GATED_BF16_BATCHM=1`
# arms it.
attn_gated_bf16_batchm = false
# Consumer-card memory sizing. OFF: the baseline, restated. GB10 keeps its
# load multipliers, its flat speculative headroom and its full uploads.
memory_fit_consumer = false
# Upper M for the W8A8 block-scaled dense-FFN prefill (#917). These are the
# only two rows in this table that GB10 declares in order to DIFFER from the
# baseline rather than to restate it: the baseline is no cap, which is right
# for H100 and wrong here.
#
# W8A8 feeds the FP8 tensor cores directly instead of dequantizing into a BF16
# MMA. On H100 that is 2.0-3.1x at every M measured. On sm_121 it is not: W8A8
# is FLAT at ~14 TFLOP/s from M=128 to M=2048 while W8A16 climbs to ~26 and
# stays there. A kernel whose throughput does not move with M is not
# compute-bound -- it is pinned by the per-token activation quantization and
# its FP32 scale epilogue, which W8A16 never pays. So W8A8 wins only while the
# GEMM is small enough that the quantization is not the bill.
#
# Two rows because the crossover is shape-dependent. Measured 2026-09-11 on
# spark-256a at the real Qwen3.8-27B dims (H=5120, INTER=17408): gate/up
# (N=17408, K=5120, WIDENING) crosses at M~64-128; down (N=5120, K=17408,
# NARROWING) at M~384-512. Each row is the low end of its band, so the arm is
# kept only where it is measured to win.
#
# SERVED RECEIPT, same box, `Qwen3.6-27B-FP8`, M=949, n=5/leg, byte-identical
# prompt, TTFT median, complete separation between the legs:
#
#     no cap  (W8A8)   3343.3 ms
#     capped  (W8A16)  2560.4 ms      -23.4%
#
# Override per shape with AVAROK_W8A8_PREFILL_MAX_M_WIDENING / _NARROWING; 0
# means "never take W8A8 on this shape" and is honoured, not ignored.
w8a8_prefill_max_m_widening = 64
w8a8_prefill_max_m_narrowing = 384
# ── Port sprint rows (port/consumer-opt) ──
# The port sprint's rows (`crates/avarok-kernels/build_defaults_port.rs`). Each
# is false, or its baseline, on this target: the sprint's receipts are Ada
# ones, and no row changes here in this sprint. Rows are inserted immediately
# before the marker line below.

# When a 4-bit BF16 load route is on (dense_affine4_from_bf16,
# gdn_affine4_from_bf16, attn_affine4_from_bf16), every projection the Marlin
# kernels serve (N a multiple of 64, K of 128, more than one group) is
# quantized once at load by round-to-nearest int4 at group 128 (GPTQ's
# symmetric uint4b8 grid, --w4-clip-search shrink candidates per group)
# instead of the MLX affine codes, and served through W4Linear on vLLM's Marlin
# W4A16 GEMM (kernels/ada/common/marlin_ada.cu, host
# crates/spark-model/src/port/marlin/): decode and verify rows 1..64 in one
# launch on one thread configuration fixed per weight (row invariant), prompts
# on vLLM's M split. A projection Marlin does not serve keeps the affine
# quantizer (one log line). 4.125 bits a weight (a bf16 scale per 128 inputs)
# against affine's 4.5 at group 64. It changes nothing on a target without the
# marlin_ada module (every non-Ada target) and nothing when no 4-bit route is
# on. Round-to-nearest int4 is a numerics change, so it is off until
# marlin_ada_microtest passes on the card (every entry within 2 BF16 ulps plus
# the FP32 term bound at M = 1, 8, 16, 17, 32, 64, row invariance across M) and
# the KL gate on the 4B (teacher-forced NLL delta at most twice the FP8 FFN
# route's, full-vocabulary KL mean at most 0.05, coherence, MTP drafted output
# equal to plain at temperature 0); GPTQ and AWQ checkpoints, whose codes are
# the checkpoint's, load through the same kernels at the packed install sites.
marlin_w4a16 = false

# A dense Qwen3.5-family GGUF (arch qwen35) keeps its IQ4_XS, Q4_K and Q6_K
# projections as the file's raw super-blocks in VRAM (the dense FFN, the
# full-attention q/k/v/o, and the two GDN input projections with their
# value-head row reorder applied to the packed bytes), tagged
# WeightDtype::Iq4Xs / Q4K / Q6K for the sm_89 keep-packed decode GEMVs (M =
# 1..8) and MMQ prefill GEMMs (kernels/ada/common/kquant_mmvq_q4_ada.cu,
# iq4_xs_mmq_ada.cu, kquant_q8_1_ada.cu over the vendored llama.cpp MIT engine;
# host port/gguf_q4/), instead of expanding them to BF16 at 2 bytes a weight.
# IQ4_XS, IQ4_NL and Q5_K tensors the route does not keep are expanded on the
# GPU (dequant_iq4xs_q5k_bf16_ada.cu, bit-exact with the CPU decoder), and the
# file's MTP head (blk.<L>.nextn.*) is mapped to the mtp.* names. Off: the
# container refuses IQ4 types as before and the loader is byte-identical. Off
# until the receipt: examples/iq4xs_gemv_microtest.rs all PASS (dequant
# bitwise, GEMV and MMQ within the float64 bound, row invariance), the R2 and
# R3 bars (M = 1 at 85% of 288 GB/s, M = 8 within 25% of M = 1), and a KL check
# against BF16 on a Qwen3.5-4B or Qwen3.8-27B IQ4_XS GGUF.
gguf_native_iq4 = false

# EXL3 trellis matrices (ExLlamaV3's QTIP-style codes, 1 to 8 bits a weight
# with mul1 half-bit steps, read by spark-runtime's weights/exl3 reader) are
# served from their packed codes on sm_89: the input rotated into the Hadamard
# domain (exl3_hadamard_ada.cu), the decode-row linear decoding each 16 x 16
# tile straight into mma fragments for 1 to 128 rows with split-K partials
# (exl3_linear_ada.cu), and longer prefills declined to the BF16 dequant and
# the caller's GEMM (host port/exl3/, after ExLlamaV3 MIT via TensorFold
# Apache-2.0). Off: port::exl3::from_exl3_tensors refuses and route_enabled is
# false, so no loader builds an EXL3 weight and every target is unchanged. Off
# until the receipt: examples/exl3_microtest.rs all PASS (dequant byte-equal to
# the host mirror at every width, the linear within the float64 bound at M =
# 1..128, row invariance, the five-run repeat), one real tensor of
# turboderp/Qwen3.8-27B-exl3 dequantized byte for byte (--real-dir), and a KL
# check of the 27B at 3.0 / 3.5 bpw against its BF16 source once a loader route
# installs EXL3 weights.
weights_exl3 = false

# On a plain-BF16 dense Qwen3.5 checkpoint (Holo 3.1 0.8B and 4B), the dense
# FFN's gate, up and down are quantized once at load by the GPU quantizer into
# MLX affine codes (a bf16 scale and bias per group of inputs; --w4-bits and
# --w4-group, default 4 bits at group 64, 4.5 bits a weight), each BF16 source
# freed right after its own quantize, and served through W4Linear: decode and
# verify rows 1..16 on TensorFold's lane MMA GEMV
# (kernels/ada/common/affine4_lane_ada.cu), prompts on the affine prompt GEMM
# or a BF16 dequant plus cuBLASLt (weight_loader/qwen35_dense/affine4_from_bf16.rs).
# On the 4B it keeps 1.27 GB of FFN weights where BF16 keeps 4.53 GB and FP8
# 2.27 GB, which is what a bandwidth-bound decode step reads. It declines on
# tensor parallel, a pending LoRA adapter, an unserved width and group, or
# absent kernels (every non-Ada target), and dense_fp8_from_bf16 wins when both
# are on. Round-to-nearest 4-bit is a numerics change, so it is off until the
# D7 receipt on the 4B: teacher-forced NLL delta at most twice the FP8 FFN
# route's, full-vocabulary KL mean at most 0.05, coherence and 4K/8K recall
# pass, and MTP drafted output equal to plain at temperature 0.
dense_affine4_from_bf16 = false

# On a plain-BF16 dense Qwen3.5 checkpoint, each GDN layer's [Q|K|V|Z]
# in-projection (the loader's BF16 concat) and out_proj are quantized once at
# load to MLX affine codes (the common --w4-bits and --w4-group, or
# AVAROK_W4_GDN_GROUP for these projections alone, for example 32), each BF16
# source freed after its own quantize, and served through W4Linear on the same
# kernels (weight_loader/qwen35_dense/gdn_affine4_from_bf16.rs). On the 4B the
# 24 GDN layers keep 0.57 GB where BF16 keeps 2.01 GB. The same declines as the
# FFN route; gdn_fp8_from_bf16 wins when both are on. A projection error feeds
# the recurrent state, so it is off until the D7 receipt plus a long-context
# degeneration check (longctx.py recall at 4K and 8K, no drift the BF16 serve
# does not share).
gdn_affine4_from_bf16 = false

# On a plain-BF16 dense Qwen3.5 checkpoint, each full-attention layer's q
# (doubled when gated), k, v and o are quantized once at load to MLX affine
# codes (--w4-bits, --w4-group), each checkpoint tensor freed after its own
# quantize, and served through W4Linear on the same kernels
# (weight_loader/qwen35_dense/attn_affine4_from_bf16.rs). On the 4B the 8
# attention layers keep 0.17 GB where BF16 keeps 0.59 GB. The same declines as
# the FFN route; attn_fp8_from_bf16 wins when both are on. A numerics change,
# independent of the FFN and GDN rows; off until the D7 receipt with the FFN
# and GDN routes on.
attn_affine4_from_bf16 = false

# The affine routes' prompt GEMM (more than 16 rows) quantizes the activation
# rows to int8 per group and runs the W4A8 int8 tensor-core GEMM over the same
# 4-bit codes (kernels/ada/common/affine_prefill_ada.cu, port::affine::prefill)
# instead of the BF16-activation prompt GEMM; a chunk with a non-finite or
# overflowing activation group falls back to BF16 and is counted. Only 4-bit
# affine weights have it, and it changes nothing unless an affine route row is
# on. Int8 tensor cores run at twice the FP8 rate on Ada, so the 4B FFN prompt
# GEMMs are expected faster than the FP8 W8A8 route's. Off until the receipt:
# prompt-row full-vocabulary KL against BF16 within the D7 bound and a TTFT
# ABBA gain at a 3,921-token prompt against the same routes with the row off.
affine4_prefill_int8 = false

# On a plain-BF16 dense Qwen3.5 checkpoint (Holo 3.1 0.8B and 4B), the dense
# FFN's gate, up and down are quantized once at load with the existing NVFP4
# quantizer (E2M1 codes, E4M3 per-16 scales, one F32 tensor scale; 4.5 bits a
# weight), each BF16 source freed right after its own quantize, and served
# through W4Linear over the w4a16_gemv family every CUDA target already
# compiles (weight_loader/qwen35_dense/nvfp4_from_bf16.rs, port/w4/nvfp4.rs):
# decode and verify rows 1..16 on w4a16_gemv / _batch2 / _batch3 / _batchN (row
# invariant by construction), prompts on w4a16_gemm or a BF16 dequant plus
# cuBLASLt. On the 4B it keeps 1.27 GB of FFN weights where BF16 keeps 4.53 GB
# and FP8 2.27 GB. The FP8 FFN route and the affine 4-bit FFN route both win
# over it; it declines on tensor parallel, a pending LoRA adapter, or absent
# kernels. Ada has no FP4 datapath, so whether the software-dequant GEMV
# reaches the bandwidth that makes this a win was never measured; off until
# queue row Q2 shows at least 85% of the measured DRAM bandwidth at M=1, then
# the D7 gate (teacher-forced NLL delta at most twice the FP8 FFN route's,
# full-vocabulary KL, coherence, recall).
dense_nvfp4_from_bf16 = false

# Batched sequence swap (`spark-model/src/model/trait_impl/sequence/state_io.rs`,
# `spark-runtime/src/kv_cache/block_io.rs`): a swapped-out sequence's image
# (each block's K and V for every attention layer, then each GDN layer's h and
# conv state) is gathered with batched async copies (`cuMemcpyBatchAsync` where
# it resolved, else one async copy per region and one event wait per chunk)
# into one reused page-locked staging buffer of at most one
# `--pinned-pool-chunk-mb` chunk, and the file write of one chunk overlaps the
# copy of the next; restore mirrors it. The file is byte-identical to the
# per-region path, so either reader reads either writer's file. OFF until the
# receipt on this card: `kv_swap_roundtrip` (queue row Q9) passes G1 and G2 at
# 1K, 4K and 32K tokens and G3 at 32K, batched >= 5x the per-region path and >=
# 8 GB/s for save and restore. `AVAROK_KV_SWAP_TIMING=1` logs one line per
# image on either path.
kv_batched_swap = false

# SSM tier blob store eviction order (`spark-model/src/model/ssm_tier/store.rs`):
# a capped host-RAM `MemBlobStore` gives up the least recently used blob (a
# fault-in hit and a put both make a key the most recent) instead of the oldest
# insert, and the model removes the tier blobs the snapshot index orphans when
# a fresh save re-homes a spilled prefix or the tail sweep drops one
# (`spark-runtime/src/radix_tree/snapshot_insert.rs`). Only matters with the
# SSM tier on (`AVAROK_SSM_TIER`): no entry is ever spilled without it. OFF
# until the receipt on this card: the reuse ladder (queue row Q10, rung C)
# shows no tok/s, TTFT or SSM-hit loss against off. Outputs are unchanged
# either way: a missing blob is a recompute.
ssm_store_lru = false

# Radix prefix-cache eviction takes its victim from an ordered (last_access,
# node id) index of evictable leaves, maintained at every transition of the
# victim predicate, instead of scanning every node once per evicted block
# (`spark-runtime/src/radix_tree/inner/lru_index.rs`). Ties break toward the
# lowest node id exactly as the scan does, so the victim sequence is identical
# by construction and by a randomized oracle
# (`radix_tree/tests/lru_index.rs`). OFF until the receipt on this card: greedy
# SHA equal and `atlas_prefix_evict_seconds_total` per victim down at least 10x
# on a saturated pool (`AVAROK_PREFIX_EVICT_TIMING=1` times the row-off scan
# arm). `AVAROK_RADIX_LRU_INDEX=1` is the A/B.
radix_lru_index = false

# A prefix-cache hit may end inside a KV block: the chunked prefill copies that
# block into a private block (every attention layer's K and V, D2D on the
# prefill stream before the block table is used) instead of sharing the donor's
# writable tail, which is the issue #1193 aliasing bug
# (`radix_tree/inner/cow_walk.rs`, `prefill_b/prefix_cow.rs`). Saves up to
# block_size - 1 prefill tokens per warm hit and lets an exact repeat of a
# non-aligned prompt reach its leaf snapshot. Never in a multi-rank world or
# under --high-speed-swap. `AVAROK_PREFIX_SUBBLOCK` (0, 1, cow) still wins when
# set. OFF until the receipt on this card: the #1193 shape at C=4 (identical
# prompts, MTP on) equal to cache-off at temperature 0 and free of
# cross-stream identity at 0.7, and prefix-repetition TTFT no worse.
# `AVAROK_PREFIX_COW_TAIL=1` is the A/B.
prefix_cow_tail = false
