[benchmarks.metrics.normalized_single_turn_score]
# Measured 84.12, same run. ★ THIS IS 1.20 BELOW THE MLPERF-EDGE FLOOR (85.32).
# The floor was derived for Qwen3.6-27B and is NOT inherited here — different
# weights — so this is a QUALITY ALARM on this gate, not an MLPerf submission
# failure; the submission rides on 3.6, which still scores 87.44 / 88.59.
# ★ DO NOT treat this bar as an endorsement. Qwen3.8-27B scored 3-4 points
# BELOW Qwen3.6-27B on the same draw and serve config, and the per-subset split
# is suspicious rather than uniformly weaker: simple_python 95.16 against
# simple_java 45.16 and simple_javascript 29.03, with the hallucination category
# down 11 points (96.02 -> 84.85). A model does not lose 66 points between
# Python and JavaScript function calls by capability; that pattern points at a
# defect in the serve path, with the chat-template change the prime suspect
# (this run rendered through the checkpoint's own template, while every recorded
# 3.6 number came through the retired override, and the two serialize tool
# arguments differently). Tracked separately. These bars exist so a regression
# below TODAY's behaviour is caught; they are not a claim that today's behaviour
# is correct.
# SHARDED-OPEN FLOOR, provisional 2026-09-13: the whole-draw run read 84.12 and
# its bar was 83.72; the four-shard aggregate on the shipped serve read 83.36
# (#936) — normalized moves more than overall under partition because ten of
# the twelve flipping samples are live_irrelevance, which the normalized score
# weights heavily. Bar = 83.36 less the 0.4 noise floor; confirm or re-cut from
# the first sharded campaign, as above.
min = 82.96
noise = 0.4
# --- decode-floor ----------------------------------------------------------
# The pinned single-user decode-rate floor. REQUIRED
# (gate::coverage::REQUIRED) since 2026-08-15: the promotion ruling's
# precondition — a >=10-run sigma calibration on the gate's own instrument —
# is met (n=12, sigma ~0.05; see the note), and the bounds below are set from
# that calibration rather than from three points.
#
# The driver pins the whole request (MinHeap code prompt, temperature 0,
# seed 0, max_tokens 1500, runs = 3) and reports the MEDIAN server decode
# rate. Its vacuity pins (>=750 output tokens per run — the driver's
# MIN_OUTPUT_TOKENS, decode_floor/score.rs, which has been 750 since the gate
# landed and was never 800 as this line used to say; it sits under the
# instrument's deterministic 915-token natural stop — server rate present,
# accept_len_mean >= 1.5 from usage.completion_tokens_details.
# accepted_prediction_tokens) make a run that measured nothing INCONCLUSIVE
# rather than PASS — a thinking-on or non-speculating serve measures the
# serial floor, and that number must never be recorded as this gate's.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "decode-floor"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
default = true
status = "measured"
note = """\
BOX RULE (2026-09-13): this is a Speed-class gate; a campaign spread with \
`spark bench certify --with-nodes` measures it on another box ONLY when that \
box is equivalent by hardware::equivalence::SPEED_SPREAD (same GPU and driver \
line, clock ceiling within 1 %, memory within 5 %, no thermal throttle, \
chassis within 15 °C), decided from the records' own captures — otherwise \
every Speed unit is bundled on one node. Two GB10s otherwise identical read \
0.66 tok/s apart at 65 vs 89 °C, ten times this entry's sigma. \
CALIBRATED 2026-08-15, dgx1, this branch's binary: n=12 runs across 4 driver \
passes, every run 28.0-28.1 tok/s, mean 28.03, sigma ~0.05. Fingerprint (the \
instrument these bounds belong to): the DRIVER'S OWN MinHeap fixture, \
per-request reasoning_effort "none", temperature 0, seed 0, max_tokens 1500 \
with a deterministic 915-token natural stop, K4 num_drafts=3 (the recipe \
pins num_drafts: 3), accepted 569/915 per run, serve --max-batch-size 32 \
--gpu-memory-utilization 0.85 (the stock recipe serve). ★ SUPERSEDED BASIS, \
kept for the history: the previous floor (29.0, noise 1.0) came from an n=3 \
basis of 31.5/29.6/30.5 (median 30.5), 2026-08-15 — measured with a \
DIFFERENT instrument (batch-1 serve, an ad-hoc probe prompt, not the \
driver's fixture). Mechanism of the shift: different fixture + serve config \
moved the LEVEL by -2.4 tok/s while run-to-run sigma on the fixed instrument \
is 0.05 — an instrument change, not a regression. The gate is calibrated to \
ITS OWN instrument; never mix bases, and never ratchet from a best run. \
★ The gate serve needs NO operator flags for thinking: thinking-off arrives \
per-request (reasoning_effort "none" in the body — honored since the \
medium-default change), NOT from the recipe, so the stock recipe serve is \
the correct subject. ★ The accept pin depends on the accept-stats \
instrumentation (real accepted_prediction_tokens in usage); a binary \
without it reports INCONCLUSIVE by name, which is correct — a floor \
measured without proof of speculative engagement is the 2026-08-15 decode \
flip-flop all over again."""

[benchmarks.metrics.server_decode_tok_s]
# Median-of-3 server decode rate. The floor of 25.5 is the bound in force —
# an effective floor of 25.0 tok/s once noise 0.5 is applied by
# scoring::compare.
#
# ★ RATCHETED 2026-09-20, 25.0 -> 25.5 (effective 24.5 -> 25.0), to the
# owner's stated floor. Source record: .benchmarks/decode-floor/
# 2026-09-20-43a3c9b202.json (spark-28c2 = dgx3, 2026-09-20 12:06 UTC), which
# reads 26.16 tok/s. SPEED-BOUND POLICY (owner, 2026-09-20): a FLOOR is the
# latest measured value x 0.975 rounded DOWN to a clean step (0.5 below 100,
# 10 from 100 to 1000, 50 above 1000); a CEILING is measured x 1.05 rounded
# UP; "measured" is ONE named committed record, never a best run. 26.16 x
# 0.975 is 25.51, which rounds down to 25.5 — here the owner's stated value
# and the derivation agree. `noise` stays at 0.5 on purpose: it is the
# instrument's measured run-to-run band, not part of the margin, and every
# prior ratchet in this block kept it fixed so the ratchet shows in `min`.
#
# The set this floor is checked against, so it is not a one-draw floor:
# every committed record since the 2026-09-08 step, n=22 across five boxes —
#
#     spark-256a (dgx1)  n=4  25.91 26.02 26.11 25.98    <- slowest box
#     spark-43fa (dgx2)  n=8  26.09-26.26
#     spark-28c2 (dgx3)  n=8  26.15-26.27
#     edgexpert-aae5 / edgexpert-2640   n=1 each   26.13 / 26.04
#     all                n=22  mean 26.16  sigma 0.10  range 25.91-26.27
#
# The effective bar 25.0 sits 0.91 below the slowest committed run
# (2026-09-11-da446c920b, dgx1) and ~11 sigma below the mean, so it cannot
# fail a healthy run on any box in the set; a regression of 4.5% on dgx3 or
# 3.5% on dgx1 fails it. dgx1's four runs all sit below every dgx2/dgx3 run,
# which is why the margin is quoted against dgx1 and not against the mean.
#
# ★ RATCHETED 2026-09-11, 22.7 -> 25.0, from a fresh 12-run set on this
# entry's own instrument and on dgx2 (spark-43fa) — the SLOWEST box, which is
# where the superseded bar was drawn from too, so the basis is comparable:
#
#     26.3 26.1 26.1 26.2 26.1 26.1 26.1 26.1 26.1 26.1 26.1 26.1
#     n=12  mean 26.125  sigma 0.062  range 26.1-26.3
#
# sigma is quantization-limited (the gate reports one decimal), so the true
# spread is at most this. 24.5 sits ~26 sigma below the mean, and ~6.2% below
# it — wider than the mean-minus-5% the sweeps use, so this is a deliberately
# conservative ratchet rather than the tightest the data allows (that would be
# 25.3).
#
# ★ WHY THE LEVEL MOVED. It is a STEP, not drift: records from 2026-08-23 to
# 09-07 read 22.4-23.5 and records from 09-08 onward read 26.1-26.3, with
# accept_len_mean 2.6826 unchanged across the whole span — so this is a
# wall-clock change, not better speculation.
#
# ★ THE CAUSE IS NOT #968, AND AN EARLIER DRAFT OF THIS NOTE SAID IT WAS.
# Three things in this repository refute it, and they are recorded here so the
# wrong story is not re-derived:
#   * f9fd8ca43's own message states "C=1 IS IDENTICAL, AND THAT IS THE
#     DIAGNOSTIC — parent 18.5 / with bug 18.5". The bug it fixed only bites
#     when admissions interleave, so it cannot move a serial rung.
#   * The campaign measured AT f9fd8ca43 reads 22.58 here and C1 18.42 on the
#     sweep — both PRE-step values, at the very commit credited with the step.
#     That record was committed in ac736e938 and dropped in 3cfe4d8c45, which
#     is the only reason "every record from 09-08 reads 26.1-26.3" looked true.
#     `git show ac736e938:.benchmarks/decode-floor/2026-09-08-f9fd8ca431.json`.
#   * The DFlash2 ladder stepped on the same day, and that gate is
#     conflicts_with = "speculative", so an mtp-carry fix cannot reach it.
#
# The leading candidate is 7dd531f59 (#965, the GLM-5.3-Flash port), the only
# code change on the first-parent path through this window; it rewrote the
# dense_gemv M=1 sites that a 248K-vocab BF16 lm head leans on, which fits a
# gain that is large serially and vanishes above C=2. STATED AS A CANDIDATE,
# NOT A FINDING: no A/B across 7dd531f59^ has been run, and this note has
# already been wrong once about the cause.
#
# What the bar does NOT depend on: the step is measured, reproduced 15 times,
# and 24.5 sits far above the entire pre-step band whatever moved it. The
# attribution matters for knowing what to protect, not for whether to protect
# it.
#
# ★ RATCHETED 2026-09-06, 21.0 -> 22.7, and this is the FIRST time this
# entry's own ">=10-run set on this same instrument" rule has actually been
# satisfied. 21.0 was set in c9a682734f from n=3 (22.3 / 22.4 / 22.0) and sat
# ~1.3 tok/s under the band it was drawn from with no measured sigma behind
# the gap. The set behind 22.7 is ten consecutive gate runs — the gate's own
# serve, recipe as-is, bf16 lm head, no hand-built harness:
#
#     22.9 22.8 22.8 22.8 22.8 22.7 22.7 22.8 22.7 22.8
#     n=10  mean 22.78  sigma 0.063  range 22.7-22.9
#
# so 22.2 sits ~9 sigma below the mean. That is a real-regression margin, not
# a noise allowance.
#
# ★ THE 12-RUN 28.03 / sigma-0.05 CALIBRATION IS STILL NOT THIS NUMBER'S
# BASIS, and never was. For weeks the lines here advertised 27.0 as this
# gate's bar, derived as "mean minus ~1 tok/s", while the value beside them
# read 21.0 — so anyone reading the file to judge a measurement read a number
# 6 tok/s above the gate. (Phrased that way on purpose:
# scripts/check_bench_threshold_prose.py reads "the floor of N" as a claim
# about the bound in force, so a dead number must not be written in that
# shape. The live claim, at the top, is written in it deliberately and is
# checked.) That calibration ran on a hand-built serve with the DEFAULT lm
# head; the GATE serves the recipe, which pins lm_head_dtype bf16 as a
# correctness pin, and that head costs ~20%. Never re-derive from it.
#
# ★ WHICH BOX THE MARGIN IS MEASURED ON MATTERS, because the boxes differ by
# more than the within-box sigma. Same gate, same pin f3f77c82fc, same night:
#
#     dgx2 (spark-43fa)  n=10  mean 22.78   <- the calibration above, slowest
#     dgx3 (spark-28c2)  n=3   23.6 23.5 23.5
#     dgx1 (spark-256a)  n=1   23.7
#
# The 0.7-0.8 tok/s spread is between boxes, an order of magnitude above the
# 0.063 within-box sigma, so a floor drawn on one box does not describe
# another — which is exactly why ci.yml's "One PR, one commit, one signer"
# refuses a record set spanning boxes. 22.7 is drawn from the SLOWEST box on
# purpose. On dgx1, currently the only fingerprint in .github/record-signers/
# and therefore the only box that can certify, the margin is ~1.5 tok/s.
# Re-cut this floor if a second box is ever registered and is slower.
#
# noise 0.5 covers the run-to-run band (observed 0.2 peak-to-peak over the
# twelve runs) and stays under the 5% validate_noise cap (5% of 25.0 = 1.25).
# Ratchet only from a fresh >=10-run set on this same instrument.
min = 25.5
noise = 0.5
[benchmarks.metrics.output_tokens]
# The driver emits the MINIMUM completion_tokens across the 3 runs, so this
# floor means "every run decoded at least 750 of the 1500 budget" — the same
# vacuity pin the driver enforces (MIN_OUTPUT_TOKENS), restated where the
# gate can see it. 750, not 1200: the calibrated instrument's natural stop
# is a deterministic 915 tokens, and a pin above the instrument's own
# reference behaviour would fail every honest run.
min = 750.0

[benchmarks.metrics.runs]
# EXACT pin, like the BFCL draw size: a different run count is a different
# benchmark, and a median over a different n is not comparable to this floor.
min = 3.0
max = 3.0

# --- concurrency-sweep -----------------------------------------------------
# The latency/throughput ladder, REQUIRED (gate::coverage::REQUIRED) since
# 2026-08-15 — the maintainer wants this gate MANDATORY, and the thresholds-
# less-entry blocker is gone: this entry carries measured floors from the
# fixed instrument below. The qwen3.6-27b and qwen3.6-35b-a3b entries stay
# unmeasured declarations of intent; baseline_for drops unmeasured entries,
# so this is the gate's one default subject.
#
# ★ THE INSTRUMENT IS PINNED, because the schema defaults are a different
# instrument (C=1,2,4,8,16,32 at osl 128): the [benchmarks.param_overrides]
# table below is applied by gate self-start exactly as serve_overrides is on
# the serve side (bench_resolve::apply_param_overrides), recorded in the run
# record's params, and demanded on the record by check_record — a record
# measured on the schema default cannot read green against these floors.
# C=32 is deliberately NOT in the gate ladder: it needs preflight headroom
# not every recipe has, and the schema-default sweep still covers it for
# manual runs.
#
