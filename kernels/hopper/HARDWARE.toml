[hardware]
name = "hopper"
vendor = "nvidia"
# H100 SXM5 / H200 SXM5 — both SM 9.0. `sm_90a` enables the arch-specific
# Hopper feature set (wgmma/TMA/setmaxnreg) for kernels that opt in; the
# shared gb10-derived kernels below use none of it yet and compile as
# plain sm_90 code. PTX built for sm_90a is NOT forward-compatible with
# sm_100/sm_120 devices — this target is Hopper-only by design.
arch = "sm_90a"
compute_capability = "9.0"
# Streaming multiprocessors. H100 SXM5/PCIe and H200 SXM5 are all GH100 with
# 132 SMs enabled; the H100 NVL card is 132 too. CROSS-CHECKED at boot against
# `CU_DEVICE_ATTRIBUTE_MULTIPROCESSOR_COUNT` — a serve on a part with a
# different count logs a warning naming both numbers rather than silently
# sizing a grid for the wrong machine (`arch_preflight::check_sm_count`).
#
# The defect it guards: `atlas_core::device::sm121::NUM_SMS = 48`, the GB10
# constant, compiled into an H100 build, where a grid sized from it ran 24 CTAs
# on 132 SMs for a whole campaign. A one-line boot warning naming both numbers
# is what would have caught it in round 1.
sm_count = 132
# H100 SXM5 80 GB HBM3: 3350 GB/s. H200 SXM5 141 GB HBM3e: 4800 GB/s.
# Sized to the smaller SKU; the runtime reads real free memory via
# cuMemGetInfo, this is documentation + roofline input only.
memory_bandwidth_gbps = 3350
memory_type = "HBM3"
memory_gb = 80

# Flags added to EVERY kernel compiled for this hardware, under
# common/KERNEL.toml's and the model's (build_flags::merge_extra_flags).
#
# ATLAS_NO_WARP_BLOCKSCALE_MMA compiles out the W4A4 path in
# qwen3.6-35b-a3b/nvfp4/moe_w4a16_grouped_gemm.cu. Hopper has no NVFP4
# datapath, so `cvt.rn.satfinite.e2m1x2.f32` and the warp-level
# `mma.sync ... .kind::mxf4nvf4.block_scale` do not exist here — ptxas:
# "Instruction 'cvt with .e2m1x2' not supported on .target 'sm_90a'"
# (measured 2026-09-05, CUDA 13.0.88; reproduce with
# `scripts/hopper_ptx_gate.sh --hw hopper --model qwen3.6-35b-a3b --strict`
# after dropping this flag — see #899).
#
# A hardware-level define, not a per-model one, because it is a fact about
# the ISA and because every KERNEL.toml under this tree is a symlink into
# kernels/gb10 — saying it per model would fork a shared file once per
# model, which tests/inherited_targets.rs forbids.
[build]
extra_nvcc_flags = ["-DATLAS_NO_WARP_BLOCKSCALE_MMA"]

# ── Serving defaults for this target ───────────────────────────────────────
#
# SSOT for the per-target serving levers, baked into `atlas_kernels` by
# build.rs (`build_defaults.rs`) as `atlas_kernels::TARGET_DEFAULTS` and read
# by every resolver in spark-model BEFORE the environment.
#
# WHY IT IS HERE. Maintainer review, 2026-09-11 (tbraun96): "There is no arch
# separation at all. H100 builds compile GB10's kernel tree. Every Hopper/GB10
# divergence is expressed as an env lever set by an H100 recipe living outside
# this repo — not as arch-selected code. 'No interference' rests on discipline
# rather than structure." A default that lives in a launch script is not a
# property of the target; one that lives beside the target's arch and memory
# facts is. The environment stays available as an EXPLICIT operator override,
# and the serve log says which values came from it.
#
# EVERY target with a `[defaults]` table declares EVERY row, even where the
# value agrees with the baseline: an absent key falls through to
# `build_defaults::baseline`, which is correct behaviour and terrible
# documentation — a reader of this file would have to know the baseline to
# know what this target serves with, which is the "recipe lives somewhere
# else" problem the table replaces.
#
# Every value below WAS a line in that external recipe. The recipe is now the
# target's own declaration, so an H100 serve with NO environment set
# reproduces the measured configuration (round 14: the `h100-defaults`
# profile and the explicit-env profile agreed to within 0.37% aggregate, with
# md5-identical coherency output on 7/7 prompts).
[defaults]
# The BF16 decode head's batched-GEMV band. 8 — GB10's frozen band, held here
# ON PURPOSE and not the 16 an H100 recipe used to export.
#
# 🔴 That 16 was measured with the tensor-core head arm (`dense_gemm_m16_bf16`,
# #927) ALSO on, where the TC arm serves 5..=16 and the band is very nearly
# inert. With the TC arm absent — it is a Hopper-owned kernel and is not in
# this PR — a 16 here would move widths 9..=16 off the reassociating tile GEMM
# onto the batched GEMV in a configuration nobody has measured. The row moves
# to 16 in the commit that lands the arm it was measured beside; a default is
# a claim about a measurement.
lm_head_batchm_max = 8
# One strided recurrent launch per batch on the GDN decode path: +6% on the
# serve, and md5-identical output to the per-sequence launches. This is the
# row that used to be `ATLAS_SSM_BATCHED_RECURRENT=1` in a launch script
# outside this repository.
ssm_batched_recurrent = true
# The Hopper FP8 ACTIVATION-QUANT twin (#928, round 16). ON, and behind a
# WIDTH FLOOR that this row alone does not express — read
# `crates/spark-model/src/layers/ops/fp8_act_quant_floor.rs` before moving it.
#
# `per_token_group_quant_fp8_hopper` gives each 128-element K-group 16 threads
# of one `uint4` and packs 8 groups into a 128-thread CTA, so the CTA's load is
# 2 KB against the parent's 256 B, the activation row stays in registers, and
# the group max is a 16-lane `__shfl_xor_sync` butterfly with no smem and no
# barrier. BIT-IDENTICAL output: same `amax / 448.0f`, same `1e-12f` floor,
# same per-element `div.rn.f32`, same saturating `__nv_cvt_float_to_fp8`.
#
# WHAT IT BUYS, and WHERE IT COSTS. `native_fp8_act_quant_hopper_microtest`,
# 1xH100 80GB HBM3, round 16, 15 arms, all bit-identical:
#
#   M=4576 K=17408   377.75 us (639.2 GB/s, 19.1% HBM) -> 105.33 us (2292.5, 68.4%)  3.59x
#   M=4576 K=6144    135.57 us (628.6, 18.8%)          ->  39.38 us (2164.3, 64.6%)  3.44x
#   M=4576 K=5120    113.47 us (625.9, 18.7%)          ->  33.29 us (2133.4, 63.7%)  3.41x
#   M=1168 K=5120     30.76 us (589.2, 17.6%)          ->   9.12 us (1986.9, 59.3%)  3.37x
#   M=25   K=5120      3.20 us                         ->   4.21 us                  0.76x
#   M=17   K=6144      3.09 us                         ->   3.87 us                  0.80x
#   M=16   K=5120      3.22 us                         ->   3.84 us                  0.84x
#   M=16..25 K=17408   3.95-4.67 us                    ->   3.89-4.32 us             1.02-1.08x
#
# The parent's standalone 625.9/628.6/639.2 GB/s reproduces round 13's in-engine
# nsys figure (633/636/641) to 1.1%, so the attribution's anchor is confirmed by
# two methods on two binaries. The twin reaches 63.7-68.4% of HBM, NOT the 80%
# the attribution's prediction table was derived from.
#
# SIX of the fifteen arms are LOSSES, and they are exactly the decode widths.
# 8 groups per CTA means 8x fewer CTAs; at M <= 25 the parent's `M x K/128`
# grid is already under one wave on 132 SMs, so dividing it by 8 removes
# parallelism that was doing useful work. Round 16 shipped this kernel selected
# by PRESENCE, with no lever and no floor, so every decode-width W8A8 call took
# the slower arm. The floor is the fix: the twin takes a launch only when its
# own grid clears `2 * sm_count` = 264 CTAs, which is `M >= 53` at K=5120,
# `M >= 44` at K=6144 and `M >= 16` at K=17408 — the sign of all fifteen arms.
#
# The kernel is an ADDITION under `[kernels] overrides`, not an override of the
# gb10 stem: both must be in the image at once, because the bit-equality gate
# runs on device. gb10 and b200 carry neither this row's `true` nor the source.
# `ATLAS_FP8_ACT_QUANT_HOPPER=0` is the A/B. Numbers:
# `FP8-ACT-QUANT-ATTRIBUTION.md`.
fp8_act_quant_hopper = true
# Split SiLU+down on the decode path — shipped ON everywhere.
decode_split_silu = true

# ── Kernels this target OVERRIDES instead of inheriting ────────────────────
#
# Every other entry in `kernels/hopper/common/` is a relative symlink into
# `kernels/gb10/common/`, which is what makes gb10 the oracle for this tree
# (`crates/atlas-kernels/tests/inherited_targets.rs`). The files listed here
# are REAL FILES: sources that exist for HOPPER PERFORMANCE and are not used
# on GB10, so gb10's tree does not carry them at all and gb10's build does not
# compile them.
#
# Maintainer rule, 2026-09-11 (tbraun96): "symlinks are fine provided the
# pointed-to gb10 file is not edited when iterating on Hopper; Hopper-tuned
# kernels must be real files under kernels/hopper/". A declaration rather than
# "any regular file is fine": an UNDECLARED regular file in a mirror is a
# silent fork of a shared kernel, which is the defect the mirror check exists
# to catch, and the two cases are indistinguishable without this list.
#
# A declared entry is one of two SHAPES, checked differently and both checked:
# an OVERRIDE replaces a gb10 namesake and must leave gb10's file alone; an
# ADDITION carries a new stem and new entry points and must not be a gb10
# source under a new name. Hopper declares exactly one file today, and it is
# an addition:
#
#   fp8_act_quant_hopper.cu  The per-token / per-128-K-group FP8 E4M3
#                            ACTIVATION quantizer that feeds every W8A8
#                            projection (#928). An ADDITION rather than an
#                            override even though the parent
#                            `per_token_group_quant_fp8.cu` is a
#                            SINGLE-entry-point file that a same-stem override
#                            would fork nothing of: the shared kernel then
#                            would not be in the Hopper image at all, and the
#                            gate for this one is BYTE EQUALITY against it on
#                            device. A new stem keeps BOTH compiled, which is
#                            what lets `native_fp8_act_quant_hopper_microtest`
#                            compare them in one process at
#                            M in {16,17,25,1168,4576} x K in {5120,6144,17408}.
#                            gb10 is untouched and keeps launching its own.
#                            Selected by kernel presence (`try_kernel` →
#                            `ops::Fp8ActQuant`) AND by `[defaults]
#                            fp8_act_quant_hopper` AND by a CTA-count floor.
#                            Presence alone is what round 16 shipped, and it
#                            put every DECODE-width call on an arm measured at
#                            0.76x-0.95x: the two kernels are bit-identical by
#                            contract, so the lever is a SPEED kill switch and
#                            not a numeric A/B, and the floor is where the
#                            width lives. Rule:
#                            `layers/ops/fp8_act_quant_floor.rs`. Numbers:
#                            `FP8-ACT-QUANT-ATTRIBUTION.md`.
[kernels]
overrides = [
  "fp8_act_quant_hopper.cu",
]
