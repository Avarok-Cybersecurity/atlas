ceiling was first stated as 2100 and re-cut to 2150 on 2026-09-20 by the coordinator, to whom \
the owner delegated it, because a ceiling's job is to fail on regression without failing on \
normal variation, so the margin that matters is against the WORST observed PASS in the regime, \
not the median run: 2100 cleared the regime maximum of 2066.7 ms by only 1.6%; 2150 clears it \
by 4.0% and the reference run by 6.4%, is the clean 50-step the policy would derive, and is \
still a 52% tightening from the superseded 4482.03. \
SPREAD, so nobody re-cuts from one draw: every committed record since the level settled on \
main at 2026-08-29 (d8bc9c9d86) through 2026-09-20 — n=30 across spark-256a (dgx1), spark-43fa \
(dgx2), spark-28c2 (dgx3), edgexpert-aae5 and edgexpert-2640 — reads median 880.3-923.3 ms \
(sigma 7.7) and p90 2000.9-2066.7 ms (sigma 18.9), so both ceilings clear every healthy run on \
every box; the p90 ceiling clears the widest value (2026-08-29-d8bc9c9d86, spark-256a) by \
4.0%, and is still the bound to re-examine first if this gate ever fails on p90 alone. The two spark-15df records of 2026-08-26/27 (sha 60812ca7b6: 1003.8 / \
2178.8 and 1008.3 / 2167.0) would NOT clear these ceilings; 60812ca7b6 is an ancestor of the \
2026-08-29 step and dgx1 read 994 / 2140 on 2026-08-28 too, so they are pre-step records, not \
evidence about the current level. \
LEVEL HISTORY, from the records: median 1640 on 2026-08-06; 1583 after the 2026-08-21 re-cut; \
976 on 2026-08-23 (e1fd858f14, spark-256a, the first sub-1000 record); 923 on 2026-08-29 and \
~900 since. The superseded ceilings (1623.59 / 4482.03, cut 2026-08-21 from the dgx1 baseline \
1576.3 x +3% and 4268.6 x +5%) had drifted to 1.8x / 2.2x the measured level, so no cold-TTFT \
