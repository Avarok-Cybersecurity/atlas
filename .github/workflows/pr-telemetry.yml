name: PR telemetry

# The cross-PR view. Each PR's own checks answer "is this one green?"; nothing
# answers "are these seven green together". Two PRs touching one kernel target
# are each measured against a baseline the other will move, and whichever lands
# second is gated on a number that no longer describes the tree.
#
# Advisory by construction: this posts a comment and fails nothing. The blocking
# decisions stay in `check.rs`, against committed records.

on:
  schedule:
    # Every four hours. Frequent enough that the comment is not stale when
    # someone opens it, rare enough that a queue of PRs does not generate a
    # notification storm.
    - cron: "17 */4 * * *"
  push:
    # Every merge to main lands as a push, so "Recommended next steps" (which
    # PR to merge next, who must re-gate, what debt the merge left) refreshes
    # the moment the tree changes instead of up to four hours later. The
    # concurrency group below already serializes this against the schedule.
    branches: [main]
  workflow_dispatch:

# One run at a time, and never cancelled mid-flight: the write step reads a
# comment and rewrites it, so a cancelled run could leave the body half-updated
# while a second run reads the stale version.
concurrency:
  group: pr-telemetry
  cancel-in-progress: false

permissions: {}

jobs:
  render:
    name: Render the view
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Collect open PRs and their changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Draft PRs are included deliberately: a draft still tells you which
          # targets are about to be contended, which is the thing this view is
          # for. It is labelled as a draft in the table.
          # ★ OPEN **and** MERGED, never CLOSED. Promotion debt outlives the
          # merge: a PR that a candidate gate wanted to see, merged without it,
          # is coverage this repo has already gone without and stays on the
          # books. A PR that was closed shipped nothing, so it owes nothing —
          # including it would inflate the ledger with debts that cannot exist.
          #
          # The API has no "merged" state: merged PRs come back as `closed`
          # with `merged_at` set, so the filter is on `merged_at`, not `state`.
          # Bounded to the most recent 200 by update time — the full history
          # would grow without limit and the debt that matters is recent.
          gh api "repos/$REPO/pulls?state=all&sort=updated&direction=desc&per_page=100" \
            --paginate --jq '[.[]
              | select(.state == "open" or .merged_at != null)
              | {number, title, author: .user.login, draft,
                 merged: (.merged_at != null)}]' \
            | jq -s -c '[.[][]] | .[0:200]' > prs.json

          # Changed paths need a second call per PR — the list endpoint does
          # not carry them. Paginated in full rather than capped: a truncated
          # path list would UNDERSTATE a PR's blast radius, and understating is
          # the one direction this view must not fail in. (GitHub itself stops
          # at 3000 files; a diff that large is already "everything".)
          jq -c '.[]' prs.json > prs.ndjson
          : > enriched.ndjson
          while read -r pr; do
            number=$(jq -r '.number' <<<"$pr")
            # ★ `--paginate` applies `--jq` PER PAGE, so an array filter emits
            # ONE ARRAY PER PAGE. At >100 files that is two JSON documents, and
            # `--argjson` takes exactly one — the whole render died on the first
            # such PR. It was not hypothetical: #350 has 144 files, and both
            # scheduled runs on 2026-08-09 aborted here.
            #
            # `jq -e .` does NOT catch this (it happily validates a concatenated
            # stream); only `--argjson` rejects it. So emit newline-delimited
            # names and assemble ONE array, which is page-count independent.
            # Guard on gh's EXIT STATUS, not on whether the output is empty:
            # on a 404 `gh api` prints the error BODY to stdout, so a
            # length-based check turns `{"message":"Not Found",...}` into a
            # single bogus "filename" that renders as a real path. (The first
            # version of this fix did exactly that.)
            if raw=$(gh api "repos/$REPO/pulls/$number/files?per_page=100" \
                       --paginate --jq '.[].filename' 2>/dev/null); then
              paths=$(printf '%s' "$raw" \
                      | jq -R -s -c 'split("\n") | map(select(length > 0))')
              unknown=false
            else
              # ★ A failed files call is NOT "this PR changes nothing". It used
              # to fall through to a bare `paths='[]'`, and every consumer reads
              # an empty list as a measurement: no targets, no owners, no
              # promotion debt, no collisions. That is this view understating a
              # blast radius all the way to zero — the one direction the comment
              # above says it must never fail in — and it did it silently, from
              # a transient API error, into a record posted to the tracking
              # issue and parsed by gate/telemetry.rs.
              #
              # The record is kept and MARKED rather than dropped: dropping it
              # makes the PR absent from the comment, and absent reads as "no
              # such PR" — the same understatement, and it also removes the PR
              # from the collision table and the merge order it should be
              # blocking. Marked, the renderer counts it at maximum radius and
              # labels every row it contributes as assumed.
              echo "::warning::PR #$number: changed files unreadable; recorded as paths_unknown, counted at maximum blast radius." >&2
              paths='[]'
              unknown=true
            fi
            jq -c --argjson p "$paths" --argjson u "$unknown" \
              '. + {changed_paths: $p, paths_unknown: $u}' <<<"$pr" >> enriched.ndjson
          done < prs.ndjson
          jq -s '.' enriched.ndjson > facts.json

          echo "collected $(jq 'length' facts.json) open PR(s)"

      - name: Render the comment body
        env:
          # atlas-plugin is host-only and CUDA-free, so the runner needs no
          # toolchain and no GPU. The skip flag stops atlas-kernels' build
          # script looking for nvcc.
          ATLAS_SKIP_BUILD: "1"
          CUDARC_CUDA_VERSION: "13000"
        run: |
          set -euo pipefail
          cargo run --quiet -p atlas-plugin --bin pr_telemetry -- . < facts.json > body.md
          # The body is the artifact the next job posts. Also echoed into the
          # run summary so the view is readable even when no tracking issue is
          # configured and nothing gets posted anywhere.
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      # Same upload/download pair release-build.yml already uses together, so
      # the pin is a combination this repo exercises rather than a new one.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-telemetry-body
          path: body.md
          retention-days: 7

  publish:
    name: Update the tracking comment
    needs: render
    runs-on: ubuntu-latest
    # The ONLY job with a write scope, and it holds exactly one. Rendering runs
    # read-only, so a bug in the analysis has nowhere to write even in principle.
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-telemetry-body

      - name: Upsert the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PCND: no default issue number. Unset means "not configured yet",
          # and the step says so and exits 0 rather than guessing an issue and
          # commenting on something arbitrary.
          ISSUE: ${{ vars.PR_TELEMETRY_ISSUE }}
          MARKER: "<!-- atlas-pr-telemetry:start -->"
        run: |
          set -euo pipefail
          if [ -z "${ISSUE:-}" ]; then
            echo "PR_TELEMETRY_ISSUE is not set — rendered the view but posted nothing."
            echo "Set the repository variable to the tracking issue number to enable it."
            echo "The body is attached to this run as the pr-telemetry-body artifact."
            exit 0
          fi

          # Find OUR previous comment by its marker rather than by a stored id,
          # so there is no state to keep in sync and a deleted comment simply
          # results in a new one.
          existing=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | .[0].id // empty")

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@body.md > /dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$ISSUE/comments" \
              -F body=@body.md > /dev/null
            echo "created a new comment"
          fi
