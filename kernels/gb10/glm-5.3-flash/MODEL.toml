[model]
name = "glm-5.3-flash"
hf_id = "LibertAIDAI/GLM-5.3-Flash-NVFP4"
revision = "9e0d74e3cef17f634e84fb8e2223707e02616290"
model_type = "glm5_next"
architecture = "Hybrid KDA linear-attention + NoPE sparse MLA (DSA) + mHC + NVFP4 MoE"
parameters = "320B-A18B"

layers_total = 45
layers_kda = 34
layers_dsa = 11
layer_pattern = "3 KDA then 1 DSA, repeating; layer 45 is the MTP head (out of scope)"
first_k_dense_replace = 3

hidden_dim = 4096
vocab_size = 154624
max_position_embeddings = 262144

# ── NoPE sparse MLA ──
q_heads = 64
kv_heads = 64
q_lora_rank = 1536
kv_lora_rank = 512
qk_nope_head_dim = 256
qk_rope_head_dim = 0
v_head_dim = 256

# 🔴 NoPE. There is no rope section: the MLA latent cache is kv_lora_rank wide
# (512), NOT DeepSeek-V4-Flash's 512+64=576. `rope_theta` is absent from the
# checkpoint config entirely.
rotary_dim = 0
partial_rotary_factor = 0.0

# ── DSA indexer ──
index_n_heads = 32
index_head_dim = 128
index_kpool = 4
index_topk = 2048
index_kpool_always_select_tail = true

# ── KDA linear attention ──
linear_num_heads = 64
linear_head_dim = 128
linear_conv_kernel = 4

# ── MoE ──
moe_experts = 288
moe_topk = 8
moe_intermediate = 2048
shared_expert_intermediate = 2048
moe_scoring_func = "sigmoid"
moe_routing_bias = true
n_group = 1
routed_scaling_factor = 2.5

# ── mHC ──
hc_mult = 4
hc_sinkhorn_iters = 20

# ── Vision ──
# 🪤 DOCUMENTATION ONLY. Nothing in Rust reads this key today (`grep -rn vision
# crates/atlas-kernels/` returns nothing); it is here for parity with
# qwen3.8-flash-next/MODEL.toml, the other multimodal target. It arms NOTHING.
#
# The real arming signal is the PTX module list: `serve_load.rs:364-378` nulls
# `config.vision` and logs ONE WARN if `vision_encoder` is missing from the
# compiled target, after which the serve is silently text-only with images
# ignored. The fastest check that a GLM vision build is armed is the ABSENCE of
# that WARN, not the presence of this line.
vision = true

# 🔴 THE MATCHER. `build.rs` parses ONLY `[[model_types]]` / `[sampling.*]` /
# `[behavior]` — every dimension key above is documentation mirroring config.json.
# Without this section the target compiles fine and then `ptx_for_config` refuses at
# SERVE time with "No compiled kernel target matches model_type 'glm5_next'", listing
# `glm-5.3-flash` as available. The `model_type` in `[model]` above does NOT match.
#
# `glm5_next` is the canonical form: the checkpoint's inner object says
# `glm5_next_text`, and `parse_glm5_next` rewrites it to `glm5_next`.
[behavior]
# Decode-time rollback + re-steer, ON by the engine default. Turned OFF here so a
# quality measurement sees the MODEL, not an intervention: when a watchdog fires,
# re-steer rewinds to the last well-formed boundary and lets generation continue,
# which is a repair the score then attributes to the model. The AGENTIC=1 serve
# profile already disables the other decode-time guards (simhash-loop,
# loop-suppress, inter-tool-prose) for the same reason and simply never covered
# this one.
rollback_resteer = false

# Apply this card's `[sampling.*]` presets to the CORE knobs (temperature, top_k,
# top_p, min_p, top_n_sigma), not just the ones the server has no default for.
#
# 🪤 A REQUEST'S EXPLICIT VALUE STILL WINS — `sampling_setup.rs` is
# `req.sampling.temperature.unwrap_or(preset)`. So this changes nothing for a
# client that pins its own sampling, and in particular NOT for the
# `agentic-webserver` gate, which pins `TEMPERATURE = 0.0` on purpose for a
# repeatable trajectory. It matters for traffic that omits them (opencode et al.),
# where the server default `top_n_sigma = 1` was reaching the sampler instead of
# the card's `0.0`.
use_sampling_presets_for_core = true

# Thinking ceiling. WITHOUT this key the target inherits
# DEFAULT_MAX_THINKING_BUDGET = 256, and because the qualitative ladder is
# `Low = ceiling/2` (api/chat/thinking.rs::effort_budget) a
# `reasoning_effort: "low"` request got just 128 tokens to reason in — observed
# as `Thinking enabled, budget=Some(128)` on every agentic turn (2026-09-08).
#
# GLM-5.3-Flash is a reasoning model whose own chat_template.jinja consumes
# `reasoning_effort` directly (six references), so the model already knows what
# was asked; this ceiling is purely Atlas's SECOND cap on top of that, and at
# 256 it was cutting the model off mid-thought. 2048 matches
# qwen3.8-flash-next — the port this one tracks — giving minimal 512 /
# low 1024 / medium 2048 / high 4096 / xhigh 8192.
#
# 🪤 This key MUST live under [behavior]. Placed after a [sampling.*] header it
# silently becomes a preset key and does nothing (trap noted in
# qwen3.8-flash-next/MODEL.toml).
max_thinking_budget = 2048

# Carry the assistant's reasoning back into the next turn's prompt.
#
# 🪤 TRI-STATE. Key ABSENT = do not inject the Jinja variable at all, and the
# model template's own default applies (that is why qwen3.6-27b deliberately
# leaves it unset). Setting it here means Atlas asserts over the template, so it
# is set on operator instruction rather than inferred: multi-turn agentic work
# on this model wants the prior reasoning visible, and the measured runs carried
# it via the client-side ATLAS_AGENTIC_PRESERVE_THINKING=1. Pinning it in
# [behavior] extends the same behaviour to plain API clients (opencode et al.)
# that do not set the kwarg themselves.
#
# A per-request `chat_template_kwargs.preserve_thinking` still wins over this
# (api/chat/prepare.rs:143), and a server-level --default-chat-template-kwargs
# pin outranks it too (serve_load.rs:1281).
preserve_thinking = true

# Speculation may run inside `<think>` on this model without the
# ATLAS_SPEC_THINK env opt-in.
#
# EARNED BY MEASUREMENT, not inherited. The lever is opt-in globally because the
# DFlash lane measured agentic followed_directions 10/10 -> 7/10 DETERMINISTICALLY
# across three identical runs, attributed to batch-K verify not being byte-lossless
# at T=0. GLM-5.3's verify was separately measured byte-identical at K=2, which is
# the likely reason that damage does not transfer here.
#
# Measured, K2 EP=2/TP=2 + MTP K=2 + prefix caching + reasoning-low,
# agentic-webserver x3 (2026-09-08):
#   engagement  serial=0.97/mtp=0.03  ->  serial=0.00/mtp=1.00
#   decode      13.50  ->  16.90 tok/s median (+25%)
#   verdict     PASS 3/3 webserver_ok, 3/3 followed_directions, 27/27 stop
#
# 🪤 One benchmark on one workload. If a future GLM revision changes the verify
# numerics, re-measure before trusting this line — and `ATLAS_SPEC_THINK=0` does
# NOT turn it back off (the env is an OR, not an override); delete the key.
spec_think = true


# ── Sampling ─────────────────────────────────────────────────────────────────
#
# 🔴 THIS FILE HAD NO `[sampling.*]` TABLE AT ALL, and that is a defect rather than an
# omission. `ATLAS_AGENTIC_SAMPLING=model-card` deliberately omits temperature and seed
# from the request so "the server's card presets own sampling"
# (`benchmarks/agentic/agent.rs`). With no presets to own it, GLM fell through to the
# CLI defaults.
#
# MEASURED, agentic-webserver 1 iteration, model-card + reasoning-low + preserved
# thinking, 2026-09-08: the run PASSED (6/6 steps, 1/1 webserver_ok, 1/1
# followed_directions) but 2 of its 15 turns DEGENERATED — one sentence repeated
# VERBATIM 16 times, then raw GLM tool-call markup emitted as plain TEXT, then
# `[finish] length` against max_tokens 8192. Finish reasons: 12 tool_calls / 2 length /
# 1 stop. The loop burns the budget, so the call arrives too late to be surfaced as a
# call at all — the verdict still passes because the agent recovers on the next turn,
# which is exactly why the verdict alone is not evidence of a clean trace.
#
# 🪤 SETTING TEMPERATURE ALONE WOULD NOT HAVE FIXED IT. The CLI ships
# `--default-min-p 0.08` and `top_n_sigma 1.0`, and a sigma filter of 1.0 truncates
# temp-1.0 sampling back to NEAR-GREEDY — the same trap documented at length in
# qwen3.8-flash-next's card, whose wording is followed here. Both are therefore pinned
# OFF explicitly so the CLI defaults cannot stack on top of the card values. A preset
# that named only temperature/top_p would have looked correct and still looped.
#
# Values are the CHECKPOINT'S OWN `generation_config.json` — temperature 1.0,
# top_p 0.95 — not a guess and not borrowed from a sibling model. That card names no
# top_k, no penalties and no tools-specific row, so none are invented here; unlike
# Qwen's card there is no separate instruct row to fall back on for tools.
[sampling.thinking_text]
temperature = 1.0
top_p = 0.95
min_p = 0.0
top_n_sigma = 0.0

[sampling.thinking_coding]
temperature = 1.0
top_p = 0.95
min_p = 0.0
top_n_sigma = 0.0

[sampling.non_thinking]
temperature = 1.0
top_p = 0.95
min_p = 0.0
top_n_sigma = 0.0

# The card gives no tools-specific row. Kept at the card values rather than borrowing
# another family's instruct row: the property under test is "not truncated to greedy",
# and inventing a number here would make the next agentic result unattributable.
[sampling.tools]
temperature = 1.0
top_p = 0.95
min_p = 0.0
top_n_sigma = 0.0


[[model_types]]
model_type = "glm5_next"
hidden_size = 4096

# ── Kernels this target legitimately does not compile ──
#
# `layers::tgemm_kernel` probes the 3-deep pipeline twin with `try_kernel` and
# takes the resolved `w4a16_gemm_t` when it comes back 0. Same entry as
# qwen3.5-122b-a10b / mistral-small-4 / nemotron-3-nano-30b-a3b.
[expected_absent.w4a16]
w4a16_gemm_t_p3 = "3-deep p3 twin shipped only in qwen3.6-27b's shadow; layers::tgemm_kernel falls back to w4a16_gemm_t (resolves). Unmeasured for this target."
# DFlash's OPTIONAL FP8 drafter path. `dflash_head/from_weights.rs` probes both with
# `try_kernel` and says so in place: "absent on targets whose w4a16 module predates
# Phase G — the FP8 drafter path is then skipped at the ATLAS_DFLASH_DRAFTER_FP8 gate
# below (BF16 fallback)". So a 0 handle here is the DESIGNED outcome, not a silent
# fallback the audit should refuse on; the drafter runs BF16 instead of FP8, which
# costs drafter speed and nothing else. Declared rather than compiled because GLM has
# no other use for these two, and copying qwen3.6's w4a16_gemm.cu into this target to
# satisfy a path the drafter does not require would be dead weight in every build.
fp8_gemm_t_row_scaled = "Phase-G FP8 drafter GEMM, probed with try_kernel; DFlash falls back to the BF16 drafter path. Not compiled for GLM."
fp8_gemm_t_row_scaled_m16 = "Phase-G small-M FP8 lm_head GEMM, probed with try_kernel; same BF16 fallback. Not compiled for GLM."
