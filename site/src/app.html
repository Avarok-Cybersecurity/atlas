<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        // apply also queues the hero poster fetch on the front page. The hero
        // is a product clip behind a poster, and the poster is the largest
        // paint on the page, so it is requested from the head rather than
        // when the parser reaches it. One file serves both themes: the console
        // it shows is dark chrome in either.
        function apply(t) {
          document.documentElement.setAttribute('data-theme', t);
          if (location.pathname !== '/' && location.pathname !== '/index.html') return;
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.setAttribute('fetchpriority', 'high');
          l.href = '/media/console-ask.webp';
          document.head.appendChild(l);
        }
        try {
          var t = localStorage.getItem('avarok-theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          apply(t);
        } catch (e) {
          apply('dark');
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Avarok is the inference economics platform for GPUs you already own. Faster inference, stronger governance, a fraction of what you pay today." />
    <!-- IBM Plex, attached late on purpose. In the bundle, preloaded or not, the
         font downloads sat on the critical path of the first paint and cost every
         page a point of Lighthouse performance against a gate that demands 100.
         So the page paints in fallbacks that occupy the same space as Plex
         (src/styles/fonts.css) and the real faces swap in without moving
         anything.

         "Late" means after the first contentful paint AND after load, then at
         idle. Not just after load: on /control load fires at 140 ms and the
         first paint lands at 320 ms, so a load listener still fetched the
         fonts ahead of the paint. Once the files are in the visitor's cache
         the sheet is attached straight away, which costs nothing.

         A second script tag, not the boot script above: theme.test.js runs
         that one against a handful of fake globals. -->
    <script>
      (function () {
        var href = '%sveltekit.assets%/fonts/plex.css';
        var done = false;
        function attach() {
          if (done) return;
          done = true;
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          document.head.appendChild(l);
          try {
            localStorage.setItem('avarok-fonts', '1');
          } catch (e) {}
        }
        var warm = false;
        try {
          warm = localStorage.getItem('avarok-fonts') === '1';
        } catch (e) {}
        if (warm) return attach();

        var painted = false;
        var loaded = document.readyState === 'complete';
        function go() {
          if (!painted || !loaded) return;
          if (window.requestIdleCallback) requestIdleCallback(attach, { timeout: 2000 });
          else setTimeout(attach, 200);
        }
        try {
          new PerformanceObserver(function (list, observer) {
            if (list.getEntriesByName('first-contentful-paint').length) {
              observer.disconnect();
              painted = true;
              go();
            }
          }).observe({ type: 'paint', buffered: true });
        } catch (e) {
          painted = true;
        }
        if (!loaded)
          addEventListener('load', function () {
            loaded = true;
            go();
          });
        // Whatever happens above, the brand typeface still arrives.
        setTimeout(attach, 5000);
      })();
    </script>
    <noscript><link rel="stylesheet" href="%sveltekit.assets%/fonts/plex.css" /></noscript>
    <!-- Must equal --bg in web-shared/avarok-tokens.css. A meta tag cannot read a
         custom property, so this is the one unavoidable copy of the ground colour;
         theme-color.test.js fails the build if the two drift. -->
    <meta name="theme-color" content="#0F1216" />
    <meta name="theme-color" content="#0F1216" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <!-- Explicit rather than inherited: several engines treat a missing robots
         directive as a reason to clip snippets and thumbnails. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Icons. The SVG wins wherever it is supported; the .ico covers legacy
         Windows surfaces (pinned sites, jump lists) that ignore SVG entirely;
         the PNGs are the explicit sizes Safari and older Chrome pick from.
         apple-touch-icon is the LIGHT-ground cut on purpose: iOS composites
         transparency onto black, which would swallow the mark. -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Avarok" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Avarok, the inference economics platform" />
    <meta property="og:description" content="Faster inference, stronger governance, a fraction of what you pay today. Runs your models faster on the GPUs you own, keeps every prompt inside your perimeter, and shows your CFO what each workload costs." />
    <meta property="og:site_name" content="Avarok" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://atlascybernetics.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avarok, the inference economics platform" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AtlasInferenceX" />
    <meta name="twitter:creator" content="@AtlasInferenceX" />
    <meta name="twitter:title" content="Avarok, the inference economics platform" />
    <meta name="twitter:description" content="Faster inference, stronger governance, a fraction of what you pay today. Every number is a receipt." />
    <meta name="twitter:image" content="https://atlascybernetics.ai/og-image.png" />
    <meta name="twitter:image:alt" content="Avarok, the inference economics platform" />

    <!-- The plain-text brief answer engines read. Generated from the same
         sources as the page by scripts/gen-llms.mjs. -->
    <link rel="alternate" type="text/plain" href="%sveltekit.assets%/llms.txt" title="llms.txt" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
