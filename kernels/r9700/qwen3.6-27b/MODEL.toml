This was the 13th of the 13 gfx1201 census failures (180 of 193 clean).
Dispatch: layers/ops/gemm_fp8_prefill.rs looks this kernel up with `?`, so
if the FP8-weight prefill GEMM path is ever selected on this target the
lookup is a hard error, not a silent fallback. On the NVFP4 targets the
FP8 attention and SSM projections are requantized to NVFP4 at load
(quantize_to_nvfp4 in the serve log), so that path is not reached; a
native-FP8 checkpoint on r9700 would be, and needs a BF16-MMA port first."""

