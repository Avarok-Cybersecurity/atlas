# K3 official MXFP4: DeepSeek-V4 E8M0 grouped GEMM via extra_cu.
#
# Host SSOT: crates/atlas-core/src/mxfp4_e8m0.rs
# GPU lander: spark_model::weight_map::quantized_mxfp4_e8m0_pair
#   K3 names: .weight_packed + .weight_scale  →  DSV4 .weight + .scale
#
# extra_cu compiles kernels/gb10/deepseek-v4-flash/nvfp4/moe_w4a16_grouped_gemm.cu
# as module moe_w4a16 — do not copy that file here, do not copy GDN.
#
# Expected handles (module moe_w4a16):
#   moe_w4a16_grouped_gemm_ptrtable_e8m0
#   moe_w4a16_grouped_gemm_ptrtable_t_e8m0
#   moe_w4a16_grouped_gemm_ptrtable_t_k64_e8m0
#   moe_w4a16_fused_gate_up_t_e8m0
#   moe_w4a16_fused_gate_up_t_k64_e8m0
# Do not list these under MODEL.toml [expected_absent].
#
# Unique KDA/MLA stems live in bf16/; nvfp4 serve bundle symlinks them.

[build]
extra_cu = ["../../deepseek-v4-flash/nvfp4/moe_w4a16_grouped_gemm.cu"]

[modules]
moe_w4a16_grouped_gemm = "moe_w4a16"
