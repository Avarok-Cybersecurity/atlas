# ★ PLACEMENT: a [benchmarks.*] sub-table attaches to the MOST RECENT
# [[benchmarks]] header above it. This serve pin was first committed ABOVE
# this entry's header (2026-08-15), so TOML silently attached it to the
# PREVIOUS entry (decode-floor) and the gate served the recipe's batch 1
# with no OVERRIDES disclosure line — keep every sub-table BELOW the header
# it belongs to. bench_tests pins where each committed serve pin sits.
[benchmarks.serve_overrides]
# ★ SEVENTEEN PINS -> THREE, 2026-09-22, owner's call: "the gate serves the
# throughput recipe ... match the throughput recipe". The `recipe =` line above
# now names qwen3.8/qwen3.8-27b-nvfp4-throughput, and that file is not a
# similar profile -- it is the published ladder's CLI frozen, verified key for
# key against bench/ladder38/published.json `series[0].cli`. So the fourteen
# pins removed here were re-stating the recipe's own defaults back at it:
#   max_batch_size 128, kv_cache_dtype fp8, max_model_len 2048, mtp_gate force,
#   num_drafts 3, mtp_quantization bf16, speculative true, scheduling_policy
#   fifo, ssm_checkpoint_interval 32, ssm_h_dtype f16-pool, gdn_fused_norm
#   true, ssm_batched_recurrent true, prefill_varlen_batch true,
#   ssm_tail_midchunk false, disable_thinking true, request_timeout 0.
# Each was compared to the recipe's value before removal. The f16-pool /
# gdn_fused_norm boot requirement (serve_phases/preflight/ssm_h_fp16.rs bails
# without the pair) is still satisfied -- by the recipe, which sets both -- and
# the pair still must not be split.
#
# ★ WHAT WAS ACTUALLY WRONG. The gate had been serving
# qwen3.8/qwen3.8-27b-nvfp4-unsloth -- the AGENTIC profile -- and overriding it
# back toward the published leg one key at a time. Two of that recipe's
# defaults were never in the override list and so were inherited in silence:
# `lm_head_dtype: bf16` and `kv_high_precision_layers: auto`. The bf16 head is
# the expensive one. kernels/gb10/HARDWARE.toml sets lm_head_batchm_max = 8, so
# above M=8 lm_head_batched.rs abandons the batched GEMV and falls to
# dense_gemm_bf16.cu: 16x16 tiles, one thread per output element, a scalar
# accumulate over K=5120 into N=248320. That is ~3.25e11 FLOP per decode step
# at M=128 -- paid once per step, i.e. a PER-SEQUENCE cost that grows with the
# rung. It is exactly the shape of the measured deficit (0.91x at C=1
# degrading to 0.51x at C=32); a flat regression cannot make that curve.
#
# A/B on this box, one sha, one harness, C=8/32/128 (scripts/ab_sweep.sh, a
# SHORT-OSL RANKING RIG at osl 256 -- these are ratios, not ladder figures;
# this gate's own osl is 1024 and the published bar is quoted there):
#
#     C=8     74.5 -> 104.9 tok/s  (+41%)   TPOT  94.8 -> 68.6 ms
#     C=32   136.8 -> 198.9 tok/s  (+45%)   TPOT 206.2 -> 134.5 ms
#     C=128  198.6 -> 303.6 tok/s  (+53%)   TPOT 550.9 -> 327.2 ms
#
# The gain growing with width is the per-sequence signature, as predicted, and
# the treatment leg's serve log carries `LM head quantized to NVFP4` while the
# control's does not -- the lever is proved armed, not assumed.
#
# ★ THE THREE BELOW ARE NOT REDUNDANT, THOUGH THEY DO RESTATE RECIPE DEFAULTS.
# site/src/lib/ladder-baselines.js builds a record's fingerprint from `params`
# + `serve_overrides` and NOTHING ELSE (line 88; it never reads
# serve_resolved), and all three are REQUIRED_AXES. Dropped from this table
# they would read null, null counts as a difference on a required axis, and the
# live series would stop being comparable to published.json -- the precise
# defect the 2026-09-21 re-point existed to fix. The other three required axes
# (isl, osl, prompt_mode) come from [benchmarks.param_overrides] below.
max_batch_size = "128"
kv_cache_dtype = "fp8"
max_model_len = "2048"
# ★ THE FOURTH PIN IS A SERVE PIN, NOT A FINGERPRINT PIN, and it is the one
# lever the published leg carried that the recipe cannot: AVAROK_PREFILL_CODISPATCH
# was env-only and node-wide, so it could not be given to this gate without also
# giving it to ttft-warm-gate (+4.78% warm TTFT, 107x the control spread, over a
# +3.0% limit). --prefill-codispatch makes it per-gate. The dense proof that beats
# vLLM at every rung (proof/MANIFEST.json, 2026-09-22) was measured WITH it; a
# certification without it measures a different, slower engine than the site
# claims. Requires the flag to exist in the tree being certified.
prefill_codispatch = "true"
# ★ ssm_cache_slots IS DELIBERATELY ABSENT: 32 -> the recipe's 8, which is also
# `--ssm-cache-slots 8` on the published CLI, so this table's last disagreement
# with that leg is gone. The measured case for 32 above was real but
# INSTRUMENT-SPECIFIC, and its instrument was retired on 2026-09-21: the
# slots_needed calibration was taken on isl 512 / natural-fixture ~832-token
# prompts, where a Marconi snapshot restore is eligible at all. This gate now
# sends isl 128, which renders to ~200 tokens -- under
# DEFAULT_MARCONI_MIN_TOKENS = 256 (mtp_carry.rs) -- so every restore is
# DECLINED by design and the pool size barely moves warm behaviour. 8 slots
# reserve 1.18 GiB against 32's 4.73 GiB, returning ~3.55 GiB to the KV budget,
# which is where the widest rungs need it.
# Consequence, stated rather than discovered: at 8 slots only C=1 is
# `warm_cache_capable` (slots_needed is 3/8/18/38 at C=1/2/4/8 and the rule is
# a strict `>`), so C>=2 measures cold BY CONSTRUCTION. That does not fail
# anything -- cache_is_uncontrolled is evaluated per cell and only when
# warm_capable (concurrency.rs:747), so those cells skip the warm rule rather
# than trip it.
# ★ lm_head_dtype IS ALSO ABSENT, and that is the whole point: the throughput
# recipe leaves it unset, so the head runs the checkpoint's native NVFP4. The
# comment that stood here called the agentic recipe's bf16 head "a correctness
# pin (exact argmax over the 248K vocab), not a throughput knob". Both halves
# were wrong: nothing ever measured an argmax difference, the published 478.11
# ladder itself ran with no --lm-head-dtype flag, and the "not a throughput
# knob" claim was off by 41-53%.

[benchmarks.param_overrides]
# The gate's instrument — see the block comment above. Values are parsed by
# each parameter's own schema kind, exactly like --param KEY=VALUE.
# 1..128 as of 2026-08-29: the published Atlas-vs-vLLM ladder quotes C=1..128,
# and a certification that stopped at 16 left the four widest rungs of the
# claim ungated. C=2 is in because it is the thinnest margin on that ladder
# and the one most easily lost silently.
concurrencies = "1,2,4,8,16,32,64,128"
# ★ 512/320 natural -> 128/1024 essay on 2026-09-21. These three lines ARE
# the re-point; everything else in this entry follows from them.
#   isls        128    the published ladder's ISL (~200 rendered tokens)
#   osl        1024    its output budget
#   prompt_mode essay  `Fixture::Essay` in concurrency.rs, whose ESSAY_TASK is
#                      SUFFIX_ESSAY from bench/ladder38/harness_w55_conc_ladder.py
#                      BYTE FOR BYTE (nonce width 6, presence_penalty and
#                      frequency_penalty pinned to 0.0 on this fixture only),
#                      SHA-256-pinned against the Python harness by
#                      concurrency_verdict_tests.
# ★ WHY THE FIXTURE HAD TO CHANGE WITH THE BUDGET, and why this is still only
# a parameter change: the natural (MinHeap code) fixture's deterministic
# completion is ~296 tokens, so at osl 1024 every cell would be vacuous by
# construction — occupancy 0.29 against a 0.8 floor — and the gate would be
# INCONCLUSIVE forever. The essay fixture is the published instrument's own
# request and elicits the full budget. It already exists in the driver, so no
# kernel or stats path moves and this entry costs no campaign of its own;
# BENCH.toml is in NON_COMPILED_KERNEL_FILES.
isls = "128"
osl = "1024"
prompt_mode = "essay"

# ── Floors re-cut 2026-08-30 from 3 fresh reps of the WIDENED instrument
# (C=1..128, bs=128, concurrent warm-up), mean - max(3*sigma, ~5%) per rung,
# every rung cut together. The previous five were cut on a hand-built bs=32
# calibration serve and describe an instrument that no longer exists.
#
# ★ THE MID-LADDER FLOORS ARE LOOSE, AND THAT IS HONEST RATHER THAN LAZY.
# C=8's sigma is 4.21 across three back-to-back reps on one frozen binary, so
# 3*sigma is 12.6 and the floor lands 21% under the mean; C=4 is 16% under.
# The top four rungs are 20-40x tighter and their 5% arm governs. A gate that
# only fires below 48 when the engine normally does 60 will not catch a 15%
# regression at that rung -- but a tighter bar on this variance fails on noise,
# and a gate that cries wolf gets switched off. The mid-ladder variance is the
# same phenomenon avarok#812 is chasing; when that is root-caused these two can
# be re-cut much tighter. Stated here so nobody reads C=8 as well-guarded.

