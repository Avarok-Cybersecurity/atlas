[package]
name = "atlas-governance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The PR journey ledger: an append-only record of how a change reached main."

# Host-only and CUDA-free, like atlas-plugin and atlas-tier. Nothing here
# touches a GPU, so it builds and tests under `ATLAS_SKIP_BUILD=1` in CI with
# no stubs.

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# The graph/vector engine the materialised view is built in. Pinned to a rev
# rather than a tag: `interchange` (the logical JSONL dump this crate's
# canonical format relies on) landed in v0.3.2 and there is no published
# crates.io release carrying it yet.
lattice-core = { git = "https://github.com/Avarok-Cybersecurity/lattice-db", rev = "282c8e8" }

