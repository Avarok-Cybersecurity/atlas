[hardware]
name = "strix"
vendor = "amd"
# AMD Strix Halo / Ryzen AI Max+ 395 — RDNA 3.5 iGPU (Radeon 8060S).
# Compiled via SCALE (scale-lang.com): the unmodified CUDA .cu sources
# are recompiled for this AMD target. `arch` selects the per-arch SCALE
# toolchain dir (targets/gfx1151/bin/nvcc).
arch = "gfx1151"
compute_capability = "11.5.1"
# LPDDR5X-8000, 256-bit unified bus → ~256 GB/s theoretical (APU,
# bandwidth-limited like GB10 — keep BF16 residual for 2x effective BW).
memory_bandwidth_gbps = 256
memory_type = "LPDDR5X"
# Physical unified RAM on the 64 GB SKU. NOTE: under ROCm-on-WSL the
# GPU-visible pool is the dedicated-VRAM carveout (<<64 GB) — model
# sizing for the WSL bring-up must account for that, not this number.
memory_gb = 64
# NOTE — two keys were removed from here because nothing read them:
#
#   force_br32_prefill      parsed by atlas-kernels/build.rs and re-emitted as
#                           ATLAS_HW_FORCE_BR32, which no code consumed (the
#                           reader was lost in the Strix squash merge, and
#                           cargo:rustc-env cannot cross from atlas-kernels to
#                           spark-model anyway). RDNA3.5's 64 KB/workgroup LDS
#                           cap is handled instead by `#define BR64 32` under
#                           __SCALE__ in common/prefill_paged_compute.cuh, with
#                           the matching 32-row host grid stride selected by
#                           cfg!(atlas_scale) in ops/prefill_attn_main_{a,b}.rs.
#
#   disable_fp8_ssm_prefill never parsed at all — no build script ever looked
#                           it up, so it was pure decoration. The native-FP8
#                           SSM prefill path is gated at runtime by the
#                           ATLAS_NO_GDN_FP8_PREFILL env var
#                           (weight_loader/qwen35_dense.rs), which is NOT
#                           target-aware: this path is ON by default on Strix.
#                           That is a real open question, not something this
#                           key was ever suppressing.
#
# Do not re-add either key without adding a reader in the same change.
