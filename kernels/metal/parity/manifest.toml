source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_gather_batched"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_gather_batched"
why    = "Same contract and the same elementwise index arithmetic as gb10's nllb_gather_batched. It is counterpart rather than mapped only because mapped requires a Metal parity test that launches the entry, and no test under crates/spark-runtime/src/metal_backend/tests launches any nllb_* kernel yet."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_gemv_bf16"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_gemv_bf16"
why    = "gb10 runs one warp per row indexed from the global thread id, reduces with __shfl_down_sync and checks a nullable bias; Metal runs one threadgroup per row, reduces simd_sum then a cross-simdgroup partial[32], and reads bias[row] unconditionally. Different reduction tree (different low bits) and no null-bias mode; no Metal test launches it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_argmax_batched"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_argmax_batched"
why    = "Same per-row argmax over bf16 logits, but gb10's shared-memory tree keeps the FIRST tree position on equal values (strict > against sval[tid]) while Metal breaks ties toward the lower token id; equal logits can therefore return different ids. gb10 also initialises at -1e30, Metal at -INFINITY. No Metal test launches it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_argmax_bf16_rows"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_argmax_batched"
why    = "A second Metal spelling of nllb_argmax_batched: same body, arguments renamed (rows, N), tie-break toward the lower id in the per-thread loop as well. gb10 has ONE row-argmax kernel, whose tree reduction keeps the first tree position on ties, so two Metal entries stand against one CUDA kernel with a different tie rule."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_topk_lse_bf16"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_beam_topk"
why    = "gb10's nllb_beam_topk takes K at runtime (<= 32), streams the log-sum-exp in one pass and writes (lse_out, val_out, idx_out); Metal fixes K = 10 as a constexpr, computes the lse in two passes (max, then sum of exp) with 256-wide fixed threadgroup arrays, and writes (top_vals, top_ids, lse_out). Same job, different signature and arithmetic."
