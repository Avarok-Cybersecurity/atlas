# ── The FLA chunked GDN prefill family: an sm_90 fence SCALE cannot lower ──
# gated_delta_rule_fla.cu:114:19: error: unknown opcode:
# fence.proxy.async.shared::cta
#
# The async-proxy fence is an sm_90 feature SCALE does not lower, and the file
# issues it unconditionally, so no flag compiles the rest. Every lookup below
# is `try_kernel` from `qwen3_ssm::init` (and
# `init_kernels::fused_spine_kernel`), so a handle of 0 leaves the GDN prefill
