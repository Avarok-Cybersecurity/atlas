# Atlas documentation — docs.atlasinference.io
#
# SSOT for the origin vhost, mirroring blog/deploy/nginx/.
#
# nginx's `add_header` does not accumulate across contexts: a location that
# declares ANY add_header discards every add_header inherited from the server
# block. This vhost previously set its three security headers at server level
# and Cache-Control inside three `location` blocks — so every HTML document,
# every stylesheet, every script and every image it served went out with no
# X-Content-Type-Options, no X-Frame-Options and no Referrer-Policy. Measured
# on the live site before this change: only 301 redirects, which match no
# location, carried them.
#
# Cache-Control is therefore computed by a map and emitted from the single
# server-level header set, so nothing overrides anything. The cache values are
# byte-identical to the location blocks they replace.

# Longest-lived first: map regexes are evaluated in declaration order.
map $uri $docs_cache_control {
    "~*\.html$"                              "public, max-age=300";

    # `immutable` is a promise that a URL's bytes will never change, and it is
    # only keepable for a content-hashed filename. rustdoc emits ten of those.
    # mdBook emits the other ~594 CSS/JS files under FIXED names — book.js,
    # css/general.css, searcher.js — and regenerates them on every build.
    # Serving those `immutable, max-age=31536000` told every cache to keep them
    # for a year, so a docs deploy could not reach a returning visitor and
    # neither could a header change. Measured at the Cloudflare edge before this
    # was fixed: book.js age 15.6 days, css/general.css age 29.4 days, both
    # still serving pre-fix responses.
    "~*[.-][0-9a-f]{8,}\.(?:css|js)$"        "public, max-age=31536000, immutable";
    "~*\.(?:css|js|woff2)$"                  "public, max-age=3600, must-revalidate";

    "~*\.(?:png|jpg|jpeg|svg|ico|gif)$"      "public, max-age=2592000";
    # Empty, so nginx emits no Cache-Control at all — the previous behaviour
    # for anything the three location blocks did not match.
    default                                   "";
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.atlasinference.io;

    # ACME challenge path (reserved — not used while Cloudflare is in front)
    location /.well-known/acme-challenge/ {
        root /opt/www/well_known;
        try_files $uri =404;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    server_name docs.atlasinference.io;

    http2 on;
    http3 on;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # iRedMail self-signed — Cloudflare Full mode accepts this on origin
    ssl_certificate /etc/ssl/certs/iRedMail.crt;
    ssl_certificate_key /etc/ssl/private/iRedMail.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 10m;

    # Cloudflare origin-IP restoration (matches 00-atlasinference.io.conf)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    root /var/www/docs.atlasinference.io/html;
    index index.html;

    # Clean URLs: /foo → /foo.html → /foo/index.html → 404
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;

    # llms.txt (https://llmstxt.org) is markdown-flavoured plain text. nginx
    # types .txt as text/plain already; naming it here documents that an agent
    # fetching it gets text rather than a download, and keeps the rule beside
    # the feed's. Sets no add_header, so the vhost's single header set stands.
    location = /llms.txt { default_type text/plain; charset utf-8; }

    # One header set for the whole vhost, and Cache-Control computed by the map
    # above rather than set in a location. Do not add an `add_header` to any
    # location below without repeating all four — see the note at the top.
    #
    # The map's `default` is deliberately EMPTY: nginx omits a header whose
    # value evaluates to the empty string, so responses that previously carried
    # no Cache-Control (redirects, fonts other than woff2, anything unmatched)
    # still carry none. This change is meant to add the security headers back
    # and alter nothing else.
    add_header Cache-Control $docs_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Block hidden files except ACME
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
