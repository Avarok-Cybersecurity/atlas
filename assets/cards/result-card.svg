<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Atlas benchmark result card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Atlas benchmark result</title>
  <!--
    Filled programmatically by atlas-plugin (gate/card.rs), by id.

    Text bodies (replace text content):
      label-toks  value-toks  note-toks        - hero label, number, sub-note
      value-model value-quant value-recipe     - configuration
      value-test  value-hardware
      label-m1..label-m4  value-m1..value-m4   - four generic detail slots
      value-verdict                            - PASS / FAIL
      value-author value-handle value-site     - attribution

    Attributes (set on the element):
      verdict-chip        - set fill: #12B981 for PASS, #EFB338 for FAIL
      field-verdict       - set display="none" for ungated runs
      field-m1..field-m4  - set display="none" on unused detail slots
      field-author / field-handle / field-site - set display="none" if absent

    Overflow: every value is clipped to its box and fades out at the right
    edge, so an over-long string degrades in place instead of escaping.
    Safe lengths (monospace): model 49, recipe 50, quant 14, test/hardware 54,
    detail values 18, handle/site 29 characters.
  -->
  <defs>
    <linearGradient id="atlasGoldCut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#12B981"/><stop offset="0.5" stop-color="#EFB338"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="clip-model"><rect x="80" y="143" width="414" height="82"/></clipPath>
    <clipPath id="clip-quant"><rect x="538" y="143" width="126" height="82"/></clipPath>
    <clipPath id="clip-recipe"><rect x="706" y="143" width="424" height="82"/></clipPath>
    <clipPath id="clip-toks"><rect x="88" y="283" width="404" height="194"/></clipPath>
    <clipPath id="clip-test"><rect x="538" y="283" width="588" height="88"/></clipPath>
    <clipPath id="clip-hardware"><rect x="538" y="389" width="588" height="88"/></clipPath>
    <clipPath id="clip-m1"><rect x="80" y="533" width="226" height="82"/></clipPath>
    <clipPath id="clip-m2"><rect x="354" y="533" width="226" height="82"/></clipPath>
    <clipPath id="clip-m3"><rect x="628" y="533" width="226" height="82"/></clipPath>
    <clipPath id="clip-m4"><rect x="902" y="533" width="226" height="82"/></clipPath>
    <clipPath id="clip-author"><rect x="76" y="693" width="230" height="32"/></clipPath>
    <clipPath id="clip-handle"><rect x="344" y="693" width="230" height="32"/></clipPath>
    <clipPath id="clip-site"><rect x="612" y="693" width="230" height="32"/></clipPath>
    <clipPath id="clip-verdict"><rect x="1010" y="34" width="122" height="32"/></clipPath>
  </defs>
  <rect width="1200" height="760" fill="#0F1216"/>
  <g transform="translate(64 34) scale(0.06918)">
    <g fill="none" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 38L358 318L38 598" stroke="#BE9DF8"/>
      <path d="M318 38L638 318L318 598" stroke="#49C3DB"/>
      <path d="M598 38L918 318L598 598" stroke="url(#atlasGoldCut)"/>
    </g>
  </g>
  <text x="156" y="56" font-size="24" fill="#C9CCD4" font-weight="650">Benchmark Result</text>
  <text x="156" y="78" font-size="12.5" fill="#82868F">Measured with Atlas. Numbers are only meaningful with the configuration beside them.</text>
  <g id="field-verdict">
  <rect id="verdict-chip" x="1006" y="34" width="130" height="32" rx="16" fill="#5A626D"/>
  <text x="1071" y="55" font-size="14" font-weight="700" fill="#0F1216" text-anchor="middle" letter-spacing="1.5" clip-path="url(#clip-verdict)" id="value-verdict">&#8212;</text>
  </g>
  <text x="64" y="128" font-size="13" fill="#BE9DF8" font-weight="650">Configuration</text>
  <g id="field-model">
  <rect x="64" y="142" width="440" height="84" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="64" y="142" width="3" height="84" fill="#BE9DF8"/>
  <text x="80" y="166" font-size="11" fill="#82868F" font-weight="600" id="label-model">Model</text>
  <text x="80" y="202" font-size="14" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-model)" id="value-model">meta-llama/Llama-3.1-70B</text>
  <rect x="456" y="143" width="38" height="82" fill="url(#fadeR)"/>
  </g>
  <g id="field-quant">
  <rect x="522" y="142" width="150" height="84" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="522" y="142" width="3" height="84" fill="#BE9DF8"/>
  <text x="538" y="166" font-size="11" fill="#82868F" font-weight="600" id="label-quant">Quant</text>
  <text x="538" y="202" font-size="14" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-quant)" id="value-quant">fp8-e4m3</text>
  <rect x="630" y="143" width="34" height="82" fill="url(#fadeR)"/>
  </g>
  <g id="field-recipe">
  <rect x="690" y="142" width="446" height="84" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="690" y="142" width="3" height="84" fill="#BE9DF8"/>
  <text x="706" y="166" font-size="11" fill="#82868F" font-weight="600" id="label-recipe">Recipe</text>
  <text x="706" y="202" font-size="14" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-recipe)" id="value-recipe">gb10/default.toml</text>
  <rect x="1092" y="143" width="38" height="82" fill="url(#fadeR)"/>
  </g>
  <text x="64" y="268" font-size="13" fill="#12B981" font-weight="650">Result</text>
  <g id="field-toks">
  <rect x="64" y="282" width="440" height="196" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="64" y="282" width="3" height="196" fill="#12B981"/>
  <text x="88" y="312" font-size="12" fill="#82868F" font-weight="600" clip-path="url(#clip-toks)" id="label-toks">Tokens / sec</text>
  <text x="88" y="420" font-size="78" fill="#12B981" font-weight="700" clip-path="url(#clip-toks)" id="value-toks">000.0</text>
  <text x="88" y="452" font-size="11" fill="#82868F" clip-path="url(#clip-toks)" id="note-toks">decode, steady state</text>
  <rect x="454" y="283" width="38" height="194" fill="url(#fadeR)"/>
  </g>
  <g id="field-test">
  <rect x="522" y="282" width="614" height="90" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="522" y="282" width="3" height="90" fill="#49C3DB"/>
  <text x="538" y="306" font-size="11" fill="#82868F" font-weight="600" id="label-test">Test</text>
  <text x="538" y="352" font-size="18" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-test)" id="value-test">decode-floor / concurrency-sweep-dflash2</text>
  <rect x="1088" y="283" width="38" height="88" fill="url(#fadeR)"/>
  </g>
  <g id="field-hardware">
  <rect x="522" y="388" width="614" height="90" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="522" y="388" width="3" height="90" fill="#49C3DB"/>
  <text x="538" y="412" font-size="11" fill="#82868F" font-weight="600" id="label-hardware">Hardware</text>
  <text x="538" y="458" font-size="18" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-hardware)" id="value-hardware">1x GB10, driver 000.00, clocks locked</text>
  <rect x="1088" y="389" width="38" height="88" fill="url(#fadeR)"/>
  </g>
  <text x="64" y="518" font-size="13" fill="#EFB338" font-weight="650">Detail</text>
  <g id="field-m1">
  <rect x="64" y="532" width="258" height="84" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="64" y="532" width="3" height="84" fill="#EFB338"/>
  <text x="80" y="556" font-size="11" fill="#82868F" font-weight="600" clip-path="url(#clip-m1)" id="label-m1">TTFT (ms)</text>
  <text x="80" y="598" font-size="20" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-m1)" id="value-m1">00.0</text>
  <rect x="276" y="533" width="30" height="82" fill="url(#fadeR)"/>
  </g>
  <g id="field-m2">
  <rect x="338" y="532" width="258" height="84" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="338" y="532" width="3" height="84" fill="#EFB338"/>
  <text x="354" y="556" font-size="11" fill="#82868F" font-weight="600" clip-path="url(#clip-m2)" id="label-m2">p99 decode (ms)</text>
  <text x="354" y="598" font-size="20" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-m2)" id="value-m2">0.00</text>
  <rect x="550" y="533" width="30" height="82" fill="url(#fadeR)"/>
  </g>
  <g id="field-m3">
  <rect x="612" y="532" width="258" height="84" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="612" y="532" width="3" height="84" fill="#EFB338"/>
  <text x="628" y="556" font-size="11" fill="#82868F" font-weight="600" clip-path="url(#clip-m3)" id="label-m3">Batch</text>
  <text x="628" y="598" font-size="20" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-m3)" id="value-m3">0</text>
  <rect x="824" y="533" width="30" height="82" fill="url(#fadeR)"/>
  </g>
  <g id="field-m4">
  <rect x="886" y="532" width="258" height="84" rx="4" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <rect x="886" y="532" width="3" height="84" fill="#EFB338"/>
  <text x="902" y="556" font-size="11" fill="#82868F" font-weight="600" clip-path="url(#clip-m4)" id="label-m4">Context</text>
  <text x="902" y="598" font-size="20" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-m4)" id="value-m4">0k</text>
  <rect x="1098" y="533" width="30" height="82" fill="url(#fadeR)"/>
  </g>
  <line x1="64" y1="656" x2="1136" y2="656" stroke="#22282F"/>
  <text x="64" y="682" font-size="11" fill="#82868F" font-weight="600">Measured by</text>
  <g id="field-author">
  <rect x="64" y="692" width="250" height="34" rx="3" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <text x="76" y="714" font-size="13" fill="#C9CCD4" clip-path="url(#clip-author)" id="value-author">Author Name</text>
  <rect x="276" y="693" width="30" height="32" fill="url(#fadeR)"/>
  </g>
  <g id="field-handle">
  <rect x="332" y="692" width="250" height="34" rx="3" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <text x="344" y="714" font-size="13" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-handle)" id="value-handle">@github-handle</text>
  <rect x="544" y="693" width="30" height="32" fill="url(#fadeR)"/>
  </g>
  <g id="field-site">
  <rect x="600" y="692" width="250" height="34" rx="3" fill="#000000" stroke="#2E353F" stroke-width="1"/>
  <text x="612" y="714" font-size="13" fill="#C9CCD4" font-family="ui-mono, ui-monospace, SFMono-Regular, Menlo, monospace" clip-path="url(#clip-site)" id="value-site">your-site.dev</text>
  <rect x="812" y="693" width="30" height="32" fill="url(#fadeR)"/>
  </g>
  <a href="https://atlasinference.io" xlink:href="https://atlasinference.io" target="_blank" rel="noopener">
  <text x="1136" y="706" font-size="13" fill="#49C3DB" font-weight="600" text-anchor="end">atlasinference.io</text>
  </a>
  <text x="1136" y="724" font-size="10.5" fill="#82868F" text-anchor="end">Copyright 2026 Atlas Cybernetics Corp</text>
</svg>
