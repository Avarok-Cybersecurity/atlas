<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#12B981"/><stop offset="0.5" stop-color="#EFB338"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BE9DF8"/><stop offset="0.5" stop-color="#49C3DB"/>
      <stop offset="1" stop-color="#12B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#14111f"/>
  <rect width="1200" height="8" fill="url(#rule)"/>

  <!-- brand mark, stroke 76 / gap 280, scaled to a 220px-tall lockup -->
  <g transform="translate(96 104) scale(0.346)">
    <g fill="none" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 38L358 318L38 598" stroke="#BE9DF8"/>
      <path d="M318 38L638 318L318 598" stroke="#49C3DB"/>
      <path d="M598 38L918 318L598 598" stroke="url(#gold)"/>
    </g>
  </g>
  <text x="452" y="258" fill="#f3f0fb" font-size="132" font-weight="800" letter-spacing="-5">Atlas</text>

  <text x="96" y="370" fill="#f3f0fb" font-size="50" font-weight="700" letter-spacing="-1">One inference engine, from the</text>
  <text x="96" y="426" fill="#b39bf7" font-size="50" font-weight="800" letter-spacing="-1">device in your hand</text>
  <text x="96" y="482" fill="#b39bf7" font-size="50" font-weight="800" letter-spacing="-1">to the datacenter rack.</text>

  <rect x="96" y="516" width="1008" height="1" fill="#3a3252"/>
  <text x="96" y="574" fill="#8a83af" font-size="28" font-weight="600"
        font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">atlasinference.io</text>
  <text x="1104" y="574" fill="#51cdb0" font-size="28" font-weight="700" text-anchor="end"
        font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace">verified on DGX Spark · GB10</text>
</svg>
