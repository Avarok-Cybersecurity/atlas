# SPDX-License-Identifier: AGPL-3.0-only
name: Certification bot

# ── One comment, edited in place ────────────────────────────────────────────
#
# The bot posts exactly one comment per PR and rewrites it as the PR moves. A
# thread of a dozen "now you are at stage 2" notes is worse than no bot: the
# newest one is at the bottom, the rest are wrong, and the reader has to work out
# which is which. Editing means the comment is always the current answer.
#
# The previous state rides in an HTML marker inside that comment. It is DISPLAY
# state only — it decides whether to show "a push knocked you back" rather than a
# bare stage card. Nothing about whether a PR may merge is read from it, which is
# the same line `atlas-governance` draws for the ledger: a verdict must never
# depend on something the PR's own automation can write.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  check_run:
    types: [completed]
  issue_comment:
    types: [created]

# `pull_request_target` runs with repository secrets against a fork's PR, so it
# must never check out or execute the head ref. It does not: every step below
# talks to the API and reads scripts from the DEFAULT branch checkout. Adding a
# checkout of `github.event.pull_request.head.sha` here would turn this into a
# pwn-request, the same warning `cla.yml` carries.
permissions:
  contents: read

concurrency:
  # Serialize per PR. Two events landing together would otherwise race to edit
  # the same comment, and the loser's body wins.
  group: certification-bot-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  state:
    name: Certification state
    runs-on: ubuntu-latest
    # A comment on a plain issue has no PR to describe. `check_run` events carry
    # their PRs in an array that is empty for pushes to main.
    if: >-
      ${{ github.event_name != 'issue_comment'
          || github.event.issue.pull_request != null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The DEFAULT branch, explicitly. Under pull_request_target the default
          # checkout is already the base, but naming it means a future edit
          # cannot quietly turn this into "run the fork's script".
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Which PR is this about
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request_target) pr='${{ github.event.pull_request.number }}' ;;
            issue_comment)       pr='${{ github.event.issue.number }}' ;;
            check_run)
              # A check run knows its PRs only when the head branch is in this
              # repo; for a fork it is empty and there is nothing to update.
              pr=$(jq -r '.check_run.pull_requests[0].number // empty' \
                    <<<'${{ toJSON(github.event) }}')
              ;;
          esac
          if [ -z "${pr:-}" ]; then
            echo "no PR in this event; nothing to say" >&2
            echo "pr=" >>"$GITHUB_OUTPUT"
          else
            echo "pr=$pr" >>"$GITHUB_OUTPUT"
          fi

      - name: Mint the certification App token
        id: apptoken
        if: steps.which.outputs.pr != '' && vars.CERTIFICATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.CERTIFICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CERTIFICATION_APP_PRIVATE_KEY }}

      - name: Read the previous state out of the bot's own comment
        id: prev
        if: steps.which.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.which.outputs.pr }}
        run: |
          set -euo pipefail
          # The marker is the lookup key AND the memory. One request, and no
          # second source of truth to drift.
          body=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
                  --jq '.[] | select(.body | contains("<!-- atlas-certification-state:")) | "\(.id)\t\(.body)"' \
                | head -1 || true)
          id=$(printf '%s' "$body" | cut -f1)
          prev=$(printf '%s' "$body" | grep -o '<!-- atlas-certification-state:[a-z0-9-]*' | sed 's/.*://' || true)
          echo "comment_id=${id}" >>"$GITHUB_OUTPUT"
          echo "prev=${prev}" >>"$GITHUB_OUTPUT"

      - name: Resolve the state
        id: state
        if: steps.which.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PREV_STATE: ${{ steps.prev.outputs.prev }}
        run: ./.github/scripts/certification-state.sh "${{ steps.which.outputs.pr }}"

      - name: Post or edit the one comment
        if: steps.which.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.which.outputs.pr }}
          STATE: ${{ steps.state.outputs.state }}
          HEADLINE: ${{ steps.state.outputs.headline }}
          COMMENT_ID: ${{ steps.prev.outputs.comment_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Absolute raw URL, and a PNG: GitHub serves raw .svg as text/plain, so
          # an <img> at the .svg renders as nothing. The SVG is committed too, for
          # the README, where a relative path is resolved by GitHub itself.
          img="https://raw.githubusercontent.com/$REPO/$DEFAULT_BRANCH/docs/diagrams/states/$STATE.png"
          body=$(cat <<EOF
          <!-- atlas-certification-state:$STATE -->
          ### $HEADLINE

          <img src="$img" alt="$STATE" width="900">

          <details><summary>How this works</summary>

          Three stages. **Stage 1** runs on every push and is cheap. **Stage 2**
          opens when someone with write access comments \`/stamp\`, which releases
          the certification job and the nine release-matrix builds — they are held
          back so a draft does not burn an hour of runners. Stage 2 needs two
          things: a codeowner of every path in the diff comments \`/seal\`, and
          benchmark records for this tree are committed. **Stage 3** is green, and
          the merge queue re-runs everything against its own merge commit.

          A new commit voids the seal. \`main\` advancing voids the records only if
          it moved a perf path. The stamp always holds. The full rules, including
          why a seal composes and records never do, are in
          [How a Change Lands](https://github.com/$REPO/blob/$DEFAULT_BRANCH/README.md#-how-a-change-lands).

          This comment is edited in place — it is always the current state, never a
          thread of stale ones.
          </details>
          EOF
          )
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$body" >/dev/null
            echo "edited comment $COMMENT_ID -> $STATE"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
            echo "posted a new comment -> $STATE"
          fi
