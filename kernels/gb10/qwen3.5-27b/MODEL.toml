[model]
name = "qwen3.5-27b"
hf_id = "Kbenkhaled/Qwen3.5-27B-NVFP4"
params = "27B"
active_params = "27B"
architecture = "Hybrid Attention + SSM (Dense FFN)"

layers_total = 64
layers_full_attention = 16
layers_linear_attention = 48

hidden_dim = 5120
head_dim = 256
q_heads = 24
kv_heads = 4
intermediate_size = 17408

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
attn_output_gate = true
partial_rotary_factor = 0.25

mtp_layers = 0
vision = true

[[model_types]]
model_type = "qwen3_5"

# Kbenkhaled's re-uploaded Qwen3.5-27B-NVFP4 enables MRoPE
# (mrope_interleaved + mrope_section=[11,11,10]) in text_config.rope_parameters.
# The dispatch rewrite to "qwen3_6_moe" is GATED on is_moe (top model_type
# qwen3_5_moe/qwen3_vl_moe), so this DENSE hybrid keeps model_type "qwen3_5"
# and routes here via the wildcard entry (the qwen3_6_moe/5120 entry below is
# belt-and-braces). hidden_size=5120 distinguishes this hybrid 27B from the
# 35B variant (hidden_size=2048) under the same model_type. NOTE: in the
# standard multi-target build the EXACT (qwen3_5, 5120) entry on qwen3.6-27b
# wins over this wildcard — see HANDOFF §9a; both legs are checked.
[[model_types]]
model_type = "qwen3_6_moe"
hidden_size = 5120

# Qwen3.5 recommended sampling (from model card).
# 2026-05-24 empirical band-aid (matches Qwen3.6-35B-A3B post-revert).
# Reverted from Qwen card's temp=1.0/pres=1.5/2.0 — those caused
# max_tokens-overrun wandering on agentic opencode clients (35B sibling).
[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[behavior]
# Content-loop watchdog enabled: dense Qwen3.5-27B has a known
# prose-attractor failure mode (2026-04-26 field reports) and the
# 2026-05-05 chess-game stress sweep confirmed it loops on long-code
# prompts (`.btn-reset` block × N at 13.4 t/s). MoE A3B/A10B variants
# in the family don't need it.
enable_loop_watchdog = true
# Thinking on by default for all Qwen reasoning-tier models (sweep 2026-05-20).
thinking_default = true
# 2026-05-23 sweep: project-wide default flipped to true (was unset →
# false via build_parse default).
thinking_in_tools = true
# 2026-05-23 sweep: explicit 2048 (was unset → 256 default).
max_thinking_budget = 2048

# ── expected_absent ────────────────────────────────────────────────────────
# Harvested 2026-08-04 from a SINGLE-TARGET `--check-kernels` run
# (ATLAS_TARGET_MODEL=qwen3.5-27b build, Kbenkhaled checkpoint): 222 lookups,
# 33 unresolved, kernel_set_hash 978c5c9c93d2. NOTE: this target's own kernel
# set is NOT what the standard multi-target build serves for this checkpoint —
# `ptx_for_config` prefers the exact `(qwen3_5, 5120)` match on qwen3.6-27b
# over this target's wildcard `(qwen3_5, None)`, so the checkpoint was
# already checked rc=0 against qwen3.6-27b's set (2026-08-03, hash
# 6a0211057c4a). This harvest covers this target's own, smaller set
# (no nvfp4_mmq/q4k/w4a4/w4a16_v2 sources shipped here). Every entry names
# the dispatch site and the resolved fallback; none are silenced
# speculatively.

# ⚠ HONESTY NOTE on the four gated_delta_rule arms below: the FP16-h-state
# decode arms dispatch these handles UN-PROBED once --ssm-h-dtype f16 is
# active. Preflight refuses f16 for bad env combos but NOT for a target
# that lacks the twins, so setting the flag on this model is a 0-handle
# launch, not a fallback. Declared here to unblock the gate; the correct
# fix is a preflight check on kernel presence. UNMEASURED.
[expected_absent.gated_delta_rule]
gated_delta_rule_decode_f16_norm = "FP16 h-state twin; see honesty note above. F32 fused-norm arm resolves."
gated_delta_rule_decode_f16_strided_norm_half = "FP16 h-state twin; see honesty note above. F32 strided-norm arm resolves."
gated_delta_rule_decode_f32_strided_norm_half = "Half-register twin; selected only under the resolved half-register gate (ATLAS_GDN_HALF_REG presence, off as shipped)."
gated_delta_rule_decode_f32_strided_norm_smem = "SMEM-staged twin; gated behind ATLAS_GDN_SMEM_STAGE (off as shipped) AND the half-register gate."

[expected_absent.gated_delta_rule_wy17]
gated_delta_rule_wy17 = """
wy17 fused decode (K=17) exists only in qwen3.6-35b-a3b's PTX module
set (per the init.rs comment); decode_batched checks non-NULL before
the fused path and keeps the sequential per-token path otherwise."""

