entry  = "kv_cache_append_bf16k_turbo4v"
state  = "counterpart"
gb10   = "kernels/gb10/common/reshape_and_cache_turbo.cu::reshape_and_cache_flash_bf16k_turbo4v"
why    = "gb10 writes num_tokens tokens through slot_mapping into a paged bf16 K pool and a separately strided paged Turbo4 V pool (k_block_stride_bytes, v_block_stride_bytes, v_data_section_bytes); Metal writes one token at cache_pos into a contiguous bf16 k_cache and flat v_data/v_scales. Same per-side rotation contract, paged vs contiguous addressing."

[[metal]]
source = "kernels/metal/common/attention_prefill.metal"
entry  = "attention_prefill"
state  = "counterpart"
gb10   = "kernels/gb10/common/inferspark_prefill.cu::inferspark_prefill"
why    = "gb10 is a tensor-core flash-attention kernel (mma.sync, cp.async, tiled online softmax) taking a causal flag and a sliding_window; Metal is a one-threadgroup-per-(token, head) three-pass softmax that implements only the causal, non-sliding-window subset and drops keys past MAX_SEQ_PREFILL = 4096 through its loop bound."

[[metal]]
source = "kernels/metal/common/attention_full.metal"
entry  = "attention_full"
state  = "counterpart"
gb10   = "kernels/gb10/common/inferspark_prefill.cu::inferspark_prefill"
why    = "gb10 expresses non-causal attention as inferspark_prefill with causal = 0: one entry point and a flag. Metal splits it into a separate kernel with no mask, no sliding_window argument, a scalar softmax per (token, head) and a 4096-key cap from its threadgroup score array. One CUDA kernel serving two Metal kernels is not 1:1."

[[metal]]
source = "kernels/metal/common/rope_apply.metal"
entry  = "rope_apply"
state  = "counterpart"
gb10   = "kernels/gb10/common/rope.cu::rope_forward"
why    = "gb10 rotates Q and K in one launch (the grid axis selects the tensor) and evaluates freq_i = theta^(-2i/rotary_dim) in FP64 inside the kernel; Metal rotates a single tensor per launch from a host-precomputed fp32 inv_freq table and has no theta argument. Same rotate-half pairing, different launch contract and frequency precision."

[[metal]]
source = "kernels/metal/common/causal_conv1d_decode.metal"
entry  = "causal_conv1d_decode"
state  = "counterpart"
gb10   = "kernels/gb10/common/causal_conv1d.cu::causal_conv1d_update"
why    = "gb10 keeps conv_state as FP32 [batch, dim, d_conv], takes an optional bias, fuses SiLU into the output and runs over a batch; Metal keeps a BF16 [num_channels, kernel_size-1] ring buffer for one sequence, has no bias, and emits the raw conv sum without SiLU. Different state dtype and shape, different epilogue."

[[metal]]
source = "kernels/metal/common/causal_conv1d_update_l2norm.metal"
entry  = "causal_conv1d_update_l2norm"
state  = "counterpart"
gb10   = "kernels/gb10/common/causal_conv1d.cu::causal_conv1d_update_l2norm"
why    = "Same math (shift, dot, SiLU, per-head L2 norm over the first qk_channels) and the same argument order, except the CUDA kernel's nullable bias pointer, which the Metal port drops (its header says the bias path is dropped). No test under crates/spark-runtime/src/metal_backend/tests launches it, so 1:1 is asserted by a header, not measured."

[[metal]]
source = "kernels/metal/common/selective_scan_decode.metal"
entry  = "selective_scan_decode"
state  = "counterpart"
gb10   = "kernels/gb10/common/mamba2_ssm_decode.cu::mamba2_ssm_decode"
why    = "gb10 keeps a 3-D FP32 state [batch, heads, head_dim, state_size] with n_groups shared B/C vectors, a D skip term and a dt clamp to [dt_min, dt_max]; Metal keeps a BF16 [num_heads, num_channels] state with one scalar B[h]/C[h] per head, no D, no dt clamp and no batch. Different recurrence shape, state precision and epilogue."

[[metal]]
source = "kernels/metal/common/add_rms_norm.metal"
entry  = "add_rms_norm"
state  = "counterpart"
gb10   = "kernels/gb10/common/rms_norm.cu::residual_add_rms_norm_vanilla"
why    = "gb10 accumulates in place (hidden += src), normalizes with plain weight and writes output plus a residual copy from that one buffer; Metal reads two inputs a and b and writes x_resid and out (four buffers, no aliasing), and no test launches add_rms_norm. The offset-from-1 residual_add_rms_norm is NOT the counterpart; the vanilla weight form is."

[[metal]]
source = "kernels/metal/common/gdn_helpers.metal"
entry  = "gdn_compute_gate"
state  = "counterpart"
gb10   = "kernels/gb10/common/ssm_preprocess.cu::compute_gdn_gates"
why    = "gb10 deinterleaves a BA projection [num_tokens, num_groups*group_dim] and writes both the decay gate and the sigmoid beta for every token and v-head; Metal takes already-split per-head dt_raw/dt_bias for one token, writes the gate only (beta comes from sigmoid_bf16_to_f32) and has no test launching it. Fused two-output multi-token kernel vs single-output helper."

[[metal]]
source = "kernels/metal/common/gdn_helpers.metal"
entry  = "sigmoid_bf16_to_f32"
state  = "counterpart"
gb10   = "kernels/gb10/common/kda_layer_ops.cu::kda_sigmoid_bf16_f32"
why    = "Same elementwise job (bf16 in, sigmoid, fp32 out) but the argument order differs (CUDA: src, dst, n; Metal: n, x, out) and no test under crates/spark-runtime/src/metal_backend/tests launches sigmoid_bf16_to_f32, so equality is a reading of two ten-line bodies rather than a measurement."

[[metal]]
source = "kernels/metal/common/qwen35_qkv_split.metal"
entry  = "qwen35_qkv_split"
state  = "counterpart"
gb10   = "kernels/gb10/common/ssm_preprocess.cu::deinterleave_qg_split"
why    = "gb10 deinterleaves per-head [Q|gate] for num_tokens rows, writes Q to q_out and the gate back IN PLACE into data with a per-token stride; Metal reads q_full and writes Q and the gate to two separate contiguous buffers for one token, and no test launches it. Same permutation, different output aliasing and no token axis."

[[metal]]
source = "kernels/metal/common/gated_delta_rule_decode.metal"
entry  = "gated_delta_rule_decode"
state  = "counterpart"
gb10   = "kernels/gb10/common/gated_delta_rule.cu::gated_delta_rule_decode"
why    = "Same math and argument order as the CUDA kernel, but Metal fixes k_dim <= 128 through two threadgroup arrays sized 128 where CUDA sizes shared memory from k_dim at launch, decodes (v_head, batch) from a flat 1-D grid rather than a 2-D one, and its parity test checks a CPU reference, not the CUDA kernel's bytes, so bit-identity with gb10 is not established."

[[metal]]
source = "kernels/metal/common/bf16_add.metal"
entry  = "bf16_add"
state  = "counterpart"
gb10   = "kernels/gb10/common/bf16_add.cu::bf16_add_inplace"
why    = "gb10 accumulates in place (dst += src, int n) for the NCCL all-reduce path; Metal is out-of-place (out = a + b, uint n) for the residual stream, so the signatures differ and an in-place launch through the Metal entry would have to alias out to a. Same arithmetic, different signature and aliasing contract."

[[metal]]
source = "kernels/metal/common/embed_lookup.metal"
entry  = "embed_lookup"
state  = "counterpart"
gb10   = "kernels/gb10/common/embed_from_argmax.cu::batched_embed"
why    = "gb10 gathers rows with no bounds check and takes only hidden_size; Metal additionally takes num_tokens and vocab_size and writes zeros for any token id >= vocab_size, so an out-of-range id yields different bytes (a garbage row vs zeros). The Metal header claims to mirror embed_from_argmax, whose signature (argmax_result, token_id_out) it does not match."

[[metal]]
source = "kernels/metal/common/layer_norm.metal"
entry  = "layer_norm"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_layernorm_oop_bf16"
why    = "gb10's only out-of-place bf16 LayerNorm-with-bias is the NLLB one, which takes rows and dim and reduces with a blockDim-sized shared tree; Metal's layer_norm serves the Qwen3.5-VL vision blocks, takes hidden_size only (one threadgroup per token, count from the grid) and reduces simdgroup-first. Same formula, different shape contract and reduction order."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_embed"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_embed"
why    = "Same gather (out[tok, :] = table[ids[tok], :]) and same arguments, but Metal hardcodes a 256-thread stride (i += 256) where CUDA strides by blockDim.x, and no test under crates/spark-runtime/src/metal_backend/tests launches any nllb_* Metal kernel, so the row cannot be mapped until one drives it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_scale_inplace"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_scale_inplace"
why    = "Same contract and the same one-line elementwise body as gb10's nllb_scale_inplace. It is counterpart rather than mapped only because mapped requires a Metal parity test that launches the entry, and no test under crates/spark-runtime/src/metal_backend/tests launches any nllb_* kernel yet."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_add_inplace"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_add_inplace"
why    = "Same contract and the same one-line elementwise body as gb10's nllb_add_inplace. It is counterpart rather than mapped only because mapped requires a Metal parity test that launches the entry, and no test under crates/spark-runtime/src/metal_backend/tests launches any nllb_* kernel yet."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_relu_inplace"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_relu_inplace"
why    = "Same contract and the same one-line elementwise body as gb10's nllb_relu_inplace. It is counterpart rather than mapped only because mapped requires a Metal parity test that launches the entry, and no test under crates/spark-runtime/src/metal_backend/tests launches any nllb_* kernel yet."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_layernorm"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_layernorm"
why    = "Same two-pass mean/variance formula and arguments as gb10's nllb_layernorm, but Metal fixes the threadgroup at 256 (sm[256], stride-128 tree, i += 256) where CUDA sizes the tree from blockDim.x and dynamic shared memory; a different launch width gives a different summation order. No Metal test launches it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_layernorm_bf16"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_layernorm_bf16"
why    = "Same two-pass mean/variance formula and arguments as gb10's nllb_layernorm_bf16, but Metal fixes the threadgroup at 256 (sm[256], stride-128 tree, i += 256) where CUDA sizes the tree from blockDim.x and dynamic shared memory; a different launch width gives a different summation order. No Metal test launches it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_linear"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_linear"
why    = "Same C = bias + A*W^T loop, but gb10's bias pointer is nullable and checked in-kernel (bias ? bias[n] : 0) while Metal reads bias[n] unconditionally, so the CUDA kernel's no-bias mode is unreachable here (Metal splits it into nllb_linear_no_bias). No test launches the Metal entry."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_attn_kv"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_attn_kv"
why    = "Same scalar SDPA as gb10's nllb_attn_kv, but Metal carves scores[tk] and red[D] out of one fixed threadgroup array scratch[256], so tk + D > 256 silently overruns, where CUDA sizes dynamic shared memory from tk + D at launch. The context cap is in the Metal kernel, not the contract, and no Metal test launches it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_attention"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_attention"
why    = "Same scalar SDPA as gb10's nllb_attention, but Metal carves scores[tk] and red[D] out of one fixed threadgroup array scratch[256], so tk + D > 256 silently overruns, where CUDA sizes dynamic shared memory from tk + D at launch. The context cap is in the Metal kernel, not the contract, and no Metal test launches it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_attn_kv_bf16"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_attn_kv_bf16"
why    = "Same scalar SDPA as gb10's nllb_attn_kv_bf16, but Metal carves scores[tk] and red[D] out of one fixed threadgroup array scratch[256], so tk + D > 256 silently overruns, where CUDA sizes dynamic shared memory from tk + D at launch. The context cap is in the Metal kernel, not the contract, and no Metal test launches it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_attn_bdecode"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_attn_bdecode"
why    = "gb10 takes a `group` argument and reads the K/V slab at b / group so grouped cross-attention rows share one padded slab; Metal has no group argument and always reads slab b, so the CUDA grouped mode cannot be expressed. Metal also caps scores + reduction at scratch[256]. Different signature, not 1:1."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_embed_bf16"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_embed_bf16"
why    = "Same bf16 gather as gb10's nllb_embed_bf16 with the same arguments, but Metal hardcodes a 256-thread stride (i += 256) where CUDA strides by blockDim.x, and no test under crates/spark-runtime/src/metal_backend/tests launches any nllb_* Metal kernel, so the row cannot be mapped until one drives it."

[[metal]]
source = "kernels/metal/common/nllb_encoder.metal"
entry  = "nllb_scale_bf16"
state  = "counterpart"
gb10   = "kernels/gb10/common/nllb_encoder.cu::nllb_scale_bf16"
why    = "Same contract and the same elementwise index arithmetic as gb10's nllb_scale_bf16. It is counterpart rather than mapped only because mapped requires a Metal parity test that launches the entry, and no test under crates/spark-runtime/src/metal_backend/tests launches any nllb_* kernel yet."

[[metal]]
