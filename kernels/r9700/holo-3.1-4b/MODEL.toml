# ── w4a4: the module does not exist on this target at all ─────────────────
# `w4a4_gemm.cu` does not compile on gfx1201 (`41:8: error: unknown opcode`),
# so the w4a4 MODULE is absent and both lookups miss:
#
#   dense_ffn.rs:445              try_kernel("w4a4", "w4a4_gemm")
#   qwen3_attention/init.rs:749   try_kernel("w4a4", "w4a4_gemm_mfast")
#
# Both land on `KernelHandle(0)`, and every use site is guarded by
# `self.w4a4_gemm_k.0 != 0 && ... && ctx.levers.fp4_prefill`
# (dense_ffn.rs:2553, qwen3_attention/prefill/paged_{qkv,oproj}.rs), so the
# FP4-activation prefill path is never taken on r9700 and prefill runs the
# ordinary W4A16/BF16 route. This is a lost fast path, not a substituted one:
# nothing falls back to w4a4_gemm, because there is no w4a4_gemm.
[expected_absent.w4a4]
w4a4_gemm = "gfx1201, SCALE 1.7.1: w4a4_gemm.cu:41:8: error: unknown opcode. The source is dropped from this target's mirror, so the module does not exist and the FP4-activation prefill path is unavailable; the `w4a4_gemm_k.0 != 0` guard at every use site keeps prefill on the W4A16 route."

w4a4_gemm_mfast = "gfx1201, SCALE 1.7.1: w4a4_gemm.cu:41:8: error: unknown opcode, and the shared source defines only w4a4_gemm (the mfast variant exists solely in nemotron-labs-3-puzzle-75b-a9b). Nothing falls back to w4a4_gemm either, because there is no w4a4_gemm: the fp4_prefill path is off."
