[hardware]
name = "gb10"
vendor = "nvidia"
arch = "sm_121f"
compute_capability = "12.1"
# Streaming multiprocessors — the GB10 value that `atlas_core::device::sm121`
# has always carried, stated here so grid-sizing rules can read it from the
# TARGET instead of from a constant named after one card. Declaring it changes
# nothing on GB10; `atlas_core::device::sm121::NUM_SMS` stays for the gb10
# callers that are genuinely about this part.
sm_count = 48
memory_bandwidth_gbps = 273
memory_type = "LPDDR5X"
memory_gb = 120

# ── Benchmark limits ───────────────────────────────────────────────────────
#
# What a certification campaign and the record policies judge a GB10 by
# (`atlas_plugin::hardware::limits`). Facts about THIS box class — its
# `acpitz` chassis zones, its unified 121 GB pool, its checkpoint load times —
# an H100 SXM has other sensors, another memory model and another disk, and
# declares its own tables when someone measures them. Every sub-table is
# required once this section exists: a reader sees every number a campaign
# will use. This file is a closure input: changing a limit re-opens every
# gb10 gate.

# Chassis and die temperatures.
# * park / resume: `spark bench certify` parks a node at or above
#   `chassis_park_c` (or on the driver's thermal-slowdown flag) and lets it
#   take units again at or below `chassis_resume_c`. Healthy loaded GB10s read
#   55-76 °C across three boxes on 2026-09-15; the box behind the 0.66 tok/s
#   cross-box incident read 89 °C with the driver reporting a slowdown. A
#   relative rule (+20 °C over rest) parked every box after its first unit — a
#   GB10 rises 26-33 °C over rest under any gate. `chassis_park_c` is also the
#   record-time "this Speed number is suspect" line (`hardware::policy`).
# * equivalence delta: two GB10s whose hottest zones are within this of each
#   other, with no thermal alert on either, may sign one Speed-class record
#   set (`gate::agreement`). 15: the incident pair was 24 °C apart; a fleet
#   under load spreads 11-13 °C (55 vs 66-68 °C) with no number moving.
# * gpu_ceiling_c: die temperature above which a Speed record's pre-run
#   capture is suspect. 75 is the midpoint between dgx1's healthy 52-66 and
#   dgx2's 70-89 on 2026-08-15 — a hypothesis awaiting a third box, gating
#   only under ATLAS_HW_TEMP_GATE=1 and recorded on every run meanwhile.
[benchmarks.limits.thermal]
chassis_park_c = 80
chassis_resume_c = 70
chassis_equivalence_delta_c = 15
gpu_ceiling_c = 75

# `MemAvailable / MemTotal` a gate needs before its server may start. The
# recipe's own `gpu_memory_utilization` is honoured verbatim; what freezes a
# unified pool is CO-TENANCY — two serves plus a heavy client took SSH with
# them once — and 16.3 GB of co-tenants was measured to cost 32 % at C=16.
# 0.85 means "nothing else holds more than ~15 % of this box": a clean GB10
# sits at ~0.94 and passes, a single 16 GB container drops it to ~0.81.
[benchmarks.limits.memory]
min_free_fraction = 0.85

# Seconds. serve_allowance: what a self-served gate spends before its first
# sample — ~40 s for a 27B NVFP4 checkpoint in the page cache, minutes for a
# cold 35B FP8 from disk; stack #1073's third campaign killed a 17 s bench at
# 52 s while its server loaded. boot_timeout: how long a started server may
# take to name its model. shard_overhead / floor: measured 2026-09-15 on
# six-way shards — an echolp sixth ran 1650-1873 s against a 1260 s share, a
# 27B sixth 741-940 s against 1020. build_allowance: a fresh anchor build on
# a node.
[benchmarks.limits.timing]
serve_allowance_s = 600
boot_timeout_s = 900
shard_overhead_s = 420
shard_floor_s = 300
build_allowance_s = 1800

# The non-thermal half of "one box": clock ceiling within 1 % (two GB10s
# report 3003 MHz exactly; anything else is another part or firmware), memory
# within 5 % (128 GB parts read a few hundred MB apart; another SKU is 30 %
# away).
[benchmarks.limits.equivalence]
clock_spread = 0.01
mem_spread = 0.05

# ── Serving defaults for this target ───────────────────────────────────────
#
# SSOT for the per-target serving levers, baked into `atlas_kernels` by
# build.rs (`build_defaults.rs`) as `atlas_kernels::TARGET_DEFAULTS` and read
# by every resolver in spark-model BEFORE the environment.
#
# WHY IT IS HERE. Maintainer review, 2026-09-11 (tbraun96): "There is no arch
# separation at all. H100 builds compile GB10's kernel tree. Every Hopper/GB10
# divergence is expressed as an env lever set by an H100 recipe living outside
# this repo — not as arch-selected code. 'No interference' rests on discipline
# rather than structure." A default that lives in a launch script is not a
# property of the target; one that lives beside the target's arch and memory
# facts is. The environment stays available as an EXPLICIT operator override,
# and the serve log says which values came from it.
#
# EVERY target with a `[defaults]` table declares EVERY row, even where the
# value agrees with the baseline: an absent key falls through to
# `build_defaults::baseline`, which is correct behaviour and terrible
# documentation — a reader of this file would have to know the baseline to
# know what this target serves with, which is the "recipe lives somewhere
# else" problem the table replaces.
#
# GB10's values are TODAY'S HARDCODED DEFAULTS, unchanged, and
# `crates/atlas-kernels/tests/target_defaults.rs` asserts exactly that by
# equality against `build_defaults::baseline`: a GB10 serve with no
# environment set behaves as it did before this table existed.
[defaults]
# The BF16 decode head's batched-GEMV band
# (`model/trait_impl/lm_head_batched.rs`). 8 is the FROZEN band: the A/B
# behind it measured the batched GEMV NEGATIVE above 8 on GB10 (-14.4% at
# C=16, commits 84d5b763c / 78d276832), and the band's upper edge decides
# whether a width lands on the GEMV or on a REASSOCIATING tile GEMM — i.e.
# which bits a decode of that width produces. See `layers/ops/gemm_quant.rs`.
lm_head_batchm_max = 8
# One strided recurrent launch per batch on the GDN decode path. No GB10
# receipt; unchanged from main.
ssm_batched_recurrent = false
# The tensor-core GDN chunked-PREFILL spine (#928). OFF, and INERT here: the
# kernel is `kernels/hopper/common/gated_delta_rule_chunk_tc.cu`, declared in
# that target's `[kernels] overrides`, and GB10's build does not compile it — so
# the probe returns `KernelHandle(0)` and the launcher stays on the scalar
# parent `gated_delta_rule_fla::chunk_delta_h_vfused` whatever this row says.
# Declared anyway because the lever list is one list.
#
# It was DEVELOPED AND VALIDATED HERE, on GB10, and it is arch-neutral; it sits
# in the Hopper tree only because a file in `kernels/gb10/common` is mirrored
# into hopper and b200 by symlink, and `check_cross_hardware.py` rule S1
# refuses to create new cross-hardware symlinks. Two things would move it back
# down, in one commit: a GB10 A/B receipt, and the two mirror links.
#
# The standing reason this row would stay false even then: the arm reassociates
# the k-reduction into the MMA tree, and this kernel's lesson is that a spine
# change can read cos=1.0000 and still cost 1.4 BFCL points, so promotion needs
# the ssm-poisoning tripwire. HOPPER ships it ON (round 13, -39.6%/-44.7% C=1
# TTFT, coherency 4/4, determinism 8/8 x 3), and that is an H100 receipt: a
# 48-SM GB10 is the part the 48-CTA grid nearly fills, so the margin does not
# transfer by argument.
gdn_prefill_tc = false
# The Hopper BA-gates twin (#928). OFF, and INERT here: the kernel lives in
# `kernels/hopper/common/ssm_ba_gates_hopper.cu`, which GB10's tree does not
# carry and GB10's build does not compile, so the probe returns
# `KernelHandle(0)` and the launcher stays on the gb10 parent
# `ssm_preprocess::dense_gemm_ba_gates_prefill` whatever this row says.
# Declared anyway, for the same reason every other row here is: the lever list
# is one list, and a row present in one target's table and missing from
# another's is how a lever comes to mean two things in one repository. The twin is bit-identical to that parent, so a GB10 receipt could
# move this row on speed alone — but the parent's 24-CTAs-per-token grid is a
# much better fit for a 48-SM part than for a 132-SM H100, and there is no GB10
# A/B. See `kernels/hopper/HARDWARE.toml` and `SSM-BA-GATES-ATTRIBUTION.md`.
ssm_ba_gates_hopper = false
# The Hopper FP8 activation-quant twin (#928, round 16). OFF: the source lives
# under `kernels/hopper` only, so the lookup returns 0 here and the row is
# INERT — declared so the lever list is one list, the same disposition as
# `gdn_decode_hopper` and `ssm_ba_gates_hopper` above. The twin's own receipt
# is an H100 one (3.3-3.6x at prefill M, 0.76-0.95x at M <= 25), and its CTA
# floor is derived from a 132-SM part; a 48-SM GB10 would want its own
# measurement before either moves.
# See `kernels/hopper/HARDWARE.toml` and `FP8-ACT-QUANT-ATTRIBUTION.md`.
fp8_act_quant_hopper = false
# Split SiLU+down on the decode path — shipped ON everywhere.
decode_split_silu = true
# Paged-decode attention split-K. `legacy` is the rule GB10 has always run —
# `num_splits = sm_count / (num_q_heads * split_ref_seqs(num_seqs, max batch))`
# — restated, not changed. Hopper's `auto` fills 132 SMs at the single-stream
# shape; a 48-SM GB10 is the part that rule was written for and there is no
# GB10 A/B, so this row does not move until there is one.
# `ATLAS_ATTN_DECODE_SPLITK=auto` is how that A/B is run.
attn_decode_splitk = "legacy"
# `w8a16_gemm_m16` on the dense-FFN decode arm (#927). OFF: the kernel is not
# in this target's tree at all (`kernels/hopper/HARDWARE.toml [kernels]
# overrides`), so the handle resolves to 0 and the arm declines anyway.
# Declared explicitly so this file answers what GB10 serves with on its own.
ffn_m16_tc = false
# `w8a16_gemm_m16{,_strided}` on the decode Q/K/V and o_proj (#927). OFF: no
# GB10 receipt, and the kernel is not in this target's tree.
attn_m16_tc = false
# `dense_gemm_m16_bf16` on the BF16 decode head (#927). OFF: no GB10 receipt,
# the kernel is not in this target's tree, and the arm is a token-visible
# numerics seam that must not arrive by inheritance.
lm_head_m16_tc = false
# `w8a16_gemv_batch16_ncol{2,4}` on the decode attention projections (#927).
# OFF: no receipt, and the kernel is not in this target's tree.
attn_ncol_gemv = false
# The fused dense-FFN gate+up decode GEMM (#927). OFF: the arm is a cuBLASLt
# call-shape change on the W8A8 block-scaled path, and GB10 has neither a
# receipt nor the arm the receipt was taken on. GB10 also does not compile the
# arm's strided-SiLU consumer (`silu_mul_strided.cu` is Hopper-owned), so the
# row is INERT here and is declared only so the lever list is one list. A GB10
# receipt moves the source down and this row with it. See
# `kernels/hopper/HARDWARE.toml` and `FFN-GATEUP-FUSION-ATTRIBUTION.md`.
ffn_gateup_fused = false
# Upper M for the W8A8 block-scaled dense-FFN prefill (#917). These are the
# only two rows in this table that GB10 declares in order to DIFFER from the
# baseline rather than to restate it: the baseline is no cap, which is right
# for H100 and wrong here.
#
# W8A8 feeds the FP8 tensor cores directly instead of dequantizing into a BF16
# MMA. On H100 that is 2.0-3.1x at every M measured. On sm_121 it is not: W8A8
# is FLAT at ~14 TFLOP/s from M=128 to M=2048 while W8A16 climbs to ~26 and
# stays there. A kernel whose throughput does not move with M is not
# compute-bound -- it is pinned by the per-token activation quantization and
# its FP32 scale epilogue, which W8A16 never pays. So W8A8 wins only while the
# GEMM is small enough that the quantization is not the bill.
#
# Two rows because the crossover is shape-dependent. Measured 2026-09-11 on
# spark-256a at the real Qwen3.8-27B dims (H=5120, INTER=17408): gate/up
# (N=17408, K=5120, WIDENING) crosses at M~64-128; down (N=5120, K=17408,
# NARROWING) at M~384-512. Each row is the low end of its band, so the arm is
# kept only where it is measured to win.
#
# SERVED RECEIPT, same box, `Qwen3.6-27B-FP8`, M=949, n=5/leg, byte-identical
# prompt, TTFT median, complete separation between the legs:
#
#     no cap  (W8A8)   3343.3 ms
#     capped  (W8A16)  2560.4 ms      -23.4%
#
# Override per shape with ATLAS_W8A8_PREFILL_MAX_M_WIDENING / _NARROWING; 0
# means "never take W8A8 on this shape" and is honoured, not ignored.
w8a8_prefill_max_m_widening = 64
w8a8_prefill_max_m_narrowing = 384

