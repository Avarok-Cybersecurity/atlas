# r9700 (gfx1201 / RDNA 4) target: a copy of
# kernels/gb10/holo-3.1-4b/MODEL.toml with two changes:
# `kernel_source = "qwen3.6-27b"` was added (gb10's copy has none), and the
# `[expected_absent]` tables were replaced with this hardware's.
#
# Sampling and behaviour below are INHERITED AND UNVERIFIED on this board:
# GB10 harvests carried over the way this target's qwen3.6-27b and
# qwen3.8-27b copies carry them. No BENCH.toml, because benchmark records are
# per-silicon and none exist here. MODEL.toml is a copy rather than a symlink
# so those values stay editable per hardware. Serve it with
#
#   AVAROK_TARGET_HW=r9700
#   AVAROK_TARGET_MODEL=holo-3.1-4b
#   AVAROK_TARGET_QUANT=nvfp4
#
# WHY THIS MODEL EXISTS ON THIS TARGET. Qwen3.8-27B does not fit the R9700's
# 32 GB under the two-layout residency, so a smaller model of the same
# architecture family is what can prove coherent generation on gfx1201 while
# the residency work lands. Holo-3.1-4B is the second, smaller candidate: the same Gated
# DeltaNet plus full-attention trunk and Qwen3-VL ViT as ornith-1.0-9b, at 4B.
#
# WHY IT REDIRECTS INSTEAD OF MIRRORING ITS OWN DIRECTORY. gb10's
# holo-3.1-4b/nvfp4/ is an older fork of gb10's qwen3.6-27b/nvfp4/, and
# of its six files SCALE 1.7.1 compiles four for gfx1201: `w4a16_gemm.cu` and
# `moe_w4a16_grouped_gemm.cu` fail on e4m3, because the fork carries only some
# of the `#if defined(__SCALE__)` shims the qwen3.6-27b copies have. The
# qwen3.6-27b copies compile clean here and are already what this target's
# qwen3.6-27b and qwen3.8-27b compile, so mirroring the fork would leave four
# stale files nobody maintains.
#
# WHY THE REDIRECT IS SOUND. The shapes differ from qwen3.6-27b's, so the
# redirect is valid only if the sources are shape-generic, and they are:
# gb10's ornith-1.0-9b, holo-3.1-4b, holo-3.1-0.8b and holo-3.1-35b-a3b
# nvfp4 directories are byte-identical (`diff -rq` silent), already serving
# hidden_dim 1024 to 4096, q_heads 8 and 16, dense FFN and MoE; the only `-D`
# naming a model dimension anywhere under kernels/ is `-DHDIM=128`, which no
# target involved here uses (all declare `head_dim = 256`); `[build]
# extra_nvcc_flags` is `["--fmad=false"]` in both KERNEL.tomls character for
# character; and the `[modules]` overrides differ almost entirely in the
# direction of qwen3.6-27b having more. The two pointing the other way are
# inert (`gated_delta_rule` maps a file stem to itself, and
# `inferspark_prefill_fp8kv = "prefill_fp8kv"` is already declared in
# kernels/r9700/common/KERNEL.toml, which build.rs merges under the model
# toml).
#
# WHAT THE REDIRECT DROPS: `fp4_mma_microtest.cu`, which gb10's fork has and
# qwen3.6-27b's directory does not. It is not a serving kernel: its only
# reader is crates/spark-model/examples/fp4_mma_microproof.rs, behind the
# `gpu-examples` feature, and that PTX has no gfx1201 lowering, so the example
# could not run here whichever tree it compiled against. No serve-path site
# and no boot-audit probe looks the module up.
#
# NO `match_names` IS NEEDED HERE, checked rather than assumed.
# `validate_collision_match_names` (crates/avarok-kernels/build.rs) groups
# targets by each `[[model_types]]` (model_type, hidden_size) pair and demands
# needles only from a pair two differently-named targets both declare. On this
# hardware no pair repeats, so the check never asks. gb10 carries these four
# models plus 25 more and likewise gives this one no match_names.
[model]
name = "holo-3.1-4b"
hf_id = "Hcompany/Holo-3.1-4B"
params = "4B"
active_params = "4B"
architecture = "Gated DeltaNet + Full Attention + Dense FFN + Qwen3-VL ViT"

# Compile kernels/r9700/qwen3.6-27b/nvfp4/, this target's own copy of the
# tree its qwen3.6-27b and qwen3.8-27b targets compile, rather than mirroring
# gb10's fork; the header above has the evidence. Everything else in this file
# (sampling, behaviour, model_types, expected_absent) still belongs to THIS
# target; only the quant kernel directory is redirected.
kernel_source = "qwen3.6-27b"

layers_total = 32
layers_linear_attention = 24
layers_full_attention = 8
layer_pattern = "3:1 (linear, linear, linear, full)"

# Dense FFN (no MoE) — the mid sibling between Holo-3.1-0.8B and the
# 35B-A3B MoE. Same hybrid GDN + full-attention trunk + Qwen3-VL ViT,
# plain SwiGLU MLP. full_attention_interval=4 → 8 full / 24 linear.
intermediate_size = 9216

hidden_dim = 2560
head_dim = 256
q_heads = 16
kv_heads = 4

linear_attn_key_heads = 16
linear_attn_key_dim = 128
linear_attn_value_heads = 32
linear_attn_value_dim = 128
linear_conv_kernel = 4

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
partial_rotary_factor = 0.25
attn_output_gate = true

mrope_interleaved = true
mrope_section = [11, 11, 10]
mtp_layers = 0
vision = true
image_token_id = 248056

# POC target: keep the default demo footprint small; callers can still pass a
# larger max sequence length after validating memory.
effective_context = 4096

[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[behavior]
thinking_default = true
thinking_in_tools = true
max_thinking_budget = 768
max_inter_tool_prose = 384
max_post_think_content_tokens = 8192
default_num_drafts = 0
tool_call_parser = "qwen3_coder"
# Tool-call grammar OFF: XGrammar tool-constrained decoding degenerates the
# Holo family (see holo-3.1-35b-a3b/MODEL.toml). Matches vLLM.
disable_tool_grammar = true

# Dense Qwen3.5/Holo: model_type stays "qwen3_5" (num_experts == 0). MRoPE is
# present but the qwen3_5 -> qwen3_6_moe rewrite is gated on is_moe, so dense
# checkpoints keep `qwen3_5` and resolve here by hidden_size. MRoPE is applied
# at runtime via the mrope_interleaved / mrope_section flags above.
[[model_types]]
model_type = "qwen3_5"
hidden_size = 2560

[kernel]
moe_gate_shmem_bytes = 4096

# ── Kernel lookups this model may legitimately fail to resolve ─────────
#
# gb10's copy of this file declares a DIFFERENT set here, harvested against
# the holo-3.1-4b/nvfp4/ fork this target does not compile. Those nine tables
# are dropped rather than merged, because eight of them name absences that do
# not exist in the tree actually compiled: qwen3.6-27b's gated_delta_rule.cu
# defines all four f16/half/smem decode arms, its w4a16_gemm.cu defines the
# p3/k64/m128 twins, the shared gated_delta_rule_wy17.cu defines
# gated_delta_rule_wy17, and the directory ships q4k_mmq, q2_0_mmq,
# q4k_quantize, nvfp4_mmq, gated_delta_rule_snap and
# gdn_verify_fused_conv_kn_f32 outright. The ninth, w4a4, IS absent here for
# an unrelated reason (w4a4_gemm.cu does not compile for gfx1201 at all), and
# the set below carries it with that reason instead of gb10's.
#
# What replaces it is this hardware's own set, carried from
# kernels/r9700/qwen3.8-27b/MODEL.toml with its reason strings unchanged:
# same silicon, same compiled tree through the same `kernel_source`, therefore
# the same absences.
#
#
# THE RULE: `kernels/r9700/common/` and `kernels/r9700/qwen3.6-27b/nvfp4/` are
# whole-directory relative-symlink mirrors of the gb10 tree MINUS the sources
# SCALE 1.7.1 `targets/gfx1201` cannot compile. `kernels/r9700/HARDWARE.toml`
# `[kernels] absent` has the list and the per-file compiler errors.
#
# Every entry point of every dropped source is declared below, because the
# boot audit (`kernel_audit::classify_failures`) fails CLOSED on an unresolved
# lookup that is not declared here and the dispatch reaches all of these
# through `try_kernel`, which issues the lookup whether or not the module was
# ever built. Declared per FILE, not per reachable lookup: an entry nothing
# asks for is simply never matched, a missing entry is a target that will not
# boot. The harvest is `build_shadow::entry_points` over each dropped `.cu`,
# which resolves the `#define KERNEL_NAME` + `#include` +
# `CONCAT(KERNEL_NAME, _64)` indirections a `__global__` grep cannot see.
#
# These are the COMPILE census's absences, not an R9700 boot harvest.
# `spark serve --check-kernels` on the board is what would confirm the audit
# reports exactly this set and nothing more.
#
# The compiled kernel set is qwen3.6-27b's (`kernel_source` above) and the
# dense-27B dispatch issues the same lookups, so the two declarations say the
# same thing. They still have to exist TWICE:
# `build_parse::parse_expected_absent` reads THIS model's own MODEL.toml
# (`build.rs`: `model_dir = hw_dir.join(model)`, never the kernel_source's),
# so a table present only in qwen3.6-27b would leave this target undeclared.

# ── The asymmetric-KV paged-prefill family: 64 KB LDS on RDNA 4 ────────────
# All nine sources fail identically inside the header they share:
#
#   prefill_paged_compute_asym.cuh:99:28: error: local memory (70416 or 70432)
#   exceeds limit (65536)
#
# A follow-up, not a permanent gap. `prefill_paged_compute_asym.cuh` hardcodes
# `#define BR64 64` (line 449) and carries none of the `#if defined(__SCALE__)
# #define BR64 32` pin that `prefill_paged_compute.cuh` has. Adding that pin,
# with the matching 32-row host grid stride, brings these nine back; it is a
# kernel-side change with its own A/B. Until then prefill uses the symmetric
# turbo kernels, which do compile here.

[expected_absent.prefill_paged_bf16k_turbo2v]
inferspark_prefill_paged_bf16k_turbo2v = "gfx1201, SCALE 1.7.1: prefill_paged_compute_asym.cuh:99:28: error: local memory (70416 or 70432) exceeds limit (65536). RDNA 4 keeps the 64 KB per-workgroup LDS cap and this header carries no `#if defined(__SCALE__) #define BR64 32` pin; adding that pin, with the matching 32-row host grid stride, is the follow-up."
inferspark_prefill_paged_bf16k_turbo2v_64 = "gfx1201, SCALE 1.7.1: prefill_paged_compute_asym.cuh:99:28: error: local memory (70416 or 70432) exceeds limit (65536). RDNA 4 keeps the 64 KB per-workgroup LDS cap and this header carries no `#if defined(__SCALE__) #define BR64 32` pin; adding that pin, with the matching 32-row host grid stride, is the follow-up."

