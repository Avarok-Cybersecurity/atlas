# r9700 (gfx1201 / RDNA 4) target: this file is a COPY of
# kernels/gb10/ornith-1.0-9b/MODEL.toml with two changes, both argued below:
# `kernel_source = "qwen3.6-27b"` was ADDED (gb10's copy has none), and the
# `[expected_absent]` tables were REPLACED with this hardware's.
#
# NOTHING HERE HAS BEEN MEASURED ON AN R9700. Every sampling number and every
# behaviour flag below is a GB10 harvest carried over unexamined, the same
# status this target's qwen3.6-27b and qwen3.8-27b copies have. No BENCH.toml:
# benchmark records are per-silicon and none exist for this board. MODEL.toml
# is a real file rather than a symlink for the usual reason, that sampling and
# behaviour are checkpoint-AND-silicon properties and this is where an R9700
# measurement lands. Serve it with
#
#   AVAROK_TARGET_HW=r9700
#   AVAROK_TARGET_MODEL=ornith-1.0-9b
#   AVAROK_TARGET_QUANT=nvfp4
#
# WHY THIS MODEL EXISTS ON THIS TARGET. Qwen3.8-27B does not fit the R9700's
# 32 GB under Atlas's two-layout residency (measured 2026-09-17), so a smaller
# model of the same architecture family is what can prove coherent generation
# on gfx1201 while the residency work lands.
# Ornith-1.0-9B is the closest small sibling: Gated DeltaNet plus full
# attention plus dense FFN plus a Qwen3-VL ViT with MRoPE, which is
# qwen3.6-27b's trunk at 9B.
#
# WHY IT REDIRECTS INSTEAD OF MIRRORING ITS OWN DIRECTORY. gb10's
# ornith-1.0-9b/nvfp4/ is an older fork of gb10's qwen3.6-27b/nvfp4/, and the
# SCALE 1.7.1 gfx1201 census of it says 4 of its 6 files compile:
# `w4a16_gemm.cu` and `moe_w4a16_grouped_gemm.cu` fail on e4m3, because the
# fork carries only some of the `#if defined(__SCALE__)` shims the
# qwen3.6-27b copies have. The qwen3.6-27b copies compile clean here and are
# already what this target's qwen3.6-27b and qwen3.8-27b compile. Mirroring
# the fork and symlinking the two failures across would leave four stale
# files nobody maintains; the redirect leaves none.
#
# WHY THE REDIRECT IS SOUND, and not a shape mismatch. These dimensions
# differ from qwen3.6-27b's (hidden_dim 4096 vs 5120, q_heads 16 vs 24,
# intermediate_size 12288 vs 17408, 32 layers vs 64), so the redirect
# is valid only if the sources are shape-generic. They are, on four counts:
#
#  * gb10's ornith-1.0-9b/nvfp4/, holo-3.1-4b/nvfp4/, holo-3.1-0.8b/nvfp4/
#    and holo-3.1-35b-a3b/nvfp4/ are BYTE-IDENTICAL directories (`diff -rq`
#    silent between all four). One unchanged source set already serves
#    hidden_dim 1024, 2048, 2560 and 4096; q_heads 8 and 16; kv_heads 2 and
#    4; intermediate_size 3584 upward; dense FFN and MoE. A source
#    specialised on any of those could not do that, and the fork is
#    therefore not "this model's kernels" in any sense: it is one family
#    snapshot shared by four models of very different shape.
#
#  * The only `-D` naming a model dimension anywhere under kernels/ is
#    `-DHDIM=128`, in eight gb10 model KERNEL.tomls. None of them is this
#    model's, holo-3.1-4b's, ornith-1.0-9b's or qwen3.6-27b's, and all four
#    of those declare `head_dim = 256`. The redirect does not cross the one
#    compile-time dimension the scheme has.
#
#  * `[build] extra_nvcc_flags` is `["--fmad=false"]` in gb10's
#    ornith-1.0-9b/nvfp4/KERNEL.toml and in gb10's
#    qwen3.6-27b/nvfp4/KERNEL.toml, character for character. Nothing else is
#    passed at the model layer.
#
#  * The two KERNEL.tomls otherwise differ only in `[modules]` name
#    overrides, and almost entirely in the direction of qwen3.6-27b having
#    MORE: w4a16_gemm_v2, w4a4_gemm, q4k_mmq, q2_0_mmq, q4k_quantize,
#    nvfp4_mmq and inferspark_prefill_paged_indirect, which the fork does not
#    ship at all. The two entries pointing the other way are inert.
#    `gated_delta_rule` maps a file stem to itself, and
#    `inferspark_prefill_fp8kv = "prefill_fp8kv"` is already declared at
#    kernels/r9700/common/KERNEL.toml:108, which build.rs merges UNDER the
#    model toml (common parses first as the base, the model toml wins per
#    key), so losing the duplicate changes nothing.
#
# WHAT THE REDIRECT DROPS: `fp4_mma_microtest.cu`, which gb10's fork has and
# qwen3.6-27b's directory does not. It is not a serving kernel. Its only
# reader in the tree is crates/spark-model/examples/fp4_mma_microproof.rs, a
# Phase-1 proof of a hand-written sm_120 block-scaled
# `mma.sync.aligned.kind::mxf4nvf4` against the CUTLASS collective, built
# behind the `gpu-examples` feature. That PTX has no gfx1201 lowering, so the
# example could not run here whichever tree it compiled against; no
# serve-path site and no boot-audit probe looks the module up (`git grep
# fp4_mma_microtest crates` returns those three example lines and nothing
# else).
#
# NO `match_names` IS NEEDED HERE, checked rather than assumed.
# `validate_collision_match_names` (crates/avarok-kernels/build.rs:1332)
# groups targets by each `[[model_types]]` (model_type, hidden_size) pair and
# demands needles only from a pair that two differently-named targets BOTH
# declare. This target declares ("qwen3_5", 4096). The other models on
# this hardware declare ("qwen3_5", 5120) and ("qwen3_6_moe", 5120) for
# qwen3.6-27b, ("qwen3_5", 5120) for qwen3.8-27b, and ("qwen3_5",
# 2560) for holo-3.1-4b. No pair repeats, every group holds one name,
# and the check never asks. gb10 carries all four of these models plus 25
# more and likewise gives this one no match_names, which is the same result
# from a much wider set.
[model]
name = "ornith-1.0-9b"
hf_id = "deepreinforce-ai/Ornith-1.0-9B"
params = "9B"
active_params = "9B"
architecture = "Gated DeltaNet + Full Attention + Dense FFN + Qwen3-VL ViT + MRoPE"

# Compile kernels/r9700/qwen3.6-27b/nvfp4/, this target's own copy of the
# tree its qwen3.6-27b and qwen3.8-27b targets compile, instead of mirroring
# gb10's ornith-1.0-9b/nvfp4/ fork. The header above has the evidence: the
# fork is one snapshot shared byte-for-byte by four models of different
# shape, nothing in either KERNEL.toml bakes a dimension, and two of the
# fork's six files do not compile for gfx1201. Everything else in this file
# (sampling, behaviour, model_types, expected_absent) still belongs to THIS
# target; only the quant kernel directory is redirected.
kernel_source = "qwen3.6-27b"

layers_total = 32
layers_linear_attention = 24
layers_full_attention = 8
layer_pattern = "3:1 (linear, linear, linear, full)"

# Dense FFN (no MoE) — the Ornith 9B sibling of the qwen3_5 dense family.
intermediate_size = 12288

hidden_dim = 4096
head_dim = 256
q_heads = 16
kv_heads = 4

linear_attn_key_heads = 16
linear_attn_key_dim = 128
linear_attn_value_heads = 32
linear_attn_value_dim = 128
linear_conv_kernel = 4

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
partial_rotary_factor = 0.25
attn_output_gate = true

mrope_interleaved = true
mrope_section = [11, 11, 10]
mtp_layers = 0
vision = true
image_token_id = 248056

effective_context = 4096

[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[behavior]
thinking_default = true
thinking_in_tools = true
max_thinking_budget = 768
max_inter_tool_prose = 384
max_post_think_content_tokens = 8192
default_num_drafts = 0
tool_call_parser = "qwen3_coder"
# Tool-call grammar OFF: same XGrammar degeneration as Holo-3.1 (runaway
# reasoning / hallucinated `Human:` turns under tool-constrained decoding).
# Matches vLLM, which free-generates + parses tool calls after. See
# holo-3.1-35b-a3b/MODEL.toml for the full root-cause writeup.
disable_tool_grammar = true

# Dense Qwen3.5/Ornith: model_type stays "qwen3_5" (num_experts == 0). MRoPE
# present but the qwen3_5 -> qwen3_6_moe rewrite is gated on is_moe, so dense
# checkpoints keep `qwen3_5` and resolve here by hidden_size. MRoPE applied at
# runtime via the mrope_interleaved / mrope_section flags above.
[[model_types]]
model_type = "qwen3_5"
hidden_size = 4096

[kernel]
moe_gate_shmem_bytes = 4096

# ── Kernel lookups this model may legitimately fail to resolve ─────────
#
# gb10's copy of this file declares a DIFFERENT set here, harvested 2026-08-03
# against the ornith-1.0-9b/nvfp4/ fork this target does not compile. Those nine
# tables are dropped rather than merged, because eight of them name absences
# that do not exist in the tree actually compiled: qwen3.6-27b's
# gated_delta_rule.cu defines all four of the f16/half/smem decode arms gb10's
# table calls absent (including the f16 pair its own HONESTY NOTE flags as
# dispatched UN-probed, which was a real 0-handle-launch hazard there and is
# not one here), its w4a16_gemm.cu defines the p3/k64/m128 twins, the shared
# gated_delta_rule_wy17.cu defines gated_delta_rule_wy17, and the directory
# ships the q4k_mmq, q2_0_mmq, q4k_quantize, nvfp4_mmq, gated_delta_rule_snap
# and gdn_verify_fused_conv_kn_f32 modules outright. The ninth, w4a4, IS
# absent here, for an unrelated reason (w4a4_gemm.cu does not compile for
# gfx1201 at all), and the replacement set below carries it with that reason
# instead of gb10's. Merging gb10's table would declare eight families absent
# that resolve while leaving the thirteen that really are absent undeclared,
# and only the second half of that fails the boot audit closed.
#
# What replaces it is this hardware's own set, carried verbatim from
# kernels/r9700/qwen3.8-27b/MODEL.toml with its reason strings unchanged: same
# silicon, same compiled tree through the same `kernel_source`, therefore the
# same absences. The text below is written for qwen3.8-27b and reads correctly
# for this target for exactly that reason.
#
# THE RULE: `kernels/r9700/common/` and `kernels/r9700/qwen3.6-27b/nvfp4/` are
# whole-directory relative-symlink mirrors of the gb10 tree MINUS the sources
# SCALE 1.7.1 `targets/gfx1201` cannot compile. `kernels/r9700/HARDWARE.toml`
# `[kernels] absent` has the list and the per-file compiler errors.
#
# Every entry point of every dropped source is declared below, because the
# boot audit (`kernel_audit::classify_failures`) fails CLOSED on an unresolved
# lookup that is not declared here, and the dispatch reaches all of these
# through `try_kernel`, which issues the lookup whether or not the module was
# ever built.
#
# Declared per FILE, not per reachable lookup. An entry for a kernel nothing
# asks for costs nothing, since it is simply never matched; a missing entry
# for a kernel something asks for is a target that will not boot. The harvest
# is `build_shadow::entry_points` over each dropped `.cu`, which resolves the
# `#define KERNEL_NAME` + `#include` + `CONCAT(KERNEL_NAME, _64)`
# indirections that a `__global__` grep cannot see.
#
# NOT harvested on an R9700 boot. These are the COMPILE census's absences;
# `spark serve --check-kernels` on the board is what would confirm the audit
# reports exactly this set and nothing more.
#
# The compiled kernel set is qwen3.6-27b's (`kernel_source` above) and the
# dense-27B dispatch issues the same lookups, so the two declarations say the
# same thing. They still have to exist TWICE:
# `build_parse::parse_expected_absent` reads THIS model's own MODEL.toml
# (`build.rs`: `model_dir = hw_dir.join(model)`, never the kernel_source's),
# so a table present only in qwen3.6-27b would leave this target undeclared.

# ── The asymmetric-KV paged-prefill family: 64 KB LDS on RDNA 4 ────────────
# All nine sources fail identically inside the header they share:
#
#   prefill_paged_compute_asym.cuh:99:28: error: local memory (70416 or 70432)
#   exceeds limit (65536)
#
# FOLLOW-UP, not a permanent gap. `prefill_paged_compute_asym.cuh` hardcodes
# `#define BR64 64` (line 449) and carries none of the `#if defined(__SCALE__)
# #define BR64 32` pin that `prefill_paged_compute.cuh` has. Adding that pin,
# with the matching 32-row host grid stride, is what brings these nine back;
# it is a kernel-side change with its own A/B and is deliberately not in this
# commit. Until then the prefill uses the symmetric turbo kernels, which DO
# compile here.

[expected_absent.prefill_paged_bf16k_turbo2v]
inferspark_prefill_paged_bf16k_turbo2v = """
gfx1201, SCALE 1.7.1: prefill_paged_compute_asym.cuh:99:28: error: local
memory (70416 or 70432) exceeds limit (65536). RDNA 4 has the same 64 KB
per-workgroup LDS cap as RDNA 3.5, and this header carries no
`#if defined(__SCALE__) #define BR64 32` pin; adding it is the follow-up."""
inferspark_prefill_paged_bf16k_turbo2v_64 = """
gfx1201, SCALE 1.7.1: prefill_paged_compute_asym.cuh:99:28: error: local
memory (70416 or 70432) exceeds limit (65536). RDNA 4 has the same 64 KB
per-workgroup LDS cap as RDNA 3.5, and this header carries no
`#if defined(__SCALE__) #define BR64 32` pin; adding it is the follow-up."""

