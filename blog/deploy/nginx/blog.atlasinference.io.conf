# Atlas blog — blog.atlasinference.io
#
# SSOT for the origin vhost. Installed on the avarok origin as
# /etc/nginx/sites-available/00-blog.atlasinference.io.conf and symlinked into
# sites-enabled. Modelled on 00-docs.atlasinference.io.conf: Cloudflare in
# "Full" mode in front, origin presents the iRedMail self-signed cert.
#
# DNS: `blog` is a CNAME onto the apex, proxied through Cloudflare.
#
# One deliberate divergence from the docs vhost, and it is a fix rather than a
# preference. nginx's `add_header` does not accumulate across contexts: a
# location that declares ANY add_header discards every add_header inherited
# from the server block. The docs vhost sets its security headers at server
# level and then sets Cache-Control inside `location ~* \.html$`, so every HTML
# document it serves — the only responses where X-Frame-Options and nosniff
# actually matter — is served with none of them. Cache-Control is therefore
# computed by a map here and emitted from the single server-level header set,
# so nothing is ever overridden. `blog/e2e/nginx-headers.test.mjs` pins this.

# Longest-lived first: nginx map regexes are evaluated in declaration order and
# the first hit wins.
map $uri $blog_cache_control {
    # Content-hashed by the bundler; the name changes when the bytes change.
    "~^/_app/immutable/"                    "public, max-age=31536000, immutable";
    # Never cache the worker itself, or a bad one pins itself for its max-age.
    "~^/service-worker\.js$"                "no-cache";
    "~*\.(?:woff2?|ttf|otf|eot)$"           "public, max-age=31536000, immutable";
    "~*\.(?:png|jpe?g|gif|svg|ico|webp|avif|mp4|webm)$"  "public, max-age=2592000";
    # Documents and everything unhashed: short, so a deploy is visible quickly.
    default                                 "public, max-age=300";
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.atlasinference.io;

    # ACME challenge path (reserved — not used while Cloudflare is in front)
    location /.well-known/acme-challenge/ {
        root /opt/www/well_known;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    server_name blog.atlasinference.io;

    http2 on;
    http3 on;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # iRedMail self-signed — Cloudflare Full mode accepts this on origin
    ssl_certificate /etc/ssl/certs/iRedMail.crt;
    ssl_certificate_key /etc/ssl/private/iRedMail.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 10m;

    # Cloudflare origin-IP restoration (matches 00-atlasinference.io.conf)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    root /var/www/blog.atlasinference.io/html;
    index index.html;

    # One header set for the whole vhost. Do not add an `add_header` to any
    # location below without repeating these — see the note at the top.
    add_header Cache-Control $blog_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Clean URLs. `$uri/index.html` before `$uri/` so /posts serves its index
    # directly instead of costing the visitor a 301 to /posts/.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Block hidden files except ACME
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
