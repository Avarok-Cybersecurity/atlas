# request is admitted, so outputs are unchanged. OFF until the receipt on this
# card: reuse.py mixed (4 decoding streams plus one 12K-token restore) with
# decode p99 inter-chunk gap during the restore no worse than the synchronous
# arm's and within 1.5x of the no-restore baseline, and
# atlas_kv_restore_parked_total > 0.
kv_restore_async = false
# Disk tier and warm restart for the host KV tier (spark-runtime
# kv_host_tier/disk.rs, lane L27): blocks the host tier evicts are demoted to
# one record file each under --kv-tier-dir (temp file plus atomic rename,
# O_DIRECT when aligned with a logged buffered fallback, budget
# --kv-tier-disk-gb, least recently used first), a later lookup promotes them
# back after checking the record's checksums, and a restarted server adopts
# the records a previous run wrote for the same model fingerprint. Needs the
# host tier (kv_host_tier) and both flags; refused under --hermetic, since it
# carries KV state across restarts. OFF until the receipt on this card: the
# restart test (prime, stop, start, query) shows
# atlas_kv_tier_disk_adopted_total > 0 and atlas_kv_tier_disk_hits_total > 0
# with greedy output equal to the primed run, and a promote is faster than
# recomputing the same prefix.
kv_tier_disk = false
# Radix prefix-cache eviction takes its victim from an ordered (last_access,
# node id) index of evictable leaves, maintained at every transition of the
# victim predicate, instead of scanning every node once per evicted block
# (`spark-runtime/src/radix_tree/inner/lru_index.rs`). Ties break toward the
# lowest node id exactly as the scan does, so the victim sequence is identical
# by construction and by a randomized oracle
# (`radix_tree/tests/lru_index.rs`). OFF until the receipt on this card:
# greedy SHA equal and `atlas_prefix_evict_seconds_total` per victim down at
# least 10x on a saturated pool (`AVAROK_PREFIX_EVICT_TIMING=1` times the
# row-off scan arm). `AVAROK_RADIX_LRU_INDEX=1` is the A/B.
radix_lru_index = false
# A prefix-cache hit may end inside a KV block: the chunked prefill copies
# that block into a private block (every attention layer's K and V, D2D on the
# prefill stream before the block table is used) instead of sharing the
# donor's writable tail, which is the issue #1193 aliasing bug
# (`radix_tree/inner/cow_walk.rs`, `prefill_b/prefix_cow.rs`). Saves up to
# block_size - 1 prefill tokens per warm hit and lets an exact repeat of a
# non-aligned prompt reach its leaf snapshot. Never in a multi-rank world or
# under --high-speed-swap. `AVAROK_PREFIX_SUBBLOCK` (0, 1, cow) still wins
# when set. OFF until the receipt on this card: the #1193 shape at C=4
# (identical prompts, MTP on) equal to cache-off at temperature 0 and free of
# cross-stream identity at 0.7, and prefix-repetition TTFT no worse.
# `AVAROK_PREFIX_COW_TAIL=1` is the A/B.
prefix_cow_tail = false
# Quest page-sparse decode attention (`spark-model/src/port/sparse_quest/`,
# `kernels/ada/common/attn_page_sparse_ada.cu`), plugged into the
# sparse-attention seam: per attention layer, 64-token page and KV head the
# channel min and max of the keys (f16, kept in the slot of the page's first
# physical block, charged to the KV budget at model build), and per decode or
# verify step the Quest bound `sum_c max(q_c*kmin_c, q_c*kmax_c)` of every
# page; the step attends only to the first `--attn-sparse-sink-pages` pages,
# the `--attn-sparse-topk-pages` best pages and the last
# `--attn-sparse-recent-tokens` tokens through a compacted block table, once
# the context passes `--attn-sparse-min-ctx` (below it the view is the dense
# table, bit-identical). APPROXIMATE, so OFF on every target and never default
# on; the module exists only in the Ada image (elsewhere the row logs once and
# attention stays dense). The receipts that only ever record it (never flip
# it): `examples/page_sparse_microtest.rs` PASS (summary bytes, scores, exact
# top-k sets, the identity gate bit-identical), then the L02 NIAH grid at
# 32K/64K/128K/262K, decode ms/step against context, perplexity drift and one
# agent task at 64K+ (queue row Q15).
attn_page_sparse = false
# Bounded KV view (APPROXIMATE; `spark-model/src/port/kv_view/`, core
# `spark-runtime/src/kv_select/` and `kv_cache/sketch.rs`, kernels
# `kv_view_table_ada.cu`, `kv_page_sketch_ada.cu`, `kv_page_score_ada.cu`;
# KVMem's idea, arXiv:2609.04852, implemented independently): once per user
# turn, at the end of the final user message's prefill, the context's
# 128-token blocks are scored against that message's last query rows
# (page-softmax over a per-page pre-RoPE mean-key sketch) and the
# full-attention layers' decode and verify attention then reads only the view
# (sink, the recent window, the question and the best blocks within
# `--kv-view-budget-tokens`, plus every token appended after), and so do the
# paged prefill chunks of the conversation's next turn; GDN layers and the MTP
# head stay dense, the first output token comes from the full prefill. It
# serves only with this row on AND a budget, and only on Ada (the table kernel
# is an Ada override). OFF on every target and never flipped in this sprint:
# changing answers is the price, and the bar for any future default is needle
# recall at least 95% of dense at 5 depths x 16K-128K with a 16K view and
# multi-needle within 2 points. `AVAROK_KV_VIEW=1` plus
# `--kv-view-budget-tokens 16384` is the A/B; the `atlas_kv_view_*` series
# show selections, view tokens, recall mass and skips by reason.
kv_view_selection = false
# RetroInfer retrieval attention (spark-model port/retro, lanes L33 and L34):
# at or above --retro-min-context tokens, each full-attention layer's decode
# attends exactly to the first --retro-sink tokens, the recent tail and the
# tokens of the few highest-scoring clusters of a segmented spherical k-means
# index over its keys (retrieval zone, --retro-retrieval-budget of the
# clusters), estimates the next clusters through their centroids and value
# sums (--retro-estimation-budget), and drops the rest; the index is built
# once per sequence, grown every --retro-update-interval generated tokens and
# reused by sequences that share a prefix. It is APPROXIMATE attention, so
# outputs differ from dense attention; decode runs without CUDA graphs while
# it is on, and BF16 or FP8 KV with head dim 256 is served (other layers stay
# dense). OFF on every target and never flipped by default; the receipt that
# would justify any default is the shadow gate on this card (--retro-shadow at
# 64K and 128K on all 8 layers: mass recall at least 0.97 and output error at
# most 0.03), then the L02 NIAH grid and RULER within 2 points of dense, and
# decode tok/s above dense at 128K.
retro_attn = false
# APPROXIMATE block-sparse prefill attention, XAttention-style
# (`kernels/ada/common/prefill_block_sparse_ada.cu`,
# `spark-model/src/port/sparse_prefill/`). A chunk of the paged prefill that
# attends to at least `--prefill-sparse-min-tokens` keys (default 32768)
# scores every pair of 128-token query and key blocks by a strided
# antidiagonal sum (`--prefill-sparse-stride`, default 8), keeps per query
# block the key blocks that hold `--prefill-sparse-threshold` (default 0.9) of
# its softmax mass plus the sink block and the diagonal band, and runs flash
# attention over the kept blocks only. BF16 or FP8 KV, head_dim 128 or 256, no
# sliding window; everything else, and chunk 0, keeps the dense kernels. It
# changes outputs, so it is OFF on every target and never defaults on: the
# receipts it owes are the identity gate (threshold 1.0 serves through the
# dense kernel, greedy SHA equal), `examples/sparse_prefill_microtest.rs`
# PASS, TTFT at 32K and 128K, and RULER and NIAH grid deltas plus KL at length
# against the row off. `AVAROK_PREFILL_SPARSE_ATTN=1` is the A/B.
prefill_sparse_attn = false
# Host-resident window desk (`spark-model/src/port/kv_window/`, page API
# `spark-runtime/src/kv_host_tier/pages.rs`, view kernel
# `kv_page_fetch_ada.cu`): APPROXIMATE attention for contexts past what VRAM
# holds. A long sequence keeps on the GPU only its first
# `--kv-window-head-tokens` positions (2048, the sinks), its last
# `--kv-window-tokens` positions (32768) and up to 2048 positions of pages a
# recall scorer brings back; every other full KV block moves to host RAM in
# batches of 1024 positions, its table entry points at one hole block so every
# position and RoPE stays, and the full-attention layers read the desk through
# a compacted block table rebuilt inside the decode graph each step. MTP heads
# attend their sinks plus the same recent window. It refuses the prefix cache,
# --high-speed-swap, vision input and KV dtypes other than BF16 and FP8. NEVER
# default on, on any target: it changes outputs whenever a sequence outgrows
# the desk. `AVAROK_KV_WINDOW_DESK=1` is the A/B; the receipts (plan Q14,
# report 77 section 12.5 R7 to R9 on the 27B) are KV capacity, needle recall
# at 128K and 262K, restore at least 10 GB/s and at most 15% decode loss from
# misses; `atlas_kv_window_*` show residency, fetches and demotions.
kv_window_desk = false
# @port:defaults
# ── Kernels this target OVERRIDES or ADDS instead of inheriting ────────────
#
# `kernels/hopper/common/` is gb10's directory reached by symlink, PLUS the
# real files named here. The maintainer rule (2026-09-11): symlinks are fine
# provided the pointed-to gb10 file is not edited while iterating on Hopper;
# a Hopper-TUNED kernel must be a real file under `kernels/hopper/`.
#
# This list is graded on disk by `tests/inherited_overrides.rs` — an entry
# that is still a symlink, or an ADDITION that re-declares a gb10 entry point,
# fails there rather than in a reader's head.
#
#   paged_decode_fp8_splitk_hopper.cu   The paged-decode SPLIT-K pair (#928):
#   paged_decode_bf16_splitk_hopper.cu  a partial-attention kernel per KV split
#                            plus the merge that folds the partials. ADDITIONS
#                            — new stems, new entry names. gb10's
#                            `paged_decode_attn_fp8.cu` already declares a
#                            split-K pair, but a same-stem override there would
#                            fork the NON-split `paged_decode_attn_fp8` entry
#                            beside them — the kernel five targets compile and
#                            six KV dtypes route through — to retune two. New
#                            stems fork nothing. The FP8 twin restores the
#                            PD_BC=4 batched inner loop (gb10's split-K path is
#                            the scalar remainder one, which a 132-SM split
#                            count would multiply rather than hide); the BF16
#                            twin is a new CAPABILITY — `run_paged_decode.rs`
#                            had an explicit "no Split-K (not implemented for
#                            BF16 yet)" branch, so the
#                            `--kv-high-precision-layers auto` layers had
#                            nothing to select. Reached only under
#                            `[defaults] attn_decode_splitk`.
#   paged_decode_splitk_hopper.cuh   Their shared machinery — the split
#                            partition, the smem tree merge, the workspace
#                            format and the reduce body.
#
#                            NOT symlinked into `kernels/b200`: that target
#                            declares `attn_decode_splitk = "legacy"` for want
#                            of a receipt, so the kernels would be compiled and
#                            never reached.
#
#   gated_delta_rule_chunk_tc.cu  The tensor-core GDN chunked-PREFILL state
#                            spine (#928) — `chunk_delta_h_tcfuse_x2`, the
#                            k-reduction moved into the MMA tree. An ADDITION:
#                            its parent `chunk_delta_h_vfused` lives in
#                            `common/gated_delta_rule_fla.cu` beside thirteen
#                            other entry points, so a same-stem override would
#                            fork all of them.
#
#                            DEVELOPED AND VALIDATED ON GB10, and it is
#                            arch-neutral — no `__CUDA_ARCH__` arm and one MMA
#                            shape, `m16n8k16 f32.bf16.bf16.f32`, which is
#                            sm_80+. It lives HERE rather than in
#                            `kernels/gb10/common` only because this repository
#                            refuses to create a new cross-hardware symlink
#                            (`check_cross_hardware.py` rule S1): a file in the
#                            gb10 tree is mirrored into hopper and b200 by
#                            `every_inherited_common_mirrors_every_gb10_common_file`,
#                            and new SHARING is a decision that must be made
#                            deliberately rather than inherited from a mirror.
#                            The consequence is stated plainly: GB10 no longer
#                            compiles this kernel, so its `gdn_prefill_tc` row
#                            is inert and `native_gdn_chunk_prefill_microtest`
#                            skips on a GB10 image. A GB10 receipt moves the
#                            file down and adds the two mirror links in one
#                            commit. Numbers: `GDN-PREFILL-ATTRIBUTION.md`.
#
#   gdn_recompute_wu_hopper.cu  The two SCALAR REMNANTS of the chunked PREFILL
#   gdn_fwd_o_hopper.cu         (#928) on tensor cores: `wu`'s two forward
#                            substitutions and `fwd_o`'s triangular
#                            `tril(kq).uc`. ADDITIONS rather than overrides
#                            because their parents live in
#                            `common/gated_delta_rule_fla.cu`, which NO model
#                            directory shadows, so a same-stem override there
#                            WOULD compile. That file is 2105 lines declaring
#                            fourteen entry points, of which these replace two:
#                            a whole-file override is whole-file and would fork
#                            the other twelve, which is the shadow-drift class
#                            `build.rs` reports. New stems with new entry names
#                            fork nothing, and the launcher picks parent or twin
#                            by kernel presence under `[defaults]
#                            gdn_prefill_tc`. Reached only under that row.
#                            Numbers: `GDN-PREFILL-ATTRIBUTION.md`.
#   gdn_prefill_hopper.cuh   Their shared operand machinery — the padded smem
#                            strides and the MMA fragment maps both twins read.
#                            No gb10 counterpart by design: it is the shared
#                            inner loop of the two `.cu` additions above and
#                            nothing else includes it.
#
#   ssm_ba_gates_hopper.cu   The SSM BA projection + GDN gate transforms with
#                            ONE CTA per token (#928). An ADDITION for a third
#                            distinct reason: its parent
#                            `dense_gemm_ba_gates_prefill` lives in
#                            `common/ssm_preprocess.cu` beside two other entry
#                            points that GB10 and four other targets compile,
#                            so a same-stem override would fork those two as
#                            well. A new stem with a new entry name forks
#                            nothing, and `ops::ssm_ba_gates_pick` selects
#                            parent or twin by kernel presence under
#                            `[defaults] ssm_ba_gates_hopper` plus a token-count
#                            guard. Numbers: `SSM-BA-GATES-ATTRIBUTION.md`.
#
#   w8a16_gemv.cu            The W8A16 M=1 decode GEMV. On an H100 this family
#   w8a16_gemv_fused.cu      is 71% of the C=1 decode step (nsys, 1xH100,
#                            Qwen/Qwen3.8-27B-FP8, 2026-09-11 round 10) and the
#                            gb10 kernels are LSU-bound on the E4M3 LUT gather
#                            rather than bandwidth-bound. These two REPLACE
#                            their gb10 namesakes: same entry points, same
#                            arithmetic in the same order, different dequant
#                            instruction. gb10 keeps its own file untouched —
#                            gb10, b200, strix and strix-hip all compile it.
#   w8a16_gemv_hopper.cuh    The shared inner loop of those two, and the SSOT
#                            for the bit-identity argument. No gb10
#                            counterpart by design: nothing else includes it.
#
# ── The three ADDITIONS: new stems, entry points gb10 does not declare ─────
#
#   dense_gemm_m16_bf16.cu   BF16 decode head, m16n8k16 M tile (#927). Reached
#                            only under `[defaults] lm_head_m16_tc`.
#   w8a16_gemm_m16.cu        Native-FP8 M16 tensor-core tiers for the dense
#                            FFN and the decode QKV/o_proj (#927). Reached
#                            only under `[defaults] ffn_m16_tc` / `attn_m16_tc`.
#   w8a16_gemv_ncol.cu       N-column-blocked decode attention projections
#                            (#927). Reached only under `[defaults]
#                            attn_ncol_gemv`.
#
# These three exist for datacentre decode performance and are reached only
# under a lever no GB10 serve sets, so they are NOT in `kernels/gb10/common` at
# all: a GB10 build does not compile a kernel it has no receipt for, and an
# edit "for Hopper" cannot land in GB10's kernel. Every consumer resolves them
# through `try_kernel` and declines on a zero handle, and every probe is gated
# on the same lever that would launch the kernel — so a target without them
# boots rather than failing the kernel audit on a lookup nothing declared.
#
#   silu_mul_strided.cu      SiLU(gate)*up over ROW-STRIDED operands — the
#                            consumer of the FUSED gate+up decode GEMM (#927).
#                            An ADDITION, and the one whose reason is not
#                            instruction selection at all: the code is
#                            ordinary bf16 elementwise work that any of these
#                            targets could compile. It is Hopper's because the
#                            only thing that dispatches it is `[defaults]
#                            ffn_gateup_fused`, which only this target
#                            declares true. Putting it in
#                            `kernels/gb10/common` would compile a kernel two
#                            targets can never launch AND add a new
#                            cross-hardware symlink to each of their mirrors,
#                            which `scripts/check_cross_hardware.py` rule S1
#                            refuses outright. Selected by kernel PRESENCE
#                            (`try_kernel`, probed only when the lever is
#                            armed) beside the lever itself. A GB10 receipt
#                            would move the file down and add the two mirror
#                            links in the same commit. Numbers:
#                            `FFN-GATEUP-FUSION-ATTRIBUTION.md`.
#
#   fp8_act_quant_hopper.cu  The per-token / per-128-K-group FP8 E4M3
#                            ACTIVATION quantizer that feeds every W8A8
#                            projection (#928). An ADDITION rather than an
#                            override even though the parent
#                            `per_token_group_quant_fp8.cu` is a
#                            SINGLE-entry-point file that a same-stem override
#                            would fork nothing of: the shared kernel then
#                            would not be in the Hopper image at all, and the
#                            gate for this one is BYTE EQUALITY against it on
#                            device. A new stem keeps BOTH compiled, which is
#                            what lets `native_fp8_act_quant_hopper_microtest`
#                            compare them in one process at
#                            M in {16,17,25,1168,4576} x K in {5120,6144,17408}.
#                            gb10 is untouched and keeps launching its own.
#                            Selected by kernel presence (`try_kernel` →
#                            `ops::Fp8ActQuant`) AND by `[defaults]
#                            fp8_act_quant_hopper` AND by a CTA-count floor.
#                            Presence alone is what round 16 shipped, and it
#                            put every DECODE-width call on an arm measured at
#                            0.76x-0.95x: the two kernels are bit-identical by
#                            contract, so the lever is a SPEED kill switch and
#                            not a numeric A/B, and the floor is where the
#                            width lives. Rule:
#                            `layers/ops/fp8_act_quant_floor.rs`. Numbers:
#                            `FP8-ACT-QUANT-ATTRIBUTION.md`.
[kernels]
overrides = [
  "dense_gemm_m16_bf16.cu",
  "fp8_act_quant_hopper.cu",
  "gated_delta_rule_chunk_tc.cu",
  "gdn_fwd_o_hopper.cu",
  "gdn_prefill_hopper.cuh",
  "gdn_recompute_wu_hopper.cu",
  "paged_decode_bf16_splitk_hopper.cu",
  "paged_decode_fp8_splitk_hopper.cu",
  "paged_decode_splitk_hopper.cuh",
  "silu_mul_strided.cu",
  "ssm_ba_gates_hopper.cu",
  "w8a16_gemm_m16.cu",
  "w8a16_gemv.cu",
  "w8a16_gemv_fused.cu",
  "w8a16_gemv_hopper.cuh",
  "w8a16_gemv_ncol.cu",
]
