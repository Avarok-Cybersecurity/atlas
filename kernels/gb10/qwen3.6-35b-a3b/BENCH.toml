delays; the official concurrency/Pareto scenario shape (per-user vs per-system tok/s \
curve via the upstream client, which is the right tool for any official submission run).\
"""

[[benchmarks]]
quant = "nvfp4"
checkpoint = "Qwen/Qwen3.6-35B-A3B-FP8"
gate = "ssm-state-poisoning-gate"
recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-bf16head"
default = true
status = "measured"
note = """\
SSM State Poisoning Gate — mandatory since 2026-08-11. Replays a fixed 4-turn \
script 12 times against one prefix-cached server at temperature 0 and demands \
byte-identical transcripts every round. Atlas is bitwise-deterministic at batch \
1, so ANY divergence is accumulated engine-state corruption — the exact class \
the batch4 stack shipped (Marconi SSM-snapshot restore poisoned runs 8/9 of the \
agentic gate into early-EOS). It is REQUIRED, not a promotion candidate, \
because the bug it exists to catch already landed once.

The zero-tolerance thresholds are DEFINITIONS of the invariant, not measured \
performance: `collapsed` and `unmeasured` must be 0 — same footing as the \
agentic gate's exact `iterations` pin. (`invariant` is deliberately NOT pinned \
to `rounds`: healthy restore jitter means most rounds are Jittered, not \
Invariant, and a note claiming otherwise once contradicted the gate's own \
verdict rule.) They are belt-and-suspenders with the run verdict (which itself \
fails on any collapse, any unmeasured round, any zero-cache replay, and any \
reference round that misses the script's semantic anchors), enforcing the \
invariant at the record level too. `rounds` is pinned at exactly 12, the N the \
invariant was written for: the incident poisoned rounds 8-9 of 10, so the gate \
carries margin past that. `min_cached_prompt_tokens` is the vacuity \
attestation — see its own comment below.

`sum_wall_s` is the only genuinely measured-style number — a BLOWUP DETECTOR, \
not a perf gate (identical philosophy to the agentic Σwall). Generous pending \
the first recorded run; ratchet after measurement, never to the best.

Self-start applies `ssm_cache_slots = "256"` from the \
[benchmarks.serve_overrides] table below (the flagship recipe's pinned \
value; recorded in the gate record's serve_overrides, and demanded on the \
record by check_record). The bf16head recipe leaves the Marconi snapshot \
pool at its default 16, which evicts \
under this multi-turn load — replays then restore from DRIFTING anchors \
(different replay geometry, legitimately different output), which is \
pool-churn noise, not the poisoned-restore-content class this gate polices. \
Pinning the pool tests restore CONTENT without the noise. Same footing as \
the agentic gate's norm.rs: normalize known bookkeeping variance so the \
measurement is repeatable, never hide signal. The first unpinned run on \
main (2026-08-12, sha 7dd4cc33bc) proved the churn: replays 2-12 diverged \
with restore anchors drifting 992→1040→1088→1152 and 33 'no SSM snapshot — \
recomputing' events in the serve log.

★ THINKING IS DISABLED VIA THE SERVE CONFIG for this gate — the baseline \
declares `disable_thinking = "true"` in [benchmarks.serve_overrides] below, \
so a `--pull-request-gate` run applies BOTH deltas with no operator flags \
and the run record is reproducible hands-free (the recipe carries \
`disable_thinking: false` in its defaults precisely so the override is \
accepted; the record discloses it). The serve is therefore NOT \
byte-identical to the flagship config the other gates certify — the \
override is the one delta. History of how this landed (2026-08-15): the \
recipe serves thinking-on (MODEL.toml thinking_default=true, budget 768), \
under which the #513 reference anchors are unsatisfiable — the budget \
forces `</think>` mid-reasoning and the answer misses 'exactly one line' / \
'3 numbered lines' (measured at 62a89527fb, the first post-#513 run; every \
pre-#513 PASS predates the anchors). A first fix pinned per-request \
`chat_template_kwargs.enable_thinking:false` in probe.rs; that path \
DEGENERATES to a ~2-token stop on qwen3_6_moe and was reverted — probe \
bodies now carry no chat_template_kwargs at all (probe_tests pins this). \
Turn-1's space-drop half of the failure was the api/strip.rs streaming \
regression (#473), fixed separately. Nothing under test is lost by \
thinking-off: the gate polices the PREFILL restore of the shared document \
prefix, and thinking tokens are post-prefill output the template strips \
from replayed history anyway.\
"""

[benchmarks.serve_overrides]
disable_thinking = "true"
ssm_cache_slots = "256"

[benchmarks.metrics.rounds]
min = 12.0
max = 12.0

# The POISONING bar: zero tolerance for a collapsed replay. This is the
# definition of the invariant the gate exists to police — a restored prefix
# must never produce degenerate output (early-EOS or runaway). Same footing
# as the agentic gate's exact `iterations` pin.
[benchmarks.metrics.collapsed]
max = 0.0

# Zero tolerance for an unmeasured round too: a transport error means the
# invariant was not proven for that round.
[benchmarks.metrics.unmeasured]
max = 0.0

# `jittered` is deliberately NOT bounded: restore-anchor selection varies
# between rounds on a healthy engine (clean main jitters 11/12 replays —
# 2026-08-12, sha a1c8000d44), and bounding it would fail healthy builds.
# It is recorded for the record, not gated.

# The vacuity attestation: the minimum turn-1 `cached_tokens` the server
# reported across the replay rounds. Every replay's first turn is a
# cross-round restore of the shared ~1.5K-token prefix, so on a caching
# server this is far above zero (the 2026-08-12 run on sha 7dd4cc33bc
# restored from anchors 992-1152). The floor of 1 is a DEFINITION, not a
# measurement: it distinguishes "the restore path ran" from "prefix caching
# was off and the gate replayed against a cold engine" — the configuration
# under which this gate once returned a green PASS proving nothing. Ratchet
# toward the observed anchor scale (~992 on this checkpoint) after the first
# recorded run that carries this metric; do not guess a higher floor before
# then.
[benchmarks.metrics.min_cached_prompt_tokens]
min = 1.0

[benchmarks.metrics.sum_wall_s]
max = 1200.0

# --- vision-fidelity -------------------------------------------------------
# Vision models only. This gate is declared on the three targets that ship a
# vision tower and have a BENCH.toml; a text-only target has no entry and the
# gate simply does not apply to it.
#
# The bounds are ABSOLUTE and take no noise term, like the cross-contamination
# gate's. Vision-token count is arithmetic over the patch grid -- there is no
# run-to-run variance for a tolerance to absorb, so any movement is a real
# change in preprocessing. That is the property that makes this gate worth
# requiring: the 2026-08-14 resolution-cap defect silently reduced every image
# above 1280px to about a tenth of its permitted area, and every capability
# check passed throughout, because a downscaled picture is still recognisably
# what it is.
#
#   integrity_passed  = 10  the INTEGRITY floor, and the legs a single
#                           well-formed request cannot reach. Every one of
#                           them fails as a FLUENT ANSWER TO THE WRONG INPUT
#                           rather than an error, which is the class this
#                           repo keeps rediscovering:
#                             heterogeneous-concurrency  four DIFFERENT
#                               requests in flight (one text-only), each
#                               scored against its own input. Identical
#                               requests cannot test the per-request offsets
#                               into the shared ViT output buffer, because
#                               every offset is then interchangeable.
#                             prefix-cache-isolation     same prompt text,
#                               different image, back to back. Guards the
#                               predicate that keeps vision prompts out of
#                               the prefix cache — it silently missed the
#                               VIDEO pad token until 2026-08-14.
#                             long-prompt-splice         a prompt past the
#                               single-chunk budget, which leaves the batched
#                               co-dispatch encode for a second splice in a
#                               different file. Measured 81 vs 7082 prompt
#                               tokens, so it really does cross over.
#                             media-in-history           the image in an
#                               earlier turn, not in the message asking the
#                               question. The #165 path.
#                             exif-orientation-pinned    PINS current
#                               behaviour rather than judging it: EXIF
#                               orientation is IGNORED, measured 2026-08-14.
#                               A rotated phone photo reaches the model
#                               sideways. Whether to honour the tag is a
#                               product decision; that it must not change by
#                               accident is not.
#                             stream-blocking-parity     the SAME request
#                               streamed and not. Every other leg sets
#                               stream:true, so the blocking path — which
#                               assembles its own response — was never run.
#                               Both must answer correctly AND agree on
#                               prompt_tokens; a difference means the two
#                               paths built different prompts from identical
#                               bytes.
#                             multi-choice-image         n=2 with an image.
#                               The blocking path gives only choice 0 the
#                               pixels (the encode is shared), which is
#                               correct and is also index-conditional code
#                               nothing ran.
#                             image-on-tool-result       the image arriving
#                               on a role:"tool" message — the OTHER call
#                               site of collect_message_images, and the case
#                               #165 exists for.
#                             thinking-on-vision         the DEFAULT config
#                               for these checkpoints, which every other leg
#                               turns off. Thinking lengthens the prompt and
#                               so moves which prefill chunk the pad run lands
#                               in. Asserted as a DIFFERENCE between two
#                               images so the unknown <think> cost cancels.
#   integrity_measured = 10 a skipped integrity leg is not a passed one.
#   geometry_matched  = 14  the CORRECTNESS floor, and the one that moves when
#                           preprocessing changes. Rung 09 (1600x900) is the
#                           ONLY rung above the retired 1280px clamp: under the
#                           clamp it is 920 tokens, un-downscaled it is 1400.
#                           The other eight fit under either regime and so
#                           cannot tell the two apart -- without rung 09 this
#                           gate could not fail on the defect it exists for.
#   geometry_asserted = 14  the MEASUREMENT floor, which is a DIFFERENT failure.
#                           A cell the server cannot serve reports UNMEASURED,
#                           which is not a mismatch -- so without this floor an
#                           encoder-capacity regression would turn every cell
#                           UNMEASURED and still read as PASS. Both are kept
#                           because neither implies the other.
#   probes_passed     = 3   capability, all three.
#   control_held      = 1   the no-image control MUST hold. The non-vacuity
#                           requirement expressed as a threshold: if the control
#                           answers as though it saw a picture, the probes are
#                           not evidence and the run is VACUOUS.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "Qwen/Qwen3.6-35B-A3B-FP8"
gate = "vision-fidelity"
recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-bf16head"
label = "Qwen3.6-35B-A3B (FP8, bf16 head)"
default = true
status = "measured"
note = """\
REFERENCE RUN 2026-08-14, dgx-00, binary feat/video-support @ 5a22d7ce: PASS, 14/14 geometry \
cells matched, 3/3 probes, 10/10 integrity legs, control held, 14.7 s. Geometry was IDENTICAL across all \
three vision targets (49/121/192/220/576/576/920/405/1400/1/128/49/49/49 merged \
tokens) -- token \
count is a property of the preprocessor rather than the checkpoint, so agreement \
across a dense NVFP4, an unsloth NVFP4 and an FP8 MoE is evidence the arithmetic is \
right rather than a coincidence. Ships preprocessor_config.json, so it resolved 16.7M \
px before the resolver fix as well; clamped to the encoder's 16384-patch ceiling, and \
the boot log says so rather than silently ignoring the checkpoint."""

[benchmarks.metrics.geometry_matched]
min = 14.0

[benchmarks.metrics.geometry_asserted]
min = 14.0

[benchmarks.metrics.integrity_passed]
min = 10.0

[benchmarks.metrics.integrity_measured]
min = 10.0

[benchmarks.metrics.probes_passed]
min = 3.0

[benchmarks.metrics.control_held]
min = 1.0

# --- video-fidelity --------------------------------------------------------
# The third video target. Declared on 2026-08-15, after the reordering defect
# that had held it back was ROOT-CAUSED AND FIXED rather than after a re-run
# that happened to come out green.
#
# What was wrong: the request path carried media as two lists, one per
# modality, from the wire parse all the way to the rendered markers. A request
# sending `video_url` then `image_url` was therefore shown the IMAGE first,
# and nothing errored -- the marker count, the pad runs and the encoder rows
# all still agreed with each other, just about a different order than the
# caller wrote. Media is now one tagged, ordered sequence end to end.
#
# Why this target and not the other two: `video-before-image` is the only leg
# that arranges the items in that order, and the stronger dense checkpoints
# recovered from being told "the video came first" while seeing the still
# first. The A3B (~3B active) did not, and answered with the image's palette.
# The weakest target was the only honest witness -- which is the argument for
# declaring the gate here rather than only where it was comfortable.
#
# ★ REQUIRES FFMPEG ON THE SERVER for every container except GIF, and the
# serve must carry `--video-allow-ffmpeg` — the recipe this entry names pins
# `video_allow_ffmpeg: true` (added 2026-08-15). Legs needing it SKIP rather
# than fail at the benchmark level, but the gate thresholds demand all 13
# legs. See qwen3.8-27b's entry for what each leg asserts.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "Qwen/Qwen3.6-35B-A3B-FP8"
gate = "video-fidelity"
recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-bf16head"
label = "Qwen3.6-35B-A3B (FP8, bf16 head)"
default = false
status = "measured"
note = """\
REFERENCE RUN 2026-08-15, dgx-00, binary feat/video-support: PASS, 13/13 legs, 0 \
skipped, control held. The same gate scored 12/13 before the media-ordering fix, \
failing `video-before-image` with the still's palette; it now reports "video read \
correctly when it precedes the image (288 prompt tokens)" -- the same 288 the dense \
targets record, so the fix reordered the items without moving the geometry. \
group-proportionality 1s=67 2s=116 4s=214 tokens (49 tok/group, 18 overhead), MP4 and \
GIF both 214, image+video 286, two-videos 437, video-in-history 249, C=1/2/4 all \
correct on one geometry. `default = false`: qwen3.8-27b owns this gate's default \
serve."""

[benchmarks.metrics.legs_passed]
min = 13.0

[benchmarks.metrics.legs_skipped]
max = 0.0

[benchmarks.metrics.control_held]
min = 1.0
