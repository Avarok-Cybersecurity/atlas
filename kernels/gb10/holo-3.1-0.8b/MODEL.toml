[model]
name = "holo-3.1-0.8b"
hf_id = "Hcompany/Holo-3.1-0.8B"
params = "0.8B"
active_params = "0.8B"
architecture = "Gated DeltaNet + Full Attention + Dense FFN + Qwen3-VL ViT"

layers_total = 24
layers_linear_attention = 18
layers_full_attention = 6
layer_pattern = "3:1 (linear, linear, linear, full)"

# Dense FFN (no MoE) — the small sibling of Holo-3.1-35B-A3B. Same hybrid
# GDN + full-attention trunk + Qwen3-VL ViT, but a plain SwiGLU MLP.
intermediate_size = 3584

hidden_dim = 1024
head_dim = 256
q_heads = 8
kv_heads = 2

linear_attn_key_heads = 16
linear_attn_key_dim = 128
linear_attn_value_heads = 16
linear_attn_value_dim = 128
linear_conv_kernel = 4

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
partial_rotary_factor = 0.25
attn_output_gate = true

mrope_interleaved = true
mrope_section = [11, 11, 10]
mtp_layers = 0
vision = true
image_token_id = 248056

# POC target: keep the default demo footprint small; callers can still pass a
# larger max sequence length after validating memory.
effective_context = 4096

[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[behavior]
thinking_default = true
thinking_in_tools = true
max_thinking_budget = 768
max_inter_tool_prose = 384
max_post_think_content_tokens = 8192
default_num_drafts = 0
tool_call_parser = "qwen3_coder"
# Tool-call grammar OFF: XGrammar tool-constrained decoding degenerates the
# Holo family (see holo-3.1-35b-a3b/MODEL.toml). Matches vLLM.
disable_tool_grammar = true

# Dense Qwen3.5/Holo: model_type stays "qwen3_5" (num_experts == 0). MRoPE is
# present but the qwen3_5 -> qwen3_6_moe rewrite is gated on is_moe, so dense
# checkpoints keep `qwen3_5` and resolve here by hidden_size. MRoPE is applied
# at runtime via the mrope_interleaved / mrope_section flags above.
[[model_types]]
model_type = "qwen3_5"
hidden_size = 1024

[kernel]
moe_gate_shmem_bytes = 4096

# ── Kernel lookups this model may legitimately fail to resolve ──
# Harvested 2026-08-03 from `spark serve --check-kernels`. This target
# runs BF16 weights; every entry below is a quantized-family or
# shadow-only try_kernel() probe whose fallback resolves. EXCEPT the
# four [expected_absent.gated_delta_rule] f16 arms — see honesty note.
[expected_absent.w4a16]
w4a16_gemm_t_p3 = "Deep-K p3 twin shipped only in qwen3.6-27b's shadow; layers::tgemm_kernel falls back to w4a16_gemm_t (resolves: common). Unmeasured for BF16-serving targets."
w4a16_gemm_t_k64_p3 = "Same family; k64_kernel falls back to required w4a16_gemm_t_k64 (resolves)."
w4a16_gemm_t_k64_n64_p3 = "Narrow-N twin; 0-handle gated at dispatch (K64_N64_MAX_WIDE_CTAS)."
w4a16_gemm_t_m128_bf16 = "BF16-projection prefill twin; dispatch gated on handle != 0, falls back to resolved w4a16 m128 path."
w4a16_gemm_t_m128_bf16_v2 = "Pipelined v2 of the above; same gating. Unmeasured."
int8_gemm_faith2 = """
INT8-prefill twin (faith2). Only materialized when finalize_int8_load
finds int8 weights AND the resolved handles — this BF16 checkpoint has
no int8 path; dispatch gated by handle != 0."""
int8_gemm_i32acc = "Same int8 family — BF16 checkpoint never materializes it."
requant_w_nvfp4_int8 = "Int8 weight requant from NVFP4 weights; this checkpoint is BF16, no NVFP4 source weights exist."
requant_a_bf16_int8 = "Same int8 family — activation requant; gated by the same weight-presence condition."

[expected_absent.w4a4]
w4a4_gemm = "NVFP4 W4A4 GEMM; BF16 checkpoint has no NVFP4 weights. Fallback resolves through w4a16."
w4a4_gemm_mfast = "mfast twin shipped only in nemotron-labs-3-puzzle's shadow; same NVFP4-weight gating applies here."

[expected_absent.q4k_mmq]
atlas_q4k_mmq128_nc = """
Q4_K FFN MMQ family — finalize_q4k_load requires ALL handles non-zero
AND ATLAS_FFN_MMQ presence, then requantizes NVFP4 weights to Q4_K.
This BF16-target's KERNEL set does not ship the module; gate fails on
handle == 0 and stays on the resolved bf16/dense path."""
atlas_q4k_mmq128_wc = "Same Q4_K family — gated off for this target (see atlas_q4k_mmq128_nc)."
atlas_q8_1_quantize_ds4_bf16 = "Same Q4_K family — activation quantizer; gated off."

[expected_absent.q4k_quantize]
q4k_quantize = "Q4_K weight quantizer for the MMQ family; gated off with the family (see q4k_mmq::atlas_q4k_mmq128_nc)."

[expected_absent.nvfp4_mmq]
atlas_nvfp4_mmq128_nc = """
NVFP4 MMQ FFN family. finalize_nvfp4_mmq_load requantizes NVFP4 weights;
this target runs BF16 so the family is never materialized, and the
KERNEL set ships no nvfp4_mmq module. Probe is gated by handle != 0."""
atlas_nvfp4_mmq128_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq16_nc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq16_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq32_nc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq32_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq64_nc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_mmq64_wc = "Same NVFP4 MMQ family — gated off for BF16 target."
atlas_nvfp4_quantize_bf16 = "NVFP4 activation quantizer; gated off with the family."
atlas_nvfp4_repack = "NVFP4 weight repacker; gated off with the family."
atlas_nvfp4_silu_mul_scaled = "NVFP4 SiLU epilogue; gated off with the family."
atlas_nvfp4_silu_mul_quant = "NVFP4 SiLU epilogue (quantized); gated off with the family."
atlas_nvfp4_scale_bf16 = "NVFP4 scale handler; gated off with the family."

[expected_absent.gated_delta_rule_wy17]
gated_delta_rule_wy17 = "wy17 fused decode (K=17) exists only in qwen3.6-35b-a3b's module set; decode_batched checks non-NULL before dispatch (per init.rs)."

# ⚠ HONESTY NOTE on the four gated_delta_rule f16 arms: the FP16-h-state
# decode arms dispatch these handles UN-PROBED once --ssm-h-dtype f16 is
# active. Preflight refuses f16 for bad env combos but NOT for a target
# that lacks the twins, so setting the flag on this model is a 0-handle
# launch, not a fallback. Declared here to unblock the gate; the correct
# fix is a preflight check on kernel presence. UNMEASURED.
[expected_absent.gated_delta_rule]
gated_delta_rule_decode_f16_norm = "FP16 h-state twin; see honesty note above. F32 fused-norm arm resolves."
gated_delta_rule_decode_f16_strided_norm_half = "FP16 h-state twin; see honesty note above. F32 strided-norm arm resolves."
gated_delta_rule_decode_f32_strided_norm_half = "Half-register twin; selected only under ATLAS_GDN_HALF_REG presence (off as shipped)."
gated_delta_rule_decode_f32_strided_norm_smem = "SMEM-staged twin; gated behind ATLAS_GDN_SMEM_STAGE (off as shipped) AND the half-register gate."
