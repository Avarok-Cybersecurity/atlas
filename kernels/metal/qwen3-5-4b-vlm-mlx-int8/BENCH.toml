# SPDX-License-Identifier: AGPL-3.0-only
#
# THE METAL BENCHMARK SET: DECLARED, EMPTY, AND UNABLE TO READ GREEN.
#
# The owner's requirement is that editing an Apple Metal kernel make a set of
# benchmarks REQUIRED, added gradually, and left open for now. "Open" has a
# precise meaning here that "absent" does not: an absent set is indistinguishable
# from a set nobody has thought about, and a zero-entry set that reports
# "0 of 0 passed" is the exact shape of a check that cannot fail.
#
# So the entries below exist, name what will be measured, and carry
# `status = "unmeasured"` with NO [benchmarks.metrics] table. That is not a
# convention — it is enforced by code that already exists:
#
#   * gate/bench.rs BAILS on an unmeasured entry that carries thresholds
#     ("A guessed number a run can clear is worse than no number — it reports
#     PASS for something nobody measured").
#   * gate/bench.rs DROPS unmeasured entries from the baseline, so resolve()
#     fails loudly with "no baseline" instead of passing with empty bounds.
#   * bench_certify/mod.rs BAILS for a hardware class that declares no
#     [benchmarks.limits], naming the missing thermal envelope and memory floor.
#     kernels/metal/HARDWARE.toml deliberately declares none, and
#     hardware/limits.rs already PINS that absence in a test.
#
# Three independent refusals, none of which can be satisfied by accident. The
# closing sequence, when someone wants this gate to actually gate: measure the
# thermal envelope on the 48 GiB box -> declare [benchmarks.limits] -> register
# a driver -> list the id in coverage::PROMOTION_CANDIDATES -> make it required.
#
# Do NOT add a metrics table, a limits block, or a promotion-candidate row to
# make CI quieter. Each of those converts a deliberately open gate into a number
# nobody measured.

[[benchmarks]]
id = "metal-decode-floor"
status = "unmeasured"
what = "single-stream decode tok/s on the MLX-int8 4B VLM, the model this target serves"

[[benchmarks]]
id = "metal-mlx-parity"
status = "unmeasured"
what = "teacher-forced logit BYTES against mlx_lm on a pinned checkpoint — the byte-identical bar"

[[benchmarks]]
id = "metal-kernel-bitparity"
status = "unmeasured"
what = "per-kernel raw-buffer memcmp against MLX where MLX has a counterpart; fp32 CPU reference plus registered mutations where it does not"
