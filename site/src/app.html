<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('avarok-theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Avarok is an open source, pure Rust and CUDA LLM inference engine hand tuned for NVIDIA DGX Spark. What ships is what we verify." />
    <!-- Must equal --bg in web-shared/avarok-tokens.css. A meta tag cannot read a
         custom property, so this is the one unavoidable copy of the ground colour;
         theme-color.test.js fails the build if the two drift. -->
    <meta name="theme-color" content="#0F1216" />
    <meta name="theme-color" content="#0F1216" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <!-- Explicit rather than inherited: several engines treat a missing robots
         directive as a reason to clip snippets and thumbnails. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Icons. The SVG wins wherever it is supported; the .ico covers legacy
         Windows surfaces (pinned sites, jump lists) that ignore SVG entirely;
         the PNGs are the explicit sizes Safari and older Chrome pick from.
         apple-touch-icon is the LIGHT-ground cut on purpose: iOS composites
         transparency onto black, which would swallow the mark. -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Avarok" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Avarok, one inference engine from handheld to datacenter" />
    <meta property="og:description" content="Open source, pure Rust + CUDA. One engine from edge accelerators to datacenter racks. Verified on DGX Spark (GB10) and running on AMD Strix Halo. Submitted to MLPerf Inference v6.1. Every number is a receipt." />
    <meta property="og:site_name" content="Avarok Inference" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://atlascybernetics.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avarok, pure Rust inference from the device in your hand to the datacenter rack" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AtlasInferenceX" />
    <meta name="twitter:creator" content="@AtlasInferenceX" />
    <meta name="twitter:title" content="Avarok, one inference engine from handheld to datacenter" />
    <meta name="twitter:description" content="Open source, pure Rust + CUDA. Verified on DGX Spark. Every number is a receipt." />
    <meta name="twitter:image" content="https://atlascybernetics.ai/og-image.png" />
    <meta name="twitter:image:alt" content="Avarok, pure Rust inference from the device in your hand to the datacenter rack" />

    <!-- The plain-text brief answer engines read. Generated from the same
         sources as the page by scripts/gen-llms.mjs. -->
    <link rel="alternate" type="text/plain" href="%sveltekit.assets%/llms.txt" title="llms.txt" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
