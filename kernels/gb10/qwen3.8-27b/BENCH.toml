min = 35.0
noise = 1.5

[benchmarks.metrics.c8_aggregate_tok_s]
# mean 67.6, sigma 1.0: the ~5% arm (3.4) beats 3*sigma (3.0); 63.0.
min = 52.0
noise = 1.5

[benchmarks.metrics.c16_aggregate_tok_s]
# mean 98.9, sigma 0.4: the ~5% arm (4.9) governs; 94.0.
min = 73.5
noise = 1.5

[benchmarks.metrics.peak_aggregate_tok_s]
# The peak rung IS C=16 on this ladder, so the same floor: a sweep whose
# peak fell below the C=16 bar has lost its top rung whichever C it came
# from.
min = 73.5
noise = 1.5

[benchmarks.metrics.min_completion_tokens]
# The vacuity guarantee, restated where the gate can see it. The original
# calibration (fixture minimum 334 > 320, every request budget-capped) was
# measured on a tree where MTP speculated inside <think>; with the
# serial-in-think fix (2c80bf2f7) token trajectories shifted and the
# fixture's minimum deterministic completion is 296 (natural EOS, temp 0).
