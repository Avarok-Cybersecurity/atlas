name: "CLA Assistant"

# Keyed on the PR: `issue_comment` and `pull_request_target` both fire for the
# same pull request but carry different `github.ref` shapes, so grouping on the
# ref alone would let the two trigger types queue against each other.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

on:
  issue_comment:
    types: [created]
  # `pull_request_target` runs with repository secrets against a fork's PR, so
  # it is only safe while NOTHING here consumes the fork's code or its
  # attacker-controlled text. Two properties keep that true, and both must
  # survive any future edit to this file:
  #
  #   1. There is NO `actions/checkout`. The job never materialises head-ref
  #      code, so a fork cannot supply a script, a build file, or an action
  #      that this workflow would then execute.
  #   2. No step interpolates `github.event.*` free text (comment bodies, PR
  #      titles/branches) into a `run:` block or an action input. Signature
  #      matching is done entirely inside the pinned action, against the
  #      comment AUTHOR's committer id — see the note on the step below.
  #
  # Adding a checkout of `github.event.pull_request.head.sha`, or piping a
  # comment body into a shell, converts this into a pwn-request: arbitrary
  # fork-controlled input executing with the write scopes declared below.
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    # `issue_comment` fires for plain issues too, where the action's
    # `pulls.get(issue.number)` 404s and reds the job for no reason. Gate on
    # the `pull_request` key that only PR-backed issues carry.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    # Scoped to what contributor-assistant actually calls (verified against the
    # action source at the pinned sha):
    #   contents      — git refs/commits that persist signatures/version1/cla.json
    #   pull-requests — pulls.get for the PR's head branch
    #   issues        — listComments / createComment / updateComment / lock
    #   actions       — reRunWorkflow, to turn the failed CLA check green once
    #                   a contributor signs by comment (upstream issue #39)
    # `statuses: write` was declared but is never used — the action sets no
    # commit status — so it is dropped.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Maintainer-controlled identities are allowlisted: they own the copyright
          # and have already signed, so gating their own (AI-generated) PRs adds only
          # friction. External first-time contributors are still asked to sign.
          allowlist: dependabot[bot],renovate[bot],google-labs-jules[bot],claude[bot],google-labs-jules,claude,AzeezIsh,tbraun96
          lock-pullrequest-aftermerge: false
          create-file-commit-message: 'chore: setup CLA signatures file'
          signed-commit-message: 'chore: $contributorName signed the CLA in PR #$pullRequestNo'
          custom-notsigned-prcomment: |
            Thanks for the contribution. Before we can merge, please sign our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md) by replying to this comment with:

            `I have read the CLA Document and I hereby sign the CLA`
          # NO `custom-pr-sign-comment`. Setting it switches the action from its
          # built-in CLA regex to EXACT equality against whatever string is
          # supplied, and the step that used to supply it read that string out
          # of the PR's comment history — so any third party who commented the
          # phrase with extra text on someone else's PR redefined the accepted
          # signature, and the real contributor's canonical reply then stopped
          # matching. Leaving the input unset restores the action's default
          # `use-dco-flag: false` regex, which matches the phrase anywhere in a
          # comment and credits it to the COMMENT AUTHOR's committer id only.
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
