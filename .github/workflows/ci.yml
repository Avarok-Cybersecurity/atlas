name: CI

on:
  # Manually runnable. During the 2026-08-06 Actions incident, webhook triggers
  # were throttled to aid recovery, so pushes stopped creating runs at all --
  # and with no dispatch trigger there was no way to ask for one. A check that
  # can only be started by an event you do not control is a check you cannot
  # get a verdict from when you most need it.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
  # Reusable: release.yml gates its (expensive) build matrix on CI passing, so
  # a fmt or clippy failure costs one cheap runner instead of eight toolchain
  # installs. Defined once here; release.yml calls it rather than copying it.
  workflow_call:

# Least privilege: CI only reads the repo. Without an explicit block the
# GITHUB_TOKEN inherits the repository default, which can be write — flagged by
# CodeQL (code-scanning/32) once this workflow gained the release-matrix job.
# The reusable workflows it calls inherit this and declare the same.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Skip CUDA/nvcc in build.rs so clippy/check can run on hosts without a GPU.
  # Emits a stub target_ptx.rs that satisfies the atlas-kernels include.
  ATLAS_SKIP_BUILD: "1"
  # Short-circuit cudarc's nvcc probe (format is {major}0{minor}0; 13000 == CUDA 13.0).
  # Required for `cargo test` on a runner without nvcc.
  CUDARC_CUDA_VERSION: "13000"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy --tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Lint policy lives in the workspace `Cargo.toml` `[workspace.lints]`
      # block (deny `warnings` + `clippy::all`, with a few targeted
      # allows for kernel-style signatures). Each crate inherits via
      # `[lints] workspace = true`, and `lib.rs` / `main.rs` re-add the
      # same denies as inner attributes so they apply even when the
      # workspace lints table isn't honoured (e.g. older tooling).
      - run: cargo clippy --workspace --tests

  license-headers:
    name: SPDX license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Was `apache/skywalking-eyes/header`. That action is a composite that
      # internally uses an UNPINNED `actions/setup-go@v5`, and this repo sets
      # `sha_pinning_required`, which applies transitively — so it cannot run
      # here however carefully we pin the action itself. Checking a header is a
      # grep; it does not justify a third-party action and a Go toolchain in CI.
      # `.licenserc.yaml` is still the only place the paths and ignores live.
      - run: pip install --quiet pyyaml
      - run: python3 scripts/check_spdx.py

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: crate-ci/typos@2a44449ff3410624a0fa2ea073c670e1c9236a40 # master

  kernel-structure:
    name: kernel shadow structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Validates the kernels/{hw} shadowing mechanism (build.rs
      # collect_cu_files): no shadow byte-identical to its common
      # namesake (dead override), no duplicate regular copies of the
      # same shadow across models (symlink to one canonical file
      # instead). GPU-free: pure content-hash check, exit 1 on any
      # violation. Stdlib-only; the runner's system python3 suffices.
      - run: python3 scripts/check_kernel_shadows.py

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate no-GPU library stubs
        # libcuda / libnccl / libcublasLt / libcudart fail-fast stubs, so the
        # workspace links on a runner with no GPU. Extracted to a script so the
        # test job and the benchmark-gate job cannot drift apart.
        run: bash scripts/ci_gpu_stubs.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Default `cargo test` skips `#[ignore]`-gated tests, which is
      # exactly what we want — every test that requires a real GPU
      # (spark-runtime, spark-storage, atlas-kernels, atlas-spark-bench
      # correctness, spark-server integration) carries `#[ignore]` and
      # is run locally on GB10 hardware via `-- --ignored`.
      - run: cargo test --workspace --locked

  test-macos-metal:
    name: cargo test --features metal (macOS aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Apple Silicon path: no CUDA toolchain, no nvcc. The `metal`
      # feature opts out of cudarc workspace-wide and into the Metal
      # runtime backend (objc2-metal). xcrun + metallib are part of
      # macOS's built-in Xcode Command Line Tools and don't need a
      # separate install on macos-14 runners.
      # `-p spark-server --features metal` activates the metal
      # feature on every transitive workspace crate via spark-server's
      # forwarding feature flags. Single-flag spelling — no long
      # `atlas-core/metal,spark-runtime/metal,...` comma list needed.
      - name: cargo check spark-server --features metal
        run: cargo check -p spark-server --no-default-features --features metal
      # Also check spark-runtime alone so a regression in the metal
      # backend tests can be diagnosed independently of higher layers.
      - name: cargo check spark-runtime --features metal
        run: cargo check -p spark-runtime --no-default-features --features metal
      # Build the metal kernel set + run every metal_backend parity
      # test. The real-model parity tests (`#[ignore]`-gated) require
      # a local copy of mlx-community/Qwen3.5-4B-MLX-8bit and only
      # run on a developer machine; default `cargo test` skips them.
      - name: cargo test -p spark-runtime --features metal
        env:
          ATLAS_TARGET_HW: metal
          ATLAS_TARGET_MODEL: qwen3-5-4b-vlm-mlx-int8
          ATLAS_TARGET_QUANT: mlx_int8
        run: |
          cargo test -p spark-runtime --no-default-features \
            --features metal --locked metal_backend
      # Sanity check: the metal-feature spark-server binary must not
      # link against libcuda. Anything else means a stray
      # `rustc-link-lib=cuda` directive snuck through a build.rs.
      - name: assert no libcuda linkage in metal binary
        run: |
          cargo build -p spark-server --bin spark --no-default-features --features metal
          if otool -L target/debug/spark | grep -i cuda; then
            echo "::error::metal-feature spark binary links libcuda"
            exit 1
          fi
          if otool -L target/debug/spark | grep -i nccl; then
            echo "::error::metal-feature spark binary links libnccl"
            exit 1
          fi

  # cargo-deny runs in security.yml with path filters on Cargo.toml / Cargo.lock /
  # deny.toml plus a weekly cron. Not duplicated here.

  # The release build matrix runs only after every gate above is green, in
  # this same CI run — so a PR's checks table shows base CI then the matrix,
  # and CI is never executed twice for one commit. Guarded to pull_request:
  # release.yml calls this workflow for its own gate, and must not trigger a
  # second matrix build there.
  release-matrix:
    name: release matrix
    if: github.event_name == 'pull_request'
    needs: [fmt, clippy, license-headers, typos, kernel-structure, test, test-macos-metal]
    uses: ./.github/workflows/release-build.yml
    with:
      version: 0.0.0-pr${{ github.event.number }}
      pr_mode: true
      retention_days: 1

  # OBSERVE-ONLY, and structurally incapable of being anything else.
  #
  # This job asks a language model what the pull request is *for*, and records
  # the answer. It does not gate. `pr-benchmark-gate` below neither `needs:`
  # this job nor reads its outputs, so there is no path — not a slow one, not a
  # subtle one — by which this reaches a verdict. That separation is the design,
  # not a rollout stage: the input is attacker-controlled (a PR title is written
  # by whoever opened the PR), and arranging for that text to be UNABLE to
  # affect verification is stronger than hoping a model resists it.
  #
  # What it is for right now is evidence. Before any category is allowed to add
  # verification, the log has to show what it would have said, on real pull
  # requests, including the ones where it abstained.
  pr-categorize:
    name: PR categorize (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # No write scopes. It reports into the job summary, not onto the PR, so a
    # compromised model response has nowhere to go even in principle.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Collect the changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Both values come from the event payload, which GitHub controls, not
          # the branch contents. They still go through env rather than being
          # interpolated into this script.
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          head -c 4000 changed.txt > changed_head.txt
      - name: Read the model id
        id: models
        run: |
          set -euo pipefail
          echo "categorize=$(jq -r '.models.categorize' .github/ai-models.json)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/categorize
        id: cat
        with:
          # The PR title reaches the action through the action's own env, never
          # spliced into a shell here.
          text: |
            ${{ github.event.pull_request.title }}

            Changed files:
            ${{ steps.diff.outputs.count }} paths
          categories: '["numerics","performance","serving","tooling","docs","ci","unknown"]'
          model: ${{ steps.models.outputs.categorize }}
          api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          # The most conservative member of the set. A fork PR has no secret and
          # a free endpoint is sometimes down; neither may read as a confident
          # answer, and "unknown" is the category that claims nothing.
          fallback: unknown
          title: atlas-pr-categorize
      - name: Record what it said
        # Every value crosses into the script through `env:`, even though the
        # action guarantees its outputs are closed-set enums and its own fixed
        # strings — no model-authored text ever reaches them. Interpolating
        # `${{ }}` into a `run:` body is the injection shape this repo warns
        # about in CODEOWNERS, and "it happens to be safe here" is not a habit
        # worth teaching the next person who copies this block.
        env:
          CATEGORY: ${{ steps.cat.outputs.category }}
          STATUS: ${{ steps.cat.outputs.status }}
          REASON: ${{ steps.cat.outputs.reason }}
          CHANGED: ${{ steps.diff.outputs.count }}
        run: |
          set -euo pipefail
          {
            echo "### PR category (advisory — does not gate)"
            echo
            echo "| field | value |"
            echo "|---|---|"
            printf '| category | `%s` |\n' "$CATEGORY"
            printf '| status | `%s` |\n' "$STATUS"
            printf '| reason | %s |\n' "$REASON"
            printf '| changed paths | %s |\n' "$CHANGED"
            echo
            echo "The required gate set is computed from the diff by"
            echo '`gate::coverage`, in Rust, and is not affected by this.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Standalone and NON-BLOCKING by design: it reports whether the branch has
  # passing, committed benchmark records, but `release-matrix` deliberately does
  # NOT wait on it. Bench records can only be produced on a GPU box, so making
  # the image path depend on them would halt releases on a missing record rather
  # than on a real defect.
  pr-benchmark-gate:
    name: PR benchmark gate
    runs-on: ubuntu-latest
    # ENFORCING as of this commit. The `continue-on-error: true` that used to
    # sit here was justified by a bootstrap gap — "no bench record is committed
    # yet, and the PR that introduces the gate cannot commit one". That gap is
    # closed: `.benchmarks/` now carries a BASELINE plus records for all five
    # required gates, so the precondition its own comment named for removal is
    # met, and keeping the line would leave a check that cannot fail.
    #
    # What a red here means: this branch has no record that still COVERS its
    # head. `record_covers` invalidates every earlier record once the diff
    # touches a PERF_PATH (crates, kernels, Cargo.*, vendor, jinja-templates,
    # rust-toolchain.toml) — which is the point. Fix it by measuring on a GPU
    # box and committing the record, not by re-adding continue-on-error.
    #
    # It is deliberately NOT in `release-matrix`'s `needs`, and deliberately
    # not a required status check on `main`: a missing GPU measurement must
    # show as red without wedging the image path or the merge button.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check_gates walks git ancestry to decide whether a record taken at an
          # earlier sha still covers HEAD, so a shallow clone would make every
          # record look uncovered.
          fetch-depth: 0
      - name: Generate no-GPU library stubs
        run: bash scripts/ci_gpu_stubs.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check committed benchmark records against their baselines
        env:
          ATLAS_SKIP_BUILD: "1"
          CUDARC_CUDA_VERSION: "13000"
        run: cargo run --locked -p spark-server --bin spark -- benchmark --pull-request-gate-check
