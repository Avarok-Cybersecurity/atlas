[package]
name = "spark-runtime"
version = "1.0.0-beta-preview"
edition = "2024"
license.workspace = true
description = "Atlas Spark runtime — GPU backend, weight loading, KV cache, scheduler"
autobenches = false

[features]
default = ["cuda"]
# ★ NO-OP ALIASES. The backend is selected by TARGET (see the two
# [target.'cfg(...)'] tables at the end of this file), not by a feature. These
# stay because ~40 live call sites pass `--features metal` -- six CI steps,
# docs/METAL_BACKEND.md, three [[example]] required-features blocks -- and
# deleting them breaks all of those for no correctness gain. They must select
# nothing: a `dep:` here would put cudarc back in a macOS graph.
cuda = ["avarok-core/cuda"]
metal = ["avarok-core/metal"]
test-utils = []

[[bin]]
name = "bench_fast_weights"
path = "benches/bench_fast_weights.rs"
required-features = ["test-utils"]

# Standalone smoke binary for the metal backend. Loads layer 3 of
# `mlx-community/Qwen3.5-4B-MLX-8bit` from `~/models/...` (override
# via `$AVAROK_MLX_MODEL_DIR`) and runs a single full-attention
# block forward pass. Prints output statistics so users can verify
# their Apple Silicon build runs real kernels on real weights.
[[example]]
name = "metal_layer3_attention"
path = "examples/metal_layer3_attention.rs"
required-features = ["metal"]

# Parallel demo for the ViT vision tower: loads
# `vision_tower.blocks.0` (real BF16 weights, no MLX quantization)
# and runs a single non-causal attention + GeLU MLP block forward.
[[example]]
name = "metal_vision_block_forward"
path = "examples/metal_vision_block_forward.rs"
required-features = ["metal"]

# Throughput benchmark for the metal backend: runs the layer-3
# attention block N times and reports min / p50 / p99 / mean
# latency + decode-equivalent tokens/sec. Useful for regression
# tracking and for users to confirm their hardware matches the
# expected envelope (~10 ms/forward on M2, scaling with bandwidth).
[[example]]
name = "metal_layer3_bench"
path = "examples/metal_layer3_bench.rs"
required-features = ["metal"]

# Note: the end-to-end Qwen3.5-4B-MLX-8bit inference demo lives in
# `crates/spark-model/examples/metal_qwen35_inference/` because the
# per-layer forward path it drives lives in `spark_model::forward`,
# and `spark-runtime` cannot depend on `spark-model` (`spark-model`
# already depends on `spark-runtime`). Run it via:
#   cargo run --release --no-default-features --features metal \
#       -p spark-model --example metal_qwen35_inference

# Integration test gated by `test-utils` because it depends on the
# `gpu::mock` module, which is itself `cfg(any(test, feature = "test-utils"))`.
# Without this gate, default `cargo test --workspace` would attempt to compile
# this test against the lib (no cfg(test)), fail to find `gpu::mock`, and
# block CI. With the gate, `cargo test --workspace` cleanly skips it; run it
# explicitly via `cargo test -p spark-runtime --features test-utils`.
[[test]]
name = "fast_weights_parity"
path = "tests/fast_weights_parity.rs"
required-features = ["test-utils"]

[dependencies]
avarok-core = { workspace = true }
avarok-kernels = { workspace = true }


# Apple Metal backend deps. Activated only by `--features metal`.



# `MTLDevice::newLibraryWithData_error` takes a `DispatchData` (libdispatch
# byte container), not an `NSData`. dispatch2 ships the wrapper.

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = "0.8"
memmap2 = "0.9"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "parking_lot"] }
rand = "0.8"
half = "2"
parking_lot = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# HARDWARE.toml is the SSOT for the SM architecture the optional CUTLASS /
# FlashInfer reference objects compile for; build.rs reads it.
[build-dependencies]
toml = "0.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

# ── Target-conditional backends ───────────────────────────────────────────
# Cargo cannot make a FEATURE target-conditional, but it can make a
# DEPENDENCY target-conditional -- and that is the half that matters. The
# `metal` and `cuda` features remain as no-op aliases so the ~40 call sites
# that pass `--features metal` keep working; what selects a backend is the
# target, via build_backend::resolve and these two tables.
#
# Precedent in tree: spark-storage/Cargo.toml already carries a
# [target.'cfg(target_os = "linux")'.dependencies] table.
#
# `optional` is deliberately dropped: a target table is already conditional,
# and leaving these optional would keep them behind a feature nothing passes.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6" }
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLBuffer",
    "MTLResource",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBlitCommandEncoder",
    "MTLEvent",
    "block2",
] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSString",
    "NSError",
] }
dispatch2 = { version = "0.3" }

# cudarc's build script shells out to `nvcc --version` and PANICS when it is
# absent, so on macOS it cannot merely be unused -- it must not be in the
# graph at all. Measured on the M4 Pro, 2026-09-18: a plain `cargo build`
# failed here with `No such file or directory`.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cudarc = { workspace = true }
