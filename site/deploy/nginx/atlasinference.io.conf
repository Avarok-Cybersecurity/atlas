# Atlas marketing site — atlasinference.io
#
# SSOT for the origin vhost, alongside blog/deploy/nginx/ and book/deploy/nginx/.
# Served by pm2 on :3040 from the tree the Site workflow rsyncs.

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name atlasinference.io www.atlasinference.io;

    # ACME challenge for SSL certificates
    location /.well-known/acme-challenge/ {
        root /opt/www/well_known;
        try_files $uri =404;
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    server_name atlasinference.io www.atlasinference.io;

    # HTTP/2 and HTTP/3 support
    http2 on;
    http3 on;
    # One header set for the whole vhost, at server level.
    #
    # nginx's `add_header` does not accumulate across contexts: a location that
    # declares ANY add_header discards every one inherited from the server
    # block. These three lived inside `location /`, which had two consequences
    # measured on the live origin before this change:
    #
    #   * the Alt-Svc below was discarded on every proxied response, so the
    #     HTTP/3 advertisement never reached a visitor;
    #   * `location ~ /\.` declares none of its own and inherited none, so the
    #     dotfile refusal went out with no security headers at all.
    #
    # Referrer-Policy was also simply missing, which is what prompted this: the
    # blog and docs vhosts both send it and this one did not.
    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSL certificates (iRedMail self-signed; Cloudflare "Full" mode accepts this)
    ssl_certificate /etc/ssl/certs/iRedMail.crt;
    ssl_certificate_key /etc/ssl/private/iRedMail.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 10m;

    # Cloudflare IP configuration
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Canonicalize www -> apex
    if ($host = www.atlasinference.io) {
        return 301 https://atlasinference.io$request_uri;
    }

    # Proxy to pm2-served static site on :3040
    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
