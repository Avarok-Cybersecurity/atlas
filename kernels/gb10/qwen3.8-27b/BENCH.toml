# arithmetic. It was calibrated against the natural fixture's ~296-token
# deterministic completion; the essay fixture's own minimum has not been
# measured on this gate. The published raw files' observed minima on this
# instrument are 691 (C=128) and 753 (C=64), so 260 passes everything ever
# seen while still failing a degenerate early-EOS collapse. Re-cut it with
# the nine rung floors from the same first records, not before: 0.8 x 1024 =
# 819 is the number arithmetic would suggest, and declaring it now would be
# a bootstrap.
min = 650.0

