# copy stream, every other sequence keeps its decode ticks, and the request
# re-enters the front of the pending queue at the top of the tick after the copy
# finished, then admits as an HBM prefix hit. A failed, stuck (10 s) or
# past-deadline restore admits the request for recompute; a client that
# disconnects while parked is dropped and its restore finishes in the
# background; a request is parked at most once. It only reorders when a request
# is admitted, so outputs are unchanged. OFF until the receipt on this card:
# reuse.py mixed (4 decoding streams plus one 12K-token restore) with decode p99
