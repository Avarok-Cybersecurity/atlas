name: Site

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.benchmarks/**'
      - '.github/workflows/site.yml'
  # No path filter on pull_request: this check joins the required set, and a
  # path-filtered required check never reports on PRs outside its paths,
  # leaving them permanently "expected" and unmergeable.
  pull_request:
    branches: [main, master]
  # Merge queue: queue commits fire none of the events above, and this check
  # is required — without this trigger the entry hangs until timeout.
  # Unfiltered for the same reason as pull_request. The deploy job stays
  # push/schedule-only by its own `if`.
  merge_group:
  # Daily rebuild so the dashboard picks up gate records that landed on
  # branches whose PRs have not merged yet (gen-gates.mjs walks all heads).
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Site unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `src/lib` only: the e2e specs under `e2e/` need a browser and a served
      # build, and are a separate concern from these.
      - name: Run unit tests
        run: bun test src/lib

  build:
    name: Build SvelteKit site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Checkout atlas-recipes (model SSOT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Avarok-Cybersecurity/atlas-recipes
          path: atlas-recipes-src

      # install.sh is versioned alongside the binaries it installs, in
      # atlas-recipes, and copied in here rather than duplicated. It embeds no
      # version — it always resolves releases/latest — so a cached copy stays
      # correct even when it predates the release it installs. Failing the build
      # is right: serving a 404 for the headline command on the front page would
      # be worse than a red pipeline.
      - name: Copy the installer from atlas-recipes
        run: |
          src="${{ github.workspace }}/atlas-recipes-src/scripts/install.sh"
          if [ ! -f "$src" ]; then
            echo "::error::scripts/install.sh is not on atlas-recipes main yet."
            echo "The front page's install command is served from that file, so building"
            echo "without it would ship a 404 for the headline instruction. Merge the"
            echo "atlasctl launcher PR in Avarok-Cybersecurity/atlas-recipes first, then"
            echo "re-run this build."
            exit 1
          fi
          cp "$src" static/install.sh
          chmod 0755 static/install.sh

      - name: Build
        run: bun x --bun vite build
        env:
          ATLAS_RECIPES_ROOT: ${{ github.workspace }}/atlas-recipes-src/recipes
          ATLAS_BASELINES_ROOT: ${{ github.workspace }}/tests/baselines
          GH_TOKEN: ${{ github.token }}

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketing-site
          path: site/build
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to avarok via rsync
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production-site
      url: https://atlasinference.io/
    steps:
      - name: Check deploy secret presence
        # Skip deploy entirely when DEPLOY_SSH_PRIVATE_KEY isn't
        # configured on the `production-site` environment. The job
        # still exits success — the marketing-site artifact uploaded
        # by the build job remains downloadable for inspection.
        id: secret_check
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_SSH_PRIVATE_KEY not set on production-site environment — skipping rsync deploy. Configure the environment secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site artifact
        if: steps.secret_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marketing-site
          path: site

      - name: Install rsync
        if: steps.secret_check.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync openssh-client

      - name: Load SSH key
        if: steps.secret_check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Pin host key
        if: steps.secret_check.outputs.configured == 'true'
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        if: steps.secret_check.outputs.configured == 'true'
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PATH:     ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -p ${PORT}" \
            site/ "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:${DEPLOY_PATH}/"
