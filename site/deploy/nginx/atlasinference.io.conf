# Legacy hostname. The marketing site and developer page live on
# atlascybernetics.ai; /engine is https://atlascybernetics.ai/engine.
#
# Cloudflare Pages currently still serves atlasinference.io as a custom
# domain on the same project (200, duplicate content). A zone-level
# Redirect Rule only fires once that host is detached from Pages — same
# trap as www. See site/deploy/cloudflare/README.md. This vhost covers
# the origin standby.

# HTTP
server {
    listen 80;
    listen [::]:80;
    server_name atlasinference.io www.atlasinference.io;

    location /.well-known/acme-challenge/ {
        root /opt/www/well_known;
        try_files $uri =404;
    }

    location / {
        return 301 https://atlascybernetics.ai$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    server_name atlasinference.io www.atlasinference.io;

    http2 on;
    http3 on;

    ssl_certificate /etc/ssl/certs/iRedMail.crt;
    ssl_certificate_key /etc/ssl/private/iRedMail.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://atlascybernetics.ai$request_uri;
}
