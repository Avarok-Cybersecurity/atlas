[hardware]
name = "gb10"
vendor = "nvidia"
arch = "sm_121f"
compute_capability = "12.1"
# Streaming multiprocessors — the GB10 value that `atlas_core::device::sm121`
# has always carried, stated here so grid-sizing rules can read it from the
# TARGET instead of from a constant named after one card. Declaring it changes
# nothing on GB10; `atlas_core::device::sm121::NUM_SMS` stays for the gb10
# callers that are genuinely about this part.
sm_count = 48
memory_bandwidth_gbps = 273
memory_type = "LPDDR5X"
memory_gb = 120

# ── Serving defaults for this target ───────────────────────────────────────
#
# SSOT for the per-target serving levers, baked into `atlas_kernels` by
# build.rs (`build_defaults.rs`) as `atlas_kernels::TARGET_DEFAULTS` and read
# by every resolver in spark-model BEFORE the environment.
#
# WHY IT IS HERE. Maintainer review, 2026-09-11 (tbraun96): "There is no arch
# separation at all. H100 builds compile GB10's kernel tree. Every Hopper/GB10
# divergence is expressed as an env lever set by an H100 recipe living outside
# this repo — not as arch-selected code. 'No interference' rests on discipline
# rather than structure." A default that lives in a launch script is not a
# property of the target; one that lives beside the target's arch and memory
# facts is. The environment stays available as an EXPLICIT operator override,
# and the serve log says which values came from it.
#
# EVERY target with a `[defaults]` table declares EVERY row, even where the
# value agrees with the baseline: an absent key falls through to
# `build_defaults::baseline`, which is correct behaviour and terrible
# documentation — a reader of this file would have to know the baseline to
# know what this target serves with, which is the "recipe lives somewhere
# else" problem the table replaces.
#
# GB10's values are TODAY'S HARDCODED DEFAULTS, unchanged, and
# `crates/atlas-kernels/tests/target_defaults.rs` asserts exactly that by
# equality against `build_defaults::baseline`: a GB10 serve with no
# environment set behaves as it did before this table existed.
[defaults]
# The BF16 decode head's batched-GEMV band
# (`model/trait_impl/lm_head_batched.rs`). 8 is the FROZEN band: the A/B
# behind it measured the batched GEMV NEGATIVE above 8 on GB10 (-14.4% at
# C=16, commits 84d5b763c / 78d276832), and the band's upper edge decides
# whether a width lands on the GEMV or on a REASSOCIATING tile GEMM — i.e.
# which bits a decode of that width produces. See `layers/ops/gemm_quant.rs`.
lm_head_batchm_max = 8
# One strided recurrent launch per batch on the GDN decode path. No GB10
# receipt; unchanged from main.
ssm_batched_recurrent = false
# Split SiLU+down on the decode path — shipped ON everywhere.
decode_split_silu = true
# `w8a16_gemm_m16` on the dense-FFN decode arm (#927). OFF: the kernel is not
# in this target's tree at all (`kernels/hopper/HARDWARE.toml [kernels]
# overrides`), so the handle resolves to 0 and the arm declines anyway.
# Declared explicitly so this file answers what GB10 serves with on its own.
ffn_m16_tc = false
# `w8a16_gemm_m16{,_strided}` on the decode Q/K/V and o_proj (#927). OFF: no
# GB10 receipt, and the kernel is not in this target's tree.
attn_m16_tc = false
