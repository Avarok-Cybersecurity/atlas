[book]
title = "The Atlas Book"
authors = ["Atlas Contributors"]
description = "A comprehensive guide to Atlas — pure-Rust LLM inference for hyperoptimized (Hardware, Model, Quantization) kernel targets."
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "output"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/"
git-repository-url = "https://github.com/Avarok-Cybersecurity/atlas"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/Avarok-Cybersecurity/atlas/edit/main/book/{path}"
no-section-label = false
# Tokens first, then the skin that consumes them. atlas-tokens.css is a symlink
# to web-shared/atlas-tokens.css — the same file the site and blog import, so
# the three properties cannot drift. mdBook reads through the link and copies
# the CONTENT into the output.
additional-css = ["theme/css/atlas-tokens.css", "theme/css/atlas.css"]
# Atlas uses system font stacks (--font-sans / --font-mono), so mdBook's
# bundled Open Sans and Source Code Pro are ~100 KB of unused payload.
copy-fonts = false

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.redirect]
"/api.html" = "/api/"
"/api/index.html" = "/api/"
