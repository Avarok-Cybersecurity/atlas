[hardware]
name = "b200"
vendor = "nvidia"
# B200 / GB200 SXM — SM 10.0 (datacenter Blackwell). `sm_100a` exposes
# tcgen05 / TMA / native NVFP4 (cvt e2m1x2, mma kind::mxf4nvf4); the shared
# gb10-derived kernels compile as plain sm_100 code today. Arch-specific PTX
# is NOT forward-compatible: B300 / GB300 are SM 10.3 (`sm_103a`) and need
# their own target. Consumer/GB10 Blackwell (sm_120/sm_121) lacks tcgen05.
arch = "sm_100a"
compute_capability = "10.0"
# Streaming multiprocessors. B200 SXM is GB100 with 148 SMs enabled.
# Cross-checked at boot against the driver's own count, as on every target.
sm_count = 148
# B200 SXM 180 GB HBM3e: ~8000 GB/s. Documentation + roofline input only;
# the runtime reads real free memory via cuMemGetInfo.
memory_bandwidth_gbps = 8000
memory_type = "HBM3e"
memory_gb = 180

# Flags added to EVERY kernel compiled for this hardware, under
# common/KERNEL.toml's and the model's (build_flags::merge_extra_flags).
#
# AVAROK_NO_WARP_BLOCKSCALE_MMA compiles out the W4A4 path in
# qwen3.6-35b-a3b/nvfp4/moe_w4a16_grouped_gemm.cu. Datacentre Blackwell DOES
# have NVFP4, but issues block-scaled MMA through tcgen05; the warp-level
# `mma.sync ... .kind::mxf4nvf4.block_scale` is a consumer/GB10 Blackwell
# (sm_120/sm_121) instruction — ptxas: "Instruction 'mma with block scale'
# not supported on .target 'sm_100a'" (measured 2026-09-05, CUDA 13.0.88;
# reproduce with `scripts/hopper_ptx_gate.sh --hw b200 --model
# qwen3.6-35b-a3b --strict` after dropping this flag — see #899).
# A tcgen05 rewrite of that kernel would lift this; nothing here does that.
#
# A hardware-level define, not a per-model one, because it is a fact about
# the ISA and because every KERNEL.toml under this tree is a symlink into
# kernels/gb10 — saying it per model would fork a shared file once per
# model, which tests/inherited_targets.rs forbids.
[build]
extra_nvcc_flags = ["-DAVAROK_NO_WARP_BLOCKSCALE_MMA"]

# ── Serving defaults for this target ───────────────────────────────────────
#
# SSOT for the per-target serving levers, baked into `avarok_kernels` by
# build.rs (`build_defaults.rs`) as `avarok_kernels::TARGET_DEFAULTS` and read
# by every resolver in spark-model BEFORE the environment.
#
# WHY IT IS HERE. Maintainer review, 2026-09-11 (tbraun96): "There is no arch
# separation at all. H100 builds compile GB10's kernel tree. Every Hopper/GB10
# divergence is expressed as an env lever set by an H100 recipe living outside
# this repo — not as arch-selected code. 'No interference' rests on discipline
# rather than structure." A default that lives in a launch script is not a
# property of the target; one that lives beside the target's arch and memory
# facts is. The environment stays available as an EXPLICIT operator override,
# and the serve log says which values came from it.
#
# EVERY target with a `[defaults]` table declares EVERY row, even where the
# value agrees with the baseline: an absent key falls through to
# `build_defaults::baseline`, which is correct behaviour and terrible
# documentation — a reader of this file would have to know the baseline to
# know what this target serves with, which is the "recipe lives somewhere
# else" problem the table replaces.
#
# B200 has NO serving receipt of any kind, so it declares the conservative
# table and NOT Hopper's. Copying a recipe across because both cards are
# datacentre parts is exactly the reasoning this mechanism replaces.
[defaults]
# The BF16 decode head's batched-GEMV band — the frozen 8, for want of a B200
# A/B.
lm_head_batchm_max = 8
# One strided recurrent launch per batch on the GDN decode path. Hopper
# declares this ON on a Hopper receipt; B200 has none, so it stays off.
ssm_batched_recurrent = false
# The tensor-core GDN chunked-PREFILL spine (#928). OFF, and INERT: the kernel
# is Hopper's (`kernels/hopper/common/gated_delta_rule_chunk_tc.cu`) and B200's
# build does not compile it. Declared because the lever list is one list. B200
# has no serving receipt of any kind, so it does not inherit a Hopper recipe by
# resemblance.
gdn_prefill_tc = false
ssm_ba_gates_hopper = false
# The Hopper FP8 activation-quant twin (#928, round 16). OFF for want of a
# receipt, like every other row here — B200 must not inherit a Hopper recipe by
# resemblance. The source is Hopper-owned and is NOT symlinked into this tree,
# so the row is inert exactly as `gdn_decode_hopper` is. The twin's width floor
# is `2 * sm_count` CTAs, which on 148 SMs would be a different threshold than
# the one that was measured. See `kernels/hopper/HARDWARE.toml`.
fp8_act_quant_hopper = false
# Split SiLU+down on the decode path — shipped ON everywhere.
decode_split_silu = true
# Paged-decode attention split-K (#928). `legacy` — the pre-#928 rule — for
# want of a receipt, like every other row here. B200's 148 SMs would make
# Hopper's `auto` land on 13 splits by the same formula, which is an ARGUMENT;
# the split-K twins are not symlinked into this tree, so `auto` here would
# resolve the gb10 FP8 pair and no BF16 pair at all.
attn_decode_splitk = "legacy"
# `w8a16_gemm_m16` on the dense-FFN decode arm (#927). OFF: no B200 receipt,
# and this target does not carry the kernel. A Hopper row is not inherited by
# resemblance (`tests/target_defaults.rs`).
ffn_m16_tc = false
# `w8a16_gemm_m16{,_strided}` on the decode Q/K/V and o_proj (#927). OFF: no
# B200 receipt. Hopper measures +5.3% here, and a Hopper row is not inherited
# by resemblance (`tests/target_defaults.rs`).
attn_m16_tc = false
# `dense_gemm_m16_bf16` on the BF16 decode head (#927). OFF: no B200 receipt,
# and this target does not carry the kernel.
lm_head_m16_tc = false
# `w8a16_gemv_batch16_ncol{2,4}` on the decode attention projections (#927).
# OFF: no receipt, and the kernel is not in this target's tree.
attn_ncol_gemv = false

# ── Kernels this target does NOT reach ────────────────────────────────────
#
# No `[kernels] overrides`, deliberately. `kernels/hopper/common` holds three
# sources that are not in `kernels/gb10/common` at all — `w8a16_gemm_m16.cu`,
# `dense_gemm_m16_bf16.cu`, `w8a16_gemv_ncol.cu` (#927) — and B200 does not
# reach them. They are ordinary datacentre MMA that this architecture could
# compile, but each is reached only under a serving lever that an A/B has to
# turn on, and B200 has no such receipt: linking them in would compile three
# kernels nothing on this target can launch, and would add three cross-hardware
# symlinks that `scripts/check_cross_hardware.py` rule S1 refuses outright.
#
# The day a B200 receipt exists, the fix is a `[kernels] overrides` list here
# plus the mirror entries, in the same change as the measurement.
# The fused dense-FFN gate+up decode GEMM (#927). OFF for want of a receipt,
# like every other row here — B200 must not inherit a Hopper recipe by
# resemblance. The arm's strided-SiLU consumer is Hopper-owned and is NOT
# symlinked into this tree, so the row is inert here. See
# `kernels/hopper/HARDWARE.toml`.
ffn_gateup_fused = false
# Load-time BF16 -> FP8 for a dense FFN. OFF for want of a receipt, like every
# other row here; a NUMERICS row.
dense_fp8_from_bf16 = false
# The same route for the GDN projections. OFF for want of a receipt; a
# NUMERICS row.
gdn_fp8_from_bf16 = false
# And for the full-attention q/k/v/o. OFF for want of a receipt.
attn_fp8_from_bf16 = false
# BF16 dense-FFN prefill on cuBLASLt by default. OFF for want of a receipt:
# the win is an Ada measurement (`kernels/ada/HARDWARE.toml`) and is not
# copied here. `AVAROK_CUBLAS_GEMM=ffn` still arms it.
ffn_bf16_cublas_prefill = false
# BF16 GDN verify projections on one cuBLASLt GEMM. OFF: a numerics row with
# no receipt. `AVAROK_GDN_BATCHED_GEMM=1` is the A/B.
gdn_batched_gemm = false
# Gated dense-BF16 Q/K/V on the batched GEMV in multi-seq decode. OFF for
# want of a receipt here; ON on ada. `AVAROK_ATTN_GATED_BF16_BATCHM=1` arms it.
attn_gated_bf16_batchm = false
# Consumer-card memory sizing. OFF: an Ada measurement, not copied here.
memory_fit_consumer = false
# Upper M for the W8A8 block-scaled dense-FFN prefill (#917). NO CAP here:
# 4294967295 is u32::MAX, which is `build_defaults::baseline`'s value and the
# way this table spells "every M takes the W8A8 arm". B200 has NO receipt
# either way. It keeps the baseline: a cap is a measurement, and copying
# GB10's because both are Blackwell is the reasoning this table replaces. The
# row is here to be filled in when someone measures it.
#
# Declared explicitly rather than left to the baseline: a row present in one
# target's table and missing from another's is how a lever comes to mean two
# things in one repository.
w8a8_prefill_max_m_widening = 4294967295
w8a8_prefill_max_m_narrowing = 4294967295
# ── Port sprint rows (port/consumer-opt) ──
# The port sprint's rows (`crates/avarok-kernels/build_defaults_port.rs`). Each
# is false, or its baseline, on this target: the sprint's receipts are Ada
# ones, and no row changes here in this sprint. Rows are inserted immediately
# before the marker line below.
# When a 4-bit BF16 load route is on (dense_affine4_from_bf16,
# gdn_affine4_from_bf16, attn_affine4_from_bf16), every projection the Marlin
# kernels serve (N a multiple of 64, K of 128, more than one group) is
# quantized once at load by round-to-nearest int4 at group 128 (GPTQ's
# symmetric uint4b8 grid, --w4-clip-search shrink candidates per group) instead
# of the MLX affine codes, and served through W4Linear on vLLM's Marlin W4A16
# GEMM (kernels/ada/common/marlin_ada.cu, host
# crates/spark-model/src/port/marlin/): decode and verify rows 1..64 in one
# launch on one thread configuration fixed per weight (row invariant), prompts
# on vLLM's M split. A projection Marlin does not serve keeps the affine
# quantizer (one log line). 4.125 bits a weight (a bf16 scale per 128 inputs)
# against affine's 4.5 at group 64. It changes nothing on a target without the
# marlin_ada module (every non-Ada target) and nothing when no 4-bit route is
# on. Round-to-nearest int4 is a numerics change, so it is off until
# marlin_ada_microtest passes on the card (every entry within 2 BF16 ulps plus
# the FP32 term bound at M = 1, 8, 16, 17, 32, 64, row invariance across M) and
# the KL gate on the 4B (teacher-forced NLL delta at most twice the FP8 FFN
# route's, full-vocabulary KL mean at most 0.05, coherence, MTP drafted output
# equal to plain at temperature 0); GPTQ and AWQ checkpoints, whose codes are
# the checkpoint's, load through the same kernels at the packed install sites.
marlin_w4a16 = false
# A dense Qwen3.5-family GGUF (arch qwen35) keeps its IQ4_XS, Q4_K and Q6_K
# projections as the file's raw super-blocks in VRAM (the dense FFN, the
# full-attention q/k/v/o, and the two GDN input projections with their
# value-head row reorder applied to the packed bytes), tagged
# WeightDtype::Iq4Xs / Q4K / Q6K for the sm_89 keep-packed decode GEMVs (M =
# 1..8) and MMQ prefill GEMMs (kernels/ada/common/kquant_mmvq_q4_ada.cu,
# iq4_xs_mmq_ada.cu, kquant_q8_1_ada.cu over the vendored llama.cpp MIT engine;
# host port/gguf_q4/), instead of expanding them to BF16 at 2 bytes a weight.
# IQ4_XS, IQ4_NL and Q5_K tensors the route does not keep are expanded on the
# GPU (dequant_iq4xs_q5k_bf16_ada.cu, bit-exact with the CPU decoder), and the
# file's MTP head (blk.<L>.nextn.*) is mapped to the mtp.* names. Off: the
# container refuses IQ4 types as before and the loader is byte-identical. Off
# until the receipt: examples/iq4xs_gemv_microtest.rs all PASS (dequant
# bitwise, GEMV and MMQ within the float64 bound, row invariance), the R2 and
# R3 bars (M = 1 at 85% of 288 GB/s, M = 8 within 25% of M = 1), and a KL check
# against BF16 on a Qwen3.5-4B or Qwen3.8-27B IQ4_XS GGUF.
gguf_native_iq4 = false
# Batched sequence swap
# (`spark-model/src/model/trait_impl/sequence/state_io.rs`,
# `spark-runtime/src/kv_cache/block_io.rs`): a swapped-out sequence's image
# (each block's K and V for every attention layer, then each GDN layer's h and
# conv state) is gathered with batched async copies (`cuMemcpyBatchAsync` where
# it resolved, else one async copy per region and one event wait per chunk)
# into one reused page-locked staging buffer of at most one
# `--pinned-pool-chunk-mb` chunk, and the file write of one chunk overlaps the
# copy of the next; restore mirrors it. The file is byte-identical to the
# per-region path, so either reader reads either writer's file. OFF until the
# receipt on this card: `kv_swap_roundtrip` (queue row Q9) passes G1 and G2 at
# 1K, 4K and 32K tokens and G3 at 32K, batched >= 5x the per-region path and >=
# 8 GB/s for save and restore. `AVAROK_KV_SWAP_TIMING=1` logs one line per
# image on either path.
kv_batched_swap = false
# SSM tier blob store eviction order
# (`spark-model/src/model/ssm_tier/store.rs`): a capped host-RAM `MemBlobStore`
# gives up the least recently used blob (a fault-in hit and a put both make a
# key the most recent) instead of the oldest insert, and the model removes the
# tier blobs the snapshot index orphans when a fresh save re-homes a spilled
# prefix or the tail sweep drops one
# (`spark-runtime/src/radix_tree/snapshot_insert.rs`). Only matters with the
# SSM tier on (`AVAROK_SSM_TIER`): no entry is ever spilled without it. OFF
# until the receipt on this card: the reuse ladder (queue row Q10, rung C)
# shows no tok/s, TTFT or SSM-hit loss against off. Outputs are unchanged
# either way: a missing blob is a recompute.
ssm_store_lru = false
# Radix prefix-cache eviction takes its victim from an ordered (last_access,
# node id) index of evictable leaves, maintained at every transition of the
# victim predicate, instead of scanning every node once per evicted block
# (`spark-runtime/src/radix_tree/inner/lru_index.rs`). Ties break toward the
# lowest node id exactly as the scan does, so the victim sequence is identical
# by construction and by a randomized oracle (`radix_tree/tests/lru_index.rs`).
# OFF until the receipt on this card: greedy SHA equal and
# `atlas_prefix_evict_seconds_total` per victim down at least 10x on a
# saturated pool (`AVAROK_PREFIX_EVICT_TIMING=1` times the row-off scan arm).
# `AVAROK_RADIX_LRU_INDEX=1` is the A/B.
radix_lru_index = false
# A prefix-cache hit may end inside a KV block: the chunked prefill copies that
# block into a private block (every attention layer's K and V, D2D on the
# prefill stream before the block table is used) instead of sharing the donor's
# writable tail, which is the issue #1193 aliasing bug
# (`radix_tree/inner/cow_walk.rs`, `prefill_b/prefix_cow.rs`). Saves up to
# block_size - 1 prefill tokens per warm hit and lets an exact repeat of a
# non-aligned prompt reach its leaf snapshot. Never in a multi-rank world or
# under --high-speed-swap. `AVAROK_PREFIX_SUBBLOCK` (0, 1, cow) still wins when
# set. OFF until the receipt on this card: the #1193 shape at C=4 (identical
# prompts, MTP on) equal to cache-off at temperature 0 and free of cross-stream
# identity at 0.7, and prefix-repetition TTFT no worse.
# `AVAROK_PREFIX_COW_TAIL=1` is the A/B.
prefix_cow_tail = false
# @port:defaults

