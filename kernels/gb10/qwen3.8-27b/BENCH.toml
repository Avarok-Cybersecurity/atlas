# --- vision-fidelity -------------------------------------------------------
# Vision models only. This gate is declared on the three targets that ship a
# vision tower and have a BENCH.toml; a text-only target has no entry and the
# gate simply does not apply to it.
#
# The bounds are ABSOLUTE and take no noise term, like the cross-contamination
# gate's. Vision-token count is arithmetic over the patch grid -- there is no
# run-to-run variance for a tolerance to absorb, so any movement is a real
# change in preprocessing. That is the property that makes this gate worth
# requiring: the 2026-08-14 resolution-cap defect silently reduced every image
# above 1280px to about a tenth of its permitted area, and every capability
# check passed throughout, because a downscaled picture is still recognisably
# what it is.
#
#   integrity_passed  = 10  the INTEGRITY floor, and the legs a single
#                           well-formed request cannot reach. Every one of
#                           them fails as a FLUENT ANSWER TO THE WRONG INPUT
#                           rather than an error, which is the class this
#                           repo keeps rediscovering:
#                             heterogeneous-concurrency  four DIFFERENT
#                               requests in flight (one text-only), each
#                               scored against its own input. Identical
#                               requests cannot test the per-request offsets
#                               into the shared ViT output buffer, because
#                               every offset is then interchangeable.
#                             prefix-cache-isolation     same prompt text,
#                               different image, back to back. Guards the
#                               predicate that keeps vision prompts out of
#                               the prefix cache — it silently missed the
#                               VIDEO pad token until 2026-08-14.
#                             long-prompt-splice         a prompt past the
#                               single-chunk budget, which leaves the batched
#                               co-dispatch encode for a second splice in a
#                               different file. Measured 81 vs 7082 prompt
#                               tokens, so it really does cross over.
#                             media-in-history           the image in an
#                               earlier turn, not in the message asking the
#                               question. The #165 path.
#                             exif-orientation-pinned    PINS current
#                               behaviour rather than judging it: EXIF
#                               orientation is IGNORED, measured 2026-08-14.
#                               A rotated phone photo reaches the model
#                               sideways. Whether to honour the tag is a
#                               product decision; that it must not change by
#                               accident is not.
#                             stream-blocking-parity     the SAME request
#                               streamed and not. Every other leg sets
#                               stream:true, so the blocking path — which
#                               assembles its own response — was never run.
#                               Both must answer correctly AND agree on
#                               prompt_tokens; a difference means the two
#                               paths built different prompts from identical
#                               bytes.
#                             multi-choice-image         n=2 with an image.
#                               The blocking path gives only choice 0 the
#                               pixels (the encode is shared), which is
#                               correct and is also index-conditional code
#                               nothing ran.
#                             image-on-tool-result       the image arriving
#                               on a role:"tool" message — the OTHER call
#                               site of collect_message_images, and the case
#                               #165 exists for.
#                             thinking-on-vision         the DEFAULT config
#                               for these checkpoints, which every other leg
#                               turns off. Thinking lengthens the prompt and
#                               so moves which prefill chunk the pad run lands
#                               in. Asserted as a DIFFERENCE between two
#                               images so the unknown <think> cost cancels.
#   integrity_measured = 10 a skipped integrity leg is not a passed one.
#   geometry_matched  = 14  the CORRECTNESS floor, and the one that moves when
#                           preprocessing changes. Rung 09 (1600x900) is the
#                           ONLY rung above the retired 1280px clamp: under the
#                           clamp it is 920 tokens, un-downscaled it is 1400.
#                           The other eight fit under either regime and so
#                           cannot tell the two apart -- without rung 09 this
#                           gate could not fail on the defect it exists for.
#   geometry_asserted = 14  the MEASUREMENT floor, which is a DIFFERENT failure.
#                           A cell the server cannot serve reports UNMEASURED,
#                           which is not a mismatch -- so without this floor an
#                           encoder-capacity regression would turn every cell
#                           UNMEASURED and still read as PASS. Both are kept
#                           because neither implies the other.
#   probes_passed     = 3   capability, all three.
#   control_held      = 1   the no-image control MUST hold. The non-vacuity
#                           requirement expressed as a threshold: if the control
#                           answers as though it saw a picture, the probes are
#                           not evidence and the run is VACUOUS.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "vision-fidelity"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
default = false
status = "measured"
note = """\
REFERENCE RUN 2026-08-14, dgx-00, binary feat/video-support @ 5a22d7ce: PASS, 14/14 geometry \
cells matched, 3/3 probes, 10/10 integrity legs, control held, 26.5 s. Geometry was IDENTICAL across all \
three vision targets (49/121/192/220/576/576/920/405/1400/1/128/49/49/49 merged \
tokens) -- token \
count is a property of the preprocessor rather than the checkpoint, so agreement \
across a dense NVFP4, an unsloth NVFP4 and an FP8 MoE is evidence the arithmetic is \
right rather than a coincidence. Ships preprocessor_config.json plus a separate \
video_preprocessor_config.json (unused until video support lands), so it resolved \
16.7M px before the resolver fix as well; clamped to the encoder's 16384-patch \
ceiling. Run at --max-seq-len 32768 for this record."""

[benchmarks.metrics.geometry_matched]
min = 14.0

[benchmarks.metrics.geometry_asserted]
min = 14.0

[benchmarks.metrics.integrity_passed]
min = 10.0

[benchmarks.metrics.integrity_measured]
min = 10.0

[benchmarks.metrics.probes_passed]
min = 3.0

[benchmarks.metrics.control_held]
min = 1.0

# --- video-fidelity --------------------------------------------------------
# VIDEO MODELS ONLY. This target owns the gate's default serve; as of
# 2026-08-15 all three vision checkpoints declare it, so nothing about the
# benchmark is 3.8-specific. The 35B was the last to be added, and only
# because it was the one target weak enough to expose the media-ordering
# defect -- see its BENCH.toml entry.
#
# ── 2026-08-15: this target went red, and the FIXTURE was at fault ─────────
# It scored 4/13, dropping "green" from the FORWARD clip (mp4 and gif alike)
# while reading the REVERSED clip perfectly 4/4 on identical geometry. Ruled
# out in order, each by measurement rather than argument:
#
#   * the media-ordering fix -- parent commit c915f01d, rebuilt and served
#     with the same flags, produced the SAME 4/13 leg for leg;
#   * the pipeline -- qwen3.6-27b read all four colours through the identical
#     code path, same 240 prompt tokens, and answered "SECOND segment ->
#     GREEN" where this target said "blue";
#   * the KV cache -- --kv-cache-dtype bf16 changed nothing, byte for byte;
#   * this checkpoint's double-quantisation (see the loader note below) --
#     Qwen/Qwen3.8-27B-FP8, the same weights in the block-scaled FP8 format
#     Atlas loads natively, failed the same way.
#
# The cause: the fixture's green was HTML green #008000, the one HALF-bright
# colour among three full-bright ones, because ffmpeg resolves the NAME
# "green" that way. Measured with the shade as the only variable:
#     #008000 -> "Red, Blue, Yellow"          (2/2 runs)
#     #00FF00 -> "Red, Green, Blue, Yellow"   (2/2 runs)
# Qwen3.6-27B read the dim band fine, so the difficulty stayed invisible until
# a weaker checkpoint became this gate's subject. The gate was measuring
# colour sensitivity, not frame order. Fixtures regenerated full-bright
# (scripts/gen_test_videos.py); all three targets now score 13/13 and the
# geometry is unchanged (67/116/214 tokens, 49 per group).
#
# ★ SEPARATE FINDING, NOT FIXED: this checkpoint is `format = mixed-precision`
# -- attention q/k/v/o, the GDN projections and lm_head are FP8 with a
# PER-CHANNEL scale, and only the MLP is NVFP4. Atlas's native w8a16 path
# needs a [N/128, K/128] block grid, so a per-row scale is deliberately
# refused (it would read another row's multiplier and produce garbage
# logits) and those tensors are dequantised to BF16 and RE-quantised to
# NVFP4. Measured cost, gate prompt, dark-green fixture: this checkpoint
# answered "Red, Blue" where the natively-loaded Qwen/Qwen3.8-27B-FP8
# managed "Red, Blue, Yellow". Both were wrong, so this is not what the red
# was -- but the double-quantisation is real and this target carries it.
# MODEL.toml's claim that the two 27B checkpoints' quantization_config
# "differs only in a tooling version string" is FALSE as of the checkpoint
# on disk; see the note there.
#
# ★ REQUIRES FFMPEG ON THE SERVER for every container except GIF, and the
# serve must carry `--video-allow-ffmpeg` — the subprocess decoder is gated
# behind that flag, so the recipe this entry names pins
# `video_allow_ffmpeg: true` (added 2026-08-15; without it the certified
# self-start 400'd every MP4 leg). When the flag or binary is absent those
# legs SKIP rather than fail at the benchmark level, but only a MANUAL run
# degrades to the GIF-only subset — this GATE's thresholds demand all 13 legs
# and 0 skips, so a certified run without ffmpeg is red by design. A run
# where everything skipped reports INCONCLUSIVE, never PASS.
#
# Bounds are absolute and take no noise term: every assertion is either
# arithmetic over the patch grid or an exact color sequence, so there is no
# run-to-run variance for a tolerance to absorb.
#
#   legs_passed   = 14  every leg. The ones that carry the weight:
#                         order fwd + REVERSED -- the same clip both ways,
#                           requiring the answer to reverse with it. The only
#                           assertion separating "the frames arrived in order"
#                           from "something arrived", and the one that caught
#                           the splice defect where video pad tokens received
#                           no encoder rows and the model described a gray
#                           field with every token count perfect.
#                         group-proportionality -- 1x/2x/4x durations, where
#                           t4-t2 == 2*(t2-t1). Three points, not two: two
#                           always fit a line because the implied template
#                           overhead absorbs any error.
#                         backend-parity -- MP4 and GIF of identical content
#                           must agree, exercising the subprocess and
#                           in-process decoders against each other.
#                         two-videos / video-before-image -- grid bookkeeping
#                           across several items when one has t_len > 1.
#                         heterogeneous-concurrency -- two clips with OPPOSITE
#                           color orders in flight at once; a crossed
#                           per-request offset returns the other's sequence.
#   legs_skipped  <= 0  on a runner WITH ffmpeg nothing should skip. Raise
#                       this only for a runner that deliberately lacks it.
#   control_held  = 1   the no-video control must not name the whole
#                       sequence, or the readings are not evidence.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "video-fidelity"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
# `default = false` since 2026-08-15: qwen3.6-27b owns this gate's required
# subject. Not a demotion of the checkpoint and not a lowered bar -- the
# thresholds below are unchanged and this entry is still measured whenever it
# is run explicitly. It is a choice of INSTRUMENT. `video-before-image` sits
# exactly at this checkpoint's capability edge: with the bright-green fixture
# it measured 13/13 on a manual serve (util 0.70, no drafts), 12/13 on this
# recipe as pinned -- "[red, green, blue]", one colour short -- and 0 colours
# with num_drafts=0, i.e. the leg's outcome moves with serve config while the
# geometry never does. qwen3.6-27b and qwen3.6-35b-a3b both pass it 13/13
# solidly. A gate whose required subject is one token away from failing
# reports on the model's edge, not on the video pipeline it exists to guard,
# and it would go red on PRs that changed nothing about video.
#
# This entry is also served by the AGENTIC recipe (thinking on, num_drafts 3,
# util 0.85), whose own metadata says "do not cross-use" it with the vision /
# tool profile. There is no vision-profile recipe for this checkpoint; adding
# one upstream in atlas-recipes is the real fix, after which this can take
# the default back with a measured run behind it.
default = false
status = "measured"
note = """\
REFERENCE RUN 2026-08-14, dgx-00, binary feat/video-support: PASS, 13/13 legs, 0 \
skipped, control held. Re-measured 2026-08-15 after the fixture fix: 13/13 on a manual \
vision-style serve, 12/13 under this entry's own agentic recipe (video-before-image \
one colour short) -- see the default = false comment above. group-proportionality \
1s=67 2s=116 4s=214 tokens -> 1/2/4 \
temporal groups at 49 tok/group with an 18-token template overhead; forward clip read \
"red, green, blue, yellow" and the reversed clip "Yellow, Blue, Green, Red"; MP4 and \
GIF both 214 prompt tokens; image+video 286; two-videos 437; video-before-image 288; \
video-in-history 249; C=1/2/4 all correct on one geometry. || THE REVERSED CLIP IS THE \
GATE. Identical geometry, identical prompt, frames in the opposite order -- no language \
prior gets that right twice, which is what makes the other legs evidence rather than \
plausible prose. || Requires ffmpeg; without it the MP4 legs SKIP and only the GIF \
subset runs (measured: PASS 5/5, 4 skipped)."""

# ★ RATCHETED 13 -> 14 on 2026-09-07, when #891 landed a fourteenth leg.
# This is a COUNT, not a measurement: every committed record before #891 reads
# exactly 13/13 and the first one after reads exactly 14/14. There is no
# variance for a tolerance to absorb, so the floor tracks the count exactly and
# a stale one guards nothing -- at min = 13 a later change that silently drops
# the new leg passes BOTH the scorer (13 asserted == 13 passed) and the floor
# (13 >= 13), and nobody hears about it. Count metrics are the easy half of
# threshold ratcheting and should never be left behind the instrument.
[benchmarks.metrics.legs_passed]
min = 14.0

[benchmarks.metrics.legs_skipped]
max = 0.0

[benchmarks.metrics.control_held]
min = 1.0

# --- kat-equality-gate ------------------------------------------------------
# The order-independence gate. REQUIRED (gate::coverage::REQUIRED) since
# 2026-09-10, promoted from PROMOTION_CANDIDATES once its excusal's stated
# precondition was met: "a measured run under --hermetic reaches zero
# divergences, and pin the sample count that was actually measured".
[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "kat-equality-gate"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth-bfcl"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
# The only entry, so `default = true` is mandatory rather than a choice:
# bench.rs bails on zero defaults exactly as it does on two.
default = true
status = "measured"
note = """\
Does the same sample answer the same, whatever ran before it? One draw issued \
in two orders against ONE server, diffed byte-exact per `sample_id`. \
★ It rides the BFCL checkpoint and recipe DELIBERATELY: the gate replays \
BFCL's request body, so a different subject would answer about a workload \
nobody scores. ★ BUT DO NOT READ A GREEN HERE AS CERTIFYING THE BFCL GATE'S \
OWN CONDITIONS. This entry pins the CLOSED regime; the bfcl-subset entry pins \
no serve_overrides at all and is scored OPEN, which is the regime this gate \
measures at 36 divergences of 257. So a green says the BFCL workload is \
order-independent WHEN THE CHANNELS ARE CLOSED, and says nothing about the \
conditions the committed 84.22 / 84.12 were taken under. Closing that gap \
would mean pinning hermetic on bfcl-subset; the owner's decision (2026-09-13) \
is the opposite — bfcl-subset is certified by a partition of shards and stays OPEN, with \
the twelve partition-sensitive samples named in its own note — so the gap is \
documented rather than closed. That is \
also why `max_new_tokens` is pinned to BFCL's 1024 and not the driver's old \
512 — see the MAX_NEW_TOKENS commit. \
★ THE BOUNDS BELOW ARE INVARIANTS, NOT MEASURED PERFORMANCE. `diverged` and \
`unmeasured` are pinned at 0 because the gate's whole claim is that they ARE \
0 — the same shape as ssm-poison's `collapsed max = 0`, and the reason this \
gate may be promoted on a run it itself judges: no bar here was cut from that \
run. The one quantity taken from measurement is the sample count. \
★ THE SERVE PINS ARE THE SUBJECT, NOT CONFIGURATION. With the channels OPEN \
this gate reads 36 divergences of 257 on this checkpoint — measured 2026-09-10 \
on spark-43fa, 3878 s, identical 221, unmeasured 0, empty_replies 0 — and \
under the pinned regime it reads 0. That open-arm run is this gate's negative \
control, and it was run at THIS cap rather than inherited from the whole-draw \
measurement, because truncating the draw changes what ran before every \
surviving sample. \
★ Note 36, not the 12-of-995 that #936 records: those are different \
instruments. #936 compared the whole draw against its own four shards; this \
gate reverses the request order against ONE server, which is a stronger \
perturbation, so it sees more. Do not read the two numbers as a regression \
between them. \
The three keys are pinned together because --hermetic EXPANDS into the other \
two and check_record compares the two sets in both directions — a record \
carrying three against a baseline pinning one fails after the GPU hours are \
spent."""

[benchmarks.serve_overrides]
# All three, not just `hermetic`: bench.rs refuses an under-pinned hermetic
# baseline at PARSE time precisely so this cannot be discovered after a run.
# A record measured this way carries all three: see this gate's own committed
# record under .benchmarks/kat-equality-gate/, whose serve_overrides read
# {enable_prefix_caching: false, hermetic: true, mtp_gate: force}. (An earlier
# draft of this note cited an arm-D bfcl-subset record by sha; that record was
# measured on a box and never committed, so the citation named a file no
# reader could open. Cite something in the tree.)
hermetic = "true"
enable_prefix_caching = "false"
mtp_gate = "force"

[benchmarks.param_overrides]
# The instrument. Each of these is load-bearing for a bound below:
#   orders          — the `orders` metric pin is only a statement about the
#                     instrument if the param is pinned too.
#   sample_cap      — `samples` depends on it; unpinned, a --param sample_cap=50
#                     run would read 50/50 and look green with 20% of the draw.
#                     ★ 257 IS A SUBSET BOUNDARY, NOT A ROUND NUMBER. The draw
#                     concatenates in sorted subset order, and `truncate` keeps
#                     a prefix of it, so the cap decides WHICH SUBSETS are
#                     compared, deterministically — this is not sampling. The
#                     12 divergences measured on this checkpoint were 10
#                     live_irrelevance, 1 live_multiple and 1
#                     live_parallel_multiple; 257 is exactly the end of
#                     live_parallel_multiple, so it covers every subset in
#                     which the effect has ever been observed. What it gives
#                     up is 738 samples: live_simple (25) plus the whole
#                     non_live half (713 — multiple, parallel,
#                     parallel_multiple, simple_java, simple_javascript,
#                     simple_python). ★ Say live_simple out loud rather than
#                     calling the remainder "the non_live tail", which an
#                     earlier draft of this note did: live_simple is a `live`
#                     subset, so the cap DOES blind this gate to one subset of
#                     the category the effect lives in. Neither instrument has
#                     produced a live_simple divergence — not the 12 the shard
#                     split found, not the 36 the order reversal found — but
#                     that is a measured absence, not a structural one, and it
#                     is the first thing to re-check if a future divergence
#                     lands outside the capped prefix.
#                     The whole draw in two orders costs ~4.3 h (1990
#                     generations at the 7.9 s/generation this record measured)
#                     against this cap's ~1 h, on every PR, forever. State the
#                     cap when you report a green: the driver logs the same
#                     warning.
#   max_new_tokens  — BFCL's own budget. Divergence surface scales with it, and
#                     every committed bfcl-subset record was measured at 1024.
orders = "2"
sample_cap = "257"
max_new_tokens = "1024"

[benchmarks.metrics.orders]
# An exact pin: a run comparing fewer orders is not this instrument.
min = 2.0
max = 2.0

[benchmarks.metrics.samples]
# Pinned at what was ACTUALLY measured, per the promotion precondition.
min = 257.0
max = 257.0

[benchmarks.metrics.diverged]
# The invariant. Any divergence at all is the failure this gate exists for.
max = 0.0

[benchmarks.metrics.unmeasured]
# A timeout or transport error is NOT evidence that the orders agreed, so an
# unmeasured sample fails rather than being skipped.
max = 0.0

[benchmarks.metrics.empty_replies]
# Measured 0 of 257 on the open arm (2026-09-10). Pinned at 0 as a DEFINITION
# rather than as a performance bar: an empty canonical reply is not a KAT
# observation, and two empty replies agreeing is not evidence the orders
# agreed. `compare` already refuses a wholly-empty run as vacuous; this catches
# the PARTIAL case, where enough replies go empty to hollow the comparison out
# while the run still looks green.
max = 0.0
