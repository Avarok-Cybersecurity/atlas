# 10-step. 0.8 x 1024 = 819 (the vacuity majority rule) is NOT written: three
# clean runs stopped one request under it, deterministically at the widest
# rungs, and a floor above a measured healthy minimum is a bootstrap.
#
# ★ KEPT AT 260 THROUGH THE 2026-09-21 RE-POINT, deliberately, while every
# rung floor went to 0.0 — this is the one bar the re-point does not
# invalidate, and it is not redundant with vacuous_cells.
#
# The sentence not to get wrong: the vacuity rule is NOT "no request under
# 80% of the budget". concurrency_vacuity.rs was rewritten FOR this very
# instrument — its module doc cites l38_r{7..11}_c*.json, where rep 2 of
# C=128 deterministically stops one request at 691 tokens and C=64 one at
# 753 — and now asks only for cell OCCUPANCY >= 0.8 of the total budget plus
# a MAJORITY of requests over 0.8 x osl. A minority may deliver anything down
# to zero. min_completion_tokens is what still denies that minority the
# floor, so switching it off with the rung floors would have removed a guard
# vacuity never replaced.
#
