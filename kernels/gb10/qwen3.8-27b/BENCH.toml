[benchmarks.metrics.peak_aggregate_tok_s]
# The peak rung IS C=16 on this ladder — the curve rises monotonically to the
# batch cap and stops there, so the peak floor is the C=16 bar.
min = 58.0
noise = 1.00

[benchmarks.metrics.min_completion_tokens]
# The vacuity guarantee at THIS gate's budget. Observed 174/187/200 at osl 200
# (vacuity floor 160); 164 sits below the minimum with margin and above the
# 80%-of-osl rule, so it stays the stricter of the two.
min = 164.0

[benchmarks.metrics.vacuous_cells]
