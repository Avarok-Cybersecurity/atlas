header:
  license:
    spdx-id: AGPL-3.0-only
    content: |
      SPDX-License-Identifier: AGPL-3.0-only
  paths:
    - 'crates/**/*.rs'
    - 'kernels/**/*.{cu,cuh,h,hpp,cpp}'
    - 'cuda_kernels/**/*.{cu,cuh,h,hpp,cpp}'
  paths-ignore:
    - 'target/**'
    - 'vendor/**'
    # Vendored llama.cpp/ggml CUDA MMQ sources (MIT-licensed upstream);
    # third-party material keeps its original license — never stamp AGPL here.
    # Path-independent: this PR promoted the vendored tree from
    # `qwen3.6-27b/nvfp4/` to `common/` so every model can compile it, and
    # a hard-coded path silently un-exempts it on the next such move.
    - 'kernels/**/q4k_vendor/**'
  comment: on-failure
