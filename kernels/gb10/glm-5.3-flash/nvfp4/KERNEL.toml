# GLM-5.3-Flash NVFP4.
#
# Unlisted `.cu` files take their file stem as the module name, and the build
# merges `common/` then this directory — so GLM compiles the shared set plus
# every GLM kernel already living in `common/` (`glm5next_mhc`, `glm5next_ffn`,
# `dsa_indexer`, `kda_*`) with no aliases required.
#
# 🔴 Why this target exists at all: `mla_paged_decode{,_fp8}` used to live ONLY
# in `deepseek-v4-flash/nvfp4/`, so no other model could resolve it. Byte-
# identical copies now sit in `common/`. DeepSeek-V4 keeps its own copies and
# therefore SHADOWS the common ones — V4 compiles exactly the bytes it always
# did, and the shadow is reported by the build's own drop warning. GLM, having
# no shadow, picks up the `common/` copies.
#
# 🪤 Those kernels hardcode `KV_LORA_DIM 512` for the latent width while taking
# the cache stride (`kv_cache_dim`) as a runtime argument. GLM is correct here
# only because its `kv_lora_rank` is ALSO 512 — a coincidence, not a design.
# `Glm5NextDsaConfig::validate` asserts it so a future GLM revision with a
# different latent fails loudly at config time instead of reading garbage.

[build]
# Matches DeepSeek-V4-Flash: MLA kernels override HDIM inline, so no global
# -DHDIM (the common paged-decode kernels only support 128/256/320).
extra_nvcc_flags = ["--fmad=false"]
