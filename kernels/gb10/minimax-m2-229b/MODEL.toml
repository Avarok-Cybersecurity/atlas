[model]
name = "minimax-m2-229b"
hf_id = "MiniMaxAI/MiniMax-M2.7"
params = "229B"
active_params = "~10B"
architecture = "Full Attention + 256-expert Sigmoid-Routed MoE + MTP K=3"

layers_total = 62
layers_linear_attention = 0
layers_full_attention = 62
layer_pattern = "all full attention (attn_type_list = [1] * 62)"

moe_experts = 256
moe_topk = 8
moe_intermediate = 1536
shared_expert_intermediate = 0
moe_scoring_func = "sigmoid"
moe_routing_bias = true

hidden_dim = 3072
head_dim = 128
q_heads = 48
kv_heads = 8

# Partial RoPE — only first 64 of 128 head dims are rotated.
rotary_dim = 64
rope_theta = 5000000
partial_rotary_factor = 0.5

# Per-layer learned q_layernorm / k_layernorm of shape [head_dim].
qk_norm_type = "per_layer"

vocab_size = 200064
max_position_embeddings = 196608
attn_output_gate = false

# MTP: 3 sequential draft modules, each a single transformer layer.
mtp_layers = 3
mtp_transformer_layers = 1
mtp_type = "full_attention"

vision = false

# Sampling defaults lifted from the MiniMax M2 model card recommendations
# (tuned for agentic / coding workloads). Adjust after M4 bring-up if
# community reports divergent preferences.
# 2026-05-24 empirical band-aid. MiniMax-M2's temp=1.0 recipe risked
# max_tokens wandering on agentic clients (lesson from Qwen3.6).
# Lowered temp=0.6 thinking, 0.7 non-thinking, kept temp=0.4 coding/tools
# (MiniMax's own benchmark value). Kept top_k=40 (MiniMax convention).
# Renamed from `[sampling.default]`/`[coding]` to Atlas-standard
# {thinking_text, thinking_coding, non_thinking, tools} so the parser
# actually picks up these values.
[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 40
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.thinking_coding]
temperature = 0.4
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.non_thinking]
temperature = 0.7
top_p = 0.95
top_k = 40
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.tools]
temperature = 0.4
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[behavior]
# MiniMax M2's native HF chat_template.jinja appends `<think>\n`
# unconditionally at `add_generation_prompt`. Atlas uses an OpenAI-
# variant template that gates this generation prompt on the resolved
# per-request thinking setting. `max_thinking_budget` still caps explicit
# or spontaneous thinking: when the scheduler detects `<think>` without
# an explicit per-request budget, it uses this number as the cap. Hit
# the cap -> `</think>` is force-emitted -> real content begins.
# `thinking_default = false` makes the OpenAI-style API treat
# `extra_body.thinking.budget_tokens` as opt-in (matches MiniMax's
# `thinking_in_tools=false` story for tool-active requests).
# 2026-05-23 sweep: false → true. With thinking_default=false the model
# only thinks when client explicitly asks for it (chat_template_kwargs);
# allowing thinking during tool-active turns is consistent with the
# project-wide default. Existing MiniMax-M2 "spontaneous-thinking phase"
# behavior is unchanged because thinking_default stays false.
thinking_in_tools = true
# 2026-05-23 sweep: 1024 → 2048 (project-wide reasoning headroom bump).
max_thinking_budget = 2048
thinking_default = false

[[model_types]]
model_type = "minimax_m2"
hidden_size = 3072

# Wildcard for hidden_sizes other than 3072. Needed so the tiny-random test
# variant (yujiepan/minimax-m2.7-tiny-random, hidden_size=8) routes to this
# target for dispatch-layer smoke tests. Exact-match 3072 wins for the
# real checkpoint per atlas_kernels::ptx_for_config resolution order.
[[model_types]]
model_type = "minimax_m2"

[kernel]
# hidden_dim(3072) * sizeof(bf16) — same shape as Qwen3.5-122B so the
# existing 6144-byte gate path reuses cleanly once M3 wires sigmoid routing.
moe_gate_shmem_bytes = 6144

# ── Kernel target staging ────────────────────────────────────────────────
# `nvfp4/` quant subdir registers the target by compiling all common kernels
# with `-DHDIM=128` (same convention as Nemotron-Super which also uses
# head_dim=128). No minimax-specific .cu overrides yet — M2/M3/M4 loader
# work fleshes out forward paths on top of these shared kernels.
#
# See docs/MINIMAX-2.7-GAMEPLAN.md + MINIMAX-M3-DESIGN.md + MINIMAX-M5-DESIGN.md.

# ── expected_absent ────────────────────────────────────────────────────────
# Harvested 2026-08-04 from an EP=2 `--check-kernels` run (rank 0 dgx2 /
# rank 1 dgx3, identical report on both ranks): 193 lookups, 12 unresolved,
# kernel_set_hash edefcd8f96f8. Note this target's shadow RESOLVES
# moe_w4a16_fused_gate_up_t_k64_m128 (Block D #3 ported here — the dispatch
# comment's "currently minimax-m2-229b"), so it is NOT on the list. Every
# entry below names the dispatch site and the resolved fallback.

[expected_absent.w4a16]
w4a16_gemm_t_p3 = """
3-deep weight-pipeline twin shipped ONLY in qwen3.6-27b's shadow.
layers::tgemm_kernel probes it, then falls back to w4a16_gemm_t, which
resolves on this target's shadow. UNMEASURED — candidate, not loss."""
w4a16_gemm_t_k64_p3 = "Same family; layers::k64_kernel falls back to the required w4a16_gemm_t_k64 (resolves on this target's shadow)."
w4a16_gemm_t_k64_n64_p3 = "Narrow-N deep-K twin; layers::k64_n64_kernel returns 0-handle when absent, dispatch gates on handle != 0 before firing."
w4a16_gemm_t_m128_bf16 = "BF16-projection prefill twin of w4a16_gemm_t_m128; prefill_weights gates on handle != 0, falls back through the resolved w4a16 m128 path."

[expected_absent.w4a4]
w4a4_gemm_mfast = """
Shipped only in nemotron-labs-3-puzzle-75b-a9b's shadow. The attention
W4A4 prefill path is additionally OPT-IN ONLY (ATLAS_ATTN_W4A4 env) and
dispatch gates on handle != 0 (paged_qkv.rs:49, paged_oproj.rs:32).
UNMEASURED."""

[expected_absent.moe_w4a16]
moe_w4a16_grouped_gemm_ptrtable_e8m0 = """
Native-MXFP4 (E8M0) scale-format variant shipped only in
deepseek-v4-flash's shadow. This NVFP4 checkpoint's scales are the
modelopt NVFP4 format, so dispatch uses the resolved ptrtable grouped
GEMM."""
moe_w4a16_grouped_gemm_ptrtable_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t variant."
moe_w4a16_grouped_gemm_ptrtable_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t_k64 variant."
moe_w4a16_fused_gate_up_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up variant."
moe_w4a16_fused_gate_up_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up_k64 variant."
moe_w4a16_fused_gate_up_t_k64_fp4 = "FUSED-FP4 gate_up (Holo-3.1 family); forward_prefill_routed gates on gateup_fp4 && handle != 0 before firing."
moe_w4a16_down_t_k64_fp4 = "FP4 down-projection twin; forward_prefill_routed gates on down_fp4 && handle != 0."
