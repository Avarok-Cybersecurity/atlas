[hardware]
name = "hopper"
vendor = "nvidia"
# H100 SXM5 / H200 SXM5 — both SM 9.0. `sm_90a` enables the arch-specific
# Hopper feature set (wgmma/TMA/setmaxnreg) for kernels that opt in; the
# shared gb10-derived kernels below use none of it yet and compile as
# plain sm_90 code. PTX built for sm_90a is NOT forward-compatible with
# sm_100/sm_120 devices — this target is Hopper-only by design.
arch = "sm_90a"
compute_capability = "9.0"
# H100 SXM5 80 GB HBM3: 3350 GB/s. H200 SXM5 141 GB HBM3e: 4800 GB/s.
# Sized to the smaller SKU; the runtime reads real free memory via
# cuMemGetInfo, this is documentation + roofline input only.
memory_bandwidth_gbps = 3350
memory_type = "HBM3"
memory_gb = 80

# Flags added to EVERY kernel compiled for this hardware, under
# common/KERNEL.toml's and the model's (build_flags::merge_extra_flags).
#
# ATLAS_NO_WARP_BLOCKSCALE_MMA compiles out the W4A4 path in
# qwen3.6-35b-a3b/nvfp4/moe_w4a16_grouped_gemm.cu. Hopper has no NVFP4
# datapath, so `cvt.rn.satfinite.e2m1x2.f32` and the warp-level
# `mma.sync ... .kind::mxf4nvf4.block_scale` do not exist here — ptxas:
# "Instruction 'cvt with .e2m1x2' not supported on .target 'sm_90a'"
# (measured 2026-09-05, CUDA 13.0.88; receipt under
# docs/campaigns/hopper-atlas-vs-vllm-2026-09/receipts/).
#
# A hardware-level define, not a per-model one, because it is a fact about
# the ISA and because every KERNEL.toml under this tree is a symlink into
# kernels/gb10 — saying it per model would fork a shared file once per
# model, which tests/inherited_targets.rs forbids.
[build]
extra_nvcc_flags = ["-DATLAS_NO_WARP_BLOCKSCALE_MMA"]

# ── Serving defaults for this target ───────────────────────────────────────
#
# SSOT for the per-target serving levers, baked into `atlas_kernels` by
# build.rs (`build_defaults.rs`) as `atlas_kernels::TARGET_DEFAULTS` and read
# by every resolver in spark-model BEFORE the environment.
#
# WHY IT IS HERE. Maintainer review, 2026-09-11 (tbraun96): "Every Hopper/GB10
# divergence is expressed as an env lever set by an H100 recipe living outside
# this repo — not as arch-selected code. 'No interference' rests on discipline
# rather than structure." Every value below WAS a line in that external recipe.
# The recipe is now the target's own declaration, so an H100 serve with NO
# environment set reproduces the round-9 best configuration, and a GB10 serve
# cannot be reached by it — the two tables are separate files.
#
# The environment still overrides any of these; the serve log's
# `target defaults (hopper): …` line marks which values came from it.
[defaults]
# H100 round 3/9: the cuBLASLt arms win on all three projection families.
# SCOPED, not a global boolean — `ATLAS_CUBLAS_GEMM=1` once armed the SSM arm
# by accident and materialised ~10.3 GiB of unledgered BF16 dequant
# (dispatch_config::CublasScope). `head` is parsed but has no consumer.
cublas_gemm_scope = "ffn,ssm,attn"
# `w8a16_gemv_batch16`: with `cublas_gemm_scope` arming the FFN's W8A8 arm at
# these same 5..=32 widths, the batch16 tier is a measured LOSS on H100 — the
# recipe that produced round 9 sets `ATLAS_FFN_NO_BATCH16`.
ffn_batch16_tier = false
# `w8a16_gemm_m16` on the dense-FFN arm: round 6 A/B, +13.7% on the SSM-layer
# FFN step at bs16 (544 CTAs against a 528-CTA residency). Off; the ATTENTION
# tiers below are the half of that lever that wins.
ffn_m16_tc = false
# `w8a16_gemm_m16{,_strided}` on QKV and o_proj: round 6 A/B, -21.7% on the
# attention phase at bs16. Net +5.3% on the serve once split from the FFN arm.
attn_m16_tc = true
# `w8a16_gemv_batch16_ncol{2,4}`: no H100 serving receipt yet — the microtest
# exists, the A/B does not. Stays off until it does.
attn_ncol_gemv = false
# `dense_gemm_m16_bf16` on the BF16 decode head: +4% on the serve.
lm_head_m16_tc = true
# The BF16 decode head's batched-GEMV band. 16, not GB10's frozen 8: on H100
# the TILE GEMM is what loses at decode widths (#927 — 224 ms/step at 16
# active rows), which is the opposite of the GB10 measurement that froze 8.
# Clamped at the kernel's compile-time row bound by the resolver.
lm_head_batchm_max = 16
# One strided recurrent launch per batch on the GDN decode path: +6% on the
# serve, and md5-identical output to the per-sequence launches.
ssm_batched_recurrent = true
# Split SiLU+down on the decode path — shipped ON everywhere since #928.
decode_split_silu = true
# `auto` = size the decode-rollback ring from free memory at preflight (#915).
ssm_decode_ring_slots = "auto"

# ── Kernels this target OVERRIDES instead of inheriting ────────────────────
#
# Every other entry in `kernels/hopper/common/` is a relative symlink into
# `kernels/gb10/common/`, which is what makes gb10 the oracle for this tree
# (`crates/atlas-kernels/tests/inherited_targets.rs`). The files listed here
# are REAL FILES: sources that exist for HOPPER PERFORMANCE and are not used on
# GB10, so gb10's tree does not carry them at all and gb10's build does not
# compile them.
#
# Maintainer rule, 2026-09-11 (tbraun96): "symlinks are fine provided the
# pointed-to gb10 file is not edited when iterating on Hopper; Hopper-tuned
# kernels must be real files under kernels/hopper/". A declaration rather than
# "any regular file is fine": an UNDECLARED regular file in a mirror is a
# silent fork of a shared kernel, which is the defect the mirror check exists
# to catch, and the two cases are indistinguishable without this list.
#
#   dense_gemm_m16_bf16.cu   BF16 decode head, m16n8k16 M tile (#927/#928).
#                            Reached only under `[defaults] lm_head_m16_tc`.
#   fp8_scale_transpose.cu   K-major activation-scale adapter for cuBLASLt
#                            block-scaled FP8. Reached only under a
#                            `cublas_gemm_scope` family; cuBLASLt is not the
#                            GB10 path.
#   w8a16_gemm_m16.cu        Native-FP8 M16 tensor-core tiers for the dense
#                            FFN and the decode QKV/o_proj. Reached only under
#                            `[defaults] ffn_m16_tc` / `attn_m16_tc`.
#   w8a16_gemv_ncol.cu       N-column-blocked decode attention projections.
#                            Reached only under `[defaults] attn_ncol_gemv`.
#
# Every consumer resolves these through `try_kernel` and declines on a zero
# handle, and every probe is gated on the same lever that would launch the
# kernel — so a target without them boots, rather than failing the kernel
# audit on a lookup nothing declared.
[kernels]
overrides = [
  "dense_gemm_m16_bf16.cu",
  "fp8_scale_transpose.cu",
  "w8a16_gemm_m16.cu",
  "w8a16_gemv_ncol.cu",
]
