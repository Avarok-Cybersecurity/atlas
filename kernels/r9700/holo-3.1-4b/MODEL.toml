# ── The model dir's two drops ──────────────────────────────────────────────
[expected_absent.w4a16_fp8_ldmab]
fp8_fp8_gemm_ldmab = "gfx1201, SCALE 1.7.1: w4a16_fp8_ldmab.cu:107:9: error: this implementation does not provide a declaration of type 'fragment<nvcuda::wmma::accumulator, 16, 8, 32, float, void>', which is needed to codegen this PTX instruction. The same e4m3 MMA gap that pins AVAROK_W4A16_VARIANT=v1. layers/ops/gemm_fp8_prefill.rs looks this kernel up with `?`, so a native-FP8 checkpoint on this board needs a BF16-MMA port first; an NVFP4 checkpoint requantizes at load and never reaches the path."

# The vendor MMQ optional module, same situation as kernels/hopper: the file
# is guarded by BLACKWELL_MMA_AVAILABLE and compiles to nothing here. It
# matters more under SCALE than on Hopper, because without the registry's ELF
# symbol check the driver returns a phantom handle and the first launch dies
# with CUDA_ERROR_INVALID_IMAGE.
[expected_absent.nvfp4_mmq]
avarok_nvfp4_mmq128_nc = "gfx1201, SCALE 1.7.1: nvfp4_mmq.cu is guarded by BLACKWELL_MMA_AVAILABLE (SM 12.x only) and compiles to a code object with no kernels here. The registry's ELF symbol check turns the lookup into handle 0, which keeps dense FFN prefill on the W4A16 path exactly as on Hopper."
