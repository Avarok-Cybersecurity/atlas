# Benchmarks for this model, and the thresholds its gate records must meet.
#
# Sibling of MODEL.toml so the numbers sit beside the thing they describe;
# hardware and model are implied by the path and cannot disagree with the
# contents. Read by `avarok_plugin::gate::bench`.
#
# Thresholds are per CHECKPOINT, not per model: two checkpoints of one model
# can differ by several BFCL points, so they cannot share a bar.
#
# This file is deliberately OUTSIDE the closure hash (`taxon::configs` does not
# list it), so ratcheting a threshold does not invalidate the record that
# justified the ratchet.
#
# `status = "unmeasured"` entries carry NO [benchmarks.metrics] table. Absence
# is the TODO -- a guessed threshold a run could clear would report PASS for
# something nobody measured.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "Qwen/Qwen3.6-35B-A3B-FP8"
gate = "agentic-webserver"
recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-bf16head"
# The human name the TUI's variant list shows; additive only, thresholds and
# default are unchanged. The dense sibling lives in qwen3.8-27b/BENCH.toml.
label = "Qwen3.6-35B-A3B MoE flagship (FP8)"
default = true
status = "measured"
note = """\
★ HARNESS PORT DONE AND MEASURED; the residual is a THRESHOLD question, not a defect. Four \
real harness defects were found and fixed (2fcea05b): the warm cargo target dir was never \
warmed and pointed at the wrong path, so the agent's first `cargo test` cold-built the dep \
tree and hit the 180 s command timeout; `run_shell` read both pipes to EOF before \
child.wait(), so any `cargo run &` -- which the prompt invites -- burned the full timeout \
and returned nothing; `ping()` used a line reader, scoring a live newline-less `pong` as \
dead; and five followed_directions regexes diverged from followed_directions.py. MEASURED \
before -> after, same box, N=10 tiers: webserver_ok 3/9/6/7 -> 10 and 8; followed_directions \
0/6/4/7 -> 9 and 5; Sigma-wall 394-637 s -> 923 and 734 s, with the agent now taking 10-18 \
turns per run instead of 3-7. One tier reached the full 10/10. REMAINING: 10/10 AND 10/10 is \
not reachable ON DEMAND. temperature is 0.0 (STALE NOTE FIXED 2026-08-09: this said 0.3; \
0.0 landed in c050ced3f and binary 8b7de2638 carries it) -- the value the harness pins and the \
one that scored 10/10 there -- so this gate is stochastic by construction. An exact 10-of-10 \
bar on a stochastic instrument fails a healthy build roughly half the time. OWNER DECISION, \
deliberately not taken here: either state these bounds as a distribution over k tiers (e.g. \
best-of-2, or a mean with a floor), or keep the exact bar and accept re-runs. Lowering the \
counts to today's draw is still the wrong move, which is why they are unchanged. The ENGINE \
is not in question: the shell harness scored webserver_ok 10/10 and cargo_valid 10/10 on \
this same binary. || original: Gate A (benchmark-pr skill): N=10 agentic-webserver on the \
35B MoE flagship — 10/10 webserver_ok, 10/10 followed_directions, Σwall <= 1300 s \
(SUPERSEDED: the ceiling in force is `sum_wall_s` <= 700, lowered 2026-09-21 — read its \
metric comment below, not this paragraph). The two \
10/10 counts are ABSOLUTE correctness bounds and take no noise. ★ Σwall is DELIBERATELY NOT \
RATCHETED to the 978.13 s best (PR #388, dgx3): unlike the BFCL scores, tier Σwall carries \
+/-200-300 s of run-to-run noise from single 230-320 s outlier iterations, so a ~978 s \
ceiling would fail constantly on healthy builds. 1300 s was a BLOWUP DETECTOR, not a perf \
gate — it cannot see a 5-10% TTFT regression, which is what the two TTFT gates are for. \
Historical band Σwall 950-1287 s; high-water (fastest) 978.13 s recorded here for reference \
only. Walls are box-specific: compare like-for-like or not at all. || ★ `iterations` is \
PINNED at exactly 10, the N the two 10/10 bounds are written for. A count bound alone does \
not describe the run that produced it: `webserver_ok >= 10` is satisfied by 12 successes out \
of 20, and `sum_wall_s` <= 700 is satisfied by 5 iterations. Neither is the gate. This adds a \
threshold, it does not relax one -- the recorded runs all carry iterations 10."""

[benchmarks.metrics.followed_directions]
min = 10.0

[benchmarks.metrics.iterations]
min = 10.0
max = 10.0

[benchmarks.metrics.sum_wall_s]
# RAISED 1000 -> 1800 on 2026-08-18, and demoted from speed bound to blowup
# detector. Σwall is a PRODUCT — turns x per-turn cost — and turn count is
# drawn by the agent, not the engine. The 2026-08-09 tightening to 1000 read a
# 600-800 s window (733.8 and 782.9 back-to-back) that a five-tier sample now
# shows was unrepresentative; every one of these was 10/10 + 10/10:
#
#   dgx1  774 s / 113 turns = 6.85 s/turn      dgx1 1039 s / 144 = 7.22
#   dgx1  813 s / 115 turns = 7.07 s/turn      dgx2 1019 s / 166 = 6.14
#   dgx1  860 s / 126 turns = 6.83 s/turn
#
# 1000 sat INSIDE that healthy distribution and rejected the last two — and it
# ranked them backwards, failing dgx2's 6.14 s/turn, the fastest tier on
# record, while passing dgx1's 7.07. Speed is now bounded by `s_per_turn`
# below; this ceiling only has to catch a blowup.
#
# LOWERED 1800 -> 700 on 2026-09-21, owner's call, against a REGIME CHANGE the
# 1800 predates. The 109 recorded runs are not one population; they split on
# 2026-09-12:
#
#   before 2026-09-12   n=88   443-1025 s   mean 774   66 of 88 ABOVE 700
#   since  2026-09-12   n=21   521-647 s    mean 573   0 of 21 above 700
#                                           stdev 30.2 (5.3% CoV)
#
# The last fourteen runs, 2026-09-17 onward, sit in 564-647 s at 3.7% CoV; the
# five most recent are 565.1, 565.7, 566.1, 566.9, 567.1. 1800 was sized for
# the old band and cannot see a 2x blowup in the new one -- it would take a
# 3.1x regression to trip, which is not a detector, it is an ornament.
#
# 700 keeps every run of the current regime: 8.2% over the worst (647.1) and
# 22% over the mean (572.8). It is still a BLOWUP DETECTOR, not a speed gate --
# speed is bounded by `s_per_turn` below, and the two 10/10 counts are the
# correctness bounds. If the agent's turn count moves, `sum_turns` catches it.
#
# ★ A run from BEFORE the regime change cannot pass this. That is intended and
# is the reason to write the split down rather than just the number: a bisect
# that reaches back past 2026-09-12 will fail here on healthy old builds, and
# the right reading of that is "different regime", not "regression".
max = 700.0

[benchmarks.metrics.sum_turns]
# DEGENERACY, stated directly instead of being smuggled into a wall bound. An
# agent that completes every task but wanders through far more turns than the
# work needs is fast per turn and still a regression. 250 is ~1.5x the 166-turn
# worst of the five tiers above, against a hard cap of 400 (max_turns 40 x 10).
max = 250.0

[benchmarks.metrics.s_per_turn]
# SPEED. The agent's own seconds (scorer excluded) per agent turn. Five tiers
# span 6.83-7.22 on dgx1 and 6.14 on dgx2 — a 5.7% on-box spread against
# Σwall's 34%, i.e. six times tighter, which is the whole reason this bound
# exists.
#
# 8.5 is ~18% above the worst of them and >3x the on-box noise band away, so it
# catches a real decode regression without firing on a draw.
#
# ★ PROVISIONAL, and loose on purpose. Those five tiers were measured with the
# scorer's cargo build still inside the wall; the numerator is now agent-only,
# so recorded values will come in BELOW them and this ceiling has more headroom
# than the 18% it was drawn for. Ratchet it after repeated back-to-back tiers
# on the new numerator — never to the best tier.
#
# ★ Because this bound now EXISTS, a tier that took zero turns records no
# `s_per_turn` at all (deliberately: a 0.0 would read as the best speed ever
# recorded) and `check_record` reports it as "missing from the record". That is
# fail-closed and correct, but the real fault in that case is the 0/10
# webserver_ok beside it — read that line first.
max = 8.5

[benchmarks.metrics.webserver_ok]
min = 10.0

