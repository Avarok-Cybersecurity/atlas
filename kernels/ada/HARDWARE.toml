[hardware]
name = "ada"
vendor = "nvidia"
# Ada Lovelace, SM 8.9: GeForce RTX 40-series, RTX 4000/5000/6000 Ada, L4,
# L40/L40S. Plain `sm_89`: NVIDIA defines no arch-specific `sm_89a`, so this is
# portable PTX that the driver JIT-compiles forward onto any CC >= 8.9.
#
# Two things the gb10 kernels lean on are missing at this arch:
#   * a way past ptxas's 48 KiB static `__shared__` ceiling, which only an
#     `a`-suffixed arch lifts;
#   * TMA and `mbarrier ... expect_tx`, which are sm_90+.
arch = "sm_89"
compute_capability = "8.9"
# Streaming multiprocessors of the reference part this target was brought up
# against: RTX 4060 Ti 16 GB (AD106, 34 SMs). Other Ada boards differ (an RTX
# 4090 has 128); the boot cross-check (`arch_preflight::check_sm_count`) warns
# on a mismatch, and only grid sizing that reads this value is affected.
sm_count = 34
# RTX 4060 Ti 16 GB: 128-bit GDDR6 at 18 Gbps = 288 GB/s. Documentation and
# roofline input only; the runtime reads real free memory via cuMemGetInfo.
memory_bandwidth_gbps = 288
memory_type = "GDDR6"
memory_gb = 16

# Flags added to EVERY kernel compiled for this hardware, under
# common/KERNEL.toml's and the model's (build_flags::merge_extra_flags).
#
# AVAROK_NO_WARP_BLOCKSCALE_MMA compiles out the W4A4 tail of
# qwen3.6-35b-a3b/nvfp4/moe_w4a16_grouped_gemm.cu, which both holo targets'
# nvfp4/ dirs link. Ada has no FP4 datapath at all, so ptxas rejects that
# region as it does on Hopper ("Feature 'cvt.e2m1x2.f32' not supported on
# .target 'sm_89'" and "Instruction 'mma with block scale' not supported",
# CUDA 13.3.73; reproduce with
# `scripts/hopper_ptx_gate.sh --hw ada --model holo-3.1-0.8b --strict` after
# dropping this flag). The rest of the file is W4A16 at the SM80 floor and
# compiles; the dense holo models never construct an MoE layer, so nothing on
# this target looks up the two entry points the define removes.
[build]
extra_nvcc_flags = ["-DAVAROK_NO_WARP_BLOCKSCALE_MMA"]

# ── Serving defaults for this target ───────────────────────────────────────
#
# SSOT for the per-target serving levers, baked into `avarok_kernels` by
# build.rs (`build_defaults.rs`) as `avarok_kernels::TARGET_DEFAULTS` and read
# by every resolver in spark-model BEFORE the environment. Every row is
# declared, even where it agrees with the baseline, so this file answers on its
# own what an Ada serve runs with.
#
# Ada has NO serving receipt yet, so it declares the conservative table, the
# same values as `build_defaults::baseline`: nothing is inherited from Hopper or
# GB10 by resemblance. A row moves only with an A/B measured on an Ada card.
[defaults]
# The BF16 decode head's batched-GEMV band: the frozen 8, for want of an Ada
# A/B.
lm_head_batchm_max = 8
# One strided recurrent launch per batch on the GDN decode path. ON for Hopper
# on a Hopper receipt; no Ada receipt, so off.
ssm_batched_recurrent = false
# The tensor-core GDN chunked PREFILL. LIVE on Ada through
# `common/gdn_chunk_tc_ada.cu` (prepare, state passing and output all on
# mma.sync; the FP32 state stays in MMA accumulators), still OFF until a
# receipt: it changes numerics against the FLA spine (BF16 and TF32 MMA
# operands). Hopper's own spine (`kernels/hopper/common/gated_delta_rule_chunk_tc.cu`,
# #928) is not linked here. `AVAROK_GDN_PREFILL_TC=1` is the A/B. The receipt
# that flips it: `examples/gdn_chunk_tc_ada_microtest.rs` PASS (FP64 oracle
# bounds, agreement with the scalar spine), then `longctx.py` recall and
# `qual.py` KL against the FLA spine, then a TTFT ABBA gain at 3.9K, 32K and
# 128K tokens.
gdn_prefill_tc = false
# The Hopper BA-gates twin. OFF and INERT: Hopper-owned source, not linked here.
ssm_ba_gates_hopper = false
# The Hopper FP8 activation-quant twin. OFF and INERT: Hopper-owned source, not
# linked here.
fp8_act_quant_hopper = false
# Split SiLU+down on the decode path: shipped ON everywhere.
decode_split_silu = true
# Paged-decode attention split-K. `legacy`, the pre-#928 rule, for want of an
# Ada A/B. `AVAROK_ATTN_DECODE_SPLITK=auto` is how that A/B is run.
attn_decode_splitk = "legacy"
# `w8a16_gemm_m16` on the dense-FFN decode arm (#927). OFF: the kernel is not in
# this target's tree.
ffn_m16_tc = false
# `w8a16_gemm_m16{,_strided}` on the decode Q/K/V and o_proj (#927). OFF: no
# Ada receipt, and the kernel is not in this target's tree.
attn_m16_tc = false
# `dense_gemm_m16_bf16` on the BF16 decode head (#927). OFF: no Ada receipt,
# and the kernel is not in this target's tree.
lm_head_m16_tc = false
# `w8a16_gemv_batch16_ncol{2,4}` on the decode attention projections (#927).
# OFF: no receipt, and the kernel is not in this target's tree.
attn_ncol_gemv = false
# The fused dense-FFN gate+up decode GEMM (#927). OFF and INERT: its
# strided-SiLU consumer is Hopper-owned and not linked here.
ffn_gateup_fused = false
# Quantize a plain-BF16 dense checkpoint's FFN to 128x128 block-scaled FP8 at
# load (`weight_loader/qwen35_dense/fp8_from_bf16.rs`). OFF, the baseline,
# until Ada has a receipt: it changes numerics. It is the row expected to flip
# first, because it is what lets the reference part hold the model it is for:
# a 4B Holo's FFN is 4.53 of its 8.68 GB in BF16, and E4M3 halves it in VRAM
# and in every bandwidth-bound decode step. The receipt that flips it to true:
# `examples/fp8_ada_microtest.rs` all PASS, then logit agreement of
# `AVAROK_DENSE_FP8_FROM_BF16=1` against the BF16 default on both holo
# targets, then decode and prefill tok/s against the same switch.
dense_fp8_from_bf16 = false
# The same load-time BF16 -> 128x128 block-scaled FP8 quantization for the GDN
# projections, `in_proj_qkvz` and `out_proj`
# (`weight_loader/qwen35_dense/gdn_fp8_from_bf16.rs`), served on the
# native-FP8 GDN arms: `fp8_gemv_ada` at M=1 decode, the batched W8A16 GEMVs
# at verify, `fp8_gemm_ada_w8a8` at prefill. OFF until Ada has a receipt: it
# changes numerics, and GDN errors feed a recurrent state. On a 4B Holo the
# GDN projections are 2.0 GB of BF16 read per decode token. The receipt that
# flips it: logit agreement of `AVAROK_GDN_FP8_FROM_BF16=1` against BF16 on
# both holo targets plus a long-context degeneration check, then tok/s.
gdn_fp8_from_bf16 = false
# The same quantization for the full-attention q/k/v/o
# (`weight_loader/qwen35_dense/attn_fp8_from_bf16.rs`): `fp8_gemv_ada` at M=1
# decode, `fp8_gemm_ada_w8a8` at prefill, including the chunk-0 Q/K/V chain
# without `AVAROK_CUBLAS_GEMM=attn` (with FP8 weights and only the W8A16 tile
# GEMMs, prefill on this part would be slower than today's BF16). OFF until
# Ada has a receipt: logit agreement of `AVAROK_ATTN_FP8_FROM_BF16=1` against
# BF16 on both holo targets, then tok/s. 0.59 GB of BF16 per 4B decode token.
attn_fp8_from_bf16 = false
# The BF16 dense-FFN PREFILL on the cuBLASLt BF16 GEMM instead of the
# hand-written `dense_gemm_tc`, which is very slow on sm_89. ON, on an
# end-to-end A/B on the RTX 4060 Ti 16 GB (same binary and flags, one env
# change, `AVAROK_CUBLAS_GEMM=ffn` against unset), 3,921-token prompt:
# Qwen3.5-0.8B prefill 8,199 -> 13,113 tok/s, Qwen3.5-4B 795 -> 3,677 tok/s,
# decode unchanged. Same numerics class: BF16 in, FP32 accumulate. Narrower
# than `AVAROK_CUBLAS_GEMM=ffn`: the W8A8 FFN prefill and the MoE shared
# expert keep their own kernels. A set `AVAROK_CUBLAS_GEMM` (any value, `off`
# included) decides instead of this row; `AVAROK_FFN_BF16_CUBLAS_PREFILL=0`
# is the A/B against `dense_gemm_tc`.
ffn_bf16_cublas_prefill = true
# The MTP-verify GDN projections of a BF16-kept GDN layer (the Qwen3.5 dense
# Bf16Raw load) on ONE cuBLASLt BF16 GEMM over all rows: `in_proj_qkvz` at 3+
# rows (today one `dense_gemv` per row at 3 and 4) and `out_proj_dense` at 2+
# rows (today the scalar `dense_gemm`). OFF: a NUMERICS row (cuBLASLt
# reassociates, so verify logits move) with no receipt yet.
# `AVAROK_GDN_BATCHED_GEMM=1` is the A/B.
gdn_batched_gemm = false
# Output-gated dense-BF16 attention Q/K/V (Qwen3.5) on the batched
# `dense_gemv_batchm` tier in multi-seq decode, instead of one GEMV per stream.
# ON: bit-identical here, not merely close. `dense_gemv_bf16_batchm` keeps
# `dense_gemv_bf16`'s per-row K order and reduction tree, both are the same
# source (ada/common symlinks to gb10/common), and ada/common builds with
# `--fmad=false`; the deinterleave is a permutation. It removes n-1 of the n
# Q/K/V weight passes per step. `AVAROK_ATTN_GATED_BF16_BATCHM=0` is the A/B.
attn_gated_bf16_batchm = true
# Memory sizing for a 16 GB card with a desktop beside the serve. ON, from the
# RTX 4060 Ti 16 GB boot logs (Qwen3.5-4B): the BF16 load peaks at 1.014x its
# on-disk size against a generic 1.3x budget (the serve needed
# `--oom-guard-mb 1024`); a Qwen MTP head allocates about 64 MB outside the
# other reserve terms against a flat 4 GiB headroom (BF16 + `--speculative`
# at 4k was refused at the KV stage); a plain serve kept the 0.225 GiB
# `mtp.*` block resident; and the draft LM head held 148,070 rows
# `--mtp-vocab 100000` never reads. `AVAROK_MEMORY_FIT_CONSUMER=0` is the A/B
# against the sizing every other target keeps.
memory_fit_consumer = true
# Upper M for the W8A8 block-scaled dense-FFN prefill (#917). No cap
# (u32::MAX, the baseline): Ada has no receipt either way. GB10's cap is a GB10
# measurement and is not copied here.
w8a8_prefill_max_m_widening = 4294967295
w8a8_prefill_max_m_narrowing = 4294967295
# ── Port sprint rows (port/consumer-opt) ──
# The port sprint's rows (`crates/avarok-kernels/build_defaults_port.rs`). Each
# is false, or its baseline, until a GPU receipt on this card flips it. Rows
# are inserted immediately before the marker line below.
# Collect the per-request logprob confidence summary (mean top-1 probability,
# minimum top-1 margin, fraction of tokens with top-1 below 0.5, over the
# first AVAROK_CONF_SUMMARY_K generated tokens, default 32) for every chat
# request and feed the atlas_conf_* series on /metrics. It never changes
# sampling or the token stream; it makes the scheduler extract top-2 logprobs
# for the first K tokens of each request, which uses the host-logits path for
# those tokens instead of the GPU argmax, so it stays off until the receipt
# shows no tok/s change. A request that sets atlas_confidence gets the summary
# in usage.atlas_confidence whatever this row says, and the field appears only
# when asked for. The receipt that may flip it: bench5 with the row on versus
# off within spread, and an equal greedy token SHA.
conf_summary = false
# D-Cut v2 for the batched MTP verify (`scheduler/mtp_dcut_cost.rs`): instead
# of keeping a fixed 0.75 of the optional draft rows, keep the number that
# maximizes expected tokens per second, B* = argmax_B (n + sum of survivals) /
# cost(2n + B), with cost(R) an online EWMA of the measured round wall per
# verify row count and survival taken from a logistic acceptance model of the
# drafter's top-1 confidence fitted while serving by damped Newton-IRLS
# (`scheduler/mtp_accept_estimator.rs`, after vLLM adaptive verification). It
# only chooses how many drafts to verify, so accept and reject stay exact;
# every sequence keeps at least one draft, the width cap (8 sequences) and the
# row budget stay, and until the table is calibrated D-Cut v1's fixed ratio
# runs (with a periodic full-width probe). OFF until the receipt on this card:
# conc A/B at C=1,2,4,8,16 with no loss at any width and a gain of at least 2%
# at C=8. `AVAROK_MTP_DCUT_COST=1` is the A/B;
# `atlas_mtp_dcut_plans_total{source}` shows how many plans the model decided.
mtp_dcut_cost_model = false
# When a batched decode or batched verify CUDA-graph cache is full and misses,
# update its least-recently-used executable in place with cuGraphExecUpdate
# when the new capture has the same topology, instead of destroying it and
# instantiating the capture (`model/trait_impl/graph_family.rs`). Same keys,
# same LRU order, and a replay runs the new capture's parameters, so greedy
# output is bit-identical by construction. OFF until the receipt on this card:
# greedy SHA equal at C=1 and C=8 and `atlas_graph_instantiations_total` flat
# after warmup (`AVAROK_GRAPH_COUNTERS=1` reads the row-off arm's churn).
# `AVAROK_GRAPH_EXEC_UPDATE=1` is the A/B.
graph_exec_update = false
# GDN write-on-accept for the batched speculative verify. With it on, the MTP
# batched K-row verify asks for the write-on-accept twin on uniform K = 2..4
# batches and folds every verdict's accepted rows into the GDN state once,
# after the verdict and before its commits
# (`scheduler/verify_k4_batch_step.rs`), instead of the parent kernel writing
# every intermediate state and a partial accept copying one back: per step and
# head 2 reads + K writes (+1 restore copy) become 1 read + 1 read + 1 write.
# K = 4 uses the existing pair (`gated_delta_rule_wy4_woa.cu`); the other
# widths (2, 3 and 5..16, which also serve the DFlash batched verify) use the
# Ada K-generic twin and fold
# (`kernels/ada/common/gated_delta_rule_wyn_woa.cu`). `AVAROK_GDN_WOA=1` is
# still required, and the f16 h-state, `--exact-verify` and ragged D-Cut
# batches keep the parent kernels. Claimed bit-identical (same expressions and
# order as each parent under `--fmad=false`). OFF until the receipt on this
# card: `gdn_woa_oracle` and `gdn_wyn_woa_oracle` all PASS (bit-equal), greedy
# texts identical to row-off at C=8, a conc A/B gain at C=2/4/8, and no
# SimHash semantic-loop watchdog fires at C=4 and C=8 (the unexplained DFlash
# write-on-accept fault behind `AVAROK_GDN_WOA` being opt-in,
# `gdn_flags::gdn_woa_enabled`). `AVAROK_GDN_WOA_MTP=1` (with
# `AVAROK_GDN_WOA=1`) is the A/B; `atlas_gdn_woa_folds_total{k}` counts the
# folds.
gdn_woa_mtp = false
# Which LM-head rows the MTP draft-only NVFP4 head holds. id: the first
# --mtp-vocab token ids, the head every target has always built. freq: the
# --mtp-vocab most frequent tokens of the Cinference-derived ranking
# (crates/spark-model/data/mtp_vocab_rank_qwen35.*, Apache-2.0 data, token
# counts by NInfer authors, source corpus not published), the tokenizer's
# added tokens forced in, with the drafter's argmax rows mapped back to token
# ids on the device (kernels/ada/common/draft_vocab_remap.cu). Held-out
# coverage at 100,000 rows: 98.1% against 86.2% for the first ids; the first-N
# head can never draft <|im_end|>, <think> or a tool-call tag. Only drafts
# change, every one is verified by the main head, so outputs are those of the
# id head. It applies only when the served tokenizer.json is one the ranking
# was verified for (Qwen3.5) and the remap kernel is in the build; otherwise
# it logs once and keeps id. CLI --mtp-vocab-rank {id,freq}. Off until the
# receipt: greedy token SHA equal id vs freq, and MTP acceptance up per
# category on the L03 corpus.
mtp_vocab_rank = "id"
# Run the MTP propose chain device-resident: each draft position after the
# first gathers its input embeddings on the device from the previous
# position's ids, and the round reads every draft back once, instead of one
# blocking readback per draft (per-sequence propose) or per position (batched
# propose). The same kernels run on the same bytes, so drafts and outputs are
# bit-identical; only host waits go. It covers grammar-free rows with 2 to 16
# drafts and declines when the draft-confidence, shadow top-k or debug-norm
# diagnostics are armed, since those read logits on the host by design. Off
# until the receipt: greedy token SHA equal at C=1 and C=8, and the propose
# phase time (L06 device phases) down beyond the ABBA bound.
mtp_propose_graph = false
# Pick MTP verify positions on the device
# (kernels/ada/common/spec_accept_sample_ada.cu, lane L12) instead of copying
# the [K, vocab] BF16 verify logits to the host and running the pre-sample
# pipeline there. It covers rows with no grammar, no logit_bias, no live LZ or
# DRY penalty and no stateful thinking stage (F2 confidence stop, an armed
# forced think end, the legacy tool-call pin); the pipeline's masks, penalties
# and biases travel as a sparse edit list, and every other row keeps the host
# pipeline, counted by reason in atlas_mtp_device_accept_fallback_total.
# Greedy picks are bit-identical to the host pipeline; sampled picks are
# distribution-exact, not bit-identical (decision D10: the RNG is keyed by
# seed and position, not the host sampler's stream). Only Ada builds the
# kernel; any other target has no module and keeps the host pipeline with one
# log line. Off until the receipt: spec_accept_oracle (greedy equal, sampled
# chi-square), qual.py top-20 KL and a sampled-pick chi-square against the
# host, and steady C=8 sampled waves no slower.
mtp_device_accept = false
# Copy drafter for MTP speculative rounds
# (`spark-server/src/scheduler/copy_draft/`): a per-sequence index over
# committed tokens (16/8/4/2-token windows, latest earlier occurrence,
# backward match extension, period continuation) proposes the tokens that
# followed an earlier copy of the context. `chain` replaces the MTP verify
# chain with the copy chain of the same width when the source agrees on at
# least --copy-draft-min-match tokens (8) and the per-request yield gate says
# it pays; `rounds` verifies a confident copy (per-window estimate >= 0.96) of
# up to --copy-draft-max-len tokens (15) alone through the variable-width
# verify, single sequence only; `auto` does both; with the row on, the legacy
# --ngram-speculative mode also answers from an incremental index that returns
# the token its scan returns. The target verifies every copied token through
# the same pipeline, so outputs stay the target's own, and grammar-constrained
# rows never take a copy plan. OFF until the receipt on this card: greedy
# token SHA equal to off on the 8 agreement prompts and the copy fixture, a
# gain on the copy cell, and no code, chat or long-context cell slower than
# off beyond its spread. `AVAROK_COPY_DRAFT=chain|rounds|auto` is the A/B; the
# `atlas_copy_*` series show how often a copy ran and how much of it was
# accepted.
copy_draft = "off"
# The dense FFN's FP8 speculative-verify rows (M = 2..8) on the sm_89 batch-M
# GEMVs (kernels/ada/common/fp8_gemv_ada_batchm.cu,
# layers/dense_ffn_ada_kernels/verify.rs): one pass over each FP8 weight for
# all M rows, through the same down arm the M=1 decode forward takes, instead
# of the prefill ladder (w8a16_gemv_batch4 at M <= 4, the padded tile GEMMs or
# the lossy W8A8 arm at M 5..8). Every row is byte-identical to M launches of
# fp8_gemv_ada, so a verify row's FFN output equals the decode output for the
# same token; at M <= 4 that is also what the ladder computes today, at M 5..8
# it moves verify logits toward the decode values. Only targets that compile
# the module can take it (no lookup elsewhere). Off until the receipt:
# examples/fp8_ada_batchm_microtest.rs all PASS, greedy token SHA equal at
# --num-drafts 3 with the row on and off, and the verify time
# (AVAROK_MTP_TIMING) down at --num-drafts 3 and 5.
ffn_fp8_verify_gemv = false
# The sm_89 FP8 decode and verify GEMVs load their weights with an explicit
# evict-first L2 policy (createpolicy.fractional.L2::evict_first on
# ld.global.nc.L1::no_allocate.L2::cache_hint; the _l2ef twins in
# kernels/ada/common/fp8_gemv_ada.cu and fp8_gemv_ada_batchm.cu, after
# Cinference, Apache-2.0), so the once-read weight stream stops displacing the
# activations, scales and the next layer's GDN state from the 32 MB L2. Output
# bits are unchanged; only the cache policy moves. Cinference reports a CUDA
# 13.1 ptxas fault on hinted loads, so the hint is compiled out on 13.0 and
# 13.1, and CUDA 13.3 is unvalidated. Off until the receipt: the SASS check
# (every hinted LDG carries a written cache-policy operand),
# examples/fp8_ada_l2hint_microtest.rs all PASS, then a bench5 ABBA decode
# gain beyond the bound.
l2_evict_first_weights = false
# The prefill FFN-norm of a Qwen3 / Qwen3.5 layer (residual add + offset
# RMSNorm) also writes the dense FFN's W8A8 gate/up activation, E4M3 codes and
# 1x128 FP32 scales, in the same launch
# (kernels/ada/common/rmsnorm_quant_fp8_ada.cu,
# layers/dense_ffn_w8a8_prefill/norm_fused.rs), so per_token_group_quant_fp8
# and its re-read of the normed rows go. Taken only where the FFN's gate and
# up both take the W8A8 arm and nothing else runs between the norm and the
# FFN; bytes equal to the unfused pair. Off until the receipt:
# examples/rmsnorm_quant_fp8_microtest.rs all PASS on all five outputs, greedy
# token SHA equal on the FP8 FFN route, and a TTFT ABBA gain at a 3,921-token
# prompt.
rmsnorm_fp8_quant_fused = false
# When a 4-bit BF16 load route is on (dense_affine4_from_bf16,
# gdn_affine4_from_bf16, attn_affine4_from_bf16), every projection the Marlin
# kernels serve (N a multiple of 64, K of 128, more than one group) is
# quantized once at load by round-to-nearest int4 at group 128 (GPTQ's
# symmetric uint4b8 grid, --w4-clip-search shrink candidates per group)
# instead of the MLX affine codes, and served through W4Linear on vLLM's
# Marlin W4A16 GEMM (kernels/ada/common/marlin_ada.cu, host
# crates/spark-model/src/port/marlin/): decode and verify rows 1..64 in one
# launch on one thread configuration fixed per weight (row invariant), prompts
# on vLLM's M split. A projection Marlin does not serve keeps the affine
# quantizer (one log line). 4.125 bits a weight (a bf16 scale per 128 inputs)
# against affine's 4.5 at group 64. It changes nothing on a target without the
# marlin_ada module (every non-Ada target) and nothing when no 4-bit route is
# on. Round-to-nearest int4 is a numerics change, so it is off until
# marlin_ada_microtest passes on the card (every entry within 2 BF16 ulps plus
# the FP32 term bound at M = 1, 8, 16, 17, 32, 64, row invariance across M)
# and the KL gate on the 4B (teacher-forced NLL delta at most twice the FP8
# FFN route's, full-vocabulary KL mean at most 0.05, coherence, MTP drafted
# output equal to plain at temperature 0); GPTQ and AWQ checkpoints, whose
# codes are the checkpoint's, load through the same kernels at the packed
# install sites.
marlin_w4a16 = false
# A dense Qwen3.5-family GGUF (arch qwen35) keeps its IQ4_XS, Q4_K and Q6_K
# projections as the file's raw super-blocks in VRAM (the dense FFN, the
# full-attention q/k/v/o, and the two GDN input projections with their
# value-head row reorder applied to the packed bytes), tagged
# WeightDtype::Iq4Xs / Q4K / Q6K for the sm_89 keep-packed decode GEMVs (M =
# 1..8) and MMQ prefill GEMMs (kernels/ada/common/kquant_mmvq_q4_ada.cu,
# iq4_xs_mmq_ada.cu, kquant_q8_1_ada.cu over the vendored llama.cpp MIT
# engine; host port/gguf_q4/), instead of expanding them to BF16 at 2 bytes a
# weight. IQ4_XS, IQ4_NL and Q5_K tensors the route does not keep are expanded
# on the GPU (dequant_iq4xs_q5k_bf16_ada.cu, bit-exact with the CPU decoder),
# and the file's MTP head (blk.<L>.nextn.*) is mapped to the mtp.* names. Off:
# the container refuses IQ4 types as before and the loader is byte-identical.
# Off until the receipt: examples/iq4xs_gemv_microtest.rs all PASS (dequant
# bitwise, GEMV and MMQ within the float64 bound, row invariance), the R2 and
# R3 bars (M = 1 at 85% of 288 GB/s, M = 8 within 25% of M = 1), and a KL
# check against BF16 on a Qwen3.5-4B or Qwen3.8-27B IQ4_XS GGUF.
gguf_native_iq4 = false
# EXL3 trellis matrices (ExLlamaV3's QTIP-style codes, 1 to 8 bits a weight
# with mul1 half-bit steps, read by spark-runtime's weights/exl3 reader) are
# served from their packed codes on sm_89: the input rotated into the Hadamard
# domain (exl3_hadamard_ada.cu), the decode-row linear decoding each 16 x 16
# tile straight into mma fragments for 1 to 128 rows with split-K partials
# (exl3_linear_ada.cu), and longer prefills declined to the BF16 dequant and
# the caller's GEMM (host port/exl3/, after ExLlamaV3 MIT via TensorFold
# Apache-2.0). Off: port::exl3::from_exl3_tensors refuses and route_enabled is
# false, so no loader builds an EXL3 weight and every target is unchanged. Off
# until the receipt: examples/exl3_microtest.rs all PASS (dequant byte-equal
# to the host mirror at every width, the linear within the float64 bound at M
# = 1..128, row invariance, the five-run repeat), one real tensor of
# turboderp/Qwen3.8-27B-exl3 dequantized byte for byte (--real-dir), and a KL
# check of the 27B at 3.0 / 3.5 bpw against its BF16 source once a loader
# route installs EXL3 weights.
weights_exl3 = false
# On a plain-BF16 dense Qwen3.5 checkpoint (Holo 3.1 0.8B and 4B), the dense
# FFN's gate, up and down are quantized once at load by the GPU quantizer into
# MLX affine codes (a bf16 scale and bias per group of inputs; --w4-bits and
# --w4-group, default 4 bits at group 64, 4.5 bits a weight), each BF16 source
# freed right after its own quantize, and served through W4Linear: decode and
# verify rows 1..16 on TensorFold's lane MMA GEMV
# (kernels/ada/common/affine4_lane_ada.cu), prompts on the affine prompt GEMM
# or a BF16 dequant plus cuBLASLt
# (weight_loader/qwen35_dense/affine4_from_bf16.rs). On the 4B it keeps 1.27
# GB of FFN weights where BF16 keeps 4.53 GB and FP8 2.27 GB, which is what a
# bandwidth-bound decode step reads. It declines on tensor parallel, a pending
# LoRA adapter, an unserved width and group, or absent kernels (every non-Ada
# target), and dense_fp8_from_bf16 wins when both are on. Round-to-nearest
# 4-bit is a numerics change, so it is off until the D7 receipt on the 4B:
# teacher-forced NLL delta at most twice the FP8 FFN route's, full-vocabulary
# KL mean at most 0.05, coherence and 4K/8K recall pass, and MTP drafted
# output equal to plain at temperature 0.
dense_affine4_from_bf16 = false
# On a plain-BF16 dense Qwen3.5 checkpoint, each GDN layer's [Q|K|V|Z]
# in-projection (the loader's BF16 concat) and out_proj are quantized once at
# load to MLX affine codes (the common --w4-bits and --w4-group, or
# AVAROK_W4_GDN_GROUP for these projections alone, for example 32), each BF16
# source freed after its own quantize, and served through W4Linear on the same
# kernels (weight_loader/qwen35_dense/gdn_affine4_from_bf16.rs). On the 4B the
# 24 GDN layers keep 0.57 GB where BF16 keeps 2.01 GB. The same declines as
# the FFN route; gdn_fp8_from_bf16 wins when both are on. A projection error
# feeds the recurrent state, so it is off until the D7 receipt plus a
# long-context degeneration check (longctx.py recall at 4K and 8K, no drift
# the BF16 serve does not share).
gdn_affine4_from_bf16 = false
# On a plain-BF16 dense Qwen3.5 checkpoint, each full-attention layer's q
# (doubled when gated), k, v and o are quantized once at load to MLX affine
# codes (--w4-bits, --w4-group), each checkpoint tensor freed after its own
# quantize, and served through W4Linear on the same kernels
# (weight_loader/qwen35_dense/attn_affine4_from_bf16.rs). On the 4B the 8
# attention layers keep 0.17 GB where BF16 keeps 0.59 GB. The same declines as
# the FFN route; attn_fp8_from_bf16 wins when both are on. A numerics change,
# independent of the FFN and GDN rows; off until the D7 receipt with the FFN
# and GDN routes on.
attn_affine4_from_bf16 = false
# The affine routes' prompt GEMM (more than 16 rows) quantizes the activation
# rows to int8 per group and runs the W4A8 int8 tensor-core GEMM over the same
# 4-bit codes (kernels/ada/common/affine_prefill_ada.cu,
# port::affine::prefill) instead of the BF16-activation prompt GEMM; a chunk
# with a non-finite or overflowing activation group falls back to BF16 and is
# counted. Only 4-bit affine weights have it, and it changes nothing unless an
# affine route row is on. Int8 tensor cores run at twice the FP8 rate on Ada,
# so the 4B FFN prompt GEMMs are expected faster than the FP8 W8A8 route's.
# Off until the receipt: prompt-row full-vocabulary KL against BF16 within the
# D7 bound and a TTFT ABBA gain at a 3,921-token prompt against the same
# routes with the row off.
affine4_prefill_int8 = false
# On a plain-BF16 dense Qwen3.5 checkpoint (Holo 3.1 0.8B and 4B), the dense
# FFN's gate, up and down are quantized once at load with the existing NVFP4
# quantizer (E2M1 codes, E4M3 per-16 scales, one F32 tensor scale; 4.5 bits a
# weight), each BF16 source freed right after its own quantize, and served
# through W4Linear over the w4a16_gemv family every CUDA target already
# compiles (weight_loader/qwen35_dense/nvfp4_from_bf16.rs, port/w4/nvfp4.rs):
# decode and verify rows 1..16 on w4a16_gemv / _batch2 / _batch3 / _batchN
# (row invariant by construction), prompts on w4a16_gemm or a BF16 dequant
# plus cuBLASLt. On the 4B it keeps 1.27 GB of FFN weights where BF16 keeps
# 4.53 GB and FP8 2.27 GB. The FP8 FFN route and the affine 4-bit FFN route
# both win over it; it declines on tensor parallel, a pending LoRA adapter, or
# absent kernels. Ada has no FP4 datapath, so whether the software-dequant
# GEMV reaches the bandwidth that makes this a win was never measured; off
# until queue row Q2 shows at least 85% of the measured DRAM bandwidth at M=1,
# then the D7 gate (teacher-forced NLL delta at most twice the FP8 FFN
# route's, full-vocabulary KL, coherence, recall).
dense_nvfp4_from_bf16 = false
# The input embedding table (one row read per token) is copied once at load
# into page-locked host memory and the model reads it through the region's
# device-visible alias, so every existing gather, the MTP head's device-side
# embed_from_argmax included, keeps working over PCIe, and the device copy is
# freed after the loader's prune step
# (crates/spark-model/src/port/embed_host/). The central single-row embed
# copies the row from the host table. Same bytes, so it is bit-identical by
# construction; it frees 2.37 GiB of VRAM on Qwen3.8-27B, which is what lets
# the 27B fit a 16 GB card. It declines for a tied LM head, a table that is
# not BF16, or a backend that refuses mapped memory (Metal, and possibly WSL2
# for a region this large), and a refusal fails a --speculative start. Off
# until the receipt: greedy token SHA equal with the row off and on, solo and
# at C=8, and the freed VRAM in the boot ledger (bench/pass.d/L24.sh).
embed_host_offload = false
# Batched sequence swap
# (`spark-model/src/model/trait_impl/sequence/state_io.rs`,
# `spark-runtime/src/kv_cache/block_io.rs`): a swapped-out sequence's image
# (each block's K and V for every attention layer, then each GDN layer's h and
# conv state) is gathered with batched async copies (`cuMemcpyBatchAsync`
# where it resolved, else one async copy per region and one event wait per
# chunk) into one reused page-locked staging buffer of at most one
# `--pinned-pool-chunk-mb` chunk, and the file write of one chunk overlaps the
# copy of the next; restore mirrors it. The file is byte-identical to the
# per-region path, so either reader reads either writer's file. OFF until the
# receipt on this card: `kv_swap_roundtrip` (queue row Q9) passes G1 and G2 at
# 1K, 4K and 32K tokens and G3 at 32K, batched >= 5x the per-region path and
# >= 8 GB/s for save and restore. `AVAROK_KV_SWAP_TIMING=1` logs one line per
# image on either path.
kv_batched_swap = false
# SSM tier blob store eviction order
# (`spark-model/src/model/ssm_tier/store.rs`): a capped host-RAM
# `MemBlobStore` gives up the least recently used blob (a fault-in hit and a
# put both make a key the most recent) instead of the oldest insert, and the
# model removes the tier blobs the snapshot index orphans when a fresh save
# re-homes a spilled prefix or the tail sweep drops one
# (`spark-runtime/src/radix_tree/snapshot_insert.rs`). Only matters with the
# SSM tier on (`AVAROK_SSM_TIER`): no entry is ever spilled without it. OFF
# until the receipt on this card: the reuse ladder (queue row Q10, rung C)
# shows no tok/s, TTFT or SSM-hit loss against off. Outputs are unchanged
# either way: a missing blob is a recompute.
ssm_store_lru = false
# Host-RAM KV tier (`spark-runtime/src/kv_host_tier/`, glue
# `spark-model/src/model/kv_tier_glue.rs`): every full prompt block the prefix
# cache newly holds is copied to a pinned host pool on a dedicated copy stream
# (one extra block reference keeps the block alive until its D2H completed),
# and a later prompt whose prefix the GPU cache already evicted restores those
# blocks by one batched H2D into fresh blocks that re-enter the radix tree, so
# its prefill sees an ordinary GPU hit. On a hybrid model the restore ends at
# the block holding an SSM snapshot past the GPU match and loads nothing
# without one. It serves only with this row on AND a `--kv-host-tier-gb`
# budget AND the prefix cache on (`--hermetic` closes it), so the row alone
# changes nothing. OFF until the receipt on this card: a multi-turn run with a
# shrunk KV pool shows tier hits, restored tokens about equal to the evicted
# prefix, greedy output and top-5 logprobs equal to a never-evicted HBM-hit
# run, TTFT within 3x of the HBM hit and at least 10x better than recompute,
# and 4-stream decode within 2% of the tier off. `AVAROK_KV_HOST_TIER=1` plus
# `--kv-host-tier-gb N` is the A/B; the `atlas_kv_tier_*` series show
# residency, hits, restores and gate declines.
kv_host_tier = false
# Asynchronous host-tier KV restore (spark-server scheduler/restore_queue.rs,
# lane L27): a new request whose prefix the host KV tier (kv_host_tier)
# restores is parked outside the batch while its host-to-device copy runs on
# the tier's copy stream, every other sequence keeps its decode ticks, and the
# request re-enters the front of the pending queue at the top of the tick
# after the copy finished, then admits as an HBM prefix hit. A failed, stuck
# (10 s) or past-deadline restore admits the request for recompute; a client
# that disconnects while parked is dropped and its restore finishes in the
# background; a request is parked at most once. It only reorders when a
# request is admitted, so outputs are unchanged. OFF until the receipt on this
# card: reuse.py mixed (4 decoding streams plus one 12K-token restore) with
# decode p99 inter-chunk gap during the restore no worse than the synchronous
# arm's and within 1.5x of the no-restore baseline, and
# atlas_kv_restore_parked_total > 0.
kv_restore_async = false
# Disk tier and warm restart for the host KV tier (spark-runtime
# kv_host_tier/disk.rs, lane L27): blocks the host tier evicts are demoted to
# one record file each under --kv-tier-dir (temp file plus atomic rename,
# O_DIRECT when aligned with a logged buffered fallback, budget
# --kv-tier-disk-gb, least recently used first), a later lookup promotes them
# back after checking the record's checksums, and a restarted server adopts
# the records a previous run wrote for the same model fingerprint. Needs the
# host tier (kv_host_tier) and both flags; refused under --hermetic, since it
# carries KV state across restarts. OFF until the receipt on this card: the
# restart test (prime, stop, start, query) shows
# atlas_kv_tier_disk_adopted_total > 0 and atlas_kv_tier_disk_hits_total > 0
# with greedy output equal to the primed run, and a promote is faster than
# recomputing the same prefix.
kv_tier_disk = false
# Radix prefix-cache eviction takes its victim from an ordered (last_access,
# node id) index of evictable leaves, maintained at every transition of the
# victim predicate, instead of scanning every node once per evicted block
# (`spark-runtime/src/radix_tree/inner/lru_index.rs`). Ties break toward the
# lowest node id exactly as the scan does, so the victim sequence is identical
# by construction and by a randomized oracle
# (`radix_tree/tests/lru_index.rs`). OFF until the receipt on this card:
# greedy SHA equal and `atlas_prefix_evict_seconds_total` per victim down at
# least 10x on a saturated pool (`AVAROK_PREFIX_EVICT_TIMING=1` times the
# row-off scan arm). `AVAROK_RADIX_LRU_INDEX=1` is the A/B.
radix_lru_index = false
# A prefix-cache hit may end inside a KV block: the chunked prefill copies
# that block into a private block (every attention layer's K and V, D2D on the
# prefill stream before the block table is used) instead of sharing the
# donor's writable tail, which is the issue #1193 aliasing bug
# (`radix_tree/inner/cow_walk.rs`, `prefill_b/prefix_cow.rs`). Saves up to
# block_size - 1 prefill tokens per warm hit and lets an exact repeat of a
# non-aligned prompt reach its leaf snapshot. Never in a multi-rank world or
# under --high-speed-swap. `AVAROK_PREFIX_SUBBLOCK` (0, 1, cow) still wins
# when set. OFF until the receipt on this card: the #1193 shape at C=4
# (identical prompts, MTP on) equal to cache-off at temperature 0 and free of
# cross-stream identity at 0.7, and prefix-repetition TTFT no worse.
# `AVAROK_PREFIX_COW_TAIL=1` is the A/B.
prefix_cow_tail = false
# Quest page-sparse decode attention (`spark-model/src/port/sparse_quest/`,
# `kernels/ada/common/attn_page_sparse_ada.cu`), plugged into the
# sparse-attention seam: per attention layer, 64-token page and KV head the
# channel min and max of the keys (f16, kept in the slot of the page's first
# physical block, charged to the KV budget at model build), and per decode or
# verify step the Quest bound `sum_c max(q_c*kmin_c, q_c*kmax_c)` of every
# page; the step attends only to the first `--attn-sparse-sink-pages` pages,
# the `--attn-sparse-topk-pages` best pages and the last
# `--attn-sparse-recent-tokens` tokens through a compacted block table, once
# the context passes `--attn-sparse-min-ctx` (below it the view is the dense
# table, bit-identical). APPROXIMATE, so OFF on every target and never default
# on; the module exists only in the Ada image (elsewhere the row logs once and
# attention stays dense). The receipts that only ever record it (never flip
# it): `examples/page_sparse_microtest.rs` PASS (summary bytes, scores, exact
# top-k sets, the identity gate bit-identical), then the L02 NIAH grid at
# 32K/64K/128K/262K, decode ms/step against context, perplexity drift and one
# agent task at 64K+ (queue row Q15).
attn_page_sparse = false
# Bounded KV view (APPROXIMATE; `spark-model/src/port/kv_view/`, core
# `spark-runtime/src/kv_select/` and `kv_cache/sketch.rs`, kernels
# `kv_view_table_ada.cu`, `kv_page_sketch_ada.cu`, `kv_page_score_ada.cu`;
# KVMem's idea, arXiv:2609.04852, implemented independently): once per user
# turn, at the end of the final user message's prefill, the context's
# 128-token blocks are scored against that message's last query rows
# (page-softmax over a per-page pre-RoPE mean-key sketch) and the
# full-attention layers' decode and verify attention then reads only the view
# (sink, the recent window, the question and the best blocks within
# `--kv-view-budget-tokens`, plus every token appended after), and so do the
# paged prefill chunks of the conversation's next turn; GDN layers and the MTP
# head stay dense, the first output token comes from the full prefill. It
# serves only with this row on AND a budget, and only on Ada (the table kernel
# is an Ada override). OFF on every target and never flipped in this sprint:
# changing answers is the price, and the bar for any future default is needle
# recall at least 95% of dense at 5 depths x 16K-128K with a 16K view and
# multi-needle within 2 points. `AVAROK_KV_VIEW=1` plus
# `--kv-view-budget-tokens 16384` is the A/B; the `atlas_kv_view_*` series
# show selections, view tokens, recall mass and skips by reason.
kv_view_selection = false
# @port:defaults

# ── Kernels this target owns ───────────────────────────────────────────────
#
# Every other entry in `common/` is a relative symlink into kernels/gb10/common
# (the kernels are written to an SM80-class floor: mma.sync.m16n8k16,
# cp.async.cg). These are the files Ada holds as real sources, because the gb10
# source cannot assemble for sm_89 and editing it would move the PTX (and the
# closure hash) of every target that inherits it. Each one's own header says
# what differs from the gb10 file it replaces.
#
#   prefill_dyn_smem.cuh     ADDITION. One `extern __shared__` buffer the
#                            prefill tiles below are laid over, and the macro
#                            that exports each entry's launch size as
#                            `<entry>_dyn_smem_bytes` for the registry
#                            (`avarok_core::registry_dyn_smem`).
#
#   inferspark_prefill.cu,   The BR=32 and BR=64 contiguous and paged prefill
#   inferspark_prefill_fp8kv.cu,  attention tiles: 66,560 to 90,208 bytes of
#   prefill_paged_compute.cuh,    static `__shared__`, which ptxas refuses
#   prefill_paged_compute_asym.cuh  above 0xc000 (48 KiB) for any arch without
#                            an `a` suffix, and Ada has none ("Entry function
#                            'inferspark_prefill_64' uses too much shared data
#                            (0x16000 bytes, 0xc000 max)": 22 modules, 42
#                            entry points, the same 22 stems gb10's sm_121f
#                            gate run reports in docs/HARDWARE.md). The tiles
#                            are the same bytes in the same order, moved to
#                            dynamic shared memory (opt-in up to 99 KiB per
#                            block on sm_89); the kernel bodies are unchanged.
#                            The 20 paged `.cu` files stay symlinks: their
#                            `#include "prefill_paged_compute*.cuh"` resolves
#                            against this directory, so they pick these headers
#                            up. See docs/HARDWARE.md, "PTX arch suffix and the
#                            static shared-memory ceiling".
#
#   gated_delta_rule_fla.cu  The opt-in TMA state spine
#                            (`gated_delta_rule_chunk_delta_h_tma`, behind
#                            AVAROK_GDN_TMA=1) uses `cp.async.bulk.tensor` and
#                            `mbarrier.arrive.expect_tx`, which need sm_90.
#                            That spine and its helpers sit inside
#                            `#if __CUDA_ARCH__ >= 900`; nothing else in the
#                            file changes. The lookup is a try_kernel whose
#                            absence keeps the scalar spine, and both holo
#                            MODEL.tomls declare it in [expected_absent].
#
#   fp8_gemv_ada.cu,         ADDITIONS. sm_89 drop-ins for the dense FFN's FP8
#   fp8_gemm_ada.cu          W8A16 decode GEMVs (register `cvt.rn.f16x2.e4m3x2`
#                            dequant, no shared-memory LUT) and its W8A8
#                            prefill GEMM (three-stage cp.async, swizzled
#                            ldmatrix). Same arguments, geometry and output
#                            bits as the gb10 kernels they stand in for, which
#                            stay symlinked here; the layer takes the handle
#                            (`layers/dense_ffn_ada_kernels.rs`).
#
#   swiglu_quant_fp8_ada.cu  ADDITION. The W8A8 prefill's SwiGLU and the down
#                            projection's per-token-group FP8 quant in one
#                            pass: the bytes and scales of `moe_silu_mul` then
#                            `per_token_group_quant_fp8`, bit for bit, without
#                            the BF16 product's round trip through DRAM
#                            (`layers/dense_ffn_swiglu_quant.rs`). gb10's
#                            `silu_mul_quant_fp8` stops at K = 2048; the Holo
#                            intermediates are 3,584 and 9,216.
[kernels]
overrides = [
  "fp8_gemm_ada.cu",
  "fp8_gemv_ada.cu",
  "gated_delta_rule_fla.cu",
  "inferspark_prefill.cu",
  "inferspark_prefill_fp8kv.cu",
  "prefill_dyn_smem.cuh",
  "prefill_paged_compute.cuh",
  "prefill_paged_compute_asym.cuh",
  "swiglu_quant_fp8_ada.cu",
  "gated_delta_rule_wyn_woa.cu",
  # draft_vocab_remap.cu  ADDITION (port sprint L11). Maps the MTP draft
  #                       head's argmax rows to token ids in place when the
  #                       head is frequency-ranked (`mtp_vocab_rank = "freq"`),
  #                       before embed_from_argmax and any readback. Looked up
  #                       only under that row, through try_target_kernel, so a
  #                       build without it keeps the id-ranked head.
  "draft_vocab_remap.cu",
  # spec_accept_sample_ada.cu  ADDITION (port sprint L12). Picks MTP verify
  #                       positions on the device: the host pre-sample
  #                       pipeline's masks, penalties and biases as a sparse
  #                       edit list, then the first-index-wins argmax (greedy,
  #                       bit-identical) or one-hot draft acceptance and
  #                       residual sampling (distribution-exact). Looked up
  #                       only under `mtp_device_accept`, through
  #                       try_target_kernel, so a build without it keeps the
  #                       host pipeline.
  "spec_accept_sample_ada.cu",
  "fp8_gemv_ada_batchm.cu",
  "rmsnorm_quant_fp8_ada.cu",
  "gdn_chunk_tc_ada.cu",
  # Affine 4-bit route (port lane L17a; TensorFold lane GEMV, Apache-2.0, see
  # TENSORFOLD-ATTRIBUTION.md). ADDITIONS, no gb10 counterpart. Looked up only
  # through try_target_kernel when an affine route row is on
  # (crates/spark-model/src/port/affine/kernels.rs).
  #   affine4_lane_ada.cu  decode/verify GEMV, M = 1..16, groups 32/64/128,
  #                        single, split-K ticket, seg and many forms
  #   affine_frag_ada.cuh  include-only cp.async, ldmatrix, MMA, code pairs
  #   affine_pack_ada.cu   BF16 -> MLX quantizer, tile pack, scale transpose,
  #                        group sums, BF16 dequant
  "affine4_lane_ada.cu",
  "affine_frag_ada.cuh",
  "affine_pack_ada.cu",
  # Affine 4-bit prompt GEMMs (port lane L17b; TensorFold qmm_prefill.cu and
  # w4a8_prefill.cu, Apache-2.0, see TENSORFOLD-ATTRIBUTION.md). ADDITIONS, no
  # gb10 counterpart. Looked up only when an affine route row is on and a call
  # has more rows than the decode window (crates/spark-model/src/port/affine/
  # prefill_launch.rs); the int8 entries only with affine4_prefill_int8 on.
  #   affine_prefill_ada.cu      BF16-activation prompt GEMM (128x128 tile, 3
  #                              stages, single and _many) and the W4A8 int8
  #                              prompt GEMM (int8 mma, 4 stages, single and
  #                              _many), with the device-side exceptional gate;
  #                              dynamic shared memory through prefill_dyn_smem.cuh
  #   affine_swiglu_sums_ada.cu  int8 activation quantizer (64-input group scale
  #                              and FP32 sum) and the fused SwiGLU + group sums +
  #                              int8 quantizer of the dense FFN's down input
  "affine_prefill_ada.cu",
  "affine_swiglu_sums_ada.cu",
  # Affine widths 2/3/5/6/8 (port lane L17c; TensorFold affine8.cu, Apache-2.0,
  # see TENSORFOLD-ATTRIBUTION.md). ADDITIONS, no gb10 counterpart. Looked up
  # only through try_target_kernel when an affine route row is on AND the route
  # asked for a width other than 4 (--w4-bits); see
  # crates/spark-model/src/port/affine/widths.rs.
  #   affine_n_ada.cu      decode/verify GEMV per width, M = 1..16, group 64,
  #                        unsplit and split-K ticket forms; BF16 -> MLX
  #                        quantizer (clip search as the 4-bit one), the narrow
  #                        and 8-bit tile packers, scale transpose, group sums,
  #                        BF16 dequant
  #   affine_codes_ada.cuh include-only code extraction (bit-sliced pairs, byte
  #                        pairs) and the cp.async/ldmatrix/MMA primitives
  "affine_codes_ada.cuh",
  "affine_n_ada.cu",
  # marlin_ada.cu and its   ADDITIONS (port sprint L18a). vLLM's Marlin W4A16
  # six marlin_*_ada.cuh    GEMM (commit 8a36f08, Apache-2.0; Marlin by Elias
  # headers                 Frantar, IST-DASLab): BF16 activations against GPTQ
  #                         int4 (kU4B8) or AWQ int4 with zero points (kU4),
  #                         group 128, m = 1 to 64 per launch, 30 `extern "C"`
  #                         entries listed in marlin_ada.cu's header. sm_75+
  #                         code (cp.async, ldmatrix, mma.sync m16n8k16, lop3):
  #                         no TMA, no wgmma. Looked up only by the
  #                         `marlin_w4a16` row's host (L18b, off on every
  #                         target), through try_target_kernel, so a build
  #                         without the module keeps every current path. See
  #                         VLLM-MARLIN-ATTRIBUTION.md.
  "marlin_ada.cu",
  "marlin_common_ada.cuh",
  "marlin_dequant_ada.cuh",
  "marlin_dtypes_ada.cuh",
  "marlin_mma_ada.cuh",
  "marlin_scalar_type_ada.cuh",
  "marlin_template_ada.cuh",
