name: Site

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'blog/**'
      # The design tokens both properties import. A change here restyles
      # atlasinference.io AND blog.atlasinference.io, so it has to trigger the
      # build that redeploys them — otherwise the two go out of sync until
      # something unrelated touches one of them.
      - 'web-shared/**'
      - '.benchmarks/**'
      - '.github/workflows/site.yml'
  # No path filter on pull_request: this check joins the required set, and a
  # path-filtered required check never reports on PRs outside its paths,
  # leaving them permanently "expected" and unmergeable.
  pull_request:
    branches: [main, master]
  # Merge queue: queue commits fire none of the events above, and this check
  # is required — without this trigger the entry hangs until timeout.
  # Unfiltered for the same reason as pull_request. The deploy job stays
  # push/schedule-only by its own `if`.
  merge_group:
  # Daily rebuild so the dashboard picks up gate records that landed on
  # branches whose PRs have not merged yet (gen-gates.mjs walks all heads).
  schedule:
    - cron: '17 6 * * *'
  # Manual redeploy. Without this the only ways to refresh production are a push
  # touching the paths above and the 06:17 cron -- so a fix that ships from
  # another repo (the installers, copied from atlas-recipes main at build time)
  # cannot be published on demand. An operator who needs one live has to wait
  # for the cron or fabricate an unrelated site commit to trigger a deploy.
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which trees does this change touch? A PR that only edits the web
  # properties does not need the Rust and CUDA work, but the SKIP has to happen
  # at JOB level: a `paths:` filter on the trigger would stop the workflow
  # running at all, the required check would never be created, and the PR would
  # wait on it forever. Five workflows here carry that lesson in their
  # comments; this is the safe half of it.
  changes:
    name: classify diff (web-only?)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web_only: ${{ steps.classify.outputs.web_only }}
      web_touched: ${{ steps.classify.outputs.web_touched }}
      blog_touched: ${{ steps.classify.outputs.blog_touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole commit graph but no blob contents: `git diff --name-only`
          # compares tree entries, so the file bodies are never needed.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts
      - id: classify
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/classify-diff.sh

  blog-frontmatter:
    # Its own job rather than a step inside `unit`, so it owns a stable check
    # name that can later be promoted to a required context without tangling
    # its verdict with the unit tests'.
    #
    # The job always RUNS and only its steps stand down, so it always reports a
    # conclusion — promotable with no hang risk, and no job-level skip whose
    # fail-open direction has to be audited. `!= 'false'` on the steps: if the
    # classifier errored, blog_touched is empty and the posts get validated
    # anyway.
    name: Blog frontmatter
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bun
        if: ${{ needs.changes.outputs.blog_touched != 'false' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install blog dependencies
        if: ${{ needs.changes.outputs.blog_touched != 'false' }}
        working-directory: blog
        run: bun install --frozen-lockfile
      # Validates every post, not just the changed ones: a category or author
      # removed from content.js invalidates posts nobody touched, and that is
      # the failure a diff-scoped check would miss.
      - name: Validate post frontmatter
        if: ${{ needs.changes.outputs.blog_touched != 'false' }}
        working-directory: blog
        run: bun scripts/check-frontmatter.mjs
      - name: Nothing under blog/ changed
        if: ${{ needs.changes.outputs.blog_touched == 'false' }}
        run: echo "no blog files in this diff — nothing to validate"

  unit:
    name: Site unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `src/lib` only: the e2e specs under `e2e/` need a browser and a served
      # build, and are a separate concern from these.
      - name: Run unit tests
        run: bun test --preload ./test-runes.js src/lib

      - name: Install blog dependencies
        working-directory: blog
        run: bun install --frozen-lockfile

      - name: Run blog unit tests
        working-directory: blog
        run: bun test src/lib

      # The chevron field brightens the page ground behind live text, so its
      # amplitude is an accessibility constraint, not a taste setting. This
      # recomputes the bound from the shader, the tokens and the shipped
      # density and fails if any text token drops below WCAG AA. It is also
      # what stops a token edit on the marketing site from silently pushing
      # the blog's metadata gray under 4.5:1.
      - name: Chevron-field contrast budget
        working-directory: ${{ github.workspace }}
        run: bun .contrast-check.mjs

  build:
    name: Build SvelteKit site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Checkout atlas-recipes (model SSOT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Avarok-Cybersecurity/atlas-recipes
          path: atlas-recipes-src

      # install.sh is versioned alongside the binaries it installs, in
      # atlas-recipes, and copied in here rather than duplicated. It embeds no
      # version — it always resolves releases/latest — so a cached copy stays
      # correct even when it predates the release it installs. Failing the build
      # is right: serving a 404 for the headline command on the front page would
      # be worse than a red pipeline.
      - name: Copy the installers from atlas-recipes
        run: |
          # Both, and both required. The page picks between them by detected
          # OS, so a missing install.ps1 is a 404 served to exactly the
          # visitors who have no other command to fall back to.
          for f in install.sh install.ps1; do
            src="${{ github.workspace }}/atlas-recipes-src/scripts/$f"
            if [ ! -f "$src" ]; then
              echo "::error::scripts/$f is not on atlas-recipes main yet."
              echo "The front page's install command is served from that file, so building"
              echo "without it would ship a 404 for the headline instruction. Merge the"
              echo "atlasctl launcher PR in Avarok-Cybersecurity/atlas-recipes first, then"
              echo "re-run this build."
              exit 1
            fi
            cp "$src" "static/$f"
            chmod 0755 "static/$f"
          done

      # Before the build, against the atlas-recipes checkout above — the corpus
      # this deploy actually ships against, not whatever a local mirror is on.
      # The front page prints `atlasctl run <flagship>` as its headline
      # instruction, and nothing else ties that name to a recipe that exists.
      - name: The advertised recipe exists
        run: bun scripts/check-flagship.mjs
        env:
          ATLAS_RECIPES_ROOT: ${{ github.workspace }}/atlas-recipes-src/recipes

      - name: Build
        run: bun x --bun vite build
        env:
          ATLAS_RECIPES_ROOT: ${{ github.workspace }}/atlas-recipes-src/recipes
          ATLAS_BASELINES_ROOT: ${{ github.workspace }}/tests/baselines
          GH_TOKEN: ${{ github.token }}

      # A page's <title> can vanish while the rest of its head survives: a layout
      # title and a page title compete for one head slot, and /control shipped for
      # a day with the homepage's title because the layout's won. The deployed
      # canary caught it -- after the deploy. Catch it here, before.
      - name: Every route kept its own title
        # `working-directory: site` is this job's default, so no `cd`.
        run: |
          fail=0
          check() { # file  expected-substring
            got=$(grep -o '<title>[^<]*' "build/$1" | head -1)
            case "$got" in
              *"$2"*) echo "ok   $1 -> $got" ;;
              *) echo "::error::build/$1 has title \"$got\", expected one containing \"$2\""; fail=1 ;;
            esac
          }
          check index.html     'Atlas, pure Rust inference'
          check control.html   'Control plane'
          check diligence.html 'Verification steps'
          exit "$fail"

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketing-site
          path: site/build
          retention-days: 7
          if-no-files-found: error

      # The blog. Same toolchain, no atlas-recipes dependency — it renders its
      # own posts and nothing else.
      - name: Install blog dependencies
        working-directory: blog
        run: bun install --frozen-lockfile

      - name: Build blog
        working-directory: blog
        run: bun x --bun vite build

      # Same reasoning as the marketing site's title check: a route can lose
      # its own <title> to the layout's and nothing else about the page looks
      # wrong. On a blog that means every article shipping under the homepage's
      # name, which is invisible until someone shares a link.
      - name: Every blog route kept its own title
        working-directory: blog
        run: |
          fail=0
          check() { # file  expected-substring
            got=$(grep -o '<title>[^<]*' "build/$1" | head -1)
            case "$got" in
              *"$2"*) echo "ok   $1 -> $got" ;;
              *) echo "::error::build/$1 has title \"$got\", expected one containing \"$2\""; fail=1 ;;
            esac
          }
          check index.html            'Notes from the inference layer'
          check 404.html              'Not found'
          check tags/engineering.html 'Engineering'
          # Every post, by name. A renamed slug that nothing links to would
          # otherwise stop being prerendered without failing anything.
          for f in build/posts/*.html; do
            got=$(grep -o '<title>[^<]*' "$f" | head -1)
            case "$got" in
              '<title>'*' — Atlas blog') echo "ok   ${f#build/} -> $got" ;;
              *) echo "::error::${f#build/} has title \"$got\""; fail=1 ;;
            esac
          done
          exit "$fail"

      # Both builds exist at this point, which is the only moment either app can
      # check the other. The blog's footer deep-links into the marketing site's
      # sections; those ids live in a different app and nothing else connects
      # them, so a renamed section leaves a link that still loads the page and
      # silently drops the reader at the top of it. Two such links shipped in
      # the first draft of the footer, both invented rather than looked up.
      - name: Blog cross-links resolve on the marketing site
        working-directory: ${{ github.workspace }}
        run: bun blog/e2e/check-crosslinks.mjs site/build blog/build

      - name: Upload blog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blog-site
          path: blog/build
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to avarok via rsync
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production-site
      url: https://atlasinference.io/
    outputs:
      # The verify job below needs to know whether anything was actually
      # deployed; without this it would check a stale production against a
      # build that never left the runner.
      configured: ${{ steps.secret_check.outputs.configured }}
    steps:
      - name: Check deploy secret presence
        # Skip deploy entirely when DEPLOY_SSH_PRIVATE_KEY isn't
        # configured on the `production-site` environment. The job
        # still exits success — the marketing-site artifact uploaded
        # by the build job remains downloadable for inspection.
        id: secret_check
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_SSH_PRIVATE_KEY not set on production-site environment — skipping rsync deploy. Configure the environment secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site artifact
        if: steps.secret_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marketing-site
          path: site

      - name: Download blog artifact
        if: steps.secret_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: blog-site
          path: blog

      - name: Install rsync
        if: steps.secret_check.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync openssh-client

      - name: Load SSH key
        if: steps.secret_check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Pin host key
        if: steps.secret_check.outputs.configured == 'true'
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        if: steps.secret_check.outputs.configured == 'true'
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PATH:     ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          # `--delete-delay`, not a bare `--delete`: rsync's default removes files
          # AS IT GOES, so an old content-hashed chunk can be deleted while a
          # visitor is still loading the previous index.html that references it —
          # a 404 on a lazily-imported chunk, mid-session, for the duration of a
          # deploy. Deferring the deletions to the end means the old bundle stays
          # whole until the new one is entirely in place.
          #
          # It does not make the deploy atomic, and the ordering does not help:
          # `--itemize-changes` shows rsync sending `index.html` BEFORE the
          # `_app/` chunks it references, so a visitor can still fetch a document
          # naming a chunk that has not landed. What the service worker's
          # network-first documents plus its previous cache cover, they cover;
          # this flag closes the half that is ours to close — never deleting the
          # old bundle out from under a session before the new one exists.
          rsync -az --delete-delay --chmod=D755,F644 \
            -e "ssh -p ${PORT}" \
            site/ "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:${DEPLOY_PATH}/"

      # blog.atlasinference.io, in the same job and over the same connection.
      # rsync is already a diff: when the built blog is byte-identical to what
      # is deployed it transfers nothing and deletes nothing, so a push that
      # only touched site/ costs one no-op sync rather than a redeploy.
      - name: Deploy blog
        if: steps.secret_check.outputs.configured == 'true'
        env:
          DEPLOY_SSH_HOST:  ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER:  ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT:  ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_BLOG_PATH: ${{ secrets.DEPLOY_BLOG_PATH }}
        run: |
          # Deliberately a hard failure rather than the soft skip the whole
          # deploy job takes when DEPLOY_SSH_PRIVATE_KEY is absent. That skip is
          # for an environment with no deploy configured at all; this is an
          # environment that DOES deploy, where one target has been forgotten.
          # Skipping quietly there means the blog silently stops updating while
          # every run stays green.
          if [ -z "${DEPLOY_BLOG_PATH}" ]; then
            echo "::error::DEPLOY_BLOG_PATH is not set on the production-site environment."
            echo "The marketing site deployed; the blog did not. Set it to the blog docroot"
            echo "on the origin (/var/www/blog.atlasinference.io/html) and re-run."
            exit 1
          fi
          PORT="${DEPLOY_SSH_PORT:-22}"
          rsync -az --delete-delay --chmod=D755,F644 \
            -e "ssh -p ${PORT}" \
            blog/ "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:${DEPLOY_BLOG_PATH}/"


  verify:
    name: Verify the deployed blog
    needs: deploy
    if: needs.deploy.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      # A SEPARATE job, and not three lines inside `deploy`, for a reason worth
      # writing down. `deploy` deliberately has no checkout: it downloads the
      # two build artifacts straight into `site/` and `blog/` and rsyncs those
      # directories wholesale. Checking the repo out there would put source
      # files in the trees that get uploaded to production. But the check
      # script lives in the repo, so it needs a checkout — hence its own job,
      # where a checkout is free of consequences.
      #
      # This was wrong for four commits and no PR could have caught it: the
      # deploy job is push-only, so on a pull request it skips, and a step that
      # would have failed on the first merge to main reported nothing at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Against the live origin, because the defect this guards is observable
      # only from a request: nginx's add_header does not accumulate across
      # contexts, so one location-level Cache-Control silently drops every
      # security header from exactly the HTML responses that need them, and
      # neither the config nor `nginx -t` says so. It also catches a deploy
      # that landed the wrong tree — the 404 assertion fails if 404.html is
      # not in the docroot.
      - name: Headers and routing on blog.atlasinference.io
        run: bun blog/e2e/check-headers.mjs https://blog.atlasinference.io
