<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Why the FP8 GEMM accumulates in FP32</title>
  <desc id="d">A logarithmic number line from 100 to 100 million. Block scaling puts each block's largest value at 448, the E4M3 maximum. One product of two such values is 200,704, about three times FP16's largest finite value of 65,504, and a 128-term inner sum can reach about 25.7 million. FP32 reaches 3.4e38, so it holds every partial sum. The price is throughput: FP8 with FP32 accumulation is 88.3 TFLOPS on this part against 176.6 with FP16 accumulation, which is still twice the 44.1 of BF16. A tick on the FP32-accumulate bar marks what fp8_gemm_ada measured on an RTX 4060 Ti 16 GB: 61 to 72 TFLOPS at 512 and 2048 rows. The card also showed that FP8 mma.sync sums below FP32 precision: the worst output lands 2^-15 of its term magnitude from the exact sum, on the gb10 and Ada kernels alike, far below E4M3's own rounding of 2^-4.</desc>

  <defs>
    <marker id="tipInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9CCD4"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="#0F1216"/>

  <text x="40" y="44" font-size="23" font-weight="650" fill="#C9CCD4">Why FP32 accumulation: FP16 cannot hold one product</text>
  <text x="40" y="66" font-size="13.5" fill="#82868F">Block scaling maps every block's largest magnitude to 448. Worst-case magnitudes on a log scale.</text>

  <!-- axis 1e2..1e8 over x 160..1060, 150 px per decade -->
  <rect x="582.4" y="120" width="477.6" height="70" fill="#F28B82" fill-opacity="0.12"/>
  <text x="1050" y="140" font-size="11.5" fill="#F28B82" text-anchor="end" font-weight="650">overflows FP16</text>
  <line x1="160" y1="190" x2="1060" y2="190" stroke="#82868F"/>
  <path d="M 1060 190 L 1120 190" stroke="#82868F" stroke-dasharray="4 3" marker-end="url(#tipInk)"/>
  <g stroke="#82868F">
    <line x1="160" y1="186" x2="160" y2="194"/>
    <line x1="310" y1="186" x2="310" y2="194"/>
    <line x1="460" y1="186" x2="460" y2="194"/>
    <line x1="610" y1="186" x2="610" y2="194"/>
    <line x1="760" y1="186" x2="760" y2="194"/>
    <line x1="910" y1="186" x2="910" y2="194"/>
    <line x1="1060" y1="186" x2="1060" y2="194"/>
  </g>
  <g font-size="10.5" fill="#82868F" text-anchor="middle">
    <text x="160" y="210">100</text>
    <text x="310" y="210">1,000</text>
    <text x="460" y="210">10,000</text>
    <text x="610" y="210">100,000</text>
    <text x="760" y="210">1,000,000</text>
    <text x="910" y="210">10,000,000</text>
    <text x="1060" y="210">100,000,000</text>
  </g>

  <!-- markers -->
  <g>
    <line x1="257.7" y1="120" x2="257.7" y2="190" stroke="#EFB338" stroke-width="2"/>
    <circle cx="257.7" cy="190" r="5" fill="#EFB338"/>
    <text x="257.7" y="236" font-size="12" font-weight="650" fill="#EFB338" text-anchor="middle">448</text>
    <text x="257.7" y="252" font-size="11" fill="#82868F" text-anchor="middle">E4M3 maximum,</text>
    <text x="257.7" y="266" font-size="11" fill="#82868F" text-anchor="middle">each operand's</text>
    <text x="257.7" y="280" font-size="11" fill="#82868F" text-anchor="middle">block maximum</text>

    <line x1="582.4" y1="110" x2="582.4" y2="190" stroke="#F28B82" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="576" y="114" font-size="12" font-weight="650" fill="#F28B82" text-anchor="end">65,504</text>
    <text x="576" y="130" font-size="11" fill="#82868F" text-anchor="end">FP16 largest finite</text>

    <line x1="655.4" y1="150" x2="655.4" y2="190" stroke="#C9CCD4" stroke-width="2"/>
    <circle cx="655.4" cy="190" r="5" fill="#C9CCD4"/>
    <text x="655.4" y="236" font-size="12" font-weight="650" fill="#C9CCD4" text-anchor="middle">200,704</text>
    <text x="655.4" y="252" font-size="11" fill="#82868F" text-anchor="middle">one product, 448 x 448:</text>
    <text x="655.4" y="266" font-size="11" fill="#82868F" text-anchor="middle">3.06 x FP16's maximum</text>

    <line x1="971.5" y1="150" x2="971.5" y2="190" stroke="#C9CCD4" stroke-width="2"/>
    <circle cx="971.5" cy="190" r="5" fill="#C9CCD4"/>
    <text x="971.5" y="236" font-size="12" font-weight="650" fill="#C9CCD4" text-anchor="middle">25,690,112</text>
    <text x="971.5" y="252" font-size="11" fill="#82868F" text-anchor="middle">128 such products: the</text>
    <text x="971.5" y="266" font-size="11" fill="#82868F" text-anchor="middle">inner sum of one K group</text>

    <text x="1120" y="236" font-size="12" font-weight="650" fill="#12B981" text-anchor="end">FP32: 3.4e38</text>
    <text x="1120" y="252" font-size="11" fill="#82868F" text-anchor="end">holds all of it</text>
  </g>

  <!-- ===== the trade ===== -->
  <text x="40" y="330" font-size="15" font-weight="650" fill="#C9CCD4">What it costs, and why it is still worth it</text>
  <!-- 0..180 TFLOPS over 600 px: 3.333 px per TFLOP, bars from x=320 -->
  <g font-size="12">
    <text x="40" y="368" fill="#C9CCD4">FP8, FP16 accumulate</text>
    <rect x="320" y="352" width="588.7" height="24" fill="#12B981" fill-opacity="0.25" stroke="#12B981" stroke-dasharray="4 3"/>
    <text x="918" y="369" fill="#C9CCD4" font-weight="650">176.6</text>
    <text x="970" y="369" fill="#F28B82" font-size="11">unsafe at E4M3's range</text>

    <text x="40" y="408" fill="#C9CCD4">FP8, FP32 accumulate</text>
    <rect x="320" y="392" width="294.3" height="24" fill="#12B981"/>
    <text x="624" y="409" fill="#C9CCD4" font-weight="650">88.3</text>
    <!-- measured range 61..72 TFLOPS: x 523.3..560.0 -->
    <rect x="523.3" y="388" width="36.7" height="32" fill="none" stroke="#C9CCD4" stroke-width="1.5"/>
    <text x="670" y="409" fill="#12B981" font-size="11">fp8_gemm_ada measured 61 to 72 (boxed), M = 512 and 2048</text>

    <text x="40" y="448" fill="#C9CCD4">BF16, FP32 accumulate</text>
    <rect x="320" y="432" width="147" height="24" fill="#BE9DF8"/>
    <text x="477" y="449" fill="#C9CCD4" font-weight="650">44.1</text>
    <text x="523" y="449" fill="#82868F" font-size="11">BF16 peak; the former BF16 FFN prefill kernel measured at most 4.6 (section 9)</text>
  </g>
  <text x="320" y="476" font-size="11" fill="#82868F">Dense tensor TFLOPS, NVIDIA's figures for the RTX 4060 Ti; the box is measured on the card.</text>

  <g font-size="11.5" fill="#82868F">
    <text x="40" y="510">To make FP16 accumulation safe, both quantizers would have to target a much smaller maximum and give up E4M3's top binades for every value.</text>
    <text x="40" y="530">The kernel's CPU reference test fp16_accumulation_would_overflow_on_one_saturated_product records the overflow.</text>
    <text x="40" y="550">On the card, FP8 mma.sync sums below FP32 precision: the worst output is 2^-15 of its term magnitude from the exact sum (the same bits on the gb10</text>
    <text x="40" y="568">and Ada kernels), far below E4M3's own 2^-4 rounding. The GPU oracle allows 2^-13.</text>
  </g>
</svg>
