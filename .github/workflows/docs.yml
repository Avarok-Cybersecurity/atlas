name: Docs

on:
  # Manually runnable. During the 2026-08-06 Actions incident, webhook triggers
  # were throttled to aid recovery, so pushes stopped creating runs at all --
  # and with no dispatch trigger there was no way to ask for one. A check that
  # can only be started by an event you do not control is a check you cannot
  # get a verdict from when you most need it.
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'book/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
  # No path filter on pull_request: this check is in the required set, and a
  # path-filtered required check never reports on PRs outside its paths
  # (kernel-only diffs), leaving them permanently "expected" and unmergeable.
  pull_request:
    branches: [main, master]
  # Merge queue: same reasoning — this job is required, queue commits fire
  # none of the events above, so report on every entry unfiltered. The deploy
  # job stays push-only by its own `if`.
  merge_group:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip CUDA/nvcc in build.rs so rustdoc can run on hosts without a GPU.
  # - ATLAS_SKIP_BUILD=1: atlas-kernels emits a stub target_ptx.rs
  # - CUDARC_CUDA_VERSION=13000: short-circuits cudarc's `nvcc --version`
  #   probe. Format is {major}0{minor}0 — 13000 == CUDA 13.0, Atlas's minimum.
  ATLAS_SKIP_BUILD: "1"
  CUDARC_CUDA_VERSION: "13000"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  build:
    name: Build mdBook + rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.4.40'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # llms.txt (https://llmstxt.org) is generated from SUMMARY.md, which is
      # already the book's table of contents. A second index maintained by hand
      # goes stale the first time a chapter is added, and a stale index is worse
      # than none for the agents that read it — they cannot tell.
      - name: llms.txt is current with SUMMARY.md
        run: node book/scripts-gen-llms.mjs --check

      - name: Build mdBook
        run: mdbook build book

      # mdBook copies non-markdown files from src/ into the build output, which
      # is how src/llms.txt reaches the site root. That is documented behaviour
      # rather than something this repo controls, so it is asserted rather than
      # assumed: if a future mdBook stops doing it, the file disappears from the
      # deployed site silently, and only a request would ever show it.
      - name: mdBook copied llms.txt into the output
        run: |
          test -s book/output/llms.txt || {
            echo "::error::book/output/llms.txt is missing or empty after mdbook build."
            echo "mdBook is expected to copy non-markdown files from book/src/ to the output."
            exit 1
          }
          head -3 book/output/llms.txt

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps

      - name: Assemble site (mdBook + rustdoc at /api/)
        run: |
          mkdir -p book/output/api
          cp -a target/doc/. book/output/api/
          # Friendly index inside /api/ pointing at atlas_core
          cat > book/output/api/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <title>Atlas API Reference</title>
          <meta http-equiv="refresh" content="0; url=atlas_core/index.html">
          </head><body>
          <p>Redirecting to <a href="atlas_core/index.html">atlas_core</a>…</p>
          </body></html>
          EOF

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site
          path: book/output
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to avarok via rsync
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production-docs
      url: https://docs.atlasinference.io/
    steps:
      - name: Check deploy secret presence
        # Skip deploy entirely when DEPLOY_SSH_PRIVATE_KEY is not
        # configured (e.g. on a fresh fork or before the maintainer
        # has wired up the production-docs environment). The job still
        # exits success — the docs artifact uploaded by the build job
        # remains downloadable for inspection.
        id: secret_check
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_SSH_PRIVATE_KEY not set — skipping rsync deploy. Configure the production-docs environment secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site artifact
        if: steps.secret_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-site
          path: site

      - name: Install rsync
        if: steps.secret_check.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync openssh-client

      - name: Load SSH key
        if: steps.secret_check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Pin host key
        if: steps.secret_check.outputs.configured == 'true'
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        if: steps.secret_check.outputs.configured == 'true'
        env:
          DEPLOY_SSH_HOST:  ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER:  ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT:  ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PATH:      ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -p ${PORT}" \
            site/ "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}:${DEPLOY_PATH}/"
