# B200 target: kernel set inherited from gb10 via symlink; expected_absent
# NOT yet harvested on B200 hardware (`spark serve --check-kernels`).
# Every other table below is gb10's, copied verbatim — sampling and behaviour
# are checkpoint properties, not device properties. The [expected_absent]
# tables are NOT: they were harvested on GB10 and are carried here only so
# the target parses. Re-harvest them on a B200/GB200 before trusting a
# startup kernel audit on this hardware.
[model]
name = "nemotron-super-120b-a12b"
hf_id = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
model_type = "nemotron_h"
architecture = "hybrid_mamba2_latent_moe_attention"
parameters = "120B"
active_parameters = "12B"

# Kernel-target resolution needles (atlas-kernels/src/resolve.rs). This
# target collides with nemotron-labs-3-puzzle-75b-a9b on (nemotron_h_puzzle,
# 4096) — declared below so a single-target Super build can serve Puzzle
# checkpoints — and build.rs requires colliding targets to declare needles.
# The target dir name is NOT a substring of the hf_id (the id spells it
# "Nemotron-3-Super"), hence the shorter needle. In the multi-target build a
# Puzzle checkpoint matches the Puzzle target's needles, not this one, which
# pins the routing the old build-order .find() only delivered by accident.
match_names = ["super-120b"]

[[model_types]]
model_type = "nemotron_h"
hidden_size = 4096

# Puzzle 75B-A9B: same Super backbone dims (H=4096, LatentMoE, Mamba-2) with
# heterogeneous per-block MoE intermediate/top-k. Reuses Super PTX; MoE dims
# are runtime parameters from config.block_configs.
[[model_types]]
model_type = "nemotron_h_puzzle"
hidden_size = 4096

# Nemotron-H Super uses ChatML + LatentMoE. No official sampling recommendations.
# 2026-05-24 empirical band-aid. NVIDIA's temp=1.0 across-the-board
# recipe risked max_tokens wandering on agentic clients (lesson from
# Qwen3.6). Lowered to temp=0.6 thinking/tools, 0.7 non-thinking.
# rep_pen=1.1 + dry=0.5 for loop suppression.
[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0  # 2026-06-06: 1.1->1.0; NVIDIA ships penalty-free — band-aid removed
dry_multiplier = 0.0      # 2026-06-06: 0.5->0.0; no vendor DRY. Re-gate; targeted dry on tools only if loop reappears

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0  # 2026-06-06: 1.1->1.0; NVIDIA ships penalty-free — band-aid removed
dry_multiplier = 0.0      # 2026-06-06: 0.5->0.0; no vendor DRY. Re-gate; targeted dry on tools only if loop reappears

[sampling.non_thinking]
temperature = 0.7
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0  # 2026-06-06: 1.1->1.0; NVIDIA ships penalty-free — band-aid removed
dry_multiplier = 0.0      # 2026-06-06: 0.5->0.0; no vendor DRY. Re-gate; targeted dry on tools only if loop reappears

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0  # 2026-06-06: 1.1->1.0; NVIDIA ships penalty-free — band-aid removed
dry_multiplier = 0.0      # 2026-06-06: 0.5->0.0; no vendor DRY. Re-gate; targeted dry on tools only if loop reappears

[behavior]
# 2026-06-06: ENABLE the content-loop watchdog. After removing the rep_pen=1.1/dry=0.5 band-aid
# (vendor ships penalty-free), single-GPU coherence showed a temp=0 "READY\nREADY\n..." repetition
# loop. The watchdog (period-N detect + rollback to a clean boundary) is the PROPER loop mechanism
# vs the rep_pen band-aid that mangles greedy argmax. Same lever that recovered qwen3-next.
enable_loop_watchdog = true
# 2026-05-23 sweep: false → true. Project-wide default flipped to true.
# NOTE: Super specifically had a pass-30 regression where thinking-during-
# tools degraded bare_json output. If that returns in practice, flip
# back to false per-model here; the project-wide change is intentionally
# permissive but per-model overrides remain authoritative.
thinking_in_tools = true
# Skip the Nemotron-H chat template's `<tool_call>\n` steering prefix.
# The prefix was added for Nano's "Think-Satisfy + JSON narration" fix
# but on Super causes a `<tool_call>\n<tool_call>\n...` emission loop
# because Super was NOT trained to have its first generated token inside
# a pre-opened tool_call block. Let the model open <tool_call> naturally
# after closing </think>.
disable_tool_steering = true
# Per-model tool-call parser override. Nemotron-Super was not trained on
# the qwen3_coder XML tool format (the nemotron_h family default). Forcing
# qwen3_coder grammar puts it into a token loop on `<tool_call>` (token
# 131071 / Chinese-character repeats observed). Bare-JSON keeps the model
# on its trained distribution: it emits a top-level `{"name":"...",
# "arguments":{...}}` object directly, with grammar enforcing the schema
# (prevents hallucinated field names like "tool" instead of "name").
# Nano-30B keeps the qwen3_coder default since it was trained on that format.
tool_call_parser = "bare_json"
# Nemotron-Super rambles deep in its thinking trace — pass-8 showed 256
# wasn't enough for the Reasoning test ("Actually they'd ask..." leaked
# because </think> was forced before a conclusion landed). 1024 gives
# enough headroom for the full chain-of-thought on non-trivial questions
# while still reserving budget headroom at typical max_tokens=1024-2048.
max_thinking_budget = 2048
# Nemotron-Super is a thinking-first model — it is TRAINED to produce a
# <think>...</think> reasoning trace before the answer. Forcing
# `enable_thinking=false` in the generation prompt prematurely closes the
# think block and the model continues producing analysis-style text
# ("We need to produce a Python code...") instead of the answer
# (pass-7 fib regression). Let the model think, and the server's
# `reasoning_parser = "qwen"` strips the block before returning `content`.
thinking_default = true

# ── Kernel lookups this model may legitimately fail to resolve ──
# Harvested 2026-08-03 from `spark serve --check-kernels` (9 lookups).
# All are try_kernel() probes; every fallback path dispatch reaches
# resolves on this target.
[expected_absent.w4a16]
w4a16_gemm_t_p3 = """
3-deep weight-pipeline twin shipped ONLY in qwen3.6-27b's shadow.
layers::tgemm_kernel probes it, falls back to w4a16_gemm_t (resolves
on this target's shadow). UNMEASURED for this target — candidate, not
loss."""
w4a16_gemm_t_k64_p3 = "Same family; layers::k64_kernel falls back to the required w4a16_gemm_t_k64 (resolves here)."
w4a16_gemm_t_k64_n64_p3 = "Narrow-N twin; layers::k64_n64_kernel returns 0-handle, dispatch gates on handle != 0."
w4a16_gemm_t_m128_bf16 = "BF16-projection prefill twin; prefill_weights gates on handle != 0, falls back through the resolved w4a16 path."
fp8_gemm_t_m128_mfast = """
M128-mfast FP8 GEMM; nemotron_mamba2/prefill gates the probe
(handle != 0 && n >= 512) and falls back to the bf16-A FP8 path that
resolves from common w4a16."""
fp8_fp8_gemm_t_m128_mfast = "Same family — the pre-cast-A fp8 path falls back to the bf16-A arm that resolves."

[expected_absent.w4a4]
w4a4_gemm_mfast = """
Shipped only in nemotron-labs-3-puzzle-75b-a9b. nemotron_mamba2 probes
it and falls back to w4a4_gemm (resolves from common). UNMEASURED."""

[expected_absent.moe_w4a16]
moe_w4a16_grouped_gemm_ptrtable_relu2 = """
ReLU^2-gated grouped GEMM; shipped only in nemotron-labs-3-puzzle-75b's
shadow. prefill_sorted gates on handle != 0 ('let fused = ...') and
falls back to the base ptrtable grouped GEMM (resolves)."""

[expected_absent.moe_w4a4]
moe_w4a4_grouped_gemm_relu2 = """
ReLU^2-gated W4A4 grouped GEMM; shipped only in nemotron-labs-3-puzzle's
moe_w4a4_grouped.cu shadow. prefill_sorted gates on handle != 0 before
firing; the base MoE path served by moe_w4a16 remains available."""
