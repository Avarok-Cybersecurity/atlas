name: Install canary

# What CI cannot see.
#
# Everything else here tests the artifact. This tests the *deployment*: the URL
# a user is told to curl, the release the installer resolves, and the pages the
# site links to. Those live on a web server and in GitHub Releases, and both can
# break while every check in this repository stays green.
#
# That is not hypothetical. `https://atlasinference.io/control` served the
# homepage — same 200, wrong page — because the web server does not try the
# `.html` extension. Nothing in the build could tell, and nothing did, until
# somebody opened the link.
#
# It runs on aarch64 because that is what a DGX Spark is; an installer that
# resolves the wrong asset for the only architecture customers run is the
# failure worth catching.

# Deliberately **not** run on pull_request. This checks what is deployed, and a
# pull request's changes are by definition not deployed yet — so gating a PR on
# it would fail every PR that fixes production, which is precisely backwards. It
# is a smoke alarm, not a spell-checker.
on:
  schedule:
    # 06:20 UTC daily, offset off the hour so it does not queue behind the
    # crowd of midnight crons.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: production one-liner (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Install atlasctl the way the website tells people to
        run: |
          set -euo pipefail
          # A private prefix: the canary must prove the installer works, not
          # inherit whatever a runner image happens to have on PATH.
          prefix="$RUNNER_TEMP/atlasctl-bin"
          mkdir -p "$prefix"
          ATLASCTL_INSTALL_DIR="$prefix" \
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
              https://atlasinference.io/install.sh | sh
          echo "$prefix" >> "$GITHUB_PATH"

      # The install above is a FIRST install, and a first install is the one
      # shape of this script that has never been broken: with nothing on disk
      # the installer takes its plain "copy it in" path. Every upgrade bug lives
      # in the other paths, and one shipped on 2026-08-29 -- the branch for "same
      # version string, different build" printed "replacing it" and copied
      # nothing, so an operator on a stale agent was told the upgrade succeeded
      # and kept running the old protocol. This canary passed throughout.
      #
      # Reproduce that exact shape: keep the version string identical and change
      # only the CONTENT. Appending bytes past the end of an ELF leaves it
      # runnable and `--version` unchanged, while its sha256 differs -- which is
      # precisely the case the installer must decide on content rather than on
      # the version it prints.
      - name: Re-running the installer over a differing build REPLACES it
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/atlasctl-bin"
          before_version=$("$prefix/atlasctl" --version)
          printf '\n# canary marker\n' >> "$prefix/atlasctl"
          tampered=$(sha256sum "$prefix/atlasctl" | cut -d" " -f1)
          # Still runnable, and still claiming the same version: without that the
          # test would be exercising the ordinary upgrade path instead.
          after_tamper=$("$prefix/atlasctl" --version)
          [ "$before_version" = "$after_tamper" ] || {
            echo "::error::tampering changed the reported version ($before_version -> $after_tamper);"
            echo "this test can no longer reach the same-version/different-content branch"
            exit 1
          }

          ATLASCTL_INSTALL_DIR="$prefix" \
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
              https://atlasinference.io/install.sh | sh

          restored=$(sha256sum "$prefix/atlasctl" | cut -d" " -f1)
          if [ "$restored" = "$tampered" ]; then
            echo "::error::the installer left the modified binary in place."
            echo "It decided an upgrade was unnecessary, or announced one and did not perform it."
            echo "Operators on a stale build are being told they are up to date."
            exit 1
          fi
          echo "replaced: $tampered -> $restored"
          "$prefix/atlasctl" --version

      - name: It runs, and it knows its recipes
        run: |
          set -euo pipefail
          atlasctl --version
          # `recipe list` exercises the vendored corpus, so an installer that
          # shipped a binary without its recipes fails here rather than in a
          # user's terminal.
          count=$(atlasctl recipe list | tail -n +2 | grep -c . || echo 0)
          echo "recipes: $count"
          [ "$count" -ge 10 ] || {
            echo "::error::atlasctl shipped only $count recipes; the vendored corpus is missing or truncated"
            exit 1
          }

  pages:
    name: the pages the site links to
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every advertised URL serves the page it claims
        run: |
          set -euo pipefail
          fail=0

          # A URL is only correct if it serves the *right* page. Status alone
          # cannot tell: the SPA fallback answers 200 with the homepage, which
          # is exactly how /control broke.
          check() {
            url="https://atlasinference.io$1"
            want="$2"
            body=$(curl --fail --silent --show-error --location \
                     --retry 3 --retry-delay 5 "$url") || {
              echo "::error::$url did not respond"
              fail=1
              return
            }
            title=$(printf '%s' "$body" | grep -o '<title>[^<]*</title>' | head -1)
            case "$title" in
              *"$want"*) echo "ok   $1 -> $title" ;;
              *)
                echo "::error::$url served \"$title\", expected a page titled like \"$want\""
                fail=1
                ;;
            esac
          }

          check /         'Atlas, pure Rust inference'
          # The URL the site actually links to. adapter-static writes this
          # route to control.html, and the deploy target serves files
          # literally, so this is the spelling that resolves.
          check /control.html 'Control plane'

          # /control must not be an error. It is the SPA fallback here -- the
          # wrong page, but harmless. A 5xx means something shipped a directory
          # where the server expects a file, which is exactly how this broke.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                   --location --max-time 20 https://atlasinference.io/control || echo 000)
          case "$code" in
            5*|000)
              echo "::error::/control returned $code -- a directory is shadowing the page again"
              fail=1
              ;;
            *) echo "ok   /control -> $code (fallback, not an error)" ;;
          esac

          # The one-liner the launch dialog prints. If this is not a shell
          # script, every install instruction on the site is wrong.
          # The body is captured whole and the first line taken from the
          # VARIABLE. Piping curl into `head -1` looks equivalent and is not:
          # `head` exits after one line, curl gets EPIPE, and under this step's
          # `set -euo pipefail` that fails the whole canary with curl's exit 23
          # -- a write error, reported as if the site were down. It is a race on
          # how fast curl finishes, so it passed for weeks and then failed with
          # the site perfectly healthy (2026-08-29 04:05, in the same run that
          # confirmed /control.html had been fixed).
          body=$(curl --fail --silent --show-error --location \
                   --retry 3 --retry-delay 5 https://atlasinference.io/install.sh)
          head=$(printf '%s' "$body" | head -1)
          case "$head" in
            '#!'*) echo "ok   /install.sh -> $head" ;;
            *)
              echo "::error::/install.sh does not start with a shebang; it served: $head"
              fail=1
              ;;
          esac

          # The SAME check for the Windows line, which is the ONLY command a
          # Windows visitor is given. `install.sh` got this check because the SPA
          # fallback answers 200 with the HOMEPAGE rather than 404 -- the failure
          # that took /control down -- and install.ps1 is served by that same
          # fallback out of that same static dir, so it fails the same way. Piped
          # into `iex`, an HTML body is not a 404 anyone can read: it is a wall of
          # parse errors, on the platform with the least fallback.
          body=$(curl --fail --silent --show-error --location \
                   --retry 3 --retry-delay 5 https://atlasinference.io/install.ps1)
          head=$(printf '%s' "$body" | head -1)
          case "$head" in
            '<'*)
              echo "::error::/install.ps1 served HTML -- the SPA fallback is answering for it: $head"
              fail=1
              ;;
            '#'*) echo "ok   /install.ps1 -> $head" ;;
            *)
              echo "::error::/install.ps1 does not start with a comment; it served: $head"
              fail=1
              ;;
          esac

          exit "$fail"
