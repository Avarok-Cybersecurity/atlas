# ── The FLA chunked GDN prefill family: an sm_90 fence SCALE cannot lower ──
# gated_delta_rule_fla.cu:114:19: error: unknown opcode:
# fence.proxy.async.shared::cta
#
# The async-proxy fence is an sm_90 feature SCALE does not lower, and the file
# issues it unconditionally, so no flag compiles the rest. Every lookup below
# is `try_kernel` from `qwen3_ssm::init` (and
# `init_kernels::fused_spine_kernel`), so a handle of 0 leaves the GDN prefill
# on the `gated_delta_rule` / `gated_delta_rule_wy*` kernels this target does
# compile: correct, and slower by a margin nobody has measured on this board.
# No follow-up is pending; unlike the LDS group this needs a SCALE codegen
# path or a fence-free rewrite of the file, not a tile-size pin.

[expected_absent.gated_delta_rule_fla]
gated_delta_rule_chunk_delta_h = "gfx1201, SCALE 1.7.1: gated_delta_rule_fla.cu:114:19: error: unknown opcode: fence.proxy.async.shared::cta, an sm_90 async-proxy fence SCALE does not lower. The file is absent entirely, so every entry point it declares is; GDN prefill stays on the gated_delta_rule/_wy* kernels that do compile."
