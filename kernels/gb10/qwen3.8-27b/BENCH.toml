# Benchmarks for this model, and the thresholds its gate records must meet.
#
# Sibling of MODEL.toml so the numbers sit beside the thing they describe;
# hardware and model are implied by the path and cannot disagree with the
# contents. Read by `atlas_plugin::gate::bench`.
#
# ★ This file may land BEFORE the model's MODEL.toml/kernels do (they arrive in
# a sibling change adding the qwen3.8-27b kernel target via a `kernel_source`
# redirect to qwen3.6-27b). `gate::bench::bench_files` discovers BENCH.toml by
# path alone for exactly this reason — the gate definition does not wait on the
# compiled target.
#
# Thresholds are per CHECKPOINT, not per model: two checkpoints of one model
# can differ by several BFCL points, so they cannot share a bar.
#
# This file is deliberately OUTSIDE the closure hash (`taxon::configs` does not
# list it), so ratcheting a threshold does not invalidate the record that
# justified the ratchet.
#
# `status = "unmeasured"` entries carry NO [benchmarks.metrics] table. Absence
# is the TODO -- a guessed threshold a run could clear would report PASS for
# something nobody measured.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "agentic-webserver"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
# NOT the default: the required Gate A subject stays the 35B MoE flagship
# (qwen3.6-35b-a3b/BENCH.toml), whose recorded history is untouched. This
# variant runs via `--checkpoint unsloth/Qwen3.8-27B-NVFP4`, or from the TUI's
# variant list.
default = false
status = "measured"
note = """\
The DENSE variant of the agentic gate. Not comparable to the 35B MoE entry in \
any direction: a dense 27B activates every parameter per token where the 35B \
MoE activates ~3B, so its wall band is roughly 2x — which is why this is a \
separate baseline entry with its own ceiling rather than a shared bar. \
REFERENCE RUN (the definition of these numbers): 2026-08-14, dgx2, binary main \
680b3a568, N=10 — webserver_ok 10/10, followed_directions 10/10, Sigma-wall \
1925.1 s, per-run walls 156.0/187.3/274.2/144.7/230.5/243.3/205.2/117.3/185.2/\
181.4 s (range 117-274 s, 2.3x min-to-max). That run FAILED only the \
35B-calibrated 1000 s budget while both correctness counts were perfect — the \
exact miscomparison per-variant thresholds exist to remove; under this entry's \
own ceiling it is a PASS. Serve profile of the reference run (what the recipe \
must pin): --gpu-memory-utilization 0.85 --max-batch-size 1 --max-seq-len \
32768 --kv-cache-dtype bf16 --lm-head-dtype bf16 --scheduling-policy slai \
--speculative --mtp-quantization bf16 --enable-prefix-caching \
--ssm-cache-slots 256 --ssm-checkpoint-interval 16 --kv-high-precision-layers \
auto, thinking ON. The 35B Gate-A profile (0.70 util, batch 2) CANNOT serve \
this model at all — it dies at boot with no memory left for KV cache — so the \
recipe is part of the variant, not a detail. The recipe id above now EXISTS in \
atlas-recipes (merged 2026-08-14 as atlas-recipes#19, commit 20ac6e8), \
pinning exactly the profile stated above, so this variant can self-start \
under --pull-request-gate. ★ Note the recipe pins `num_drafts: 3` (K=4), \
matching the reference run; the qwen3.8-27b target deliberately omits \
`default_num_drafts`, so an unpinned run would instead take the engine \
default K=2. When running against an operator-started endpoint pass \
`--param wall_budget_s=5000` explicitly -- 5000 is this entry's committed \
ceiling, NOT the 2500 an earlier revision of this note named: threshold_params \
substitution happens only under the gate (and in the TUI's variant step), so a \
plain `benchmark run` keeps the schema default 1000 s and a healthy dense tier \
(Sigma-wall ~1925 s) FAILS its run verdict on wall alone. \
★ SPEED IS NOT GATED ON THIS VARIANT. `s_per_turn_budget` defaults to 0.0 = \
non-gating and this entry commits no `[benchmarks.metrics.s_per_turn]` bound, \
because none has been measured here. That is deliberate: the 35B's measured \
8.5 s/turn is meaningless against the 18-40 s/turn documented below, and \
applying it would fail every dense run on a number drawn from another model. \
`s_per_turn`, `sum_agent_wall_s`, `sum_turns` and `decode_tps` ARE recorded on \
every run, so a bound can be ratcheted in from real tiers when they exist. \
The two 10/10 counts are ABSOLUTE correctness \
bounds and take no noise, same footing as the 35B entry; `iterations` is \
PINNED at exactly 10 for the same reason stated there — a count bound alone \
does not describe the run that produced it."""

[benchmarks.metrics.followed_directions]
min = 10.0

[benchmarks.metrics.iterations]
min = 10.0
max = 10.0

[benchmarks.metrics.sum_wall_s]
# Set from TWO measured N=10 tiers on dgx2 (2026-08-14, this branch's binary):
#   temp 1.0 -> 4090 s      temp 0.6 -> 4182 s
# Both 10/10 webserver_ok and 10/10 followed_directions, so the model is
# healthy at this wall; the number is what the current serve costs, not a
# defect. 5000 s is the slower tier + ~20% headroom.
#
# ★ This is ~2x the 1925 s reference tier taken 2026-08-14 on the pre-branch
# nightly. That gap is NOT sampling and NOT the inter-tool prose budget (both
# investigated and ruled out — see the MODEL.toml note and the prose-budget
# analysis): it is per-turn decode cost, 18 s/turn there vs ~40 s/turn here
# with turn counts unchanged. That regression is UNEXPLAINED and tracked
# separately; if it is found and fixed, this ceiling should come down with it
# rather than being left loose. A blow-up detector set at 5000 s only detects
# blow-ups relative to the CURRENT serve cost.
#
# Ratchet only after repeated back-to-back tiers, never to the best tier.
max = 5000.0

[benchmarks.metrics.webserver_ok]
min = 10.0

