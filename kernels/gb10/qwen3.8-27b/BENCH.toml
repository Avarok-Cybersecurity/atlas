# --- concurrency-sweep-dflash2 ---------------------------------------------
# The same ladder with the DFlash2 drafter armed, REQUIRED since 2026-08-29.
#
# ★ WHY A SECOND GATE AND NOT A SECOND VARIANT OF THE FIRST. `check_record`'s
# `record_is_required_subject` refuses a non-default checkpoint for the
# required verdict — "a pass on the dense 27B is not evidence for the required
# gate, whose declared subject is the default checkpoint" — so a variant can
# never satisfy a mandatory gate. Two gate ids is the mechanism the repo
# already uses for exactly this shape (`bfcl-subset` / `bfcl-subset-echolp`).
#
# ★ WHY IT EXISTS AT ALL. Nothing else gates speculation. All ten previous
# required gates serve a no-drafter recipe, so a DFlash2 regression could only
# ever be judged by hand — which is precisely what the 2026-08 C4
# investigation had to do, spending days establishing "not DFlash2" from
# source reading because no committed record could speak for it.
#
# ★ ITS NUMBERS ARE NOT COMPARABLE TO concurrency-sweep's. Speculation moves
# low-C aggregate throughput by more than any regression either bar is set to
# catch, so the two carry independent bounds and must never be crossed. The
# useful comparison is each gate against its own history, never one against
# the other.
[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "concurrency-sweep-dflash2"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-dflash2"
label = "Qwen3.8-27B dense (NVFP4, unsloth) + DFlash2"
default = true
status = "measured"
note = """\
MEASURED 2026-08-30, spark-256a, this branch's binary: 3 reps of the full \
ladder — C=1/2/4/8/16, isl 512, osl 200, natural (MinHeap) fixture, temp 0, \
seed 0, warmup 1 — zero vacuous cells and zero request errors in every rep. \
Aggregate tok/s per C: C1 23.42/26.60/26.63; C2 37.67/38.62/37.56; C4 \
44.58/44.17/44.77; C8 53.35/53.39/52.83; C16 60.90/60.76/60.89. Floors at \
mean - max(3*sigma, ~5%) per rung, cut together, never from a best rep. \
★ WHY osl=200 AND NOT THE PLAIN GATE'S 320. At 320 this gate is uncertifiable \
at ANY floor: the C=1 cell is deterministically vacuity-flagged. Measured \
three times before and three times after four throughput fixes, identically — \
vacuous cells 0/1/2 and min_completion 262/229/229 — because DFlash2's \
completion on this fixture is ~229 tokens, i.e. 71.5% of a 320 budget against \
an 80% vacuity floor. A vacuous cell fails unconditionally, so no threshold \
choice helps. This is the SAME calibration the plain entry documents making \
for itself in the other direction ("at osl=512 the C=16 cell was ALWAYS \
vacuity-flagged ... the default budget cannot measure the top rung"): lower \
the budget until every request hits it. RAISING osl so 229 clears 80% would \
be tuning to hide the rule — requests would keep ending naturally and only \
the bar would move. Lowering it below the natural stop makes every finish a \
"length" finish, which is the comparability property the rule protects. \
★ WHY gamma 8 AND NOT 15. Single-stream, gamma 15 is faster (57.0 median vs \
49.9) — but the verify pool is gamma-sized and gamma 15 at bs=16 refuses to \
START: 57.7 GB consumed + 45.7 GB reserve = 103.4 GB, exactly the util-0.85 \
budget, measured on a verified-idle box. gamma 8 also holds the best \
acceptance (73.5% vs 48.6%), which is what matters when the verify pool is \
shared across sequences. gamma 15's 57.0 is a SINGLE-STREAM result and must \
not be quoted as a concurrency one. \
★ NOT COMPARABLE TO concurrency-sweep, in either direction: different batch \
cap (16 vs 128) and different osl (200 vs 320). Each gate is scored against \
its own committed history; crossing them is meaningless."""

[benchmarks.serve_overrides]
# The DFlash2 serve. It matches the plain gate's profile on every axis it CAN
# match; the batch cap is the one it cannot, and the reason is measured rather
# than assumed.
#
# ★ 16, NOT 128 — a DFlash2 serve refuses to START wider on this box.
# Measured 2026-08-29, spark-256a, util 0.85, everything else as pinned here:
#
#     max_batch_size |  48  |  64  |  96  | 128
#     reserve        | 56.5 | 59.0 | 63.8 | 68.7  GB
#
# against ~46.5 GB left after weights + drafter, so 128 dies with "No memory
# left for KV cache: 56.9 GB consumed + 67.1 GB inference reserve". The slope
# is only ~151 MB/slot; the ~49 GB INTERCEPT is the wall.
#
# It is the verify pool. `preflight` at bs=64 prints
# `ssm_pool=53568 MB (64 max_batch blobs + 32 MTP-covered slots x 3 verify
# blobs)`; the same box with MTP instead prints 32112 MB for 128 max_batch
# blobs + 32 slots x 5. DFlash blobs are ~2.5x MTP's because the pools are
# gamma-sized -- uniform K = gamma+1 on every slot -- and this drafter's
# trained block_size is 8.
#
# Three things that look like levers and are not:
#   * AVAROK_MTP_MAX_SEQS cannot shrink the slot count. `mtp_state_slots_with`
#     is `max_batch_size.min(cap.max(VERIFY_WY_TABLE_SEQS))` and that floor is
#     32. Setting it to 8 changed nothing (verified). The floor only lifts
#     BELOW bs=32, where max_batch_size becomes the binding term -- which is
#     exactly why 16 is comfortable and 48 is not: it is a knee, not a slope.
#   * --ssm-h-dtype f16-pool, the lever that took the MTP bs=128 reserve
#     36.7 -> 22.4 GB, is REJECTED with --dflash by cli/validate.rs: the
#     DFlash verify width dispatches gated_delta_rule_wy17, which has no FP16
#     h-state twin and strides its h intermediates in FP32 elements. "Fluent
#     garbage, not an error." The refusal is right; the relief is unavailable.
#   * Raising --gpu-memory-utilization past 0.85 is not on the table on GB10.
#
# So this gate's ladder stops at C=16 (its param_overrides below), because a
# rung above the batch cap measures the cap and not the engine -- the same
# defect as the batch-1 instrument the plain gate's pin exists to correct, one
# scale up. The real fix is an FP16 h-state twin for gated_delta_rule_wy17;
# until then this is the honest width.
max_batch_size = "16"
kv_cache_dtype = "fp8"
# 32, with the plain gate (2026-09-13): the one-variable rule — every pin the
# plain gate carries is carried here identically except the batch cap — and
# the same warm-capacity arithmetic (`concurrency::slots_needed`; see the
# plain gate's note). 4.73 GiB beside the drafter fits the bs=16 reserve.
ssm_cache_slots = "32"
max_model_len = "4096"
# --dflash is `conflicts_with = "speculative"` at the clap level, so the
# recipe this names must not also enable MTP; the two drafters are mutually
# exclusive by construction, not by convention.
dflash = "true"
# Named explicitly rather than left to the MODEL.toml [dflash] fallback. A
# drafter is trained against ONE target's hidden states — this one consumes
# Qwen3.8-27B layers [5,19,33,47,61] — and a mismatched drafter degrades to
# near-zero acceptance rather than failing, which is slow and silent. The
# record therefore has to carry which drafter produced the number.
draft_model = "incoai/Qwen3.8-27B-DFlash2"
# gamma=8 is the drafter's OWN trained block_size, stated inside its
# `dflash_config`. It must be explicit: --dflash-gamma's clap default is 16,
# which shadows the checkpoint's value, and running an 8-block drafter at 16
# measured 0% accept on every verify step while sizing its pools for twice
# the block it can use.
dflash_gamma = "8"

