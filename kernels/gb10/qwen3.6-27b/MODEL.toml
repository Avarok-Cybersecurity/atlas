[model]
name = "qwen3.6-27b"
hf_id = "Qwen/Qwen3.6-27B"
params = "27B"
active_params = "27B"
architecture = "Hybrid Attention + GDN + Dense FFN + MRoPE"

# Architecture mirrors the existing Qwen3.5-27B (hybrid GDN + full-attention,
# 4:1 pattern). Diff vs Qwen3.5-27B: vocab 152K → 248K, MRoPE-interleaved
# enabled by default in the upstream config (Qwen3.5-27B picked up MRoPE only
# in Kbenkhaled's NVFP4 re-upload; Qwen3.6-27B has it natively).
layers_total = 64
layers_full_attention = 16
layers_linear_attention = 48

hidden_dim = 5120
head_dim = 256
q_heads = 24
kv_heads = 4
intermediate_size = 17408

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
attn_output_gate = true
partial_rotary_factor = 0.25

# MRoPE (multi-modal rotary position embedding). Same configuration as
# Qwen3.6-35B-A3B's full-attention layers — interleaved 3-axis rope. Text-only
# serving keeps H/W position IDs at zero.
mrope_interleaved = true
mrope_section = [11, 11, 10]

mtp_layers = 0

# Effective context for agentic tasks. Mirrors Qwen3.5-27B's empirical bound
# (Atlas's hybrid-GDN long-context behavior is consistent across 27B variants).
effective_context = 24576

# Official Qwen3.6-27B sampling recommendations (HF model card), plus
# Atlas's anti-repetition stack (DRY + LZ) on every preset. The Qwen
# values for temperature / top_p / top_k / presence_penalty are kept
# verbatim — DRY and LZ are additive and target the multi-token
# phrase-loop attractor that flat per-unique-token presence_penalty
# can't break (see `atlas-kernels/src/lib.rs::SamplingCategory`:
# "presence_penalty on its own is a FLAT per-unique-token hit … DRY
# scales with the repeat-length and is the published remedy"). LZ at
# 0.2 is the SGLang reference (arXiv:2504.20131); DRY at (0.8, 1.75, 2)
# catches ≥3-token repeats — matches llama.cpp / KoboldAI defaults — to
# break the `#plane { cursor: pointer; }` and CSS-block phrase-loop
# attractors observed in OpenWebUI long-code sessions where the looser
# allowed_length=4 left enough room to settle into 4-token cycles.
#
# Atlas's sampler now consumes the full token sequence (prompt + output)
# for penalties — matching HF Transformers / vLLM / llama.cpp — so
# Qwen's `non_thinking.presence_penalty=1.5` behaves as upstream intends
# (chat-template stop tokens share the pressure, no premature EOS).
[sampling.thinking_text]
temperature = 1.0
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
lz_penalty = 0.2
dry_multiplier = 0.8
dry_base = 1.75
dry_allowed_length = 2

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
# ROOT CAUSE + FIX (2026-05-16, OpenWebUI "3D chess game" field report):
# The official Qwen3.6-27B model card sets thinking-mode
# presence_penalty=0.0 and EXPLICITLY states: "adjust the presence_penalty
# parameter between 0 and 2 to reduce endless repetitions." With 0.0 the
# model falls into a documented announce/restart degeneration loop on
# complex code-gen ("I'll write the code… Let me… Here is…" / verbatim
# `<!DOCTYPE html>…- Meta tags - Three.js` ×3 / planning-bullet leak into
# content) — confirmed upstream on official vLLM/BF16 (QwenLM/Qwen3.6 #88:
# 17.4% truncation, 84% repetition on hard code prompts; #115, #145).
# Atlas had faithfully copied the card's 0.0; thinking-OFF was always
# clean ONLY because [sampling.non_thinking] uses presence_penalty=1.5.
# Bisected live: same prompt + presence_penalty=1.5 → real Three.js code
# (13 JS API calls, valid </html></script>, no restart loop) vs 0.0 →
# pure degeneration. 1.5 mirrors the battle-tested non_thinking value;
# DRY/LZ/XTC restored (they target the complementary multi-token phrase
# and lexically-similar-CSS attractors presence_penalty can't break — a
# diagnostic run with them zeroed produced a MORE verbatim loop).
presence_penalty = 1.5
frequency_penalty = 0.0
lz_penalty = 0.2
dry_multiplier = 0.8
dry_base = 1.75
dry_allowed_length = 2
# XTC (Exclude Top Choices) opt-in. Dense Qwen3.6-27B-FP8 has a
# documented long-context attractor where it emits token-different but
# lexically-similar CSS/HTML blocks (e.g. `#game-container { width: 100vw; }`
# alternating with `#game-container { position: relative; }`). DRY misses
# this because the token sequence varies between repeats. XTC drops the
# modal peak on a 30% coin flip, forcing the sampler off the attractor.
# Known upstream issue (QwenLM/Qwen3.5 #115, vLLM #27157) — sampler-side
# mitigation is the realistic remedy.
xtc_probability = 0.3
xtc_threshold = 0.1

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 1.5
frequency_penalty = 0.0
lz_penalty = 0.2
dry_multiplier = 0.8
dry_base = 1.75
dry_allowed_length = 2

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
lz_penalty = 0.2
dry_multiplier = 0.8
dry_base = 1.75
dry_allowed_length = 2

[behavior]
# Content-loop watchdog enabled: dense Qwen3.6-27B has a known
# prose-attractor failure mode (2026-04-26 field reports) and the
# 2026-05-05 chess-game stress sweep confirmed it loops on long-code
# prompts (CSS block repetition at 13.3 t/s for ~3990 tokens). MoE
# A3B/A10B variants in the family don't need it.
enable_loop_watchdog = true
thinking_in_tools = false
# Enable thinking by default for OpenAI/OpenWebUI-compatible requests.
# Tool-active turns still suppress thinking unless the client explicitly
# requests reasoning because `thinking_in_tools=false` above.
thinking_default = true
# 8192 gives the model enough planning space for complex multi-file / long-code
# generation tasks (Three.js apps, full algorithms, etc.). 512 was too small —
# the model would sketch a brief plan then output a skeleton and stop.
max_thinking_budget = 8192
# K=2 verify: MTP propose now accumulates KV history correctly (2026-05-15
# fix: after_verify no longer trims the first valid KV on REJECT). Accept rate
# expected ~50%+ vs prior ~0%. K=3 also preserved (slightly better on partial
# accept). Reverted from the K=3 workaround now that K=2 is fixed.
default_num_drafts = 1
# Suppress EOS for the first N content tokens after </think>. Dense
# Qwen3.6-27B with thinking enabled stops after ~17 tokens ("Here is the
# complete answer.") when thinking ends naturally — the model treats the
# hidden <think> block as its answer and uses visible content only as an
# acknowledgment. 25 tokens is just above the ~17-token intro sentence
# threshold: enough to force the model into the first line of code (at which
# point html_suppresses_eos or html_document_is_complete take over), but
# small enough that short Q&A answers aren't suppressed into hallucination.
min_content_tokens = 25
# Suppress </think> + EOS until the model has emitted at least N thinking
# tokens. Dense Qwen3.6-27B with template-forced thinking bails out of
# <think> after ~150 tokens with an INCOMPLETE plan (ends mid-sentence:
# "...generate a single HTML file containing the complete 3D ches"), then
# continues planning in the VISIBLE content channel where it degenerates
# into a plan→restart loop ("I'll create...", partial code, "Wait, let
# me...", restart `<!DOCTYPE html>` ×3) and a watchdog kills it with a
# ~40-line stub (2026-05-16 OpenWebUI field report: "create a beautiful
# 3D chess game"). The SAME prompt with thinking disabled produces a
# clean, complete <html> file — proving the broken think→content
# transition (not the model) is the fault. 512 forces a complete hidden
# plan: comfortably past the ~150-token premature bail and past the
# 400-token F2 confidence-stop gate ("the model needs room to plan"),
# well under the 3686 effective budget. Symmetric with max_thinking_budget
# (the max) and min_content_tokens (the post-</think> content floor).
min_thinking_tokens = 512

# Upstream Qwen/Qwen3.6-27B reports `model_type = "qwen3_5"` in config.json.
# Atlas's `parse_qwen3_5_config` (atlas-core/src/config.rs) rewrites this to
# `qwen3_6_moe` when MRoPE-interleaved is detected — same path Qwen3.5-27B
# already uses for the Kbenkhaled NVFP4 re-upload. The factory routes through
# the existing `Qwen35WeightLoader`; no new loader is needed because the
# weight key naming is unchanged from Qwen3.5.
[[model_types]]
model_type = "qwen3_5"
hidden_size = 5120

[[model_types]]
model_type = "qwen3_6_moe"
hidden_size = 5120

# DFlash block-diffusion speculative decoding pairing.
# Drafter (`z-lab/Qwen3.6-27B-DFlash`) is a separate 8-layer Qwen3-arch
# transformer that emits γ=16 tokens per step via bidirectional in-block
# attention. The 27B target's hidden_size (5120) determines the drafter's
# `fc` projection input dimension (5 * 5120 = 25600) — different from the
# 35B-A3B target's drafter (5 * 2048 = 10240) but the drafter checkpoint
# itself is the right shape per its own config.json.
[dflash]
draft_model = "z-lab/Qwen3.6-27B-DFlash"
gamma = 16
window_size = 4096
mask_token_id = 248070
# Verified 2026-05-03 against z-lab/Qwen3.6-27B-DFlash/config.json.
# `dflash_loader::parse_dflash_config` reads these from the drafter's
# config.json at runtime; this MODEL.toml field is the fallback default.
target_layer_ids = [1, 16, 31, 46, 61]
