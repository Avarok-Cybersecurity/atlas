# Benchmarks for this model, and the thresholds its gate records must meet.
#
# Sibling of MODEL.toml so the numbers sit beside the thing they describe;
# hardware and model are implied by the path and cannot disagree with the
# contents. Read by `atlas_plugin::gate::bench`.
#
# ★ This file may land BEFORE the model's MODEL.toml/kernels do (they arrive in
# a sibling change adding the qwen3.8-27b kernel target via a `kernel_source`
# redirect to qwen3.6-27b). `gate::bench::bench_files` discovers BENCH.toml by
# path alone for exactly this reason — the gate definition does not wait on the
# compiled target.
#
# Thresholds are per CHECKPOINT, not per model: two checkpoints of one model
# can differ by several BFCL points, so they cannot share a bar.
#
# This file is deliberately OUTSIDE the closure hash (`taxon::configs` does not
# list it), so ratcheting a threshold does not invalidate the record that
# justified the ratchet.
#
# `status = "unmeasured"` entries carry NO [benchmarks.metrics] table. Absence
# is the TODO -- a guessed threshold a run could clear would report PASS for
# something nobody measured.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "agentic-webserver"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
# NOT the default: the required Gate A subject stays the 35B MoE flagship
# (qwen3.6-35b-a3b/BENCH.toml), whose recorded history is untouched. This
# variant runs via `--checkpoint unsloth/Qwen3.8-27B-NVFP4`, or from the TUI's
# variant list.
default = false
status = "measured"
note = """\
The DENSE variant of the agentic gate. Not comparable to the 35B MoE entry in \
any direction: a dense 27B activates every parameter per token where the 35B \
MoE activates ~3B, so its wall band is roughly 2x — which is why this is a \
separate baseline entry with its own ceiling rather than a shared bar. \
REFERENCE RUN (the definition of these numbers): 2026-08-14, dgx2, binary main \
680b3a568, N=10 — webserver_ok 10/10, followed_directions 10/10, Sigma-wall \
1925.1 s, per-run walls 156.0/187.3/274.2/144.7/230.5/243.3/205.2/117.3/185.2/\
181.4 s (range 117-274 s, 2.3x min-to-max). That run FAILED only the \
35B-calibrated 1000 s budget while both correctness counts were perfect — the \
exact miscomparison per-variant thresholds exist to remove; under this entry's \
own ceiling it is a PASS. Serve profile of the reference run (what the recipe \
must pin): --gpu-memory-utilization 0.85 --max-batch-size 1 --max-seq-len \
32768 --kv-cache-dtype bf16 --lm-head-dtype bf16 --scheduling-policy slai \
--speculative --mtp-quantization bf16 --enable-prefix-caching \
--ssm-cache-slots 256 --ssm-checkpoint-interval 16 --kv-high-precision-layers \
auto, thinking ON. The 35B Gate-A profile (0.70 util, batch 2) CANNOT serve \
this model at all — it dies at boot with no memory left for KV cache — so the \
recipe is part of the variant, not a detail. The recipe id above now EXISTS in \
atlas-recipes (merged 2026-08-14 as atlas-recipes#19, commit 20ac6e8), \
pinning exactly the profile stated above, so this variant can self-start \
under --pull-request-gate. ★ Note the recipe pins `num_drafts: 3` (K=4), \
matching the reference run; the qwen3.8-27b target deliberately omits \
`default_num_drafts`, so an unpinned run would instead take the engine \
default K=2. When running against an operator-started endpoint pass \
`--param wall_budget_s=5000` explicitly -- 5000 is this entry's committed \
ceiling, NOT the 2500 an earlier revision of this note named: threshold_params \
substitution happens only under the gate (and in the TUI's variant step), so a \
plain `benchmark run` keeps the schema default 1000 s and a healthy dense tier \
(Sigma-wall ~1925 s) FAILS its run verdict on wall alone. \
★ SPEED IS NOT GATED ON THIS VARIANT. `s_per_turn_budget` defaults to 0.0 = \
non-gating and this entry commits no `[benchmarks.metrics.s_per_turn]` bound, \
because none has been measured here. That is deliberate: the 35B's measured \
8.5 s/turn is meaningless against the 18-40 s/turn documented below, and \
applying it would fail every dense run on a number drawn from another model. \
`s_per_turn`, `sum_agent_wall_s`, `sum_turns` and `decode_tps` ARE recorded on \
every run, so a bound can be ratcheted in from real tiers when they exist. \
The two 10/10 counts are ABSOLUTE correctness \
bounds and take no noise, same footing as the 35B entry; `iterations` is \
PINNED at exactly 10 for the same reason stated there — a count bound alone \
does not describe the run that produced it."""

[benchmarks.metrics.followed_directions]
min = 10.0

[benchmarks.metrics.iterations]
min = 10.0
max = 10.0

[benchmarks.metrics.sum_wall_s]
# Set from TWO measured N=10 tiers on dgx2 (2026-08-14, this branch's binary):
#   temp 1.0 -> 4090 s      temp 0.6 -> 4182 s
# Both 10/10 webserver_ok and 10/10 followed_directions, so the model is
# healthy at this wall; the number is what the current serve costs, not a
# defect. 5000 s is the slower tier + ~20% headroom.
#
# ★ This is ~2x the 1925 s reference tier taken 2026-08-14 on the pre-branch
# nightly. That gap is NOT sampling and NOT the inter-tool prose budget (both
# investigated and ruled out — see the MODEL.toml note and the prose-budget
# analysis): it is per-turn decode cost, 18 s/turn there vs ~40 s/turn here
# with turn counts unchanged. That regression is UNEXPLAINED and tracked
# separately; if it is found and fixed, this ceiling should come down with it
# rather than being left loose. A blow-up detector set at 5000 s only detects
# blow-ups relative to the CURRENT serve cost.
#
# Ratchet only after repeated back-to-back tiers, never to the best tier.
max = 5000.0

[benchmarks.metrics.webserver_ok]
min = 10.0

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "bfcl-subset"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth-bfcl"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
# THE REQUIRED bfcl-subset SUBJECT as of 2026-08-15 (flipped from Qwen3.6-27B per
# maintainer: 3.6 is no longer worth requiring on every PR). The 3.6 entry in
# kernels/gb10/qwen3.6-27b/BENCH.toml is now default = false — see the consequence
# note there re: the MLPerf submission no longer being gated.
default = true
# MEASURED 2026-08-14 (dgx1, this branch's binary, golden draw n=995 seed 42):
# overall 84.22 / normalized 84.12. See the metrics table below and the sharp
# caveat in the note.
status = "measured"
note = """\
The DENSE 3.8 leg of the BFCL gate. Exists so a Qwen3.8-27B score can be read \
directly against the recorded Qwen3.6-27B results — same golden ST-995 draw \
(62/10/10, floor 25, n=995, seed 42, temp 0), same scorer, and a serve recipe \
whose defaults are byte-identical to the 3.6 sibling's (atlas-recipes#20; only \
the checkpoint differs). That identity is load-bearing: BFCL's normalized \
score moves with serve config as well as with the draw, so the two legs must \
share a config or the generation-over-generation delta means nothing. \
Thresholds are ABSENT until a run establishes them; until then a run here \
BASELINES rather than gates. ★ Do NOT copy the 3.6 entry's floors \
(87.44 / 88.59) or the MLPerf floor (83.64 / 85.32) into this entry: same \
architecture and same draw, but DIFFERENT WEIGHTS, so neither transfers. The \
MLPerf-edge submission rides on 3.6, and nothing here guards it. \
★ One discontinuity vs the recorded 3.6 history: `num_drafts = 1` (K=2) was \
silently discarded before the 2026-08-14 --num-drafts precedence fix, so those \
3.6 numbers were measured at K=4. Speculative decode is lossless, so ACCURACY \
is comparable across that boundary; wall and TPOT are not."""

[benchmarks.metrics.samples]
# The golden MLPerf draw is exactly 995. A run reporting anything else is not
# this draw and its score is not comparable — pin both ends.
min = 995.0
max = 995.0

[benchmarks.metrics.overall_accuracy]
# Measured 84.22 (2026-08-14, dgx1, golden draw n=995 seed 42, temp 0,
# recipe qwen3.8/qwen3.8-27b-nvfp4-unsloth-bfcl). Bar set at the measured
# value less the documented +-0.4 MTP-nondeterminism noise floor.
min = 83.82
noise = 0.4

[benchmarks.metrics.normalized_single_turn_score]
# Measured 84.12, same run. ★ THIS IS 1.20 BELOW THE MLPERF-EDGE FLOOR (85.32).
# The floor was derived for Qwen3.6-27B and is NOT inherited here — different
# weights — so this is a QUALITY ALARM on this gate, not an MLPerf submission
# failure; the submission rides on 3.6, which still scores 87.44 / 88.59.
# ★ DO NOT treat this bar as an endorsement. Qwen3.8-27B scored 3-4 points
# BELOW Qwen3.6-27B on the same draw and serve config, and the per-subset split
# is suspicious rather than uniformly weaker: simple_python 95.16 against
# simple_java 45.16 and simple_javascript 29.03, with the hallucination category
# down 11 points (96.02 -> 84.85). A model does not lose 66 points between
# Python and JavaScript function calls by capability; that pattern points at a
# defect in the serve path, with the chat-template change the prime suspect
# (this run rendered through the checkpoint's own template, while every recorded
# 3.6 number came through the retired override, and the two serialize tool
# arguments differently). Tracked separately. These bars exist so a regression
# below TODAY's behaviour is caught; they are not a claim that today's behaviour
# is correct.
min = 83.72
noise = 0.4
# --- decode-floor ----------------------------------------------------------
# The pinned single-user decode-rate floor. REQUIRED
# (gate::coverage::REQUIRED) since 2026-08-15: the promotion ruling's
# precondition — a >=10-run sigma calibration on the gate's own instrument —
# is met (n=12, sigma ~0.05; see the note), and the bounds below are set from
# that calibration rather than from three points.
#
# The driver pins the whole request (MinHeap code prompt, temperature 0,
# seed 0, max_tokens 1500, runs = 3) and reports the MEDIAN server decode
# rate. Its vacuity pins (>=750 output tokens per run — the driver's
# MIN_OUTPUT_TOKENS, decode_floor/score.rs, which has been 750 since the gate
# landed and was never 800 as this line used to say; it sits under the
# instrument's deterministic 915-token natural stop — server rate present,
# accept_len_mean >= 1.5 from usage.completion_tokens_details.
# accepted_prediction_tokens) make a run that measured nothing INCONCLUSIVE
# rather than PASS — a thinking-on or non-speculating serve measures the
# serial floor, and that number must never be recorded as this gate's.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "decode-floor"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
default = true
status = "measured"
note = """\
CALIBRATED 2026-08-15, dgx1, this branch's binary: n=12 runs across 4 driver \
passes, every run 28.0-28.1 tok/s, mean 28.03, sigma ~0.05. Fingerprint (the \
instrument these bounds belong to): the DRIVER'S OWN MinHeap fixture, \
per-request reasoning_effort "none", temperature 0, seed 0, max_tokens 1500 \
with a deterministic 915-token natural stop, K4 num_drafts=3 (the recipe \
pins num_drafts: 3), accepted 569/915 per run, serve --max-batch-size 32 \
--gpu-memory-utilization 0.85 (the stock recipe serve). ★ SUPERSEDED BASIS, \
kept for the history: the previous floor (29.0, noise 1.0) came from an n=3 \
basis of 31.5/29.6/30.5 (median 30.5), 2026-08-15 — measured with a \
DIFFERENT instrument (batch-1 serve, an ad-hoc probe prompt, not the \
driver's fixture). Mechanism of the shift: different fixture + serve config \
moved the LEVEL by -2.4 tok/s while run-to-run sigma on the fixed instrument \
is 0.05 — an instrument change, not a regression. The gate is calibrated to \
ITS OWN instrument; never mix bases, and never ratchet from a best run. \
★ The gate serve needs NO operator flags for thinking: thinking-off arrives \
per-request (reasoning_effort "none" in the body — honored since the \
medium-default change), NOT from the recipe, so the stock recipe serve is \
the correct subject. ★ The accept pin depends on the accept-stats \
instrumentation (real accepted_prediction_tokens in usage); a binary \
without it reports INCONCLUSIVE by name, which is correct — a floor \
measured without proof of speculative engagement is the 2026-08-15 decode \
flip-flop all over again."""

[benchmarks.metrics.server_decode_tok_s]
# Median-of-3 server decode rate. The floor of 22.7 is the bound in force —
# an effective floor of 22.2 tok/s once noise 0.5 is applied by
# scoring::compare.
#
# ★ RATCHETED 2026-09-06, 21.0 -> 22.7, and this is the FIRST time this
# entry's own ">=10-run set on this same instrument" rule has actually been
# satisfied. 21.0 was set in c9a682734f from n=3 (22.3 / 22.4 / 22.0) and sat
# ~1.3 tok/s under the band it was drawn from with no measured sigma behind
# the gap. The set behind 22.7 is ten consecutive gate runs — the gate's own
# serve, recipe as-is, bf16 lm head, no hand-built harness:
#
#     22.9 22.8 22.8 22.8 22.8 22.7 22.7 22.8 22.7 22.8
#     n=10  mean 22.78  sigma 0.063  range 22.7-22.9
#
# so 22.2 sits ~9 sigma below the mean. That is a real-regression margin, not
# a noise allowance.
#
# ★ THE 12-RUN 28.03 / sigma-0.05 CALIBRATION IS STILL NOT THIS NUMBER'S
# BASIS, and never was. For weeks the lines here advertised 27.0 as this
# gate's bar, derived as "mean minus ~1 tok/s", while the value beside them
# read 21.0 — so anyone reading the file to judge a measurement read a number
# 6 tok/s above the gate. (Phrased that way on purpose:
# scripts/check_bench_threshold_prose.py reads "the floor of N" as a claim
# about the bound in force, so a dead number must not be written in that
# shape. The live claim, at the top, is written in it deliberately and is
# checked.) That calibration ran on a hand-built serve with the DEFAULT lm
# head; the GATE serves the recipe, which pins lm_head_dtype bf16 as a
# correctness pin, and that head costs ~20%. Never re-derive from it.
#
# ★ WHICH BOX THE MARGIN IS MEASURED ON MATTERS, because the boxes differ by
# more than the within-box sigma. Same gate, same pin f3f77c82fc, same night:
#
#     dgx2 (spark-43fa)  n=10  mean 22.78   <- the calibration above, slowest
#     dgx3 (spark-28c2)  n=3   23.6 23.5 23.5
#     dgx1 (spark-256a)  n=1   23.7
#
# The 0.7-0.8 tok/s spread is between boxes, an order of magnitude above the
# 0.063 within-box sigma, so a floor drawn on one box does not describe
# another — which is exactly why ci.yml's "One PR, one commit, one signer"
# refuses a record set spanning boxes. 22.7 is drawn from the SLOWEST box on
# purpose. On dgx1, currently the only fingerprint in .github/record-signers/
# and therefore the only box that can certify, the margin is ~1.5 tok/s.
# Re-cut this floor if a second box is ever registered and is slower.
#
# noise 0.5 covers the run-to-run band (observed 0.2 peak-to-peak over the ten
# runs) and stays under the 5% validate_noise cap (5% of 22.7 = 1.135).
# Ratchet only from a fresh >=10-run set on this same instrument.
min = 22.7
noise = 0.5
[benchmarks.metrics.output_tokens]
# The driver emits the MINIMUM completion_tokens across the 3 runs, so this
# floor means "every run decoded at least 750 of the 1500 budget" — the same
# vacuity pin the driver enforces (MIN_OUTPUT_TOKENS), restated where the
# gate can see it. 750, not 1200: the calibrated instrument's natural stop
# is a deterministic 915 tokens, and a pin above the instrument's own
# reference behaviour would fail every honest run.
min = 750.0

[benchmarks.metrics.runs]
# EXACT pin, like the BFCL draw size: a different run count is a different
# benchmark, and a median over a different n is not comparable to this floor.
min = 3.0
max = 3.0

# --- concurrency-sweep -----------------------------------------------------
# The latency/throughput ladder, REQUIRED (gate::coverage::REQUIRED) since
# 2026-08-15 — the maintainer wants this gate MANDATORY, and the thresholds-
# less-entry blocker is gone: this entry carries measured floors from the
# fixed instrument below. The qwen3.6-27b and qwen3.6-35b-a3b entries stay
# unmeasured declarations of intent; baseline_for drops unmeasured entries,
# so this is the gate's one default subject.
#
# ★ THE INSTRUMENT IS PINNED, because the schema defaults are a different
# instrument (C=1,2,4,8,16,32 at osl 128): the [benchmarks.param_overrides]
# table below is applied by gate self-start exactly as serve_overrides is on
# the serve side (bench_resolve::apply_param_overrides), recorded in the run
# record's params, and demanded on the record by check_record — a record
# measured on the schema default cannot read green against these floors.
# C=32 is deliberately NOT in the gate ladder: it needs preflight headroom
# not every recipe has, and the schema-default sweep still covers it for
# manual runs.
#
# Under the gate the driver self-verdicts against min_c1/min_c4/min_c8/
# min_c16/min_peak (auto-filled from the min bounds below); any vacuous cell
# or request error is a failing verdict regardless of the floors.

[[benchmarks]]
quant = "nvfp4"
checkpoint = "unsloth/Qwen3.8-27B-NVFP4"
gate = "concurrency-sweep"
recipe = "qwen3.8/qwen3.8-27b-nvfp4-unsloth"
label = "Qwen3.8-27B dense (NVFP4, unsloth)"
default = true
status = "measured"
note = """\
★ READ FIRST — EVERY LADDER FIGURE IN THIS NOTE IS SUPERSEDED HISTORY, NOT \
THE BOUNDS IN FORCE. The floors this entry enforces were re-cut 2026-08-30 \
from the WIDENED instrument (C=1..128 at bs=128, concurrent warm-up); their \
derivation is the block comment directly above \
[benchmarks.metrics.c1_aggregate_tok_s] and the numbers are the metric tables \
themselves. The 2026-08-15 ladder described below is a DIFFERENT instrument \
(C=1/4/8/16 at bs=32) and its five floors no longer exist. Kept because the \
osl=320 calibration and the serve-profile reasoning still hold. || \
MEASURED 2026-08-15, dgx1, this branch's binary: 3 reps of the full ladder \
on the FIXED instrument — C=1/4/8/16, isl 512, osl 320, natural (MinHeap) \
code fixture, per-request reasoning_effort "none", temperature 0, seed 0, \
warmup 1 — zero vacuous cells and zero request errors in every rep. \
Aggregate tok/s (incl. TTFT), per C: C1 25.6/25.5/25.5 (mean 25.5, sigma \
0.05); C4 45.6/48.7/48.3 (mean 47.5, sigma 1.4); C8 66.7/69.0/67.1 (mean \
67.6, sigma 1.0); C16 98.3/99.2/99.1 (mean 98.9, sigma 0.4). TTFT p50 \
~1.3/4.5/8.4/15.9 s at C=1/4/8/16. ★ WHY osl=320: the natural fixture's \
minimum deterministic completion WAS 334 tokens when this was cut — it is 296 \
today, after the serial-in-think fix (2c80bf2f7); see min_completion_tokens \
below, and note the 320 budget still binds — so a 320-token budget makes \
EVERY request hit the budget ("length" finish) and every cell comparable — \
at osl=512 the C=16 cell was ALWAYS vacuity-flagged, deterministically, \
i.e. the default budget cannot measure the top rung on this model. That is \
the vacuity guarantee min_completion_tokens pins below. Floors are set at \
mean minus max(3*sigma, ~5%) per rung, so a sub-noise wobble passes and a \
real regression does not. Recalibrate all five together, from >=3 fresh \
reps on this same instrument, never from a best rep. \
★ SERVE PROFILE (2026-08-15): the recipe is the shared AGENTIC profile — a \
serial reproduction config (batch 1, bf16 KV, 256 Marconi slots, 32K \
context) that strangles a concurrency instrument: the first certified run \
served it verbatim and measured C=1..16 all ~19 tok/s with TTFT stacking \
linearly, and its serve sized only ~0.6-1.1 GB of KV — nowhere near 16 \
concurrent ~832-token sequences. The gate therefore pins its own serve \
profile in [benchmarks.serve_overrides] below (each key justified inline), \
disclosed on every record per the serve_overrides contract; lm_head_dtype \
stays the recipe's bf16 correctness pin. \
★ THOSE FIVE FLOORS ARE GONE — RE-CUT 2026-08-30; this paragraph is kept so \
the sequence stays legible, and it described the file's state for weeks after \
it stopped being true. The five placeholders were 24/43/63/94/94, cut from \
the 2026-08-15 hand-built batched calibration serve rather than from a \
certified run on the pinned profile (fp8 KV, 8 Marconi slots, 4K context \
change the memory geometry). They were replaced by the EIGHT floors now in \
the metric tables (C=1..128), cut together from 3 fresh reps of the widened \
bs=128 instrument — see the block comment above the first metric table for \
their derivation, and for the stated fact that the mid-ladder rungs are \
loose. \
★ WARM-UP SEMANTICS CHANGED: historical records sent one unrelated `warm` \
prompt per cell, then measured `c0..cN`; later rungs also reused prompts from \
earlier rungs. `warmup = 1` now runs every exact measured prompt once before \
timing. The floors quoted above predate that controlled-cache instrument and \
could not calibrate it — and the replacement HAPPENED: the 2026-08-30 re-cut \
ran on the concurrent-warm-up instrument, and the metric tables below are its \
output."""

# ★ PLACEMENT: a [benchmarks.*] sub-table attaches to the MOST RECENT
# [[benchmarks]] header above it. This serve pin was first committed ABOVE
# this entry's header (2026-08-15), so TOML silently attached it to the
# PREVIOUS entry (decode-floor) and the gate served the recipe's batch 1
# with no OVERRIDES disclosure line — keep every sub-table BELOW the header
# it belongs to. bench_tests pins where each committed serve pin sits.
[benchmarks.serve_overrides]
# The gate's serve profile. Every key is a `defaults:` key of the
# qwen3.8/qwen3.8-27b-nvfp4-unsloth recipe, overridden because that recipe
# is the serial agentic reproduction config (see the note). Applied by gate
# self-start, recorded on the run record, and demanded there by
# check_record.
#
# The recipe pins max_batch_size: 1 (its own memory doctrine). A concurrency
# instrument measured at batch 1 is serial by construction — the 2026-08-15
# first certified run proved it (C=1..16 all ~19 tok/s, TTFT stacking
# linearly). 0.85 util + batch 32 verified to boot and serve on 2026-08-15
# (the calibration ladders ran on it).
# ⚠ 32 -> 128 on 2026-08-29, with the ladder. A batch cap below the widest
# rung makes that rung serial by construction, which is the same defect the
# recipe's batch 1 had at C=16 — the cap must cover the widest measured C or
# the top of the curve measures the cap, not the engine. Because check_record
# demands an exact serve-pin match, this INVALIDATES every concurrency-sweep
# record committed before it; that is correct, they measured a different
# instrument.
max_batch_size = "128"
# The recipe's bf16 KV is its <=32K single-stream reproduction pin. This
# model's own MODEL.toml carries default_kv_dtype = "fp8" (a property of the
# shared FP8-KV kernel set), and the serve itself WARNs that bf16 is the
# risky override for this model; fp8 halves KV bytes, which this profile
# spends on concurrent sequences.
kv_cache_dtype = "fp8"
# The recipe's 256 slots built a measured 38.7 GB Marconi snapshot pool
# (2026-08-16 gate serve log) — geometry for 1000-sample serial prefix
# reuse, useless to a 16-way ladder and the single largest KV thief. Each
# slot holds one full per-seq SSM blob (48 GDN layers × 3,309,568 B =
# 151.5 MiB), so 32 slots reserve 4.73 GiB and 8 reserve 1.18 GiB.
# Concurrency serving does not replay long shared prefixes — the ladder's
# requests are independent ~832-token sequences — so 8 slots retain the
# warm-prefix value at 1/4 the reserve, returning the other 3.55 GiB to
# the KV budget on top of the ~34 GB the 256→32 cut already returned.
# ⚠ The committed record above was measured with 32 slots; this pin change
# means that record no longer covers, pending the planned re-record (the
# floors already carry the "AWAIT RE-CUT" caveat in the note).
ssm_cache_slots = "8"
# The gate's sequences are isl 512 + osl 320 (<900 tokens with template);
# 4096 leaves >4x headroom while shrinking the per-sequence KV commitment
# and the max_model_len-sized inference reserve — multiplying available KV
# blocks roughly 8x vs the recipe's 32768.
max_model_len = "4096"
# lm_head_dtype is deliberately NOT overridden: the recipe's bf16 head is a
# correctness pin (exact argmax over the 248K vocab), not a throughput knob.

[benchmarks.param_overrides]
# The gate's instrument — see the block comment above. Values are parsed by
# each parameter's own schema kind, exactly like --param KEY=VALUE.
# 1..128 as of 2026-08-29: the published Atlas-vs-vLLM ladder quotes C=1..128,
# and a certification that stopped at 16 left the four widest rungs of the
# claim ungated. C=2 is in because it is the thinnest margin on that ladder
# and the one most easily lost silently.
concurrencies = "1,2,4,8,16,32,64,128"
isls = "512"
osl = "320"

# ── Floors re-cut 2026-08-30 from 3 fresh reps of the WIDENED instrument
# (C=1..128, bs=128, concurrent warm-up), mean - max(3*sigma, ~5%) per rung,
